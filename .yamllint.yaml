---
# https://yamllint.readthedocs.io/en/stable/
extends: default

ignore: |
  *.sops.yaml
  *.sops.yml
  **/blueprints/**/*.yaml
  # generated by vendir — hand-editing it is always wrong
  **/vendir.lock.yml

rules:
  braces: disable
  comments:
    require-starting-space: false
    min-spaces-from-content: 1
  comments-indentation: disable
  indentation:
    spaces: 2
  line-length: disable
  quoted-strings:
    # 'consistent' requires yamllint >= 1.38; CodeRabbit's bundled 1.37.1
    # rejects it and skips YAMLlint on every PR. 'any' keeps the rule portable
    # while required: false preserves the existing style.
    quote-type: any
    required: false
