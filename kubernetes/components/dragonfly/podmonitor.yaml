---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: &name ${APP}-dragonfly
spec:
  jobLabel: *name
  selector:
    matchLabels:
      app: ${APP}-dragonfly
  podTargetLabels: ["app"]
  podMetricsEndpoints:
    - port: admin
      # admin /metrics aggregates slow INFO sections; stock 10s times out
      scrapeTimeout: 30s
      interval: 60s
  fallbackScrapeProtocol: PrometheusText0.0.4
