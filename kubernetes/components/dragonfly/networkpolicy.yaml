---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/cilium.io/ciliumnetworkpolicy_v2.json
# Dragonfly operator does not manage NetworkPolicy. This component limits
# Redis to the owning application and the unauthenticated admin port to the
# Dragonfly operator and vmagent.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ${APP}-dragonfly-access
spec:
  endpointSelector:
    matchLabels:
      app: ${APP}-dragonfly
  ingress:
    - fromEndpoints:
        - matchLabels:
            "app.kubernetes.io/name": ${APP}
      toPorts:
        - ports:
            - { port: "6379", protocol: TCP }
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": database-system
            "app.kubernetes.io/name": dragonfly-operator
      toPorts:
        - ports:
            - { port: "9999", protocol: TCP }
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring-system
            "app.kubernetes.io/name": vmagent
      toPorts:
        - ports:
            - { port: "9999", protocol: TCP }
