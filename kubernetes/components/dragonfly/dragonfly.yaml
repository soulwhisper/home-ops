---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: "${APP}-dragonfly"
spec:
  replicas: 1
  authentication:
    passwordFromSecret:
      name: "${APP}-dragonfly"
      key: password
  image: ghcr.io/dragonflydb/dragonfly:v2.0.0
  args:
    - --maxmemory=$(MAX_MEMORY)Mi
    - --proactor_threads=2
    # Apps needing custom Lua semantics (e.g. BullMQ compatibility) set
    # DRAGONFLY_LUA_FLAGS in their Flux postBuild substitution.
    - --default_lua_flags=${DRAGONFLY_LUA_FLAGS:=}
  env:
    - name: MAX_MEMORY
      valueFrom:
        resourceFieldRef:
          resource: limits.memory
          divisor: 1Mi
  resources:
    requests:
      cpu: 100m
      memory: "${REDIS_MEM:=1024Mi}"
    limits:
      memory: "${REDIS_MEM:=1024Mi}"
