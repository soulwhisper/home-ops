---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.kgateway.dev/trafficpolicy_v1alpha1.json
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: "${APP}-auth"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: "${APP_ROUTE:-${APP}}"
  extAuth:
    extensionRef:
      name: authentik-ext-auth
      namespace: networking-system
  transformation:
    request:
      dynamicMetadata:
        # header() returns empty for absent headers; headers["x"] throws on
        # the client request (x-authentik-* exist only post-ext-authz),
        # crashing the kgateway dynamic module -> envoy 400 after every login
        - namespace: kgateway.auth
          key: username
          value:
            stringValue: '{{ header("x-authentik-username") }}'
        - namespace: kgateway.auth
          key: groups
          value:
            stringValue: '{{ header("x-authentik-groups") }}'
