---
# Rewarmable cache/scratch PVC on a two-replica, host-failure-domain NVMe pool.
# A single-replica layout can block RBD teardown and the node reboot when its
# OSD is drained. Never use for durable data. Consumers mount via existingClaim.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "${CACHE_CLAIM:-${APP}-cache}"
spec:
  accessModes:
    - "${CACHE_ACCESSMODES:-ReadWriteOnce}"
  resources:
    requests:
      storage: "${CACHE_CAPACITY:-10Gi}"
  storageClassName: ceph-cache
