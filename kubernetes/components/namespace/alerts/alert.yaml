---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/notification.toolkit.fluxcd.io/alert_v1beta3.json
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: alertmanager
spec:
  providerRef:
    name: alertmanager
  eventSeverity: error
  eventSources:
    - kind: FluxInstance
      name: "*"
    - kind: GitRepository
      name: "*"
    - kind: HelmRelease
      name: "*"
    - kind: HelmRepository
      name: "*"
    - kind: Kustomization
      name: "*"
    - kind: OCIRepository
      name: "*"
  # notification-controller sends point-in-time events directly to Alertmanager.
  # Exclude only observed transient DNS/network text; sustained OCI/Git source
  # failures remain covered by Flux*RepositoryNotReady rules after 10m (#66/#67).
  exclusionList:
    - "error.*lookup.*github"
    - "dial.*tcp.*timeout"
    - "waiting.*socket"
    - "server misbehaving"
    - "context deadline exceeded"
    - "unexpected EOF"
  suspend: false
