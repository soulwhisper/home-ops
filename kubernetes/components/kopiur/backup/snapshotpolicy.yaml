---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: "${APP}"
spec:
  repository:
    kind: ClusterRepository
    name: nas
  sources:
    - pvc:
        name: "${KOPIUR_CLAIM:-${APP}}"
  copyMethod: "${KOPIUR_COPYMETHOD:-Snapshot}"
  volumeSnapshotClassName: "${KOPIUR_SNAPSHOTCLASS:-ceph-block-snapshot}"
  retention:
    keepDaily: 14
  compression:
    compressor: zstd-fastest
  upload:
    maxParallelFileReads: 2
  verification:
    # Read all backed-up file contents; never restore over the application PVC.
    # This is repository integrity verification, not an application restore drill.
    quick:
      schedule:
        cron: "${KOPIUR_VERIFY_SCHEDULE:-0 4 * * 0}"
        jitter: 6h
      parallel: 2
      fileParallelism: 2
    verifyFilesPercent: 100
  mover:
    # Cap the mover's CPU/memory burst: unthrottled zstd+read bursts on the
    # shared control-plane nodes have stalled apiserver lease renewals
    # (leader-election timeouts, PodRestartStorm homelab-tickets#4).
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    # app files have arbitrary ownership (root-run apps, 0600 owner-only files);
    # only uid 0 + DAC_OVERRIDE reads every file reliably, and only root
    # restores preserve original ownership. Namespace must opt in via
    # kopiur.home-operations.com/privileged-movers=true (webhook-enforced).
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
      runAsGroup: 0
      capabilities:
        drop: ["ALL"]
        add: ["DAC_OVERRIDE", "DAC_READ_SEARCH"]
    podSecurityContext:
      fsGroup: 0
