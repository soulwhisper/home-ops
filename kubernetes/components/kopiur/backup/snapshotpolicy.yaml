---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: "${APP}"
spec:
  repository:
    kind: ClusterRepository
    name: nas
  sources:
    - pvc:
        name: "${KOPIUR_CLAIM:-${APP}}"
  copyMethod: "${KOPIUR_COPYMETHOD:-Snapshot}"
  volumeSnapshotClassName: "${KOPIUR_SNAPSHOTCLASS:-ceph-block-snapshot}"
  retention:
    keepDaily: 14
  compression:
    compressor: zstd-fastest
  upload:
    maxParallelFileReads: 2
  mover:
    # app files have arbitrary ownership (root-run apps, 0600 owner-only files);
    # only uid 0 + DAC_OVERRIDE reads every file reliably, and only root
    # restores preserve original ownership. Namespace must opt in via
    # kopiur.home-operations.com/privileged-movers=true (webhook-enforced).
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
      runAsGroup: 0
      capabilities:
        drop: ["ALL"]
        add: ["DAC_OVERRIDE", "DAC_READ_SEARCH"]
    podSecurityContext:
      fsGroup: 0
