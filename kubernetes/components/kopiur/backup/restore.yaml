---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: "${APP}-bootstrap"
  labels:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  source:
    fromPolicy:
      name: "${APP}"
      offset: 0 # latest snapshot
  # passive populator: the PVC claims this Restore via spec.dataSourceRef
  target:
    populator: {}
  options:
    # Ownership is part of the restore contract; never silently accept
    # permission failures and leave files owned by the mover.
    ignorePermissionErrors: false
  mover:
    # Replay arbitrary recorded UID/GID ownership. Root restores receive
    # CHOWN/DAC_OVERRIDE/FOWNER/FSETID through privilegedMode.
    privilegedMode: true
    securityContext:
      runAsUser: 0
      runAsNonRoot: false
  policy:
    onMissingSnapshot: Continue
