---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

# Bootstraps core applications that provide a minimal runtime base for the
# cluster. These releases are installed first so the cluster has the resources
# Flux needs before its own reconciliation begins.
#
# After this bootstrap phase, Flux is ready to take over management of the
# application stack and continue reconciling downstream state.

helmDefaults:
  cleanupOnFail: true
  forceConflicts: true
  timeout: 600
  wait: true
  waitForJobs: true

bases:
  - ./default.yaml

defaultInherit: default

releases:
  - name: prometheus-crds
    namespace: monitoring-system

  - name: cilium
    namespace: kube-system
    needs: ["monitoring-system/prometheus-crds"]

  - name: coredns
    namespace: kube-system
    needs: ["kube-system/cilium"]

  - name: spegel
    namespace: kube-system
    needs: ["kube-system/coredns"]

  # for gateway-api crds
  - name: gateway-api-crds
    namespace: kube-system
    needs: ["kube-system/spegel"]

  # for component crds
  - name: external-secrets
    namespace: security-system
    needs: ["kube-system/gateway-api-crds"]

  - name: flux-operator
    namespace: gitops-system
    needs: ["security-system/external-secrets"]

  - name: flux-instance
    namespace: gitops-system
    needs: ["gitops-system/flux-operator"]
