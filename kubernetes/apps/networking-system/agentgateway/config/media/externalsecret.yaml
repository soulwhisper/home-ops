---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# Media capability credentials are independent even while they enroll the
# same omni group key. A future per-consumer key can be granted one capability
# without inheriting the others.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-embedding-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        omni: |
          {
            "key": "{{ .llm_omni }}",
            "metadata": {
              "user_id": "extractor"
            }
          }
  dataFrom:
    - extract:
        key: agentgateway
