---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# Each media capability has its own 1Password item and credential. Chat-lane
# keys do not implicitly authorize media inference or discovery.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-embedding-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        embedding: |
          {
            "key": "{{ .llm_embedding }}",
            "metadata": {
              "user_id": "embedding"
            }
          }
  dataFrom:
    - extract:
        key: agentgateway
