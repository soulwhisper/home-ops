---
# Studio media lanes, plain HTTP passthrough (no LLM parsing).
# ExternalName Service backends are not resolved by the agentgateway
# dataplane ("service not found" on every request) — use static
# AgentgatewayBackends with DNS host instead.
#   :8000 oMLX — /v1/embeddings (alias `embedding`), /v1/rerank (alias
#               `reranker`); the same process serves the chat lanes via the
#               llm-backend-* AI providers
#   :8001 ComfyUI — /v1/images (alias `image`), /v1/audio/speech (alias
#               `voice`); OpenAI-compatible workflow endpoints
# Aliases are the contract in docs/application/ai.md (Studio Model Registry).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: studio-server
spec:
  static:
    host: studio.homelab.internal
    port: 8000
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: studio-comfyui
spec:
  static:
    host: studio.homelab.internal
    port: 8001
