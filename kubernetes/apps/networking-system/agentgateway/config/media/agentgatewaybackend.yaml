---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/agentgateway.dev/agentgatewaybackend_v1alpha1.json
# Each media backend declares exactly one API format; undeclared formats are
# rejected upstream. policies.auth injects the oMLX key from studio-api-auth.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: studio-embeddings
spec:
  ai:
    provider:
      custom:
        model: qwen3-embedding-0.6b
        formats:
          - type: Embeddings
      host: studio.homelab.internal
      port: 8000
  policies:
    auth:
      secretRef:
        name: studio-api-auth
    # The route type drives request parsing; custom.formats drives upstream.
    ai:
      routes:
        "/v1/embeddings": "Embeddings"
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/agentgateway.dev/agentgatewaybackend_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: studio-rerank
spec:
  ai:
    provider:
      custom:
        model: qwen3-reranker-0.6b
        formats:
          - type: Rerank
      host: studio.homelab.internal
      port: 8000
  policies:
    auth:
      secretRef:
        name: studio-api-auth
    ai:
      routes:
        "/v1/rerank": "Rerank"
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/agentgateway.dev/agentgatewaybackend_v1alpha1.json
# Audio payloads are forwarded unparsed only on the two public routes below;
# backend auth still injects the oMLX key.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: studio-audio
spec:
  ai:
    provider:
      openai:
        model: voxcpm2
      host: studio.homelab.internal
      port: 8000
  policies:
    auth:
      secretRef:
        name: studio-api-auth
    ai:
      routes:
        "/v1/audio/speech": "Passthrough"
        "/v1/audio/transcriptions": "Passthrough"
