---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
# Media models have independent inference and discovery routes. Discovery is
# answered directly and does not depend on any inference backend.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-embedding-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  rules:
    - name: inference
      matches:
        - path:
            type: Exact
            value: /v1/embeddings
          method: POST
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: studio-embeddings
      timeouts:
        request: 120s
    - name: discovery
      matches:
        - path:
            type: Exact
            value: /v1/models/embedding
          method: GET
      timeouts:
        request: 30s
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-reranker-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  rules:
    - name: inference
      matches:
        - path:
            type: Exact
            value: /v1/rerank
          method: POST
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: studio-rerank
      timeouts:
        request: 120s
    - name: discovery
      matches:
        - path:
            type: Exact
            value: /v1/models/reranker
          method: GET
      timeouts:
        request: 30s
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-audio-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  rules:
    - name: inference
      matches:
        - path:
            type: Exact
            value: /v1/audio/speech
          method: POST
        - path:
            type: Exact
            value: /v1/audio/transcriptions
          method: POST
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: studio-audio
      timeouts:
        request: 300s
    - name: discovery
      matches:
        - path:
            type: Exact
            value: /v1/models/audio
          method: GET
      timeouts:
        request: 30s
