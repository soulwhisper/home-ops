---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-media-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  rules:
    # image generation (ComfyUI, Qwen-Image-2.1)
    - matches:
        - path:
            type: PathPrefix
            value: /v1/images
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: studio-comfyui
      timeouts:
        request: 300s
    # audio: TTS (ComfyUI, VoxCPM2)
    - matches:
        - path:
            type: PathPrefix
            value: /v1/audio
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: studio-comfyui
      timeouts:
        request: 300s
    # embeddings (oMLX, alias `embedding`)
    - matches:
        - path:
            type: PathPrefix
            value: /v1/embeddings
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: studio-server
      timeouts:
        request: 120s
    # rerank (oMLX, alias `reranker`, Cohere-compatible)
    - matches:
        - path:
            type: PathPrefix
            value: /v1/rerank
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: studio-server
      timeouts:
        request: 120s
