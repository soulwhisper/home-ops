---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
# Studio media lanes (embeddings / rerank / audio) onto the LLM-pipeline
# backends. Auth: strict consumer API key (llm-api-auth); each backend
# injects the oMLX server key upstream.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-media-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  rules:
    # model discovery: gateway-synthesized lane list (see studio-models
    # policy — directResponse, backend never hit; keep in sync with
    # docs/application/ai.md Studio Model Registry)
    - name: models
      matches:
        - path:
            type: PathPrefix
            value: /v1/models
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: studio-audio
      timeouts:
        request: 30s
    # embeddings (oMLX, id `qwen3-embedding-0.6b`)
    - matches:
        - path:
            type: PathPrefix
            value: /v1/embeddings
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: studio-embeddings
      timeouts:
        request: 120s
    # rerank (oMLX, id `qwen3-reranker-0.6b`, Cohere-compatible)
    - matches:
        - path:
            type: PathPrefix
            value: /v1/rerank
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: studio-rerank
      timeouts:
        request: 120s
    # audio TTS (oMLX, id `voxcpm2`)
    - matches:
        - path:
            type: PathPrefix
            value: /v1/audio
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: studio-audio
      timeouts:
        request: 300s
