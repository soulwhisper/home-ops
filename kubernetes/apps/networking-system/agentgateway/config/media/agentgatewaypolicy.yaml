        name: llm-audio-auth
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: studio-embedding-model
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-embedding-route
      sectionName: discovery
  traffic:
    directResponse:
      status: 200
      headers:
        - name: content-type
          value: '"application/json"'
      body: '{"id":"embedding","object":"model","created":0,"owned_by":"omlx"}'
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
