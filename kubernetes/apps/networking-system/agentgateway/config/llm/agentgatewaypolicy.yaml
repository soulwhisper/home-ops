---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: &name llm-api-auth
spec:
  # Consumer API-key auth: strict on every chat model and the media route.
  # ROLLOUT-CHECK: verify policy attachment to AgentgatewayModel; fallback
  # is listener-scoped auth if the dataplane rejects model targets.
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayModel
      name: complex
    - group: agentgateway.dev
      kind: AgentgatewayModel
      name: complex-raw
    - group: agentgateway.dev
      kind: AgentgatewayModel
      name: omni
    - group: agentgateway.dev
      kind: AgentgatewayModel
      name: micro
    - group: agentgateway.dev
      kind: AgentgatewayModel
      name: catchall
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-media-route
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretRef:
        name: *name
