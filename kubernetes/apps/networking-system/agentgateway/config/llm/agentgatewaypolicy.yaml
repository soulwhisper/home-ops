---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: &name llm-api-auth
spec:
  # Consumer API-key auth: strict on the unified /v1 lane (all rules, incl.
  # complex-raw) and the media route.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-llm-route
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-media-route
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretRef:
        name: *name
---
# CI route access: gha-ci key only + token/request budget.
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ci-access
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-llm-route-ci
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretRef:
        name: gha-ci-auth
    rateLimit:
      local:
        - tokens: 300000
          unit: Hours
        - requests: 60
          unit: Minutes
