---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
# Unified LLM lane: everything OpenAI lives under /v1 (chat completions +
# media). Lane selection by model id (body model -> x-model header via the
# gateway-wide PreRouting transform). Guarded/open split is a MODEL NAME:
# `uncensored` skips promptGuard, everything else is guarded (policy
# targets the guarded rules by sectionName). No catch-all — unknown ids 404.
# SDK note: OpenAI/litellm clients append /chat/completions to their base
# URL, so consumer base URLs are .../v1 (see ai.md).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-llm-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  rules:
    # OPEN lane (rule `uncensored`): the single uncensored model, unguarded.
    # Pure-chat consumers only (SillyTavern / open-notebook / open-webui);
    # automation rides the guarded `agent` lane.
    - name: uncensored
      matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
          headers:
            - type: Exact
              name: x-model
              value: "uncensored"
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: llm-backend-complex
      timeouts:
        request: 300s
    # GUARDED lanes (llm-guardrails targets these rules by sectionName).
    - name: agent
      matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
          headers:
            - type: Exact
              name: x-model
              value: "agent"
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: llm-backend-agent
      # qwen-agentworld-35b-a3b is is_pinned=false with ttl_seconds=3600 on
      # oMLX, and its consumers (HealthChecks 6h cadence, alert RCA) arrive
      # colder than the TTL — nearly every request is a cold 35B load,
      # potentially after evicting a resident model to make room. 300s is
      # not enough headroom for that; automation lane, no interactivity cost.
      timeouts:
        request: 900s
    - name: omni
      matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
          headers:
            - type: Exact
              name: x-model
              value: "omni"
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: llm-backend-omni
      timeouts:
        request: 300s
