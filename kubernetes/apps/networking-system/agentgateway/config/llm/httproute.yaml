---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
# Each chat model owns its inference and discovery rules. The same lane key
# authorizes both rules; discovery is served by the model's directResponse
# policy and deliberately has no backendRef.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-uncensored-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  rules:
    - name: chat
      matches:
        - path:
            type: Exact
            value: /v1/chat/completions
          method: POST
          headers:
            - type: Exact
              name: x-model
              value: "uncensored"
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: llm-backend-uncensored
      timeouts:
        request: 300s
    - name: discovery
      matches:
        - path:
            type: Exact
            value: /v1/models/uncensored
          method: GET
      timeouts:
        request: 30s
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-agent-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  rules:
    # Cold 35B loads after oMLX TTL eviction need a longer automation budget.
    - name: chat
      matches:
        - path:
            type: Exact
            value: /v1/chat/completions
          method: POST
          headers:
            - type: Exact
              name: x-model
              value: "agent"
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: llm-backend-agent
      timeouts:
        request: 900s
    - name: discovery
      matches:
        - path:
            type: Exact
            value: /v1/models/agent
          method: GET
      timeouts:
        request: 30s
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-omni-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  rules:
    - name: chat
      matches:
        - path:
            type: Exact
            value: /v1/chat/completions
          method: POST
          headers:
            - type: Exact
              name: x-model
              value: "omni"
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: llm-backend-omni
      timeouts:
        request: 300s
    - name: discovery
      matches:
        - path:
            type: Exact
            value: /v1/models/omni
          method: GET
      timeouts:
        request: 30s
