---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
# Guarded LLM lane. `llm-guardrails` (promptGuard) attaches here and nowhere
# else; every consumer of this route is scanned request+response.
# hermes-agent is the only consumer (its cilium policy only allows POST /chat/*).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-llm-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /chat
          headers:
            - type: Exact
              name: x-priority
              value: "high"
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: llm-backend-complex
      timeouts:
        request: 300s
    - matches:
        - path:
            type: PathPrefix
            value: /chat
          headers:
            - type: Exact
              name: x-model
              value: "complex"
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: llm-backend-complex
      timeouts:
        request: 300s
    - matches:
        - path:
            type: PathPrefix
            value: /chat
          headers:
            - type: Exact
              name: x-model
              value: "micro"
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: llm-backend-micro
      timeouts:
        request: 120s
    - matches:
        - path:
            type: PathPrefix
            value: /chat
          headers:
            - type: Exact
              name: x-model
              value: "omni"
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: llm-backend-omni
      timeouts:
        request: 300s
    # Catch-all: unknown/absent model ids land on the main brain. Listed
    # last so header rules win on implementations with ordered matching.
    - matches:
        - path:
            type: PathPrefix
            value: /chat
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: llm-backend-complex
      timeouts:
        request: 300s
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
# Open LLM lane — deliberately serves ONLY the `complex` main brain. `complex`
# is the single uncensored model and the only reason this lane exists; omni
# and micro are reachable exclusively through the guarded /chat route.
# `llm-guardrails` does NOT target this route. Consumers: open-webui (portal
# chat) and eval traffic. Machine extractors run on the guarded lane.
# Path note: /chat/raw is deeper than /chat, so longest-prefix matching
# unambiguously splits the two lanes.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-llm-raw-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /chat/raw
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: llm-backend-complex
      timeouts:
        request: 300s
