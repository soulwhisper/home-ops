---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/agentgateway.dev/agentgatewaybackend_v1alpha1.json
# pre-MacStudio cloud lane, restored as the pipeline-verification route while
# studio is offline. SiliconFlow hosts the SAME models as oMLX, so embedding
# vectors stay in the Qwen3-Embedding-4B space — flipping traffic here and
# back does not corrupt the hindsight pgvector store.
# Route prefix /sf/* keeps verification traffic off the production lanes.
# (removed in ac8e4474 when traffic moved to studio; restored per owner)
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: siliconflow-chat
spec:
  ai:
    provider:
      host: api.siliconflow.cn
      port: 443
      openai:
        model: "Qwen/Qwen3.8-27B"
  policies:
    auth:
      secretRef:
        name: siliconflow-api
    tls:
      sni: api.siliconflow.cn
---
# embeddings (like rerank) is not handled by the ai provider — it is
# chat-only; that is why the studio media lanes are static passthrough too.
# Model name travels in the request body (Qwen/Qwen3-Embedding-4B on SF).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: siliconflow-embedding
spec:
  static:
    host: api.siliconflow.cn
    port: 443
  policies:
    auth:
      secretRef:
        name: siliconflow-api
    tls:
      sni: api.siliconflow.cn
---
# rerank is Cohere-shaped, not OpenAI — plain passthrough + path rewrite on
# the route; auth/tls policies still inject the key and verify the cert
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: siliconflow-rerank
spec:
  static:
    host: api.siliconflow.cn
    port: 443
  policies:
    auth:
      secretRef:
        name: siliconflow-api
    tls:
      sni: api.siliconflow.cn
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-siliconflow-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  rules:
    # agentgateway classifies LLM request type from the canonical /v1/* path;
    # rewrite the /sf/* verification prefixes before the AI provider sees them
    - matches:
        - path:
            type: PathPrefix
            value: /sf/chat
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /v1/chat/completions
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: siliconflow-chat
      timeouts:
        request: 300s
    - matches:
        - path:
            type: PathPrefix
            value: /sf/embeddings
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /v1/embeddings
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: siliconflow-embedding
      timeouts:
        request: 120s
    - matches:
        - path:
            type: PathPrefix
            value: /sf/rerank
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /v1/rerank
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: siliconflow-rerank
      timeouts:
        request: 120s
