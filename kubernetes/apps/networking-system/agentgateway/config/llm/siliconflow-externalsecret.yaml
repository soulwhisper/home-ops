---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# pre-MacStudio cloud lane (siliconflow) — restored for pipeline verification
# when studio is down. Same models as oMLX (Qwen3.8-27B / Qwen3-Embedding-4B /
# Qwen3-Reranker-0.6B) => same embedding space, no vector corruption.
# Removed in ac8e4474 when traffic moved to studio; 1P item field kept.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: siliconflow-api
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        Authorization: "{{ .siliconflow }}"
  dataFrom:
    - extract:
        key: llm-api
