---
# Studio chat lanes on the MacStudio oMLX OpenAI-compatible endpoint.
# Model ids ARE lane names (the gateway PreRouting transformation maps
# request body `model` -> `x-model`): consumers address lanes by the studio
# alias registry in docs/application/ai.md. `openai.model` below mirrors the
# served alias; routing is by header rule, not by this value.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: llm-backend-complex
spec:
  ai:
    provider:
      openai:
        model: "complex"
      host: studio.homelab.internal
      port: 8000
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: llm-backend-micro
spec:
  ai:
    provider:
      openai:
        model: "micro"
      host: studio.homelab.internal
      port: 8000
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: llm-backend-omni
spec:
  ai:
    provider:
      openai:
        model: "omni"
      host: studio.homelab.internal
      port: 8000
