---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-uncensored-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        uncensored: |
          {
            "key": "{{ .llm_uncensored }}",
            "metadata": {
              "user_id": "uncensored"
            }
          }
  dataFrom:
    - extract:
        key: agentgateway
---
