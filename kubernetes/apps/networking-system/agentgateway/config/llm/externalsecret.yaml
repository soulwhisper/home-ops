---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# Consumer-facing lane keys, sourced from the 1Password `agentgateway` item.
# One credential per lane: each route accepts only its own lane key. A consumer
# that needs a second lane holds that lane's key directly (hermes aux reads
# `llm_omni` as OPENAI_AUX_API_KEY). The oMLX server key is injected upstream
# by the backends via policies.auth.secretRef and is not handed to lane
# consumers; blackbox-exporter keeps a read-only `studio-api-auth` copy in
# monitoring-system for direct probes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-uncensored-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        uncensored: |
          {
            "key": "{{ .llm_uncensored }}",
            "metadata": {
              "user_id": "uncensored"
            }
          }
  dataFrom:
    - extract:
        key: agentgateway
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-persona-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        persona: |
          {
            "key": "{{ .llm_persona }}",
            "metadata": {
              "user_id": "persona"
            }
          }
  dataFrom:
    - extract:
        key: agentgateway
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-agent-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        agent: |
          {
            "key": "{{ .llm_agent }}",
            "metadata": {
              "user_id": "agent"
            }
          }
  dataFrom:
    - extract:
        key: agentgateway
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# Only the omni lane key is accepted here. hermes aux holds the same
# `llm_omni` field directly via its own ExternalSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-omni-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        omni: |
          {
            "key": "{{ .llm_omni }}",
            "metadata": {
              "user_id": "omni"
            }
          }
  dataFrom:
    - extract:
        key: agentgateway
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# Upstream credential: the oMLX server key on the MacStudio. Consumed by
# the chat and media backends' policies.auth (default secret key
# `Authorization`, written upstream as `Authorization: Bearer ...`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: studio-api-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        Authorization: "{{ .api_key }}"
  dataFrom:
    - extract:
        key: omlx
