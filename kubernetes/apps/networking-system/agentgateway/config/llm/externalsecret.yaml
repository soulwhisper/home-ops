---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# Consumer-facing gateway key (single shared credential: every app presents
# agentgateway_api_auth; the oMLX server key never leaves the backends,
# which inject it upstream via policies.auth.secretRef).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-api-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        api: |
          {
            "key": "{{ .agentgateway_api_auth }}",
            "metadata": {
              "user_id": "api"
            }
          }
  dataFrom:
    - extract:
        key: llm-api
---
# CI lane credential (GitHub Actions via tailnet). Separate secret so the
# gha-ci key never shares an auth surface with the main key.
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gha-ci-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        gha-ci: |
          {
            "key": "{{ .agentgateway_gha_auth }}",
            "metadata": {
              "user_id": "gha-ci"
            }
          }
  dataFrom:
    - extract:
        key: llm-api
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# Upstream credential: the oMLX server key on the MacStudio. Consumed by
# the chat and media backends' policies.auth (default secret key
# `Authorization`, written upstream as `Authorization: Bearer ...`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: studio-api-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        Authorization: "{{ .api_key }}"
  dataFrom:
    - extract:
        key: omlx
