---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# Consumer-facing gateway keys. Two valid credentials (multi-entry api key
# secret, one entry per key):
#   api    — the shared agentgateway consumer key (chat lanes, MCP lanes)
#   studio — the oMLX server key, valid at the gateway ONLY so media
#            passthrough consumers (/v1/embeddings, /v1/rerank) can present
#            it; the static backend forwards it to oMLX unchanged
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-api-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # format: "sk-$(whoami)-$(openssl rand -hex 16)"
        api: |
          {
            "key": "{{ .agentgateway_api_auth }}",
            "metadata": {
              "user_id": "api"
            }
          }
        studio: "{{ .api_key }}"
  dataFrom:
    - extract:
        key: llm-api
    - extract:
        key: omlx
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# Upstream credential: the oMLX server key on the MacStudio. Consumed by
# AgentgatewayModel policies.auth (default secret key `Authorization`,
# written upstream as `Authorization: Bearer ...`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: studio-api-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        Authorization: "{{ .api_key }}"
  dataFrom:
    - extract:
        key: omlx
