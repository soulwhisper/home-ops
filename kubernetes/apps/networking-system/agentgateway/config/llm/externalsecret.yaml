---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# Consumer-facing lane keys, sourced from the 1Password `agentgateway` item.
# One credential per lane, issued only to that lane's consumers (see ai.md
# "LLM lane keys"). The oMLX server key never leaves the backends, which
# inject it upstream via policies.auth.secretRef (studio-api-auth).
# Key format: llm-<lane>-<hex16>.
#
# Cross-lane enrollment: a lane key is also registered in the secret of any
# lane its holders legitimately need — llm-omni-auth additionally enrolls the
# agent key (hermes aux) and the uncensored key (open-webui auxiliary tasks).
# Revocation = remove the entry from every lane and media capability secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-uncensored-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        uncensored: |
          {
            "key": "{{ .llm_uncensored }}",
            "metadata": {
              "user_id": "human"
            }
          }
  dataFrom:
    - extract:
        key: agentgateway
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-agent-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        agent: |
          {
            "key": "{{ .llm_agent }}",
            "metadata": {
              "user_id": "automation"
            }
          }
  dataFrom:
    - extract:
        key: agentgateway
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-omni-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        omni: |
          {
            "key": "{{ .llm_omni }}",
            "metadata": {
              "user_id": "extractor"
            }
          }
        # cross-lane: hermes aux side-tasks ride omni with the agent key
        agent: |
          {
            "key": "{{ .llm_agent }}",
            "metadata": {
              "user_id": "automation"
            }
          }
        # cross-lane: open-webui auxiliary tasks ride omni with the chat key
        uncensored: |
          {
            "key": "{{ .llm_uncensored }}",
            "metadata": {
              "user_id": "human"
            }
          }
  dataFrom:
    - extract:
        key: agentgateway
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# Upstream credential: the oMLX server key on the MacStudio. Consumed by
# the chat and media backends' policies.auth (default secret key
# `Authorization`, written upstream as `Authorization: Bearer ...`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: studio-api-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        Authorization: "{{ .api_key }}"
  dataFrom:
    - extract:
        key: omlx
