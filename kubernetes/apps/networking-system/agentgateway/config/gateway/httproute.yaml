---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-dashboard
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/icon: si-anthropic
    gethomepage.dev/name: AgentGateway
    gethomepage.dev/group: Observability
    gethomepage.dev/pod-selector: app.kubernetes.io/name=agentgateway-proxy
    gethomepage.dev/href: "https://ai.noirprime.com/ui/"
spec:
  hostnames: ["ai.noirprime.com"]
  parentRefs:
    - name: kgateway-internal
      namespace: networking-system
  rules:
    - backendRefs:
        - name: agentgateway-proxy
          namespace: networking-system
          port: 15000
---
# Exposes the agentgateway API surface (/chat, /mcp) to the intranet via
# kgateway-internal (10.10.0.131) on its own subdomain: TLS termination via
# the wildcard cert + external-dns automation. Dashboard stays on ai.noirprime.com.
# Auth stays at agentgateway (strict API key) — no SSO extAuth on API paths.
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-intranet
spec:
  hostnames: ["api.noirprime.com"]
  parentRefs:
    - name: kgateway-internal
      namespace: networking-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /chat
      backendRefs:
        - name: agentgateway-proxy
          namespace: networking-system
          port: 80
      # Align with the LLM route; gateway defaults would cut long streams.
      timeouts:
        request: 300s
    # Open LLM lane — same timeout discipline; auth still terminates at
    # agentgateway (strict API key), only promptGuard differs.
    - matches:
        - path:
            type: PathPrefix
            value: /chat/raw
      backendRefs:
        - name: agentgateway-proxy
          namespace: networking-system
          port: 80
      timeouts:
        request: 300s
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: agentgateway-proxy
          namespace: networking-system
          port: 80
