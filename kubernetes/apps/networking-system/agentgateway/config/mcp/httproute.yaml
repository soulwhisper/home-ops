---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
# Tiered, guarded MCP endpoints — one route per ToolHive group, each with its
# own credential (group <-> route <-> key bound 1:1:1; see mcpgroup.yaml).
# Every route rewrites its tier prefix to the canonical /mcp before the
# backend sees it (the streamable-HTTP endpoint on each vmcp lives exactly at
# /mcp). MCP has no open lane: the search and agent tiers carry the
# mcp-guardrails ExtMCP sidecar (FailClosed) — untrusted web content feeding
# an unguarded LLM lane, and external operator agents without cluster-side
# promptGuard; cluster adds guarded lanes + CEL allowlists + token
# boundaries; home is RW-by-design behind the guarded lane and the HA token.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-mcp-search-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp/search
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /mcp
      # Guarded tiers land scan time inside the route budget (response scans
      # buffer the body before headers go out); 120s covers the 45s callout
      # budget plus tool execution with headroom — the gateway default would
      # cut long guarded calls early.
      timeouts:
        request: 120s
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: mcp-backend-search
