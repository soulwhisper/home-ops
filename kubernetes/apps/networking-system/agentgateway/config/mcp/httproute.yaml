# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
# operator-agent tier: forgejo ticket RW + incident memory. Distinct route
# and credential (mcp-agent-auth), never issued to chat-tier apps — the
# shared LLM keys cannot reach this path.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-mcp-agent-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
