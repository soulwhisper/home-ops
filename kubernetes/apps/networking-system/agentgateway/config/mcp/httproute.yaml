---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
# Tiered, guarded MCP endpoints — one rule per ToolHive chat tier. Every rule
# rewrites its tier prefix to the canonical /mcp before the backend sees it
# (the streamable-HTTP endpoint on each vmcp lives exactly at /mcp), mirroring
# the siliconflow-lane rewrite pattern.
# MCP has no open lane: every tier carries the mcp-guardrails ExtMCP sidecar
# (FailClosed) via the backend policy, regardless of which LLM lane the client
# used. Auth: mcp-api-auth (strict API key, shared chat-tier credential).
# /mcp/ops is NOT here — it lives on its own route below with a distinct
# credential so chat-tier key holders cannot reach incident memory.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-mcp-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp/ro
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /mcp
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: mcp-backend-ro
    - matches:
        - path:
            type: PathPrefix
            value: /mcp/rw
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /mcp
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: mcp-backend-rw
    - matches:
        - path:
            type: PathPrefix
            value: /mcp/ext
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /mcp
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: mcp-backend-ext
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
# ops isolation tier on a separate route: the mcp-ops-auth policy binds a
# distinct credential (never issued to chat-tier apps), so the shared
# llm-api-auth key cannot reach incident memory through this path.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-mcp-ops-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp/ops
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /mcp
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: mcp-backend-ops
