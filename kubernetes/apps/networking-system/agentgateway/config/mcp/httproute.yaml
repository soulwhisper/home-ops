---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
# Tiered, guarded MCP endpoints — one route per ToolHive group, each with its
# own credential (group <-> route <-> key bound 1:1:1; see mcpgroup.yaml).
# Every route rewrites its tier prefix to the canonical /mcp before the
# backend sees it (the streamable-HTTP endpoint on each vmcp lives exactly at
# /mcp). MCP has no open lane: the search tier carries the mcp-guardrails
# ExtMCP sidecar (FailClosed) — the only tier with untrusted web content
# feeding an unguarded LLM lane; other tiers rely on guarded lanes + CEL
# allowlists + token boundaries.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-mcp-search-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp/search
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /mcp
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: mcp-backend-search
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
