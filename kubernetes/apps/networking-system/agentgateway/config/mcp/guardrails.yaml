---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: mcp-guardrails
spec:
  # Attached to the search and agent backends ONLY (2026-10-20 decision):
  # - search is the untrusted-content tier (arbitrary web/RSS/git content)
  #   feeding an unguarded lane (open-webui uncensored);
  # - agent's consumers are EXTERNAL operator agents — they do not ride the
  #   cluster's guarded LLM lanes, and forgejo ticket bodies carry
  #   alert/log-derived (hence untrusted) strings, so the sidecar is their
  #   only cluster-side injection screen.
  # cluster/home consumers (hermes) ride the guarded `agent` lane — cluster
  # adds CEL allowlists and token/SA boundaries, home is RW-by-design behind
  # the HA token — so the sidecar there was duplication, and FailClosed on
  # those tiers made one sidecar an outage for all of MCP.
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: mcp-backend-search
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: mcp-backend-agent
  backend:
    mcp:
      guardrails:
        processors:
          - remote:
              backendRef:
                name: mcp-guardrails
                port: 9001
              failureMode: FailClosed
            methods:
              # Full = Request + Response. See header: this is the
              # single most important phase choice in the policy.
              tools/call: Full
              # Response-only: scan tool descriptions for poisoning.
              tools/list: Response
              # Response-only: scan prompt content for injection.
              prompts/get: Response
              # Response-only: scan resource bodies for exfil/injection.
              resources/read: Response
---
# The guardrail Service is also the ExtMcp callout backend. Its backend-level
# timeout overrides agentgateway's 10s fallback for that callout.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: mcp-guardrails-timeout
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: mcp-guardrails
  backend:
    http:
      # Four balanced response windows, each bounded by 3.5s.
      requestTimeout: 15s
