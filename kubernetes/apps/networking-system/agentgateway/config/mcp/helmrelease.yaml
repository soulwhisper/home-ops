---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name mcp-guardrails
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      hostUsers: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # per-call stateless (invariant windows reset on any move anyway);
          # short grace speeds eviction/restart by ~20s
          terminationGracePeriodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/soulwhisper/mcp-guardrails
              # 1.2.1: 22M QUANT model (same accuracy, ~4x smaller, faster CPU
              # inference) + OTEL_METRICS_ENABLED toggle (#142/#141)
              tag: 1.2.1
            env:
              # App is OTLP/gRPC-only (guardrails/otel.py proto.grpc exporters,
              # insecure derived from the http:// scheme). gRPC must go to :4317;
              # :4318 is the HTTP receiver — plaintext h2c there got HTTP 400
              # ("Failed parsing HTTP/2") and zero spans ever reached langfuse.
              OTEL_EXPORTER_OTLP_ENDPOINT: "http://opentelemetry-collector.monitoring-system.svc.cluster.local:4317"
              # collector runs traces-only pipelines; without this the app
              # pushes metrics every 15s and logs UNIMPLEMENTED forever
              # (needs image >=1.2.1, soulwhisper/mcp-guardrails#141)
              OTEL_METRICS_ENABLED: "false"
              # 22M fp32 measured 1.0-3.1s/scan on a 2-core quota (twice broke
              # tools/list on FailClosed timeout). 1.2.1 ships the quant model
              # (same accuracy, ~4x less compute) — 3s timeout stays as the
              # FailClosed guard; limits.cpu=4 is the burst quota.
              SCANNER_TIMEOUT_MS: "3000"
              # deterministic service.name for the collector's servitor
              # pipeline filter (traces -> langfuse)
              OTEL_SERVICE_NAME: "mcp-guardrails"
            resources:
              # limits.cpu=4 is what actually buys scan speed (CFS quota);
              # requests reserve scheduler capacity AND cpu.shares under
              # contention. requests=4 tripped KubeCPUOvercommit (cap (N-1)/N
              # = 2/3 on 3 nodes; we were at 0.6728). requests=1 would halve
              # the pod's share exactly when scans matter (FailClosed).
              # requests=2 clears the alert (~0.64) and keeps a workable share.
              requests:
                cpu: "2"
                memory: 512Mi
              limits:
                cpu: "4"
                memory: 2Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  grpc: { port: &port 9001 }
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  grpc: { port: *port }
                  periodSeconds: 15
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  grpc: { port: *port }
                  periodSeconds: 2
                  failureThreshold: 150
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true

    service:
      app:
        ports:
          http:
            appProtocol: kubernetes.io/h2c
            port: *port

    persistence:
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
