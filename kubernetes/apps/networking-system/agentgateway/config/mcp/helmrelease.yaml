---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name mcp-guardrails
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      hostUsers: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # per-call stateless (invariant windows reset on any move anyway);
          # short grace speeds eviction/restart by ~20s
          terminationGracePeriodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/soulwhisper/mcp-guardrails
              tag: 1.2.0
            env:
              # App is OTLP/gRPC-only (guardrails/otel.py proto.grpc exporters,
              # insecure derived from the http:// scheme). gRPC must go to :4317;
              # :4318 is the HTTP receiver — plaintext h2c there got HTTP 400
              # ("Failed parsing HTTP/2") and zero spans ever reached langfuse.
              OTEL_EXPORTER_OTLP_ENDPOINT: "http://opentelemetry-collector.monitoring-system.svc.cluster.local:4317"
              # Measured on this hardware (2 shared cores): 22M ≈ 1.0s/scan —
              # the 1000ms set in #4167 still denies (observed 1002ms deny at
              # 11:04). 3s gives 3x margin while staying FailClosed-meaningful.
              # The remaining lever for real latency is the 22M quant variant
              # (LF_ONNX_FILE=model.quant.onnx, same accuracy) — deferred.
              SCANNER_TIMEOUT_MS: "3000"
              # deterministic service.name for the collector's servitor
              # pipeline filter (traces -> langfuse)
              OTEL_SERVICE_NAME: "mcp-guardrails"
            resources:
              # back to pre-band-aid sizing; the 22M needs a fraction of the
              # 86M's CPU (and ~90MB vs 1.1GB model memory)
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "2"
                memory: 2Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  grpc: { port: &port 9001 }
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  grpc: { port: *port }
                  periodSeconds: 15
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  grpc: { port: *port }
                  periodSeconds: 2
                  failureThreshold: 150
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true

    service:
      app:
        ports:
          http:
            appProtocol: kubernetes.io/h2c
            port: *port

    persistence:
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
