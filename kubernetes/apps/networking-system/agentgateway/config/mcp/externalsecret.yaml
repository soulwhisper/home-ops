---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# Per-group MCP credentials, sourced from the 1Password `agentgateway` item.
# One key per group, issued ONLY to that group's consumer(s):
#   mcp_search     -> open-webui, dsh-web
#   mcp_cluster    -> hermes (MCP_CLUSTER_KEY), dsh-web
#   mcp_home       -> hermes (MCP_HOME_KEY), dsh-web
#   mcp_agent      -> operator agents only, never chat-tier apps
# Key format: mcp-<group>-<hex16> (see docs/application/ai.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-search-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        search: |
          {
            "key": "{{ .mcp_search }}",
            "metadata": {
              "user_id": "search"
            }
          }
  dataFrom:
    - extract:
        key: agentgateway
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-cluster-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        cluster: |
          {
            "key": "{{ .mcp_cluster }}",
