---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-search-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        search: |
          {
            "key": "{{ .mcp_search }}",
            "metadata": {
              "user_id": "search"
            }
          }
  dataFrom:
    - extract:
        key: agentgateway
