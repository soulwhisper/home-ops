---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# ai-ops tier credential for /mcp/aiops — deliberately separate from the
# shared chat-tier key (llm-api-auth). Issue ONLY to ai-ops agents; never
# distribute to chat-tier apps (open-webui & co).
# Sourced from the 1Password `llm-api` item field `agentgateway_agent_auth`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-aiops-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        api: |
          {
            "key": "{{ .agentgateway_agent_auth }}",
            "metadata": {
              "user_id": "aiops"
            }
          }
  dataFrom:
    - extract:
        key: llm-api
