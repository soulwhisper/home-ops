---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# operator-agent tier credential (forgejo ticket RW + hindsight ops bank).
# Deliberately separate from every chat-tier key: LLM/MCP group keys are NOT
# valid here, which is what isolates incident memory and the tickets repo.
# Value carried over from the old llm-api.agentgateway_agent_auth field.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-agent-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        agent: |
          {
            "key": "{{ .mcp_agent }}",
            "metadata": {
              "user_id": "agent"
            }
          }
  dataFrom:
    - extract:
        key: agentgateway
