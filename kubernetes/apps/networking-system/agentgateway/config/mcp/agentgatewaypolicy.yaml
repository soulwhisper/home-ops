---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
# Per-route API-key auth, one credential per ToolHive group. A key minted for
# one group is invalid on every other group's route — this is what actually
# scopes open-webui to search and hermes to cluster/home.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: mcp-search-auth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-mcp-search-route
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretRef:
        name: mcp-search-auth
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
