---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
# Gateway-level MCP tool allowlists (backend.mcp.authorization, Allow =
# default-deny for everything unmatched; list ops filtered per item, call/get
# rejected). Requires vmcp optimizer OFF so aggregated {workload}_-prefixed
# tool names reach the gateway — see toolhive/config/virtualmcpserver.yaml.
#
# CEL filters serve two purposes: security default-deny where the upstream has
# no token/SA boundary (firecrawl, trendradar, victoria-*), and schema
# size control on fat APIs (forgejo to the ticket workflow) so tool lists fit
# 64K-context consumers.
# Token-bounded servers stay unfiltered: the k8s read-only SA, and the
# github-ro tier (read-only server mode plus lockdown, with injection scans
# at the guardrail layer). fluxcd is the exception inside cluster: its generic
# get_kubernetes_* tools are excluded by mcp-cluster-filter. Hindsight banks
# are bounded by the tier key.
#
# Tool allowlists are version-sensitive: re-enumerate tools/list and re-check
# these expressions on every image bump. The filtered servers' mcpserver.yaml
# files track their current images.
#
# NOTE: expressions match tool names only; prompts/resources from these
# servers match nothing and are therefore also denied (none exist today —
# revisit if a server starts exposing them).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: mcp-search-filter
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: mcp-backend-search
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
            # firecrawl: retrieval only — scrape/search/map/crawl (+status).
            # Excluded: monitor_*, agent*, interact*, feedback, find_tools,
            # credit_usage, research_*, developer/gov_search (state-changing
            # or off-role for search-tier web fetching).
            - |
              mcp.tool.name.matches('^mcp-firecrawl_firecrawl_(scrape|search|map|crawl|check_crawl_status)$')
              || mcp.tool.name.startsWith('mcp-context_')
              || mcp.tool.name.matches('^trendradar_(search_news|get_latest_news|get_trending_topics|get_latest_rss|search_rss|get_news_by_date|read_article|read_articles_batch|find_related_news|analyze_topic_trend|analyze_data_insights|analyze_sentiment|aggregate_news|compare_periods|resolve_date_range|list_available_dates|generate_summary_report)$')
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: mcp-cluster-filter
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: mcp-backend-cluster
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
            # fluxcd: flux-native only; its generic get_kubernetes_* getters
            # duplicate mcp-kubernetes (which is richer).
            # victoria-logs: query surface only — flags is a server-config read.
            # victoria-metrics: query surface only — excluded: documentation
            # (also MCP_DISABLED_TOOLS), flags, tsdb_status, active_queries,
            # top_queries, metric_statistics.
            - |
              mcp.tool.name.startsWith('mcp-kubernetes_')
              || ( mcp.tool.name.startsWith('mcp-fluxcd_')
                   && ! mcp.tool.name.startsWith('mcp-fluxcd_get_kubernetes_') )
              || ( mcp.tool.name.startsWith('mcp-victoria-logs_')
                   && mcp.tool.name != 'mcp-victoria-logs_flags' )
              || mcp.tool.name.matches('^mcp-victoria-metrics_(query|query_range|labels|label_values|series|metrics|metrics_metadata|explain_query|prettify_query|alerts|rules)$')
              || mcp.tool.name.startsWith('mcp-victoria-traces_')
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
# agent tier: forgejo narrowed to the ticket workflow (the only sanctioned use
# of this tier; homelab-tickets skill); hindsight-ops stays whole — it is the
# incident memory. pat_tickets remains the permission boundary; this is the
# second layer plus schema-size control (the full forgejo surface alone would
# not fit a 64K-context consumer alongside the other tiers).
# Explicitly out: delete_*, repo/hook/secret admin, dispatch_workflow
# (operator-only by design), stopwatch/tracked-time.
# Tracked against forgejo-mcp v3.3.0 (163 tools enumerated) — re-verify on
# every version bump.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: mcp-agent-filter
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: mcp-backend-agent
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
            - |
              mcp.tool.name.matches('^mcp-forgejo_(list_repo_issues|get_issue_by_index|list_issue_comments|get_issue_comment|create_issue_comment|edit_issue_comment|issue_state_change|search_issues|list_repo_labels|add_issue_labels|remove_issue_labels|update_issue)$')
              || mcp.tool.name.startsWith('mcp-hindsight-ops_')
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: mcp-browser-filter
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: mcp-backend-browser
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
            # This group contains only Playwright browser tools. SSRF and
            # private-network access are constrained by the browser CNP.
            # browser_run_code_unsafe executes host-side code in the MCP pod,
            # outside the browser sandbox and its network boundary.
            - |
              mcp.tool.name.startsWith('mcp-playwright_browser_')
              && mcp.tool.name != 'mcp-playwright_browser_run_code_unsafe'
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: mcp-github-pr-filter
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: mcp-backend-github-pr
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
            # Branch/commit/PR only. merge_pull_request and every other tool
            # are denied both here and by the server's GITHUB_TOOLS allowlist.
            - mcp.tool.name.matches('^mcp-github-pr_(get_file_contents|list_branches|create_branch|create_or_update_file|push_files|get_commit|list_commits|pull_request_read|list_pull_requests|search_pull_requests|create_pull_request)$')
