---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.kgateway.dev/gatewayparameters_v1alpha1.json
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: kgateway-params
spec:
  kube:
    deployment:
      replicas: 3 # bgp advertise 3 nodes
    podTemplate:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # k8s 1.34 forbids matchLabelKeys without a labelSelector; Exists
          # spans both internal/external gateway proxies. matchLabelKeys may
          # not duplicate a selector key, so only pod-template-hash stays —
          # spreading is scoped to each gateway's own replicaset
          labelSelector:
            matchExpressions:
              - key: gateway.networking.k8s.io/gateway-name
                operator: Exists
          matchLabelKeys:
            - pod-template-hash
    envoyContainer:
      bootstrap:
        logFormat:
          json:
            time: "%Y-%m-%dT%T.%eZ"
            level: "%l"
            logger: "%n"
            thread: "%t"
            source: "%g:%#"
            # no "message": envoy JSON logs always include the message field
            # automatically and reject %v explicitly
      resources:
        requests:
          cpu: "100m"
          memory: "512Mi"
        limits:
          memory: "1Gi"
    service:
      externalTrafficPolicy: Local
    podDisruptionBudget:
      spec:
        minAvailable: 1
        unhealthyPodEvictionPolicy: AlwaysAllow
