---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: &name kgateway-external
spec:
  jobLabel: *name
  namespaceSelector:
    matchNames:
      - networking-system
  podMetricsEndpoints:
    - port: http-monitoring
      path: /metrics
      honorLabels: true
      # envoy per-cluster histograms dominate vmsingle cardinality (~16k series)
      metricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: envoy_cluster_update_duration_bucket
  selector:
    matchLabels:
      app.kubernetes.io/name: *name
---
