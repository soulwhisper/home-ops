---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kgateway-internal
  # NOTE: no external-dns target annotation — it makes route records CNAMEs to
  # the gateway hostname, and AdGuard answers those CNAMEs without chasing the
  # target, which breaks glibc stub resolvers. A records from the gateway LB
  # address work everywhere.
spec:
  gatewayClassName: kgateway
  infrastructure:
    annotations:
      external-dns.kubernetes.io/hostname: gateway-int.noirprime.com
      lbipam.cilium.io/ips: "10.10.0.131"
    parametersRef:
      name: kgateway-params
      group: gateway.kgateway.dev
      kind: GatewayParameters
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: noirprime-com-tls
