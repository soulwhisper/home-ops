---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.kgateway.dev/gatewayextension_v1alpha1.json
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayExtension
metadata:
  name: authentik-ext-auth
spec:
  extAuth:
    # HTTP ext-authz forwards only Host/Method/Path/Content-Length/Authorization
    # by default — without cookie the outpost never sees the state/session
    # cookie and every OAuth callback fails with 400
    headersToForward:
      - "cookie"
      - "authorization"
      - "x-forwarded-for"
      - "user-agent"
    httpService:
      backendRef:
        name: authentik-server
        namespace: security-system
        port: 80
      pathPrefix: "/outpost.goauthentik.io/auth/envoy"
      authorizationRequest:
        headersToAdd:
          x-forwarded-host: "%REQ(:authority)%"
          x-forwarded-proto: "%PROTOCOL%"
      authorizationResponse:
        headersToBackend:
          - "x-authentik-username"
          - "x-authentik-groups"
          - "x-authentik-email"
          - "x-authentik-name"
          - "x-authentik-uid"
          - "set-cookie"
        # kgateway 2.4: forward the 302 Location to the client on denial so
        # browsers reach the authentik login page (redirect-based flows);
        # set-cookie must pass too or the outpost session/state cookie never
        # reaches the browser and the OAuth callback 400s with
        # "auth callback without a valid session cookie"
        headersToClient:
          - "location"
          - "set-cookie"
        # authentik envoy-mode contract: on allow, the outpost returns the
        # session via a `cookie` header meant for the downstream client;
        # without it the callback completes server-side but the browser never
        # receives the session and loops back to login
        headersToClientOnSuccess:
          - "cookie"
          - "set-cookie"
          - "location"
