---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name externaldns-powerdns
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: external-dns
  values:
    fullnameOverride: *name
    domainFilters: ["k8s.pdns.homelab.internal"]
    extraArgs:
      - --gateway-name=kgateway-internal
      - --pdns-server=https://10.10.0.100:8443
      - --tls-ca=/etc/powerdns-tls/api.pem
    env:
      - name: EXTERNAL_DNS_PDNS_API_KEY
        valueFrom:
          secretKeyRef:
            name: *name
            key: api-key
    extraVolumes:
      - name: powerdns-tls
        configMap:
          name: powerdns-api-tls
    extraVolumeMounts:
      - name: powerdns-tls
        mountPath: /etc/powerdns-tls
        readOnly: true
    podAnnotations:
      reloader.stakater.com/auto: "true"
    managedRecordTypes: [A, AAAA, CNAME]
    policy: upsert-only
    provider:
      name: pdns
    resources:
      requests:
        cpu: 16m
        memory: 64Mi
      limits:
        memory: 128Mi
    sources:
      - gateway-httproute
      - service
    txtOwnerId: home-ops-powerdns
    txtPrefix: "pdns-%{record_type}."
