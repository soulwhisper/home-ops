---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name externaldns-powerdns
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: external-dns

  values:
    fullnameOverride: *name
    domainFilters: ["noirprime.com"]
    excludeDomains: ["derp.noirprime.com"]
    extraArgs:
      - --gateway-name=kgateway-internal
      - --pdns-server=http://10.10.0.100:9200
    env:
      - name: EXTERNAL_DNS_PDNS_API_KEY
        valueFrom:
          secretKeyRef:
            name: *name
            key: EXTERNAL_DNS_PDNS_API_KEY
    podAnnotations:
      reloader.stakater.com/auto: "true"
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 2000
      runAsGroup: 2000
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: { drop: ["ALL"] }
    managedRecordTypes: [A, AAAA, CNAME]
    policy: upsert-only
    provider:
      name: pdns
    resources:
      requests:
        cpu: 16m
        memory: 64Mi
      limits:
        memory: 128Mi
    serviceMonitor:
      enabled: true
    sources:
      - gateway-httproute
      - service
    txtOwnerId: "home-ops"
    txtPrefix: "k8s-int."
