---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name externaldns-powerdns
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: external-dns

  values:
    fullnameOverride: *name
    domainFilters: ["noirprime.com"]
    excludeDomains: ["derp.noirprime.com"]
    extraArgs:
      - --gateway-name=kgateway-internal
      - --pdns-server=http://10.10.0.100:8081
    env:
      - name: EXTERNAL_DNS_PDNS_API_KEY
        valueFrom:
          secretKeyRef:
            name: *name
            key: api-key
    podAnnotations:
      reloader.stakater.com/auto: "true"
    managedRecordTypes: [A, AAAA, CNAME]
    policy: upsert-only
    provider:
      name: pdns
    resources:
      requests:
        cpu: 16m
        memory: 64Mi
      limits:
        memory: 128Mi
    serviceMonitor:
      enabled: true
    sources:
      - gateway-httproute
      - service
    txtOwnerId: home-ops-powerdns
    txtPrefix: "pdns-%{record_type}."
