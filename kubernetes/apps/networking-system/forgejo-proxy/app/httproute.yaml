---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
# HTTPS front for NAS-hosted Forgejo via the internal gateway (wildcard LE
# cert lives on the https listener). TLS terminates here; upstream hop to the
# NAS stays plain HTTP on wired VLAN 100 (same accepted posture as before).
# No authentik: consumers are PAT/bearer API clients (runner, webhook-relay,
# MCP) that forward-auth would break. Deliberately NOT exposed via the
# external gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &name forgejo-proxy
spec:
  hostnames: ["git.noirprime.com"]
  parentRefs:
    - name: kgateway-internal
      namespace: networking-system
      sectionName: https
  rules:
    - backendRefs:
        - name: *name
          port: 9003
