---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpgroup_v1beta1.json
# Grouping rule: a new group is created ONLY for a new consumer or a new
# permission class; a new server joins the group whose consumer+permission
# match. Group <-> agentgateway route <-> API key are bound 1:1:1
# (see agentgateway config/mcp/).
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPGroup
metadata:
  name: search
spec:
  description: "Search tier. Web/docs/news/codebase retrieval: firecrawl, context7, trendradar. Issued to hermes and open-webui."
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpgroup_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPGroup
metadata:
  name: cluster
spec:
  description: "In-cluster, read-only. No egress; read-only Kubernetes/Flux SAs and scoped Grafana/Victoria* tokens. For the ops agent (hermes)."
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpgroup_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPGroup
metadata:
  name: persona
spec:
  description: "In-cluster, read-write. No egress; Hindsight persona bank only. Home Assistant moved to the archived smarthome group with its application."
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpgroup_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPGroup
metadata:
  name: agent
spec:
  description: "Operator-agent tier. Forgejo ticket RW (pat_tickets; the Forgejo-side token scope is the boundary) + incident/RCA memory (hindsight ops bank). Separate credential keeps chat-tier consumers out. Issued to hermes and external operator agents."
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpgroup_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPGroup
metadata:
  name: browser
spec:
  description: "Isolated Chromium automation through Playwright. Public web egress only; CDP is restricted to its MCP workload. No current consumer."
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpgroup_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPGroup
metadata:
  name: github-pr
spec:
  description: "GitHub branch, file commit and pull-request creation without merge. Uses a dedicated repository-scoped credential. No current consumer."
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpgroup_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPGroup
metadata:
  name: github-ro
spec:
  description: "GitHub code and repository retrieval in read-only mode. Issued to hermes."
