---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcptelemetryconfig_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPTelemetryConfig
metadata:
  name: shared-otel
spec:
  openTelemetry:
    enabled: true
    endpoint: opentelemetry-collector.monitoring-system.svc.cluster.local:4318
    insecure: true
    # OTEL metrics disabled: the collector runs traces-only pipelines (no
    # otlp metrics pipeline), so every upload 404s and spams "failed to upload
    # metrics". MCP metrics are already collected via the prometheus scrape
    # below (scrapeconfig.yaml targets up).
    metrics:
      enabled: false
    tracing:
      enabled: true
      # One sampling decision: emit from vMCP and let the collector filter
      # connection noise and retain model/tool traces. A 5% source rate
      # combined with the collector's baseline sampled only ~0.5% of calls.
      samplingRate: "1.0"
  prometheus:
    enabled: true
---
# Backend servers are a selected pilot, not a second full-coverage tier:
# vMCP already emits tools/call with tool name and status. Backend spans are
# kept at 10% to expose server-internal latency without duplicating vMCP
# volume.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPTelemetryConfig
metadata:
  name: backend-otel
spec:
  openTelemetry:
    enabled: true
    endpoint: opentelemetry-collector.monitoring-system.svc.cluster.local:4318
    insecure: true
    metrics:
      enabled: false
    tracing:
      enabled: true
      samplingRate: "0.1"
  prometheus:
    enabled: false
