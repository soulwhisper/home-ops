---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcptelemetryconfig_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPTelemetryConfig
metadata:
  name: shared-otel
spec:
  openTelemetry:
    enabled: true
    # ToolHive's OTLP client is gRPC (host:port form, scheme stripped by the
    # operator) — must target the collector's gRPC receiver :4317, not the
    # HTTP receiver :4318 (plaintext h2c -> HTTP 400, spans silently dropped).
    endpoint: opentelemetry-collector.monitoring-system.svc.cluster.local:4317
    insecure: true
    # OTEL metrics disabled: the collector runs traces-only pipelines (no
    # otlp metrics pipeline), so every upload 404s and spams "failed to upload
    # metrics". MCP metrics are already collected via the prometheus scrape
    # below (scrapeconfig.yaml targets up).
    metrics:
      enabled: false
    tracing:
      enabled: true
      samplingRate: "0.05"
  prometheus:
    enabled: true
