---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ai-behavior-rules
spec:
  groups:
    - name: ai-behavior.rules
      rules:
        - alert: AgentNewToolObserved
          annotations:
            summary: >-
              Agent invoked {{ $labels.server }} tool {{ $labels.mcp_resource_id }} not seen in the last 7 days.
          expr: |
            sum by (server, mcp_resource_id) (increase(toolhive_mcp_requests_total{mcp_method="tools/call"}[1h])) > 0
            unless
            sum by (server, mcp_resource_id) (increase(toolhive_mcp_requests_total{mcp_method="tools/call"}[7d] offset 1h)) > 0
          labels:
            severity: info
        - alert: AgentToolCallSpike
          annotations:
            summary: >-
              {{ $labels.server }} tool {{ $labels.mcp_resource_id }} call rate is 4x above its 7d baseline (sponge/loop suspect).
          expr: |
            sum by (server, mcp_resource_id) (rate(toolhive_mcp_requests_total{mcp_method="tools/call"}[15m]))
            > 4 * sum by (server, mcp_resource_id) (avg_over_time(rate(toolhive_mcp_requests_total{mcp_method="tools/call"}[15m])[7d:1h])) > 0
          for: 15m
          labels:
            severity: warning
        - alert: AgentRWToolOffHours
          annotations:
            summary: "write-tier tool {{ $labels.mcp_resource_id }} ({{ $labels.job }}) invoked between 02:00-07:00 CST."
          expr: |
            sum by (job, mcp_resource_id) (increase(toolhive_mcp_requests_total{job=~"vmcp-home|vmcp-agent", mcp_method="tools/call"}[10m])) > 0
            and on() (hour() >= 18 and hour() <= 23)
          labels:
            severity: critical
        - alert: AgentEgressDenied
          annotations:
            summary: >-
              CNP denied egress from {{ $labels.source_workload }} to
              {{ $labels.destination_namespace }}/{{ $labels.destination_workload }}
              (empty = world/unidentified IP; intent/behaviour divergence).
          expr: |
            sum by (source_workload, destination_namespace, destination_workload) (increase(hubble_drop_total{reason="POLICY_DENIED", source_namespace="servitor-apps"}[5m])) > 0
          # require sustained drops: backend restarts cause short reconnect
          # storms to stale pod IPs (denied by the private-CIDR except). Cilium
          # now terminates TCP sockets to deleted backends (cilium helmrelease
          # lb-sock-terminate-all-protos), so a storm persisting past 15m is
          # real divergence or a socket Cilium did not load-balance.
          # 2026-10-08: open-webui -> deleted dragonfly IP fired for 27h before
          # TCP termination was enabled.
          for: 15m
          labels:
            severity: critical
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ai-memory-rules
spec:
  groups:
    - name: ai-memory.rules
      rules:
        - alert: MemoryWriteSurge
          expr: >
            sum by (server) (increase(toolhive_mcp_tool_calls_total{
              tool=~"retain|add_messages_to_session"}[15m])) > 60
          labels:
            severity: warning
        - alert: MemoryWriteErrors
          expr: >
            sum by (server, tool) (increase(toolhive_mcp_tool_calls_total{
              tool=~"retain|add_messages_to_session|create_session", status!="success"}[30m])) > 5
          labels:
            severity: warning
        - alert: MemoryBypassAttempt
          annotations:
            summary: "{{ $labels.source_workload }} Attempt to bypass the MCP layer was blocked."
          expr: >
            increase(hubble_drop_total{
              destination_namespace="selfhosted-apps",
              destination_workload="hindsight"}[15m]) > 0
          labels:
            severity: critical
