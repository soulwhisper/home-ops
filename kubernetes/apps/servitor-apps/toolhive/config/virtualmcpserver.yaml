---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/virtualmcpserver_v1beta1.json
# Optimizer stays OFF on all groups: it masks real tool names behind
# find_tool/call_tool meta-tools, which would blind gateway-level tool
# filtering (agentgateway backend.mcp.authorization) — the gateway would only
# see the meta-tools. With it off, aggregated {workload}_-prefixed tool names
# reach the gateway and filters.yaml can allowlist per route; the vmcp
# embeddings dependency stays out with it.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: &name search
spec:
  incomingAuth:
    type: anonymous
  outgoingAuth:
    source: inline
    backends:
      # github-mcp-server http mode requires a per-request bearer token
      mcp-github:
        type: externalAuthConfigRef
        externalAuthConfigRef:
          name: mcp-github
  # Operator default cpu limit is 500m; persistent tools/list and rerank
  # bursts throttled ~52% of CFS periods. Memory: the runner leaks ~9Mi/h
  # under streamable-http sessions (same ToolHive leak class as
  # hindsight/trendradar — peaked 348Mi in 39h and OOMKilled once,
  # homelab-tickets#59). 1Gi + the daily restarter cronjob caps it.
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
  groupRef:
    name: *name
  telemetryConfigRef:
    name: shared-otel
    serviceName: *name
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
    operational:
      failureHandling:
        partialFailureMode: best_effort
        healthCheckInterval: 10s
        healthCheckTimeout: 5s
        unhealthyThreshold: 2
        circuitBreaker:
          enabled: true
          failureThreshold: 3
          timeout: 30s
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/virtualmcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: &name cluster
spec:
  incomingAuth:
    type: anonymous
  outgoingAuth:
    source: inline
  # see search vmcp for the resources comment (same leak class, same caps)
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
  groupRef:
    name: *name
  telemetryConfigRef:
    name: shared-otel
    serviceName: *name
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
    operational:
      failureHandling:
        partialFailureMode: best_effort
        healthCheckInterval: 10s
        healthCheckTimeout: 5s
        unhealthyThreshold: 2
        circuitBreaker:
          enabled: true
          failureThreshold: 3
          timeout: 30s
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/virtualmcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: &name home
spec:
  incomingAuth:
    type: anonymous
  outgoingAuth:
    source: inline
  groupRef:
    name: *name
  telemetryConfigRef:
    name: shared-otel
    serviceName: *name
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
    operational:
      failureHandling:
        partialFailureMode: best_effort
        # vmcp requires timeout < interval (startup validation). ha-mcp's
        # NORMAL tools/list is ~6s (measured healthy; tool-search index build
        # spikes past 5s), so 10s/5s stormed the circuit breaker (#3958);
        # 30s/15s clears normal latency with 2.5x headroom, catches real
        # hangs, and cuts check churn vs the old 10s cadence.
        healthCheckInterval: 30s
        healthCheckTimeout: 15s
        unhealthyThreshold: 2
        circuitBreaker:
          enabled: true
          failureThreshold: 3
          timeout: 30s
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/virtualmcpserver_v1beta1.json
# operator-agent tier: forgejo ticket RW + hindsight ops bank. Separate group
# + credential so chat-tier consumers can never reach incident memory or the
# tickets repo; reached via agentgateway /mcp/agent only.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: &name agent
spec:
  incomingAuth:
    type: anonymous
  outgoingAuth:
    source: inline
    backends:
      # forgejo-mcp enforces a per-request bearer token (--token)
      mcp-forgejo:
        type: externalAuthConfigRef
        externalAuthConfigRef:
          name: mcp-forgejo
  groupRef:
    name: *name
  telemetryConfigRef:
    name: shared-otel
    serviceName: *name
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
    operational:
      failureHandling:
        partialFailureMode: best_effort
        healthCheckInterval: 30s
        healthCheckTimeout: 15s
        unhealthyThreshold: 2
        circuitBreaker:
          enabled: true
          failureThreshold: 3
          timeout: 30s
