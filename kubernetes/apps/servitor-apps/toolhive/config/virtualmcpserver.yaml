---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/virtualmcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: &name internal-ro
spec:
  incomingAuth:
    type: anonymous
  outgoingAuth:
    source: inline
  # optimizer embeddings run on the MacStudio (oMLX via agentgateway;
  # gateway enforces API key -> OPENAI_API_KEY below). EmbeddingServer CR removed
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-api-auth
                  key: OPENAI_API_KEY
  groupRef:
    name: *name
  telemetryConfigRef:
    name: shared-otel
    serviceName: *name
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
    operational:
      failureHandling:
        partialFailureMode: best_effort
        healthCheckInterval: 10s
        healthCheckTimeout: 5s
        unhealthyThreshold: 2
        circuitBreaker:
          enabled: true
          failureThreshold: 3
          timeout: 30s
    optimizer:
      embeddingProvider: openai
      embeddingService: http://agentgateway-proxy.networking-system.svc.cluster.local:80/sf
      embeddingModel: Qwen/Qwen3-Embedding-4B
      embeddingServiceTimeout: 15s
      maxToolsToReturn: 10
      hybridSearchSemanticRatio: "0.6"
      semanticDistanceThreshold: "0.8"
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/virtualmcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: &name internal-rw
spec:
  incomingAuth:
    type: anonymous
  outgoingAuth:
    source: inline
    backends:
      # forgejo-mcp enforces a per-request bearer token (--token)
      mcp-forgejo:
        type: externalAuthConfigRef
        externalAuthConfigRef:
          name: mcp-forgejo
  # see internal-ro: MacStudio embeddings via agentgateway + OPENAI_API_KEY
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-api-auth
                  key: OPENAI_API_KEY
  groupRef:
    name: *name
  telemetryConfigRef:
    name: shared-otel
    serviceName: *name
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
    operational:
      failureHandling:
        partialFailureMode: best_effort
        healthCheckInterval: 10s
        healthCheckTimeout: 5s
        unhealthyThreshold: 2
        circuitBreaker:
          enabled: true
          failureThreshold: 3
          timeout: 30s
    optimizer:
      embeddingProvider: openai
      embeddingService: http://agentgateway-proxy.networking-system.svc.cluster.local:80/sf
      embeddingModel: Qwen/Qwen3-Embedding-4B
      embeddingServiceTimeout: 15s
      maxToolsToReturn: 10
      hybridSearchSemanticRatio: "0.6"
      semanticDistanceThreshold: "0.8"
