---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmcp-ingress
spec:
  endpointSelector:
    matchLabels:
      "app.kubernetes.io/name": virtualmcpserver
  ingress:
    # Post-unification: the only MCP-protocol clients are the agentgateway
    # (tiered /mcp/* endpoints) and vmagent (metrics scrape). Chat frontends
    # reach tools through the gateway, never directly.
    - fromEndpoints:
        - matchLabels:
            {
              "k8s:io.kubernetes.pod.namespace": monitoring-system,
              "app.kubernetes.io/name": vmagent,
            }
        - matchLabels:
            {
              "k8s:io.kubernetes.pod.namespace": networking-system,
              "app.kubernetes.io/name": agentgateway-proxy,
            }
      toPorts:
        - ports:
            - port: "4483"
              protocol: TCP
