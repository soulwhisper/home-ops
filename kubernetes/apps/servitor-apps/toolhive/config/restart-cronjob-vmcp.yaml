---
# Daily restart of every vmcp runner to bound its memory leak.
# Why: the runner grows ~9 Mi/h under streamable-http sessions (same ToolHive
# leak class as hindsight/trendradar — peaked 348 Mi in 39h and OOMKilled at
# the 512Mi limit, homelab-tickets#59). The 1Gi limit plus this daily pod
# delete caps RSS far below it. Delete this file once ToolHive fixes the leak.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmcp-restarter
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vmcp-restarter
rules:
  # pod delete (not rollout restart): the runner Deployment is operator-owned
  # and reconciled from the VirtualMCPServer CR; a template patch is drift the
  # operator may revert. Deleting the pod is drift-free — it is recreated.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vmcp-restarter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vmcp-restarter
subjects:
  - kind: ServiceAccount
    name: vmcp-restarter
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vmcp-restarter
spec:
  schedule: "40 4 * * *"
  timeZone: "Asia/Shanghai"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: vmcp-restarter
          automountServiceAccountToken: true
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: kubectl
              image: registry.k8s.io/kubectl:v1.37.1
              resources:
                requests:
                  cpu: 5m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              # stagger per group: deleting all four tiers at once would be a
              # brief total MCP outage; ~45s between deletes lets each runner
              # come back Ready before the next tier drops. Failures are
              # preserved into the exit status so backoffLimit retries work
              # (a bare loop would let the final sleep mask a failed delete).
              command:
                - sh
                - -c
                - >-
                  rc=0;
                  for g in search cluster home agent; do
                    kubectl delete pod --namespace=servitor-apps
                    --selector=toolhive-name=$g --wait=false || rc=1;
                    sleep 45;
                  done;
                  exit $rc
              securityContext:
                allowPrivilegeEscalation: false
          restartPolicy: Never
