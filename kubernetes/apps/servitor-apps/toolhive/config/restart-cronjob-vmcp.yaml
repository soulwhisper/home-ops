---
# Daily restart of every vmcp runner to bound its memory leak.
# Why: the runner grows ~9 Mi/h under streamable-http sessions (same ToolHive
# leak class as hindsight/trendradar — peaked 348 Mi in 39h and OOMKilled at
# the 512Mi limit, homelab-tickets#59). The 1Gi limit plus this daily pod
# delete caps RSS far below it. Delete this file once ToolHive fixes the leak.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmcp-restarter
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vmcp-restarter
rules:
  # pod delete (not rollout restart): the runner Deployment is operator-owned
  # and reconciled from the VirtualMCPServer CR; a template patch is drift the
  # operator may revert. Deleting the pod is drift-free — it is recreated.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vmcp-restarter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vmcp-restarter
subjects:
  - kind: ServiceAccount
    name: vmcp-restarter
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vmcp-restarter
spec:
  schedule: "40 4 * * *"
  timeZone: "Asia/Shanghai"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      # KubeJobFailed is evaluated per Job: a retained failed Job keeps the
      # alert firing after the next successful run. Expire finished Jobs so
      # the alert clears without manual cleanup.
      ttlSecondsAfterFinished: 3600
      # 4 groups * (discovery 120s + delete 120s + recreate 300s + ready
      # 300s) worst case is 56m; cap the whole run at 30m.
      activeDeadlineSeconds: 1800
      template:
        spec:
          serviceAccountName: vmcp-restarter
          automountServiceAccountToken: true
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: kubectl
              # registry.k8s.io/kubectl is distroless (no sh); this job needs a
              # shell for its retry loop.
              image: alpine/k8s:1.37.1
              resources:
                requests:
                  cpu: 5m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              # stagger per group: deleting all four tiers at once would be a
              # brief total MCP outage. Wait on the deleted pod BY NAME — a
              # selector-based wait can latch onto the replacement — then
              # wait for a DIFFERENT-named pod to exist and become Ready
              # (Deployment status is asynchronous and can report the old
              # ReplicaSet's counts in a narrow window). Fail fast:
              # proceeding after a failed wait would take more groups
              # offline while one is still down; backoffLimit retries the
              # whole Job, which is idempotent.
              # Discovery can race a pod that vanishes mid-walk: retry
              # discovery, tolerate the vanish, and log every step so a
              # failure names its group.
              command:
                - sh
                - -c
                - |
                  set -u
                  ns=servitor-apps

                  find_pod() {
                    group="$1"
                    i=0
                    while [ "$i" -lt 24 ]; do
                      pod=$(kubectl get pod --namespace="$ns" \
                        -l "toolhive-name=$group" \
                        -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
                      if [ -n "$pod" ]; then
                        printf '%s' "$pod"
                        return 0
                      fi
                      i=$((i + 1))
                      sleep 5
                    done
                    return 1
                  }

                  for g in search cluster home agent; do
                    pod=$(find_pod "$g") || {
                      echo "no runner pod for $g after 120s"; exit 1; }
                    echo "restarting $g/$pod"
                    kubectl delete pod --namespace="$ns" "$pod" \
                      --wait=false --ignore-not-found=true || exit 1
                    kubectl wait --for=delete "pod/$pod" \
                      --namespace="$ns" --timeout=120s || exit 1

                    newpod=""
                    i=0
                    while [ "$i" -lt 60 ]; do
                      candidate=$(kubectl get pod --namespace="$ns" \
                        -l "toolhive-name=$g" \
                        -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
                      if [ -n "$candidate" ] && [ "$candidate" != "$pod" ]; then
                        newpod="$candidate"
                        break
                      fi
                      i=$((i + 1))
                      sleep 5
                    done
                    if [ -z "$newpod" ]; then
                      echo "no replacement pod for $g after 300s"
                      exit 1
                    fi
                    echo "waiting for $g/$newpod"
                    kubectl wait --for=condition=ready "pod/$newpod" \
                      --namespace="$ns" --timeout=300s || exit 1
                  done
                  echo "all runner pods restarted"
              securityContext:
                allowPrivilegeEscalation: false
          restartPolicy: Never
