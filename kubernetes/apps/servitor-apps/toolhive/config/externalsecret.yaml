---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# vmcp optimizer (openai provider) reads OPENAI_API_KEY from env. This is the
# oMLX server key: valid at the gateway via the multi-entry llm-api-auth
# secret, then forwarded unchanged to the studio by the media passthrough.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-api-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        OPENAI_API_KEY: "{{ .api_key }}"
  dataFrom:
    - extract:
        key: omlx
