---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# vmcp optimizer (openai provider) reads OPENAI_API_KEY from env; the
# agentgateway dataplane enforces this key on /v1/* (same llm-api item as
# networking-system/llm-api-auth).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-api-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        OPENAI_API_KEY: "{{ .agentgateway_api_auth }}"
  dataFrom:
    - extract:
        key: llm-api
