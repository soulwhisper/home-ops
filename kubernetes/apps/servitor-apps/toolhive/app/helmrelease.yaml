---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name toolhive-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: toolhive-operator

  values:
    operator:
      replicaCount: 1
      # cluster scope
      features:
        storageVersionMigrator: false
      rbac:
        scope: "namespace"
        allowedNamespaces:
          - "servitor-apps"
      # operator.defaultRedis intentionally NOT set: upstream bug
      # stacklok/toolhive#6679 — the operator forwards the redis addr to
      # proxyrunner pods but not the password -> NOAUTH crashloop on every
      # MCPServer. Revisit when #6679 lands in a release.
