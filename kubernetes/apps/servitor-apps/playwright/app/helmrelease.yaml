---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name playwright
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
    controllers:
      *name :
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: mcr.microsoft.com/playwright
              tag: v1.64.1-noble
            env:
              HOME: /home/pwuser
            command: ["/bin/bash", "-ec"]
            args:
              - |
                mkdir -p /home/pwuser/.config/google-chrome/Crashpad
                chrome="$(find /ms-playwright -type f -path '*/chrome-linux*/chrome' -print -quit)"
                test -n "$chrome"
                # Renderer HTTP(S), including loopback, must use egress-proxy;
                # CDP remains a separate control channel through cdp-proxy.
                exec "$chrome" \
                  --headless=new \
                  --no-sandbox \
                  --proxy-server=http://127.0.0.1:8888 \
                  "--proxy-bypass-list=<-loopback>" \
                  --no-first-run \
                  --no-default-browser-check \
                  --remote-debugging-port=9223 \
                  --user-data-dir=/home/pwuser/browser-profile \
                  about:blank
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "2"
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /json/version
                    port: 9222
                  periodSeconds: 2
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /json/version
                    port: 9222
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /json/version
                    port: 9222
                  periodSeconds: 10
                  failureThreshold: 3
          # Current Chromium keeps CDP on loopback even when a remote-address
          # flag is supplied. This listener exposes it safely inside the pod
          # and rewrites Host to satisfy DevTools' local-host check.
          cdp-proxy:
            image:
              repository: docker.io/library/nginx
              tag: 1.31.8-alpine
            command: ["nginx"]
            args: ["-g", "daemon off;"]
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                cpu: 100m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
          egress-proxy:
            image:
              repository: docker.io/ubuntu/squid
              tag: 6.6-24.04_edge
            command: ["/usr/local/bin/entrypoint.sh"]
            args: ["-f", "/etc/squid/squid.conf", "-NYC"]
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 200m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: &egress-healthcheck
                      - /bin/bash
                      - -c
                      - exec 3<>/dev/tcp/127.0.0.1/8888
                  periodSeconds: 2
                  failureThreshold: 30
              liveness: &egress-probe
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *egress-healthcheck
                  periodSeconds: 30
                  failureThreshold: 3
              readiness: *egress-probe

    service:
      app:
        ports:
          cdp:
            port: 9222

    persistence:
      nginx-config:
        type: configMap
        name: playwright-proxy
        globalMounts:
          - path: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
      squid-config:
        type: configMap
        name: playwright-proxy
        advancedMounts:
          *name :
            egress-proxy:
              - path: /etc/squid/squid.conf
                subPath: squid.conf
                readOnly: true
      profile:
        type: emptyDir
        globalMounts:
          - path: /home/pwuser
            subPath: pwuser
          - path: /tmp
            subPath: tmp
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
