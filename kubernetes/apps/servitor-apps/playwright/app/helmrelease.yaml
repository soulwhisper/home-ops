---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name playwright
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
    controllers:
      *name :
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: mcr.microsoft.com/playwright
              tag: v1.64.1-noble
            command: ["/bin/bash", "-ec"]
            args:
              - |
                chrome="$(find /ms-playwright -type f -path '*/chrome-linux*/chrome' -print -quit)"
                test -n "$chrome"
                exec "$chrome" \
                  --headless=new \
                  --no-sandbox \
                  --no-first-run \
                  --no-default-browser-check \
                  --remote-debugging-port=9223 \
                  --user-data-dir=/home/pwuser/browser-profile \
                  about:blank
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "2"
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /json/version
                    port: 9222
                  periodSeconds: 2
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /json/version
                    port: 9222
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /json/version
                    port: 9222
                  periodSeconds: 10
                  failureThreshold: 3
          # Current Chromium keeps CDP on loopback even when a remote-address
          # flag is supplied. This listener exposes it safely inside the pod
          # and rewrites Host to satisfy DevTools' local-host check.
          cdp-proxy:
            image:
              repository: docker.io/library/nginx
              tag: 1.29.3-alpine
            command: ["nginx"]
            args: ["-g", "daemon off;"]
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                cpu: 100m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true

    service:
      app:
        ports:
          cdp:
            port: 9222

    persistence:
      nginx-config:
        type: configMap
        name: playwright-nginx
        globalMounts:
          - path: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
      profile:
        type: emptyDir
        globalMounts:
          - path: /home/pwuser
            subPath: pwuser
          - path: /tmp
            subPath: tmp
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
