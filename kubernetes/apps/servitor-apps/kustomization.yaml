---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: servitor-apps
components:
  - ../../components/namespace
  - ../../components/kopiur/secret
resources:
  # system
  - ./toolhive/ks.yaml
  # mcp
  - ./mcp
  # app
  - ./hermes-agent/ks.yaml
  - ./onyx/ks.yaml
patches:
  # kopiur movers run uid 0 + DAC_OVERRIDE by default; webhook requires opt-in
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: _
        annotations:
          kopiur.home-operations.com/privileged-movers: "true"
    target:
      kind: Namespace
