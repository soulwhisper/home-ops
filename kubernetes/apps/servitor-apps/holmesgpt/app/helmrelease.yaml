---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name holmesgpt
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: holmes

  values:
    # Cluster-internal RCA service only: no ingress/route, no HOLMES_API_KEY
    # (optional upstream). Interaction via `kubectl port-forward svc/holmesgpt-holmes`
    # + /api/chat, or the holmes CLI.
    extraEnvVarsSecrets:
      - *name # OPENAI_API_BASE + OPENAI_API_KEY (ExternalSecret)

    # LLM: local agentgateway `complex` lane (Qwen3.8-27B on the studio).
    # Agentic RCA needs tool-calling; omni/micro lanes are extractors and too
    # weak. Lane stays guarded (promptGuard) — investigation prompts carry
    # untrusted log content.
    modelList:
      complex:
        model: openai/complex
        api_base: envRef:OPENAI_API_BASE
        api_key: envRef:OPENAI_API_KEY
        temperature: 0

    toolsets:
      # no Internet egress for this pod (see ciliumnetworkpolicy.yaml)
      internet:
        enabled: false
      # robusta toolset requires a Robusta SaaS account; not used
      robusta:
        enabled: false
      prometheus/metrics:
        enabled: true
        config:
          subtype: victoriametrics
          prometheus_url: http://vmsingle-victoria-metrics-cluster.monitoring-system.svc.cluster.local:8428
      victorialogs:
        enabled: true
        config:
          api_url: http://victoria-logs-server.monitoring-system.svc.cluster.local:9428

    # Operator mode (alpha upstream): HealthCheck / ScheduledHealthCheck /
    # TriggeredHealthCheck CRDs (chart crds/). No destinations configured —
    # upstream supports only Slack/PagerDuty, which doesn't match the feishu
    # relay; results are read from CR status (`kubectl get hc -A`).
    operator:
      enabled: true

    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 2Gi
