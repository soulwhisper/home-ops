---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name dsh-tavern
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/soulwhisper/dsh-tavern
              tag: "3.0@sha256:62342ac45cb039f3542a6adcac9efeb8868098769bb36ed13ff73c4f396bbfe5"
            env:
              DSH_HOST:
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              DSH_PUBLIC_URL: "https://tavern.noirprime.com"
              DSH_TRUSTED_HOSTS: "tavern.noirprime.com"
            envFrom:
              - configMapRef:
                  name: dsh-tavern-forward-auth
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["node", "/opt/dsh/scripts/readiness.mjs"]
                  failureThreshold: 30
                  periodSeconds: 10
              liveness: &liveness
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["node", "/opt/dsh/scripts/readiness.mjs"]
                  periodSeconds: 30
                  failureThreshold: 3
                  timeoutSeconds: 10
              readiness: *liveness

    service:
      app:
        ports:
          http:
            port: 3080

    route:
      app:
        hostnames: ["tavern.noirprime.com"]
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: /icons/sillytavern.svg
          gethomepage.dev/name: DSH Tavern
          gethomepage.dev/group: Service
        parentRefs:
          - name: kgateway-internal
            namespace: networking-system

    persistence:
      app:
        existingClaim: *name
        globalMounts:
          - path: /data
          - path: /workspace
            subPath: workspace
      cache:
        type: emptyDir
        sizeLimit: 2Gi
        globalMounts:
          - path: /cache
      logs:
        type: emptyDir
        sizeLimit: 512Mi
        globalMounts:
          - path: /logs
      backups:
        type: emptyDir
        sizeLimit: 5Gi
        globalMounts:
          - path: /backups
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
