---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name dsh-tavern
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000 # node
            runAsGroup: 1000
            # kopiur movers work as gid 2000 — PVC data must be group-2000
            # accessible (same shape as crafty-controller: app 1000, fs 2000)
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/soulwhisper/dsh-tavern
              tag: "3.0"
            env:
              # authentik forward-auth in front (components/authentik); the
              # baked dsh-ui-auth login gateway must trust proxy headers and
              # count client IPs correctly
              DSH_AUTH_TRUST_PROXY: "1"
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              # dsh writes under $DSH_HOME, /workspace (bootstrap files) and /tmp
              readOnlyRootFilesystem: true
            probes:
              # root path is auth-gated (401 without token) — a TCP connect is
              # the honest liveness signal
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 3080
                  failureThreshold: 30
                  periodSeconds: 10
              liveness: &liveness
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 30
                  failureThreshold: 3
                  timeoutSeconds: 10
              readiness: *liveness

    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["tavern.noirprime.com"]
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: /icons/sillytavern.svg
          gethomepage.dev/name: DSH Tavern
          gethomepage.dev/group: Service
        parentRefs:
          - name: kgateway-internal
            namespace: networking-system

    persistence:
      # cards, sessions, presets, profile data — created by the kopiur backup
      # component (PVC + snapshot schedule)
      home:
        existingClaim: *name
        globalMounts:
          - path: /home/node/.dsh
      workspace:
        type: emptyDir
        globalMounts:
          - path: /workspace
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
