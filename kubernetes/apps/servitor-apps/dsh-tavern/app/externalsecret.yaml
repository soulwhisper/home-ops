---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dsh-tavern
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        DEEPSEEK_API_KEY: "{{ .deepseek }}"
        DSH_FORWARD_AUTH_ALLOWED_SUBJECTS: "{{ .admin_user }}"
  dataFrom:
    - extract:
        key: llm-api
    - extract:
        key: app-user
