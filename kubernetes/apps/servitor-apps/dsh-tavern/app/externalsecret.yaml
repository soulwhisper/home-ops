---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dsh-tavern
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        DEEPSEEK_API_KEY: "{{ .deepseek }}"
        DSH_FORWARD_AUTH_ALLOWED_SUBJECTS: "{{ .admin_user }}"
        cordis.patch.yml: |
          - id: llm-pi-ai
            name: "@deepseek-ai/dsh-llm-pi-ai"
            config:
              providers:
                persona:
                  api: openai-completions
                  baseURL: http://agentgateway-proxy.networking-system.svc.cluster.local:80/v1
                  headers:
                    Authorization: "Bearer {{ .llm_persona }}"
                  models:
                    - id: persona
                      name: persona
                      contextWindow: 65536
          - id: compaction-basic
            config:
              thresholdRatio: 0.75
              headroomTokens: 8192
              retainTokens: 4096
              summarizationProvider: persona
              summarizationModel: persona
              modelPolicies:
                - provider: persona
                  model: persona
                  thresholdRatio: 0.75
                  headroomTokens: 8192
                  retainTokens: 4096
  dataFrom:
    - extract:
        key: llm-api
    - extract:
        key: app-user
    - extract:
        key: agentgateway
