---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dsh-tavern
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        DSH_FORWARD_AUTH_ALLOWED_SUBJECTS: "{{ .admin_user }}"
        cordis.patch.yml: |
          - id: llm-pi-ai
            name: "@deepseek-ai/dsh-llm-pi-ai"
            config:
              providers:
                persona:
                  api: openai-completions
                  baseURL: http://agentgateway-proxy.networking-system.svc.cluster.local:80/v1
                  headers:
                    Authorization: "Bearer {{ .llm_persona }}"
                  models:
                    - id: persona
                      name: persona
                deepseek:
                  api: openai-completions
                  baseURL: https://api.deepseek.com/v1
                  headers:
                    Authorization: "Bearer {{ .deepseek }}"
                  models:
                    - id: deepseek-chat
                      name: deepseek-chat
                    - id: deepseek-reasoner
                      name: deepseek-reasoner
  dataFrom:
    - extract:
        key: llm-api
    - extract:
        key: app-user
    - extract:
        key: agentgateway
