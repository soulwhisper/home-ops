---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dsh-tavern
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        DEEPSEEK_API_KEY: "{{ .deepseek }}"
        DSH_FORWARD_AUTH_ALLOWED_SUBJECTS: "{{ .admin_user }}"
        cordis.patch.yml: |
          - id: llm-pi-ai
            name: "@deepseek-ai/dsh-llm-pi-ai"
            config:
              providers:
                uncensored:
                  api: openai-completions
                  baseURL: http://agentgateway-proxy.networking-system.svc.cluster.local:80/v1
                  headers:
                    Authorization: "Bearer {{ .llm_uncensored }}"
                  models:
                    - id: uncensored
                      name: uncensored
                omni:
                  api: openai-completions
                  baseURL: http://agentgateway-proxy.networking-system.svc.cluster.local:80/v1
                  headers:
                    Authorization: "Bearer {{ .llm_omni }}"
                  models:
                    - id: omni
                      name: omni
                kimi:
                  api: openai-completions
                  baseURL: https://api.moonshot.ai/v1
                  headers:
                    Authorization: "Bearer {{ .kimi }}"
                  models:
                    - id: kimi-k3.1-pro
                      name: kimi-k3.1-pro
  dataFrom:
    - extract:
        key: llm-api
    - extract:
        key: app-user
    - extract:
        key: agentgateway
