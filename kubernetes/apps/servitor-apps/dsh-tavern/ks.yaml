---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &name dsh-tavern
  annotations:
    config.home-ops.io/managed: "true"
  labels:
    config.home-ops.io/deps: "infra"
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *name
  targetNamespace: servitor-apps
  path: "./kubernetes/apps/servitor-apps/dsh-tavern/app"
  dependsOn:
    - name: agentgateway
      namespace: networking-system
  components:
    - ../../../../components/cache
    - ../../../../components/authentik
    - ../../../../components/kopiur/backup
  patches:
    # Keep the Tavern PVC empty on recreation; backups remain via the kopiur
    # SnapshotPolicy and can be restored manually.
    - target:
        kind: PersistentVolumeClaim
        name: dsh-tavern
      patch: |
        - op: remove
          path: /spec/dataSourceRef
  postBuild:
    substitute:
      APP: *name
      APP_HOST: "tavern.noirprime.com"
      CACHE_CAPACITY: 15Gi
