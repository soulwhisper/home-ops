---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: diceframe
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: diceframe
  data:
    # Placeholder: create a 1Password Password item named `diceframe` (or
    # change the item/property below). Its password is the fixed WebUI access
    # password. TRPG_ACCESS_TOKEN wins over UI password changes on restart.
    - secretKey: TRPG_ACCESS_TOKEN
      remoteRef:
        key: diceframe
        property: password
