---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name diceframe
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/diceframe/diceframe
              tag: 3.1.2
            env:
              # SQLite lives under /app/data; bundled worlds/plugins and the
              # managed updater seed stay in the image.
              TRPG_WEB_HOST: 0.0.0.0
              TRPG_WEB_PORT: "9876"
              TRPG_DATA_DIR: /app/data
              TZ: Asia/Shanghai
              HOME: /tmp
            envFrom:
              - secretRef:
                  name: *name
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/system/update/health
                    port: 9876
                  failureThreshold: 60
                  periodSeconds: 5
                  timeoutSeconds: 5
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/system/update/health
                    port: 9876
                  periodSeconds: 30
                  failureThreshold: 3
                  timeoutSeconds: 5
              readiness: *probe

    service:
      app:
        ports:
          http:
            port: 9876
    route:
      app:
        hostnames: ["trpg.noirprime.com"]
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: /icons/diceframe.svg
          gethomepage.dev/name: DiceFrame
          gethomepage.dev/group: Service
        parentRefs:
          - name: kgateway-internal
            namespace: networking-system

    persistence:
      app:
        existingClaim: *name
        globalMounts:
          - path: /app/data
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
