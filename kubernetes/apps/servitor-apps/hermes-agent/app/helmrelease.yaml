---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name hermes-agent
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000 # hermes
            runAsGroup: 10000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          # Same Talos SELinux fix as victoria-logs (full story in the
          # victoria-logs helmrelease): hermes writes to its unlabeled RBD
          # PVC were one of the 2026-10-18 permissive-AVC flood sources, and
          # seLinuxOptions is a proven no-op on Talos — relabel via
          # initContainer instead. Root required (chcon needs ownership);
          # overrides the pod-level runAsNonRoot.
          selinux-relabel:
            image: { repository: ubuntu, tag: "24.04" }
            command:
              - sh
              - -eu
              - -c
              - |
                  # Marker-file proof of a COMPLETED full walk; deleted
                  # BEFORE each redo so a mid-walk failure can't leave a
                  # stale marker (see victoria-logs helmrelease).
                  if [ "$(stat -c %C /vol)" != "system_u:object_r:ephemeral_t:s0" ] || [ ! -f /vol/.selinux-relabelled ]; then
                    rm -f /vol/.selinux-relabelled
                    chcon -R system_u:object_r:ephemeral_t:s0 /vol
                    touch /vol/.selinux-relabelled
                    echo "relabelled /vol"
                  fi
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"], add: ["DAC_OVERRIDE", "FOWNER"] } # DAC_OVERRIDE: Hermes dirs are mode 0700
              readOnlyRootFilesystem: true
            resources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { memory: 256Mi }
          # Seeds config.yaml + ops profile onto the PVC at every boot
          # (authoritative; dashboard edits to these files revert on restart).
          # .env files are rendered from pod env because profile $${VAR} refs
          # resolve against the profile's own .env, not the process env.
          seed-config:
            image:
              repository: docker.io/library/busybox
              # renovate: datasource=docker depName=docker.io/library/busybox
              tag: "1.38"
            command: ["/bin/sh", "/seed/seed.sh"]
            # non-secret feishu policy vars too: seed.sh can only render what
            # its own env carries, and this initContainer has no other env source
            env:
              FEISHU_DOMAIN: "feishu"
              FEISHU_CONNECTION_MODE: "websocket"
              FEISHU_ALLOW_BOTS: "mentions"
              FEISHU_GROUP_POLICY: "allowlist"
            envFrom:
              - secretRef:
                  name: *name
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              # soulwhisper build: upstream hermes-agent + baked extras (rtk,
              # caveman skills, feishu deps) + supervisord (gateway+dashboard
              # in one container). Tag tracks upstream semver releases.
              repository: ghcr.io/soulwhisper/hermes-agent
              tag: 0.22.3
            # every k8s rollout SIGTERMs the gateway and it broadcasts
            # "Gateway shutting down — task interrupted" to feishu mid-task
            # (10 graceful SIGTERMs/3d, zero crashes). Give in-flight tasks a
            # grace window before the signal lands; 25s stays inside the
            # default 30s terminationGracePeriodSeconds.
            lifecycle:
              preStop:
                exec:
                  command: ["sh", "-c", "sleep 25"]
            env:
              HERMES_SERVICES: "gateway,dashboard"
              # Feishu plugin (websocket mode; credentials via envFrom secret)
              FEISHU_DOMAIN: "feishu"
              FEISHU_CONNECTION_MODE: "websocket"
              FEISHU_ALLOW_BOTS: "mentions"
              FEISHU_GROUP_POLICY: "allowlist"
            envFrom:
              - secretRef:
                  name: *name
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8642
                  failureThreshold: 30
                  periodSeconds: 10
              liveness: &liveness
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 30
                  failureThreshold: 5
                  timeoutSeconds: 10
              readiness: *liveness
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true

    service:
      app:
        ports:
          api:
            primary: true
            port: *port
          http:
            port: 9119
          webhook:
            port: 8644

    persistence:
      app:
        existingClaim: *name
        globalMounts:
          - path: /opt/data
            subPath: hermes
          - path: /workspace
            subPath: workspace
        # app-template schema: initContainer mounts come from advancedMounts,
        # not per-entry volumeMounts. Mounts the whole RBD volume root (no
        # subPath) so chcon -R covers every subdir.
        advancedMounts:
          *name :
            selinux-relabel:
              - path: /vol
      seed:
        type: configMap
        name: hermes-agent-config
        globalMounts:
          - path: /seed
            readOnly: true
      cache:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
