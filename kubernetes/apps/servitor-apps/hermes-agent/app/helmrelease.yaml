---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name hermes-agent
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  # : Init plugins
  # run 'rtk init --agent hermes' at first time, restart app to load plugins

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000 # hermes
            runAsGroup: 10000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          hermes-extras:
            image:
              repository: ghcr.io/soulwhisper/hermes-extras
              tag: "2026.09.11"
            command: ["/bin/sh", "/app/install.sh"]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
          # Seeds config.yaml + chat/ops profiles onto the PVC at every boot
          # (authoritative; dashboard edits to these files revert on restart).
          # .env files are rendered from pod env because profile $${VAR} refs
          # resolve against the profile's own .env, not the process env.
          seed-config:
            image:
              repository: docker.io/library/busybox
              # renovate: datasource=docker depName=docker.io/library/busybox
              tag: "1.38"
            command: ["/bin/sh", "/seed/seed.sh"]
            envFrom:
              - secretRef:
                  name: *name
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: ghcr.io/soulwhisper/hermes-suite
              tag: 2026.9.7
            env:
              HERMES_SERVICES: "dashboard,gateway,webui"
              # plugins
              RTK_TELEMETRY_DISABLED: "true"
              # Feishu plugin (websocket mode; credentials via envFrom secret)
              FEISHU_DOMAIN: "feishu"
              FEISHU_CONNECTION_MODE: "websocket"
              FEISHU_ALLOW_BOTS: "mentions"
              FEISHU_GROUP_POLICY: "allowlist"
            envFrom:
              - secretRef:
                  name: *name
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8642
                  failureThreshold: 30
                  periodSeconds: 10
              liveness: &liveness
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 30
                  failureThreshold: 5
                  timeoutSeconds: 10
              readiness: *liveness
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true

    service:
      app:
        ports:
          api:
            primary: true
            port: *port
          http:
            port: 9119
          web:
            port: 8787
          webhook:
            port: 8644

    persistence:
      app:
        existingClaim: *name
        globalMounts:
          - path: /opt/data
            subPath: hermes
          - path: /workspace
            subPath: workspace
      seed:
        type: configMap
        name: hermes-agent-config
        globalMounts:
          - path: /seed
            readOnly: true
      cache:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
