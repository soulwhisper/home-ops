---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name hermes-agent
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  # : Init plugins
  # run 'rtk init --agent hermes' at first time, restart app to load plugins

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000 # hermes
            runAsGroup: 10000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          hermes-extras:
            image:
              repository: ghcr.io/soulwhisper/hermes-extras
              tag: "2026.10.08"
            command: ["/bin/sh", "/app/install.sh"]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
          # Seeds config.yaml + ops profile onto the PVC at every boot
          # (authoritative; dashboard edits to these files revert on restart).
          # .env files are rendered from pod env because profile $${VAR} refs
          # resolve against the profile's own .env, not the process env.
          seed-config:
            image:
              repository: docker.io/library/busybox
              # renovate: datasource=docker depName=docker.io/library/busybox
              tag: "1.38"
            command: ["/bin/sh", "/seed/seed.sh"]
            envFrom:
              - secretRef:
                  name: *name
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              # upstream image direct (suite retired — it existed to bundle
              # dashboard+webui; the dashboard is built in since 0.21.x).
              # Docker Hub ships no plain semver tag, only rc.N-vX.Y.Z
              # candidates + floating aliases: pin stable by digest, renovate
              # floats it forward per upstream release (packageRules.json5).
              repository: nousresearch/hermes-agent
              tag: stable@sha256:444b42594e7f467425872fc35e077a227d377f0fe0726bc818706d62175fad8b # v0.21.7
            # bypass the image's s6-overlay entrypoint (needs root + writable
            # /run); one process per container, k8s-native supervision instead
            command: ["/opt/hermes/.venv/bin/hermes"]
            args: ["gateway", "run"]
            # every k8s rollout SIGTERMs the gateway and it broadcasts
            # "Gateway shutting down — task interrupted" to feishu mid-task
            # (10 graceful SIGTERMs/3d, zero crashes). Give in-flight tasks a
            # grace window before the signal lands; 25s stays inside the
            # default 30s terminationGracePeriodSeconds.
            lifecycle:
              preStop:
                exec:
                  command: ["sh", "-c", "sleep 25"]
            env:
              # upstream image defaults HOME elsewhere; all state is PVC-backed
              HOME: /opt/data
              # feishu plugin deps mirrored onto the PVC by hermes-extras
              PYTHONPATH: /opt/data/.local/lib/hermes-plugins
              # plugins
              RTK_TELEMETRY_DISABLED: "true"
              # Feishu plugin (websocket mode; credentials via envFrom secret)
              FEISHU_DOMAIN: "feishu"
              FEISHU_CONNECTION_MODE: "websocket"
              FEISHU_ALLOW_BOTS: "mentions"
              FEISHU_GROUP_POLICY: "allowlist"
            envFrom:
              - secretRef:
                  name: *name
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8642
                  failureThreshold: 30
                  periodSeconds: 10
              liveness: &liveness
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 30
                  failureThreshold: 5
                  timeoutSeconds: 10
              readiness: *liveness
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
          dashboard:
            image:
              repository: nousresearch/hermes-agent
              tag: stable@sha256:444b42594e7f467425872fc35e077a227d377f0fe0726bc818706d62175fad8b # v0.21.7
            # same s6-bypass as the gateway container
            command: ["/opt/hermes/.venv/bin/hermes"]
            args: ["dashboard", "--host", "0.0.0.0", "--port", "9119", "--no-open"]
            env:
              HOME: /opt/data
            probes:
              # auth gate 302s to /login — a 302 proves the server is up
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9119
                  failureThreshold: 30
                  periodSeconds: 10
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9119
                  periodSeconds: 30
                  failureThreshold: 5
                  timeoutSeconds: 10
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true

    service:
      app:
        ports:
          api:
            primary: true
            port: *port
          http:
            port: 9119
          webhook:
            port: 8644

    persistence:
      app:
        existingClaim: *name
        globalMounts:
          - path: /opt/data
            subPath: hermes
          - path: /workspace
            subPath: workspace
      seed:
        type: configMap
        name: hermes-agent-config
        globalMounts:
          - path: /seed
            readOnly: true
      cache:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
