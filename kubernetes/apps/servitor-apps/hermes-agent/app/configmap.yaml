---
# Declarative hermes-agent config, seeded onto the PVC by the seed-config
# initContainer at every pod start (dashboard edits to these files revert on
# restart — edit here instead). $${VAR} refs (flux-escaped) land as ${VAR}
# which the initContainer renders from pod env (ExternalSecret).
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-config
data:
  # default profile (left functionally untouched: gateway/multiplex + aux lanes
  # are additive)
  config.yaml: |
    model:
      default: agent
      provider: custom
      base_url: $${OPENAI_BASE_URL}
      api_key: $${OPENAI_API_KEY}
    gateway:
      multiplex_profiles: true
    # rtk-rewrite: plugin files are image-baked and mirrored by the
    # entrypoint; the allow-list must live here — runtime `rtk init` would be
    # reverted by the next seed
    plugins:
      enabled: [rtk-rewrite]
    # gateway enforces authentik; this gate only satisfies hermes' refusal to
    # bind non-loopback without an auth provider
    dashboard:
      basic_auth:
        username: "admin"
        password_hash: "scrypt$16384$8$1$iqGHQwhoTPMwkiMDI7SV3w==$V45cYiP24KiQ6tllPk3FN7XBM2fenuVWyvPtcMUvDko="
    platforms:
      feishu:
        enabled: false
      webhook:
        enabled: true
        extra:
          port: 8644
          # frigate-alert disabled: frigate lives in the parked smarthome-apps
          # namespace. Re-enable together with that application and its
          # FRIGATE_WEBHOOK_SECRET.
          # routes:
          #   frigate-alert:
          #     secret: $${FRIGATE_WEBHOOK_SECRET}
          #     profile: ops
          #     prompt: |
          #       [Frigate alert] camera={camera} severity={severity}: {description}
          #       (label={label}, zones={zones}, event={event_id}, ts={timestamp})
          #     deliver: log
    # Side tasks pinned to the cheap omni lane (body model -> x-model header).
    # Each task carries the omni lane key; the main agent lane key never
    # reaches the omni route.
    auxiliary:
      vision:
        provider: main
        model: omni
        base_url: $${OPENAI_BASE_URL}
        key_env: OPENAI_AUX_API_KEY
        timeout: 30
      web_extract:
        provider: main
        model: omni
        base_url: $${OPENAI_BASE_URL}
        key_env: OPENAI_AUX_API_KEY
        reasoning_effort: low
      title_generation:
        enabled: true
        provider: main
        model: omni
        base_url: $${OPENAI_BASE_URL}
        key_env: OPENAI_AUX_API_KEY
        timeout: 30
        extra_body:
          chat_template_kwargs: { enable_thinking: false }
      session_search:
        provider: main
        model: omni
        base_url: $${OPENAI_BASE_URL}
        key_env: OPENAI_AUX_API_KEY
        max_concurrency: 3
      compression:
        provider: main
        model: omni
        base_url: $${OPENAI_BASE_URL}
        key_env: OPENAI_AUX_API_KEY
        reasoning_effort: low

  ops-config.yaml: |
    model:
      default: agent
      provider: custom
      base_url: $${OPENAI_BASE_URL}
      api_key: $${OPENAI_API_KEY}
    # ops profile is the automation brain: cluster read-only, agent (forgejo
    # ticket RW + hindsight-ops memory), search (web/docs retrieval), and
    # github-ro (read-only GitHub code retrieval; issued alongside cluster).
    # agent/search ride the FailClosed mcp-guardrails sidecar: if the sidecar
    # is down, those two tiers are suspended for ops.
    mcp_servers:
      cluster:
        url: http://agentgateway-proxy.networking-system.svc.cluster.local:80/mcp/cluster
        headers:
          Authorization: "Bearer $${MCP_CLUSTER_KEY}"
      github-ro:
        url: http://agentgateway-proxy.networking-system.svc.cluster.local:80/mcp/github-ro
        headers:
          Authorization: "Bearer $${MCP_GITHUB_RO_KEY}"
      agent:
        url: http://agentgateway-proxy.networking-system.svc.cluster.local:80/mcp/agent
        headers:
          Authorization: "Bearer $${MCP_AGENT_KEY}"
      search:
        url: http://agentgateway-proxy.networking-system.svc.cluster.local:80/mcp/search
        headers:
          Authorization: "Bearer $${MCP_SEARCH_KEY}"
    # rtk shell-output compression for the automation loops
    plugins:
      enabled: [rtk-rewrite]
    auxiliary:
      vision:
        provider: main
        model: omni
        base_url: $${OPENAI_BASE_URL}
        key_env: OPENAI_AUX_API_KEY
        timeout: 30
      web_extract:
        provider: main
        model: omni
        base_url: $${OPENAI_BASE_URL}
        key_env: OPENAI_AUX_API_KEY
        reasoning_effort: low
      compression:
        provider: main
        model: omni
        base_url: $${OPENAI_BASE_URL}
        key_env: OPENAI_AUX_API_KEY
        reasoning_effort: low
  ops-profile.yaml: |
    description: "Batching brain: cron, WeChat, automation"
    display_name: "Ops"
  ops-SOUL.md: |
    # Ops profile
    Batch automation brain: cron jobs, WeChat relays, scheduled QA.
    Optimize for correctness and idempotency over conversational latency.

  # auto-start marker consumed by the container boot reconciler
  gateway-state.json: |
    {"desired_state": "running"}

  # rendered from pod env (ExternalSecret); writes profile .env files because
  # profile-scoped $${VAR} refs never see the pod env
  seed.sh: |
    #!/bin/sh
    set -eu
    umask 077

    # The PVC heartbeat belongs to the previous container; require this
    # container's gateway to publish a fresh one before it can become ready.
    rm -f /opt/data/cron/ticker_heartbeat

    cp /seed/config.yaml /opt/data/config.yaml

    # root .env — authoritative; prevents first-boot placeholder seeding from
    # shadowing pod env (dotenv loads with override=True). Feishu is disabled
    # for default and its credentials are seeded only into ops.
    cat > /opt/data/.env <<EOF
    OPENAI_BASE_URL=$${OPENAI_BASE_URL}
    OPENAI_API_KEY=$${OPENAI_API_KEY}
    API_SERVER_ENABLED=true
    API_SERVER_HOST=0.0.0.0
    API_SERVER_KEY=$${API_SERVER_KEY}
    FRIGATE_WEBHOOK_SECRET=$${FRIGATE_WEBHOOK_SECRET}
    EOF

    # remove leftover profiles on upgrade — multiplex_profiles=true keeps any
    # leftover dir live (incl. its API key + model config); seed only owns ops
    rm -rf /opt/data/profiles/chat

    for p in ops; do
      d="/opt/data/profiles/$p"
      mkdir -p "$d"
      cp "/seed/$p-config.yaml" "$d/config.yaml"
      cp "/seed/$p-SOUL.md" "$d/SOUL.md"
      cp "/seed/$p-profile.yaml" "$d/profile.yaml"
      cp /seed/gateway-state.json "$d/gateway_state.json"
    done

    # ops profile: no API server key -> /p/ops/ API fails closed by design
    cat > /opt/data/profiles/ops/.env <<EOF
    OPENAI_BASE_URL=$${OPENAI_BASE_URL}
    OPENAI_API_KEY=$${OPENAI_API_KEY}
    MCP_CLUSTER_KEY=$${MCP_CLUSTER_KEY}
    MCP_AGENT_KEY=$${MCP_AGENT_KEY}
    MCP_SEARCH_KEY=$${MCP_SEARCH_KEY}
    FEISHU_APP_ID=$${FEISHU_APP_ID}
    FEISHU_APP_SECRET=$${FEISHU_APP_SECRET}
    FEISHU_ENCRYPT_KEY=$${FEISHU_ENCRYPT_KEY}
    FEISHU_VERIFICATION_TOKEN=$${FEISHU_VERIFICATION_TOKEN}
    FEISHU_ALLOWED_USERS=$${FEISHU_ALLOWED_USERS}
    FEISHU_HOME_CHANNEL=$${FEISHU_HOME_CHANNEL}
    EOF
    # optional vars live on plain env (not the secret) — write only when set,
    # so an empty line can never shadow the pod env (dotenv override=True) and
    # a missing key cannot abort the seed under `set -eu`.
    # no $( ) command substitution: flux postBuild misparses it
    for v in MCP_GITHUB_RO_KEY FEISHU_DOMAIN FEISHU_CONNECTION_MODE FEISHU_ALLOW_BOTS FEISHU_GROUP_POLICY; do
      if printenv "$v" >/dev/null 2>&1; then
        { echo -n "$v="; printenv "$v"; } >> /opt/data/profiles/ops/.env
      fi
    done
