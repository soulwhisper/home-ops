---
# yaml-language-server: $schema=https://json.schemastore.org/configmap
# Declarative hermes-agent config, seeded onto the PVC by the seed-config
# initContainer at every pod start (dashboard edits to these files revert on
# restart — edit here instead). ${VAR} refs resolve against each profile's
# own .env, which the initContainer renders from pod env (ExternalSecret).
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-config
data:
  # default profile (left functionally untouched: gateway/multiplex + aux lanes
  # are additive; model config mirrors what was previously set via 1Password)
  config.yaml: |
    model:
      default: complex
      provider: custom
      base_url: ${OPENAI_BASE_URL}
      api_key: ${OPENAI_API_KEY}
    gateway:
      multiplex_profiles: true
    platforms:
      webhook:
        enabled: true
        extra:
          port: 8644
          routes:
            frigate-alert:
              secret: ${FRIGATE_WEBHOOK_SECRET}
              profile: ops
              prompt: |
                [Frigate alert] camera={camera} severity={severity}: {description}
                (label={label}, zones={zones}, event={event_id}, ts={timestamp})
              deliver: log
    # side tasks pinned to cheap gateway lanes (body model -> x-model header)
    auxiliary:
      vision: { provider: main, model: omni, timeout: 30 }
      web_extract: { provider: main, model: omni, reasoning_effort: low }
      title_generation:
        enabled: true
        provider: main
        model: micro
        timeout: 30
        extra_body:
          chat_template_kwargs: { enable_thinking: false }
      session_search: { provider: main, model: omni, max_concurrency: 3 }
      compression: { provider: main, model: omni, reasoning_effort: low }

  # chat profile — Onyx and similar chat frontends (served at :8642/p/chat/v1,
  # model id "chat" = profile name under multiplexing)
  chat-config.yaml: |
    model:
      default: complex
      provider: custom
      base_url: ${OPENAI_BASE_URL}
      api_key: ${OPENAI_API_KEY}
    auxiliary:
      title_generation:
        enabled: true
        provider: main
        model: micro
        timeout: 30
        extra_body:
          chat_template_kwargs: { enable_thinking: false }
    # Secret hygiene: profile .env holds gateway keys and any process secret is
    # readable by tools running as the same user — so the chat profile gets NO
    # terminal/file toolsets. MCP tools (mcp_*) are not gated by toolsets.
    platform_toolsets:
      cli: [web, vision, skills, todo]
  chat-profile.yaml: |
    description: "Chat frontends (Onyx etc.); isolated memory + API key"
    display_name: "Chat"
  chat-SOUL.md: |
    # Chat profile
    Conversational frontend profile. Serve interactive chat (Onyx) with full
    ToolHive MCP tools. Read-only-first: never mutate cluster/home state
    unless the user explicitly asks and the tool requires it.
  ops-config.yaml: |
    model:
      default: complex
      provider: custom
      base_url: ${OPENAI_BASE_URL}
      api_key: ${OPENAI_API_KEY}
    auxiliary:
      vision: { provider: main, model: omni, timeout: 30 }
      web_extract: { provider: main, model: omni, reasoning_effort: low }
      compression: { provider: main, model: omni, reasoning_effort: low }
  ops-profile.yaml: |
    description: "Batching brain: cron, WeChat, automation"
    display_name: "Ops"
  ops-SOUL.md: |
    # Ops profile
    Batch automation brain: cron jobs, WeChat relays, scheduled QA.
    Optimize for correctness and idempotency over conversational latency.

  # auto-start marker consumed by the container boot reconciler
  gateway-state.json: |
    {"desired_state": "running"}

  # rendered from pod env (ExternalSecret); writes profile .env files because
  # profile-scoped ${VAR} refs never see the pod env
  seed.sh: |
    #!/bin/sh
    set -eu
    umask 077

    cp /seed/config.yaml /opt/data/config.yaml

    # root .env — authoritative; prevents first-boot placeholder seeding from
    # shadowing pod env (dotenv loads with override=True)
    cat > /opt/data/.env <<EOF
    OPENAI_BASE_URL=${OPENAI_BASE_URL}
    OPENAI_API_KEY=${OPENAI_API_KEY}
    API_SERVER_ENABLED=true
    API_SERVER_HOST=0.0.0.0
    API_SERVER_KEY=${API_SERVER_KEY}
    FRIGATE_WEBHOOK_SECRET=${FRIGATE_WEBHOOK_SECRET}
    EOF

    for p in chat ops; do
      d="/opt/data/profiles/$p"
      mkdir -p "$d"
      cp "/seed/$p-config.yaml" "$d/config.yaml"
      cp "/seed/$p-SOUL.md" "$d/SOUL.md"
      cp "/seed/$p-profile.yaml" "$d/profile.yaml"
      cp /seed/gateway-state.json "$d/gateway_state.json"
    done

    cat > /opt/data/profiles/chat/.env <<EOF
    OPENAI_BASE_URL=${OPENAI_BASE_URL}
    OPENAI_API_KEY=${OPENAI_API_KEY}
    API_SERVER_ENABLED=true
    API_SERVER_KEY=${CHAT_API_SERVER_KEY}
    EOF

    # ops profile: no API server key -> /p/ops/ API fails closed by design
    cat > /opt/data/profiles/ops/.env <<EOF
    OPENAI_BASE_URL=${OPENAI_BASE_URL}
    OPENAI_API_KEY=${OPENAI_API_KEY}
    EOF
