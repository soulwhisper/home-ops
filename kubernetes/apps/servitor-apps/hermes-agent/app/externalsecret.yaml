---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # Feishu (one and only messaging platform; plugin: plugins/platforms/feishu)
        FEISHU_APP_ID: "{{ .app_id }}"
        FEISHU_APP_SECRET: "{{ .app_secret }}"
        FEISHU_VERIFICATION_TOKEN: "{{ .verify_token }}"
        FEISHU_ENCRYPT_KEY: "{{ .encrypt_key }}"
        FEISHU_ALLOWED_USERS: "{{ .allowed_users }}"
        # Web
        FIRECRAWL_API_URL: "http://firecrawl.selfhosted-apps.svc.cluster.local:3002"
        # LLM via agent gateway (consumed by seed-config initContainer)
        OPENAI_BASE_URL: "http://agentgateway-proxy.networking-system.svc.cluster.local:80/chat"
        OPENAI_API_KEY: "{{ .agentgateway_api_auth }}"
        # gateway API server keys (>=16 chars; per-profile keys are scoped)
        API_SERVER_KEY: "{{ .api_server_key }}"
        CHAT_API_SERVER_KEY: "{{ .chat_api_server_key }}"
        # frigate-vision alert route HMAC secret (platforms.webhook, ops profile)
        FRIGATE_WEBHOOK_SECRET: "{{ .frigate_webhook_secret }}"
  dataFrom:
    - extract:
        key: hermes-agent
    - extract:
        key: llm-api
    - extract:
        key: feishu
