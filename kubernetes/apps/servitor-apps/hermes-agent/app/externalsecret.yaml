---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # Web
        FIRECRAWL_API_URL: "http://firecrawl.selfhosted-apps.svc.cluster.local:3002"
        # LLM — guarded lanes (promptGuard), model id == lane name; lanes map
        # to studio folder-ids via each backend's openai.model override
        # (agent main brain; omni aux).
        OPENAI_BASE_URL: "http://agentgateway-proxy.networking-system.svc.cluster.local:80/v1"
        OPENAI_API_KEY: "{{ .llm_agent }}"
        # MCP — tiered gateway endpoints (cluster read-only, home read-write,
        # ops profile additionally agent+search); consumed by config.yaml
        # mcp_servers via ${VAR} interpolation, which resolves against the
        # .env files seed.sh renders from the pod env
        MCP_CLUSTER_KEY: "{{ .mcp_cluster }}"
        MCP_HOME_KEY: "{{ .mcp_home }}"
        MCP_AGENT_KEY: "{{ .mcp_agent }}"
        MCP_SEARCH_KEY: "{{ .mcp_search }}"
        # hermes gateway API server key (>=16 chars)
        API_SERVER_KEY: "{{ .api_server_key_root }}"
        # frigate-vision alert route HMAC secret (platforms.webhook, ops profile)
        FRIGATE_WEBHOOK_SECRET: "{{ .webhook_secret_frigate }}"
        # Feishu
        FEISHU_ALLOWED_USERS: "{{ .admin_users }}"
        FEISHU_HOME_CHANNEL: "{{ .homebot_channel }}"
        FEISHU_APP_ID: "{{ .homebot_app_id }}"
        FEISHU_APP_SECRET: "{{ .homebot_app_secret }}"
        FEISHU_ENCRYPT_KEY: "{{ .homebot_encrypt_key }}"
        FEISHU_VERIFICATION_TOKEN: "{{ .homebot_verify_token }}"
  dataFrom:
    - extract:
        key: hermes-agent
    - extract:
        key: agentgateway
    - extract:
        key: feishu
