---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dsh-web-profile-patch
data:
  merge-profile.mjs: |
    import fs from 'node:fs';

    const [seedPath, profilePath, markerPath = '/data/dsh/.profile-patch-seed-v1'] =
      process.argv.slice(2);

    if (!seedPath || !profilePath) {
      console.error('usage: merge-profile.mjs <seed> <profile> [marker]');
      process.exit(2);
    }

    if (fs.existsSync(markerPath)) {
      console.log('profile patch already seeded');
      process.exit(0);
    }

    const YAML = await (async () => {
      for (const spec of [
        '/data/dsh/profiles/web/node_modules/yaml/dist/index.js',
        '/opt/dsh/runtime/node_modules/yaml/dist/index.js',
      ]) {
        try {
          const mod = await import(spec);
          return mod.default ?? mod;
        } catch {}
      }
      throw new Error('yaml module not found');
    })();

    function readArray(file, label) {
      const raw = fs.readFileSync(file, 'utf8');
      const doc = YAML.parseDocument(raw);
      if (doc.errors.length > 0) {
        throw new Error(`${label}: ${doc.errors[0].message}`);
      }
      if (doc.contents !== null && !YAML.isSeq(doc.contents)) {
        throw new Error(`${label} must be a YAML array`);
      }
      const items = doc.contents?.items ?? [];
      if (!items.every((item) => YAML.isMap(item))) {
        throw new Error(`${label} must contain only mapping entries`);
      }
      return { raw, items };
    }

    const idOf = (item) => {
      const id = item.get('id');
      return typeof id === 'string' ? id : null;
    };

    const serverOf = (item) => {
      const config = item.get('config');
      const name = config?.get('serverName');
      return typeof name === 'string' ? name : null;
    };

    const rowStart = (raw, item) =>
      item.range ? raw.lastIndexOf('\n', item.range[0] - 1) + 1 : 0;

    const textOf = (raw, item) =>
      item.range ? raw.slice(rowStart(raw, item), item.range[1]) : '';

    const removeItem = (raw, item) =>
      item.range
        ? raw.slice(0, rowStart(raw, item)) + raw.slice(item.range[1])
        : raw;

    const appendRows = (raw, rows) => {
      if (rows.length === 0) return raw;
      return `${raw.replace(/\s*$/, '\n')}${rows.join('\n')}\n`;
    };

    const seed = readArray(seedPath, 'seed');
    const profile = readArray(profilePath, 'profile');

    const existingIds = new Set(profile.items.map(idOf).filter(Boolean));
    const existingServers = new Set(profile.items.map(serverOf).filter(Boolean));

    let raw = profile.raw;
    for (const item of profile.items) {
      if (idOf(item) === 'mnemon') raw = removeItem(raw, item);
    }

    const additions = [];
    for (const item of seed.items) {
      const id = idOf(item);
      const server = serverOf(item);

      if (id === 'mnemon') {
        additions.push(textOf(seed.raw, item));
        continue;
      }
      if (id !== null && existingIds.has(id)) continue;
      if (server !== null && existingServers.has(server)) continue;
      additions.push(textOf(seed.raw, item));
    }

    if (profile.items.length === 0) {
      raw = `${seed.raw.trim()}\n`;
    } else {
      raw = appendRows(raw, additions);
    }

    if (raw === profile.raw) {
      fs.writeFileSync(markerPath, 'seeded\n', { mode: 0o600 });
      console.log('profile patch already contains the seed');
      process.exit(0);
    }

    const backupPath = `${profilePath}.pre-profile-seed`;
    fs.copyFileSync(profilePath, backupPath);
    const tmpPath = `${profilePath}.tmp-${process.pid}`;
    fs.writeFileSync(tmpPath, raw, { mode: 0o600 });
    fs.renameSync(tmpPath, profilePath);
    fs.writeFileSync(markerPath, 'seeded\n', { mode: 0o600 });
    console.log(`seeded ${additions.length} profile rows; backup ${backupPath}`);
