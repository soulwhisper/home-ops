---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dsh-web
data:
  # The edge performs Authentik group authorization. DSH only needs the
  # verified header name and the trusted edge peer range.
  DSH_FORWARD_AUTH_HEADER: x-authentik-username
  DSH_FORWARD_AUTH_TRUSTED_PROXY_CIDRS: 10.100.0.0/17
  DSH_FORWARD_AUTH_MAX_CONNECTION_SECONDS: "900"
