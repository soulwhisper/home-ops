---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name dsh-web
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/soulwhisper/dsh-web
              tag: "0.2.1-rc.2@sha256:c4f0ca308caf778f9aca1b94da75a07e6b97caee3001419546924a1c7af5d8ec"
            env:
              DSH_HOST:
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              DSH_PUBLIC_URL: "https://${APP_HOST}"
              DSH_TRUSTED_HOSTS: "${APP_HOST}"
              # The edge forwards x-authentik-username after Authentik allow.
              # Keep this single-owner allowlist explicit; a group header does
              # not authorize here.
              DSH_FORWARD_AUTH_HEADER: "x-authentik-username"
              DSH_FORWARD_AUTH_ALLOWED_SUBJECTS: "admin"
              DSH_FORWARD_AUTH_TRUSTED_PROXY_CIDRS: "10.100.0.0/17"
              DSH_FORWARD_AUTH_MAX_CONNECTION_SECONDS: "900"
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["node", "/opt/dsh/scripts/readiness.mjs"]
                  failureThreshold: 30
                  periodSeconds: 10
              liveness: &liveness
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["node", "/opt/dsh/scripts/readiness.mjs"]
                  periodSeconds: 30
                  failureThreshold: 3
                  timeoutSeconds: 10
              readiness: *liveness

    service:
      app:
        ports:
          http:
            port: 3080

    route:
      app:
        hostnames: ["${APP_HOST}"]
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: /icons/open-webui.svg
          gethomepage.dev/name: DSH Web
          gethomepage.dev/group: Service
        parentRefs:
          - name: kgateway-internal
            namespace: networking-system

    persistence:
      app:
        existingClaim: *name
        globalMounts:
          - path: /data
          - path: /workspace
            subPath: workspace
      cache:
        type: emptyDir
        sizeLimit: 4Gi
        globalMounts:
          - path: /cache
      logs:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /logs
      backups:
        type: emptyDir
        sizeLimit: 10Gi
        globalMounts:
          - path: /backups
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
