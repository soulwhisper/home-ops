---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name dsh-web
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/soulwhisper/dsh-web
              # Tag-only: Renovate's Kubernetes manager cannot bump a
              # tag@sha256 pin, so keep the release tag as the version axis.
              tag: "0.2.1-rc.2-r2"
            env:
              DSH_HOST:
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              DSH_PUBLIC_URL: "https://chat.noirprime.com"
              DSH_TRUSTED_HOSTS: "chat.noirprime.com"
              DSH_FORWARD_AUTH_HEADER: x-authentik-username
              DSH_FORWARD_AUTH_TRUSTED_PROXY_CIDRS: 10.100.0.0/17
              DSH_FORWARD_AUTH_MAX_CONNECTION_SECONDS: "900"
            envFrom:
              - secretRef:
                  name: *name
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["node", "/opt/dsh/scripts/readiness.mjs"]
                  failureThreshold: 30
                  periodSeconds: 10
              liveness: &liveness
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["node", "/opt/dsh/scripts/readiness.mjs"]
                  periodSeconds: 30
                  failureThreshold: 3
                  timeoutSeconds: 10
              readiness: *liveness

    service:
      app:
        ports:
          http:
            port: 3080

    route:
      app:
        hostnames: ["chat.noirprime.com"]
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: /icons/open-webui.svg
          gethomepage.dev/name: DSH Web
          gethomepage.dev/group: Service
        parentRefs:
          - name: kgateway-internal
            namespace: networking-system

    persistence:
      app:
        existingClaim: *name
        globalMounts:
          - path: /data
            subPath: data
          - path: /workspace
            subPath: workspace
      cache:
        existingClaim: dsh-web-cache
        globalMounts:
          - path: /cache
            subPath: cache
          - path: /logs
            subPath: logs
          - path: /backups
            subPath: backups
      mcp:
        type: secret
        name: *name
        globalMounts:
          - path: /data/dsh/cordis.patch.yml
            subPath: cordis.patch.yml
            readOnly: true
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
