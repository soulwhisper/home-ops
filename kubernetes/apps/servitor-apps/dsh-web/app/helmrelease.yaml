---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name dsh-web
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          state-seed:
            image:
              repository: ghcr.io/soulwhisper/dsh-web
              tag: "0.2.1-rc.2-r2@sha256:64505485b1ed284dd90a8ec51ca57dda11542e8e6d56e0f12ba783008bdf2a3e"
            command:
              - node
              - /opt/dsh/scripts/materialize-state.mjs
            env:
              DSH_HOME: /data/dsh
              HOME: /data/home
              DSH_PROFILE: web
              DSH_BACKUP_ROOT: /backups
              # One-time r1 -> r2 state migration; remove after the rollout is verified.
              DSH_STATE_MIGRATION: "apply"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
        containers:
          app:
            image:
              repository: ghcr.io/soulwhisper/dsh-web
              tag: "0.2.1-rc.2-r2@sha256:64505485b1ed284dd90a8ec51ca57dda11542e8e6d56e0f12ba783008bdf2a3e"
            env:
              DSH_HOST:
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              DSH_PUBLIC_URL: "https://chat.noirprime.com"
              DSH_TRUSTED_HOSTS: "chat.noirprime.com"
              # Keep injected skills outside /data/dsh: materialize-state treats
              # any pre-existing child as existing state and demands a migration.
              DSH_AGENTS_HOME: "/data/home/.agents"
            envFrom:
              - configMapRef:
                  name: *name
              - secretRef:
                  name: *name
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["node", "/opt/dsh/scripts/readiness.mjs"]
                  failureThreshold: 30
                  periodSeconds: 10
              liveness: &liveness
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["node", "/opt/dsh/scripts/readiness.mjs"]
                  periodSeconds: 30
                  failureThreshold: 3
                  timeoutSeconds: 10
              readiness: *liveness

    service:
      app:
        ports:
          http:
            port: 3080

    route:
      app:
        hostnames: ["chat.noirprime.com"]
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: /icons/open-webui.svg
          gethomepage.dev/name: DSH Web
          gethomepage.dev/group: Service
        parentRefs:
          - name: kgateway-internal
            namespace: networking-system

    persistence:
      app:
        existingClaim: *name
        advancedMounts:
          *name :
            app:
              - path: /data
              - path: /workspace
                subPath: workspace
            state-seed:
              - path: /data
      cache:
        existingClaim: dsh-web-cache
        globalMounts:
          - path: /cache
            subPath: cache
          - path: /logs
            subPath: logs
          - path: /backups
            subPath: backups
      mcp:
        type: secret
        name: dsh-web-mcp
        advancedMounts:
          *name :
            app:
              - path: /data/dsh/cordis.patch.yml
                subPath: cordis.patch.yml
                readOnly: true
      skills:
        type: emptyDir
        advancedMounts:
          *name :
            app:
              - path: /data/home/.agents/skills
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
