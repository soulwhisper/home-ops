---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dsh-web
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        DSH_FORWARD_AUTH_ALLOWED_SUBJECTS: "{{ .admin_user }}"
        cordis.patch.yml: |
          - insert:
              - id: mcp-search
                name: '@deepseek-ai/dsh-mcp-client'
                config:
                  serverName: search
                  transport: streamable-http
                  url: http://agentgateway-proxy.networking-system.svc.cluster.local:80/mcp/search
                  headers:
                    Authorization: "Bearer {{ .mcp_search }}"
                  failOnStartupError: false
                  reconnect: &mcp-reconnect
                    enabled: true
                    initialDelayMs: 1000
                    maxDelayMs: 30000
                    # Keep retrying after long backend outages; the default ten
                    # attempts permanently unregister tools until a DSH restart.
                    maxAttempts: 9007199254740991
              - id: mcp-cluster
                name: '@deepseek-ai/dsh-mcp-client'
                config:
                  serverName: cluster
                  transport: streamable-http
                  url: http://agentgateway-proxy.networking-system.svc.cluster.local:80/mcp/cluster
                  headers:
                    Authorization: "Bearer {{ .mcp_cluster }}"
                  failOnStartupError: false
                  reconnect: *mcp-reconnect
              - id: mcp-persona
                name: '@deepseek-ai/dsh-mcp-client'
                config:
                  serverName: persona
                  transport: streamable-http
                  url: http://agentgateway-proxy.networking-system.svc.cluster.local:80/mcp/persona
                  headers:
                    Authorization: "Bearer {{ .mcp_home }}"
                  failOnStartupError: false
                  reconnect: *mcp-reconnect
              - id: mcp-browser
                name: '@deepseek-ai/dsh-mcp-client'
                config:
                  serverName: browser
                  transport: streamable-http
                  url: http://agentgateway-proxy.networking-system.svc.cluster.local:80/mcp/browser
                  headers:
                    Authorization: "Bearer {{ .mcp_browser }}"
                  failOnStartupError: false
                  reconnect: *mcp-reconnect
              - id: mcp-github-pr
                name: '@deepseek-ai/dsh-mcp-client'
                config:
                  serverName: github-pr
                  transport: streamable-http
                  url: http://agentgateway-proxy.networking-system.svc.cluster.local:80/mcp/github-pr
                  headers:
                    Authorization: "Bearer {{ .mcp_github_pr }}"
                  failOnStartupError: false
                  reconnect: *mcp-reconnect
          - id: llm-pi-ai
            name: "@deepseek-ai/dsh-llm-pi-ai"
            config:
              providers:
                uncensored:
                  api: openai-completions
                  baseURL: http://agentgateway-proxy.networking-system.svc.cluster.local:80/v1
                  headers:
                    Authorization: "Bearer {{ .llm_uncensored }}"
                  models:
                    - id: uncensored
                      name: uncensored
                persona:
                  api: openai-completions
                  baseURL: http://agentgateway-proxy.networking-system.svc.cluster.local:80/v1
                  headers:
                    Authorization: "Bearer {{ .llm_persona }}"
                  models:
                    - id: persona
                      name: persona
                deepseek:
                  api: openai-completions
                  baseURL: https://api.deepseek.com/v1
                  headers:
                    Authorization: "Bearer {{ .deepseek }}"
                  models:
                    - id: deepseek-chat
                      name: deepseek-chat
                    - id: deepseek-reasoner
                      name: deepseek-reasoner
          - id: mnemon
            config:
              writeEnabled: true
              # Startup-only: permits the authenticated Persona Memory Space RPC.
              # Memory Spaces can select persona/work/others per-space bankIds;
              # the CNP permits all four bank paths (home is the legacy alias).
              remoteAccess: trusted-host
              persistenceStrategy:
                mode: manual
                providerId: hindsight
                providerConnections:
                  hindsight:
                    bankId: persona
                    budget: mid
  dataFrom:
    - extract:
        key: llm-api
    - extract:
        key: app-user
    - extract:
        key: agentgateway
