---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dsh-web
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        DEEPSEEK_API_KEY: "{{ .deepseek }}"
        DSH_FORWARD_AUTH_ALLOWED_SUBJECTS: "{{ .admin_user }}"
        cordis.patch.yml: |
          - insert:
              - id: mcp-search
                name: '@deepseek-ai/dsh-mcp-client'
                config:
                  serverName: search
                  transport: streamable-http
                  url: http://agentgateway-proxy.networking-system.svc.cluster.local:80/mcp/search
                  headers:
                    Authorization: "Bearer {{ .mcp_search }}"
                  failOnStartupError: false
              - id: mcp-cluster
                name: '@deepseek-ai/dsh-mcp-client'
                config:
                  serverName: cluster
                  transport: streamable-http
                  url: http://agentgateway-proxy.networking-system.svc.cluster.local:80/mcp/cluster
                  headers:
                    Authorization: "Bearer {{ .mcp_cluster }}"
                  failOnStartupError: false
              - id: mcp-home
                name: '@deepseek-ai/dsh-mcp-client'
                config:
                  serverName: home
                  transport: streamable-http
                  url: http://agentgateway-proxy.networking-system.svc.cluster.local:80/mcp/home
                  headers:
                    Authorization: "Bearer {{ .mcp_home }}"
                  failOnStartupError: false
  dataFrom:
    - extract:
        key: llm-api
    - extract:
        key: app-user
    - extract:
        key: agentgateway
