---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dsh-web
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # The DSH image needs one owner subject; the Authentik blueprint
        # remains the only group authorization layer.
        DSH_FORWARD_AUTH_ALLOWED_SUBJECTS: "{{ .admin_user }}"
  dataFrom:
    - extract:
        key: app-user
