---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dsh-web
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        DEEPSEEK_API_KEY: "{{ .deepseek }}"
        DSH_FORWARD_AUTH_ALLOWED_SUBJECTS: "{{ .admin_user }}"
        MCP_SEARCH_TOKEN: "{{ .mcp_search }}"
        MCP_CLUSTER_TOKEN: "{{ .mcp_cluster }}"
        MCP_PERSONA_TOKEN: "{{ .mcp_persona }}"
        MCP_BROWSER_TOKEN: "{{ .mcp_browser }}"
        MCP_GITHUB_PR_TOKEN: "{{ .mcp_github_pr }}"
        # Host patch: shared model providers only. MCP and memory are
        # profile-owned so the DSH MCP panel can read and write them.
        cordis.patch.yml: |
          - id: llm-pi-ai
            name: "@deepseek-ai/dsh-llm-pi-ai"
            config:
              providers:
                uncensored:
                  api: openai-completions
                  baseURL: http://agentgateway-proxy.networking-system.svc.cluster.local:80/v1
                  headers:
                    Authorization: "Bearer {{ .llm_uncensored }}"
                  models:
                    - id: uncensored
                      name: uncensored
                      contextWindow: 65536
                persona:
                  api: openai-completions
                  baseURL: http://agentgateway-proxy.networking-system.svc.cluster.local:80/v1
                  headers:
                    Authorization: "Bearer {{ .llm_persona }}"
                  models:
                    - id: persona
                      name: persona
                      contextWindow: 65536
        # One-time seed for the writable profile patch. The init container
        # merges missing MCP rows and replaces the legacy mnemon entry.
        cordis.profile.patch.yml: |
          - id: mcp-search
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: search
              transport: streamable-http
              url: http://agentgateway-proxy.networking-system.svc.cluster.local:80/mcp/search
              headers:
                Authorization: !!js '`Bearer $${process.env.MCP_SEARCH_TOKEN}`'
              failOnStartupError: false
              reconnect:
                enabled: true
                initialDelayMs: 1000
                maxDelayMs: 30000
                maxAttempts: 9007199254740991
          - id: mcp-cluster
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: cluster
              transport: streamable-http
              url: http://agentgateway-proxy.networking-system.svc.cluster.local:80/mcp/cluster
              headers:
                Authorization: !!js '`Bearer $${process.env.MCP_CLUSTER_TOKEN}`'
              failOnStartupError: false
              reconnect:
                enabled: true
                initialDelayMs: 1000
                maxDelayMs: 30000
                maxAttempts: 9007199254740991
          - id: mcp-persona
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: persona
              transport: streamable-http
              url: http://agentgateway-proxy.networking-system.svc.cluster.local:80/mcp/persona
              headers:
                Authorization: !!js '`Bearer $${process.env.MCP_PERSONA_TOKEN}`'
              failOnStartupError: false
              reconnect:
                enabled: true
                initialDelayMs: 1000
                maxDelayMs: 30000
                maxAttempts: 9007199254740991
          - id: mcp-browser
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: browser
              transport: streamable-http
              url: http://agentgateway-proxy.networking-system.svc.cluster.local:80/mcp/browser
              headers:
                Authorization: !!js '`Bearer $${process.env.MCP_BROWSER_TOKEN}`'
              failOnStartupError: false
              reconnect:
                enabled: true
                initialDelayMs: 1000
                maxDelayMs: 30000
                maxAttempts: 9007199254740991
          - id: mcp-github-pr
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: github-pr
              transport: streamable-http
              url: http://agentgateway-proxy.networking-system.svc.cluster.local:80/mcp/github-pr
              headers:
                Authorization: !!js '`Bearer $${process.env.MCP_GITHUB_PR_TOKEN}`'
              failOnStartupError: false
              reconnect:
                enabled: true
                initialDelayMs: 1000
                maxDelayMs: 30000
                maxAttempts: 9007199254740991
          - id: mnemon
            config:
              writeEnabled: true
              # Startup-only: permits the authenticated Persona Memory Space RPC.
              # Memory Spaces can select persona/work/others per-space bankIds;
              # the CNP permits all four bank paths (home is the legacy alias).
              remoteAccess: trusted-host
              persistenceStrategy:
                mode: manual
                providerId: hindsight
                providerConnections:
                  hindsight:
                    bankId: persona
                    budget: mid
  dataFrom:
    - extract:
        key: llm-api
    - extract:
        key: app-user
    - extract:
        key: agentgateway
