---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# Declarative DSH Web MCP config. The mounted home-level patch adds one
# streamable-HTTP MCP client for the guarded search tier. The gateway API key
# is projected into the patch at sync time; it never appears in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dsh-web-mcp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        cordis.patch.yml: |
          - insert:
              - id: mcp-search
                name: '@deepseek-ai/dsh-mcp-client'
                config:
                  serverName: search
                  transport: streamable-http
                  url: http://agentgateway-proxy.networking-system.svc.cluster.local:80/mcp/search
                  headers:
                    Authorization: "Bearer {{ .mcp_search }}"
                  failOnStartupError: false
  dataFrom:
    - extract:
        key: agentgateway
