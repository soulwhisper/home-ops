
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: covel
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # openssl rand -hex 32
        COVEL_MEDIA_TOKEN_SECRET: "{{ .covel }}"
  dataFrom:
    - extract:
        key: encryption-cipher
