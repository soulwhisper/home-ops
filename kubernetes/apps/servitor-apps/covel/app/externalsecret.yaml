---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: covel-media-token
spec:
  length: 64
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: covel
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 12h
  target:
    name: covel
    template:
      data:
        COVEL_MEDIA_TOKEN_SECRET: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: covel-media-token
