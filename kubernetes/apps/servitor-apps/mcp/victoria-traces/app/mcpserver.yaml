---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &name mcp-victoria-traces
spec:
  groupRef:
    name: cluster
  # NOTE: VictoriaMetrics-Community org (vl/vm images are victoriametrics org).
  # renovate: datasource=docker depName=ghcr.io/victoriametrics-community/mcp-victoriatraces
  image: ghcr.io/victoriametrics-community/mcp-victoriatraces:v1.5.0
  env:
    - name: VT_INSTANCE_ENTRYPOINT
      value: "http://victoria-traces.monitoring-system.svc.cluster.local:10428"
    - name: MCP_SERVER_MODE
      value: "http"
    - name: MCP_LISTEN_ADDR
      value: ":8081"
    # same as vl/vm: docs are searchable upstream, drop the tool
    - name: MCP_DISABLED_TOOLS
      value: "documentation"
  transport: streamable-http
  mcpPort: 8081
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
