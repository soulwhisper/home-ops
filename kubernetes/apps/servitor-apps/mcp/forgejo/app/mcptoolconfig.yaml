---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcptoolconfig_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: mcp-forgejo-tickets
spec:
  # pat_tickets also has repository-write scope for the manual lessons workflow.
  # Models may read skills/learnings and work issues, never change repository
  # files/branches/workflows or dispatch actions on the NAS-root-capable runner.
  # issue_state_change is excluded: closing a ticket is a human decision after
  # verification (update_issue in forgejo-mcp v3.2.0 has no state field).
  # ToolHive filters tools/call as well as tools/list (v0.51.4 smoke verified).
  toolsFilter:
    - add_issue_labels
    - create_issue
    - create_issue_comment
    - get_file_content
    - get_issue_by_index
    - get_issue_comment
    - get_repo
    - get_repo_tree
    - list_issue_comments
    - list_repo_contents
    - list_repo_issues
    - list_repo_labels
    - list_repo_milestones
    - remove_issue_labels
    - search_issues
    - update_issue
