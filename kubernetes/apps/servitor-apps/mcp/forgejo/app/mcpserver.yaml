---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpserver_v1beta1.json
# goern/forgejo-mcp — Forgejo-native MCP (github-mcp-server can't serve Forgejo:
# it hardcodes /api/v3 + GraphQL). Streamable-HTTP with server-side token.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &name mcp-forgejo
spec:
  groupRef:
    name: internal-rw
  # renovate: datasource=docker depName=git.b4mad.industries/agentic-forges/forgejo-mcp
  image: git.b4mad.industries/agentic-forges/forgejo-mcp:v3.2.0
  transport: streamable-http
  mcpPort: 8080
  args:
    - --transport
    - http
    - --url
    - http://nas.homelab.internal:9003
    - --host
    - 0.0.0.0
    # v3 refuses to bind 0.0.0.0 without declared hosts; the toolhive runner
    # reaches the pod via the headless service / pod FQDN
    - --allowed-hosts
    - mcp-forgejo-0.mcp-mcp-forgejo-headless,mcp-forgejo-0.mcp-mcp-forgejo-headless:8080,mcp-mcp-forgejo-headless,mcp-mcp-forgejo-headless:8080,mcp-mcp-forgejo,mcp-mcp-forgejo:8080,localhost,localhost:8080
    # multi-tenant mode: no global --token; the client bearer (injected by the
    # vMCP via MCPExternalAuthConfig) is forwarded upstream to Forgejo, so no
    # token env lands in the workload pod
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
