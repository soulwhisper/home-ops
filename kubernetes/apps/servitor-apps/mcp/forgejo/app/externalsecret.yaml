---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name mcp-forgejo
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # Same repo-scoped PAT as the ticket/lessons automation; no draftbox access.
        # vMCP injects the header; the MCP workload itself receives no credential.
        AUTHORIZATION_HEADER: "Bearer {{ .pat_tickets }}"
  data:
    - secretKey: pat_tickets
      remoteRef:
        key: forgejo
        property: pat_tickets
