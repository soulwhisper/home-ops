---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name mcp-forgejo
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # Forgejo PAT scoped to the draftbox repo (bot account recommended)
        FORGEJO_ACCESS_TOKEN: "{{ .draftbox_token }}"
  dataFrom:
    - extract:
        key: forgejo
