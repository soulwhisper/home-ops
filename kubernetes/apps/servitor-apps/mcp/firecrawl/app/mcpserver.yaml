---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &name mcp-firecrawl
spec:
  groupRef:
    name: search
  # Gateway tool allowlist: networking-system/agentgateway/config/mcp/filters.yaml
  # (search policy). Tracked against image v3.33.3 (28 tools enumerated
  # 2026-10-20) — re-verify the allowlist on every version bump.
  # v3.x dropped the nginx frontend: the node server serves /mcp (and
  # /health) directly — no init/seed/rewrite machinery needed anymore.
  image: ghcr.io/firecrawl/firecrawl-mcp-server:v3.33.3
  env:
    - name: PORT
      value: "3000"
    # binds 0.0.0.0 by default (image env) — toolhive proxies to the pod IP,
    # so no HOST override (the old nginx-fronted layout needed loopback)
    - name: FIRECRAWL_API_URL
      value: "http://firecrawl-app.selfhosted-apps.svc.cluster.local:3002"
    - name: HTTP_STREAMABLE_SERVER
      value: "true"
  transport: streamable-http
  mcpPort: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
