---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &name mcp-firecrawl
spec:
  groupRef:
    name: external
  image: ghcr.io/firecrawl/firecrawl-mcp-server:latest
  podTemplateSpec:
    spec:
      volumes:
        # toolhive runs the pod with a read-only rootfs; the entrypoint renders
        # /tmp/nginx.conf at boot and fails without a writable scratch dir
        - name: tmp
          emptyDir: {}
        # entrypoint also rewrites /etc/nginx/nginx.conf (mv fails on RO rootfs)
        - name: nginx
          emptyDir: {}
      containers:
        - name: mcp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx
              mountPath: /etc/nginx
  env:
    - name: PORT
      value: "3000"
    - name: FIRECRAWL_API_URL
      value: "http://firecrawl.selfhosted-apps.svc.cluster.local:3002"
    - name: HTTP_STREAMABLE_SERVER
      value: "true"
  mcpPort: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
