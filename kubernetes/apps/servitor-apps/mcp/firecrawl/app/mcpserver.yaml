---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &name mcp-firecrawl
spec:
  groupRef:
    name: external
  image: ghcr.io/firecrawl/firecrawl-mcp-server:latest
  podTemplateSpec:
    spec:
      volumes:
        # toolhive runs the pod with a read-only rootfs; the entrypoint renders
        # /tmp/nginx.conf at boot and fails without a writable scratch dir
        - name: tmp
          emptyDir: {}
        # entrypoint sed+mv's /etc/nginx/nginx.conf, impossible on the RO
        # rootfs; the init container seeds the stock config into an emptyDir
        # (a bare emptyDir shadow-mounts the dir empty and sed fails)
        - name: nginx
          emptyDir: {}
        # nginx compiled defaults on the RO rootfs: logs/tmp under
        # /var/lib/nginx, pid at /run/nginx.pid
        - name: nginx-run
          emptyDir: {}
        - name: nginx-lib
          emptyDir: {}
      initContainers:
        - name: nginx-config
          image: ghcr.io/firecrawl/firecrawl-mcp-server:latest
          # seed /etc/nginx and pre-create nginx compiled-default runtime dirs;
          # nginx mkdir() is not recursive and dies on the empty emptyDir
          command: ["sh", "-c", "cp -a /etc/nginx/. /nginx/ && mkdir -p /nginx-lib/tmp/client_body /nginx-lib/tmp/proxy /nginx-lib/tmp/fastcgi /nginx-lib/tmp/uwsgi /nginx-lib/tmp/scgi /nginx-lib/logs"]
          volumeMounts:
            - name: nginx
              mountPath: /nginx
            - name: nginx-lib
              mountPath: /nginx-lib
      containers:
        - name: mcp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx
              mountPath: /etc/nginx
            - name: nginx-lib
              mountPath: /var/lib/nginx
            - name: nginx-run
              mountPath: /run
  env:
    - name: PORT
      value: "3000"
    - name: FIRECRAWL_API_URL
      value: "http://firecrawl.selfhosted-apps.svc.cluster.local:3002"
    - name: HTTP_STREAMABLE_SERVER
      value: "true"
  mcpPort: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
