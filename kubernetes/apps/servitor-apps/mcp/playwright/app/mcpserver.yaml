---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &name mcp-playwright
spec:
  groupRef:
    name: browser
  # The browser runs in the separate playwright workload. CDP avoids coupling
  # this MCP release to a Playwright Server protocol version.
  image: mcr.microsoft.com/playwright/mcp:v0.0.83
  args:
    - --port=8931
    - --host=0.0.0.0
    - --cdp-endpoint=http://playwright.servitor-apps.svc.cluster.local:9222
    # Prevent web content from driving the unauthenticated pod-local CDP listener.
    - --blocked-origins=http://127.0.0.1:*;http://localhost:*;http://[::1]:*;https://127.0.0.1:*;https://localhost:*;https://[::1]:*
    - --output-dir=/tmp/playwright
  env:
    # os.tmpdir() and XDG_CACHE_HOME keep browser sockets and initialization
    # cache on the existing writable volume; --output-dir alone is insufficient.
    - name: TMPDIR
      value: /tmp/playwright
    - name: XDG_CACHE_HOME
      value: /tmp/playwright/.cache
    # Relative filenames from screenshot/console/network/evaluate tools resolve
    # against HOME; it must be writable too.
    - name: HOME
      value: /tmp/playwright
    # ToolHive rewrites Host to the selected upstream Service or backend Pod IP.
    # Those addresses are not stable allowlist inputs; Cilium and ToolHive own
    # the client-facing network and authentication boundaries.
    - name: PLAYWRIGHT_MCP_ALLOWED_HOSTS
      value: "*"
  transport: streamable-http
  mcpPort: 8931
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podTemplateSpec:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: output
              mountPath: /tmp/playwright
      volumes:
        - name: output
          emptyDir: {}
