---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &name mcp-grafana
spec:
  groupRef:
    name: internal-ro
  image: grafana/mcp-grafana:1.5.1
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          command: ["/app/mcp-grafana"]
          # toolhive reaches the pod via the headless service / pod FQDN;
          # mcp-grafana Host-validation rejects those without an allowlist
          # (same shape as mcp-forgejo's --allowed-hosts)
          # defense-in-depth: the SA token is read-only; enforce at the server too
          args: ["--disable-write", "--transport", "streamable-http", "--address", "0.0.0.0:8000", "--allowed-hosts", "mcp-grafana-0.mcp-mcp-grafana-headless,mcp-grafana-0.mcp-mcp-grafana-headless:8000,mcp-mcp-grafana-headless,mcp-mcp-grafana-headless:8000,mcp-mcp-grafana,mcp-mcp-grafana:8000,localhost,localhost:8000"]
  env:
    - name: GRAFANA_URL
      value: "http://grafana-service.monitoring-system.svc.cluster.local:3000"
  transport: streamable-http
  mcpPort: 8000
  secrets:
    - name: mcp-grafana-sa
      key: token
      targetEnvName: GRAFANA_SERVICE_ACCOUNT_TOKEN
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
