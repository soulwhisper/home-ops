---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-kubernetes-view
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-kubernetes-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: mcp-kubernetes-view
    namespace: servitor-apps
---
# Read-only node metadata for nodes_top. nodes/proxy is intentionally not
# granted: a GET on that subresource can reach kubelet exec/run endpoints over
# WebSocket, so it is not a read-only permission.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-kubernetes-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-kubernetes-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-kubernetes-nodes
subjects:
  - kind: ServiceAccount
    name: mcp-kubernetes-view
    namespace: servitor-apps
