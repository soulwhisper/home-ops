---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &name mcp-kubernetes
spec:
  groupRef:
    name: internal-ro
  image: ghcr.io/containers/kubernetes-mcp-server:v0.0.67
  args: ["--config", "/etc/mcp/config.toml"]
  podTemplateSpec:
    spec:
      volumes:
        - name: config
          configMap:
            name: *name
        # server stats <configDir>/conf.d at boot and hard-fails on EACCES;
        # /root is 0700 root in the image while the pod runs unprivileged, so
        # both mounts live under /etc/mcp instead
        - name: confd
          emptyDir: {}
      containers:
        - name: mcp
          # klog stamps local time with no offset (I1016 22:07:46); with the
          # k8tz-injected TZ=Asia/Shanghai the log pipeline parses those as UTC
          # and every line lands 8h in the future (VictoriaLogsFutureLogTimestamps,
          # homelab-tickets#27). TZ=UTC makes klog emit UTC.
          env:
            - name: TZ
              value: "UTC"
          volumeMounts:
            - name: config
              mountPath: /etc/mcp/config.toml
              subPath: config.toml
              readOnly: true
            - name: confd
              mountPath: /etc/mcp/conf.d
  transport: streamable-http
  mcpPort: 8080
  serviceAccount: mcp-kubernetes-view
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
