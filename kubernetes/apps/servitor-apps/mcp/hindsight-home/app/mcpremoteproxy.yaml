---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpremoteproxy_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPRemoteProxy
metadata:
  name: &name mcp-hindsight-home
spec:
  groupRef:
    name: home
  toolConfigRef:
    name: *name
  # Hindsight creates the bank on first retain; reads (get_bank, list_tags,
  # recall) require it to exist. This single-bank endpoint is valid; 404s
  # before the first retain are expected.
  remoteUrl: http://hindsight.selfhosted-apps.svc.cluster.local:8888/mcp/home
  # in-cluster DNS suffix is blocked by toolhive's SSRF guard unless opted in
  allowPrivateEndpoint: true
  proxyPort: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
