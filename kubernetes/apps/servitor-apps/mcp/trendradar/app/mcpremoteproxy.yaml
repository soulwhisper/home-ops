---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpremoteproxy_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPRemoteProxy
metadata:
  name: trendradar
spec:
  groupRef:
    name: search
  # Gateway tool allowlist: networking-system/agentgateway/config/mcp/filters.yaml
  # (search policy). Tracked against wantcat/trendradar-mcp 4.1.0 (27 tools
  # enumerated 2026-10-20) — re-verify the allowlist on every version bump.
  remoteUrl: http://trendradar.selfhosted-apps.svc.cluster.local:3333/mcp
  # in-cluster DNS suffix is blocked by toolhive's SSRF guard unless opted in
  allowPrivateEndpoint: true
  proxyPort: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
