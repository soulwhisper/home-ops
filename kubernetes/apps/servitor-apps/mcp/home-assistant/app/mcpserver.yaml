---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &name mcp-home-assistant
spec:
  groupRef:
    name: internal-rw
  image: ghcr.io/homeassistant-ai/ha-mcp:8.5.0
  podTemplateSpec:
    spec:
      volumes:
        # toolhive runs the pod with a read-only rootfs; python needs a usable
        # tmpdir (FileNotFoundError: no usable temporary directory otherwise)
        - name: tmp
          emptyDir: {}
      containers:
        - name: mcp
          # ha-mcp 8.5.0 vendored FastMCP and dropped the `fastmcp` CLI;
          # `ha-mcp-web` serves streamable-http on MCP_PORT (default 8086)
          command: ["ha-mcp-web"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
  env:
    - name: "HOMEASSISTANT_URL"
      value: "http://home-assistant.smarthome-apps.svc.cluster.local:8123"
    # 8.5.0: cross-session admission control; cap parallel HA calls
    - name: "HA_TOOL_CONCURRENCY"
      value: "2"
    # tool-search cuts idle tool-context ~46K -> ~5K tokens
    - name: "ENABLE_TOOL_SEARCH"
      value: "true"
  transport: streamable-http
  mcpPort: 8086
  secrets:
    - name: *name
      key: HOMEASSISTANT_TOKEN
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
