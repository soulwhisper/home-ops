---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &name mcp-github
spec:
  groupRef:
    name: external
  # Pinned at v1.14.0: v2.0.2 emits nullable-union `type: ["null","object"]`
  # in every tool's outputSchema on the Modern (2026-07-28) path, and
  # toolhive-core mcpcompat decodes schemas into a strict `Type string`
  # field — vmcp tools/list decode fails and the circuit opens (degraded
  # 2026-10-09/10, reproduced byte-level). Unpin when a toolhive release
  # carries the union-tolerant schema fix.
  image: ghcr.io/github/github-mcp-server:v1.14.0
  args: ["http"]
  env:
    - name: GITHUB_READ_ONLY
      value: "1"
    # only the toolsets the toolsFilter below uses
    - name: GITHUB_TOOLSETS
      value: "repos,issues,pull_requests"
    # only serve content from repos the token owns/collaborates on
    - name: GITHUB_LOCKDOWN_MODE
      value: "1"
  transport: streamable-http
  mcpPort: 8082
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
