---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: mcp-github
spec:
  # Pinned at v1.14.0: newer github-mcp-server emits nullable-union
  # `type: ["null","object"]` in every tool's outputSchema on the Modern
  # (2026-07-28) protocol path, and toolhive-core mcpcompat decodes schemas
  # into a strict `Type string` field — vmcp tools/list decode fails and the
  # circuit opens. Re-verify the pin on github-mcp-server bumps and toolhive
  # upgrades.
  image: ghcr.io/github/github-mcp-server:v1.14.0
  args: ["http"]
  transport: streamable-http
  mcpPort: 8082
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
