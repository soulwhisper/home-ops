---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-github
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        GITHUB_PERSONAL_ACCESS_TOKEN: "{{ .mcp_github_token }}"
        # vMCP outgoingAuth headerInjection needs the full header value;
        # github-mcp-server http mode requires a per-request bearer token
        AUTHORIZATION_HEADER: "Bearer {{ .mcp_github_token }}"
  dataFrom:
    - extract:
        key: github-keys
