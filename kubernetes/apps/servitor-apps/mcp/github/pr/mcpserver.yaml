---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &name mcp-github-pr
spec:
  groupRef:
    name: github-pr
  # Keep the 1.x schema contract used by the existing ToolHive deployment.
  image: ghcr.io/github/github-mcp-server:v1.14.0
  args: ["http"]
  env:
    # Explicit tools only. Toolsets are intentionally unset so pull_requests
    # cannot re-register merge_pull_request or unrelated writers.
    - name: GITHUB_TOOLS
      value: "get_file_contents,create_branch,create_or_update_file,push_files,get_commit,list_commits,pull_request_read,list_pull_requests,search_pull_requests,create_pull_request"
    - name: GITHUB_LOCKDOWN_MODE
      value: "1"
  transport: streamable-http
  mcpPort: 8082
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
