---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-github-pr
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # Placeholder field, supplied separately before this writer is used.
        AUTHORIZATION_HEADER: "Bearer {{ .mcp_github_pr_token }}"
  dataFrom:
    - extract:
        key: github-keys
