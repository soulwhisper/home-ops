---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpremoteproxy_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPRemoteProxy
metadata:
  name: &name mcp-hindsight-ops
spec:
  groupRef:
    # isolated tier (virtualmcpserver/internal-ops via agentgateway /mcp/ops) —
    # chat-tier consumers on ro/rw/ext can never retain into incident memory
    name: internal-ops
  toolConfigRef:
    name: *name
  # dedicated memory bank for ai-ops incident/RCA memory — recall boundary
  # keeps ops history out of the conversational `homelab` bank
  remoteUrl: http://hindsight.selfhosted-apps.svc.cluster.local:8888/mcp/ops
  # in-cluster DNS suffix is blocked by toolhive's SSRF guard unless opted in
  allowPrivateEndpoint: true
  proxyPort: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
