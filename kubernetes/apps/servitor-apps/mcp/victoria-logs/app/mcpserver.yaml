---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &name mcp-victoria-logs
spec:
  groupRef:
    name: internal-ro
  # renovate: datasource=docker depName=ghcr.io/victoriametrics/mcp-victorialogs
  image: ghcr.io/victoriametrics/mcp-victorialogs:v1.9.0
  env:
    - name: VL_INSTANCE_ENTRYPOINT
      value: "http://victoria-logs-server.monitoring-system.svc.cluster.local:9428"
    - name: MCP_SERVER_MODE
      value: "http"
    - name: MCP_LISTEN_ADDR
      value: ":8081"
    # embedded bleve doc-search DB is the server's main resource consumer
    # (upstream FAQ); docs are searchable upstream, drop the tool
    - name: MCP_DISABLED_TOOLS
      value: "documentation"
  transport: streamable-http
  mcpPort: 8081
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
