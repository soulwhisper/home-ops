---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpserver_v1beta1.json
# soulwhisper/reflex — System-1 routing advisor (laya typed decisions, no
# generation). Advisory member of internal-ro: agents MAY consult route_*;
# nothing is enforced yet. Every policy decision emits one OTEL span
# (gen_ai.system=reflex) -> traces/servitor -> langfuse; the exported spans
# are the shadow dataset for the fine-tune path. 0.4.0 = ONNX runtime
# (English base checkpoint, no torch stack).
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &name mcp-reflex
spec:
  groupRef:
    name: internal-ro
  image: ghcr.io/soulwhisper/reflex:0.4.1
  transport: streamable-http
  mcpPort: 9000
  env:
    - name: REFLEX_POLICIES
      value: /etc/reflex/routes.yaml
    # mcp v2 DNS-rebinding protection 421s the toolhive proxy otherwise.
    # An enumerated list can't work here: the proxy dials dynamic endpoint
    # IPs (its own redirect logs show ClusterIP/pod-IP targets). "*" disables
    # the check at the workload — acceptable: only reachable in-cluster,
    # behind the toolhive proxy (0.4.1 feature).
    - name: REFLEX_ALLOWED_HOSTS
      value: "*"
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://opentelemetry-collector.monitoring-system.svc.cluster.local:4318"
    # SDK default (parentbased_always_on) would drop ~95% of decision spans
    # under toolhive's 5%-sampled proxy parents — silently shrinking the
    # shadow dataset
    - name: OTEL_TRACES_SAMPLER
      value: "always_on"
    - name: OTEL_SERVICE_NAME
      value: reflex
  telemetryConfigRef:
    name: shared-otel
    serviceName: *name
  podTemplateSpec:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mcp
          volumeMounts:
            - name: policies
              mountPath: /etc/reflex
              readOnly: true
            # python/ml runtime scratch on toolhive's read-only rootfs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: policies
          configMap:
            name: reflex-policies
        - name: tmp
          emptyDir: {}
  resources:
    # ONNX fp32 measured warm RSS 2.4Gi (N305); int8 variant would fit 1Gi
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 3Gi
