---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name open-webui-oikb
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # Open WebUI user API key (Settings → Account → API keys)
        OPEN_WEBUI_API_KEY: "{{ .open_webui_api_key }}"
        # oikb daemon's own API key (protects /sync, /history, webhooks)
        OIKB_API_KEY: "{{ .oikb_api_key }}"
  dataFrom:
    - extract:
        key: open-webui
