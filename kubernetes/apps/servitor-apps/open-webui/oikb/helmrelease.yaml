---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name open-webui-oikb
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/oikb
              tag: 0.6.0
            args: ["daemon"]
            env:
              OPEN_WEBUI_URL: "http://open-webui:8080"
              LOG_FORMAT: "json"
              OIKB_CONFIG_DIR: /var/lib/oikb
            envFrom:
              - secretRef:
                  name: *name
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /health, port: 8080 }
                  periodSeconds: 10
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /health/ready, port: 8080 }
                  periodSeconds: 30
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true

    service:
      app:
        ports:
          http:
            port: 8080

    persistence:
      config:
        type: configMap
        name: *name
        globalMounts:
          - path: /app/.oikb.yaml
            subPath: .oikb.yaml
            readOnly: true
      sources:
        existingClaim: backup
        globalMounts:
          - path: /sources/homelab
            subPath: dropbox/Obsidian\noirprime\300-Homelab
            readOnly: true
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /var/lib/oikb
            subPath: state
          - path: /tmp
            subPath: tmp
