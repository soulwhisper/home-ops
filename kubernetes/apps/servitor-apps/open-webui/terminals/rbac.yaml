---
# Least-privilege RBAC for the terminals orchestrator (kubernetes backend):
# it needs exactly pods + services + PVCs in THIS namespace. No secrets, no
# configmaps, no cluster-scope, no deletecollection. Sandbox pods carry no
# token (TERMINALS_KUBERNETES_RESTRICTED + no SA mount via operator defaults).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: &name open-webui-terminals
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: &name open-webui-terminals
subjects:
  - kind: ServiceAccount
    name: *name
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: *name
