---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name open-webui-terminals
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # static bearer for the orchestrator API; open-webui uses it for the
        # Open Terminal integration connection
        TERMINALS_API_KEY: "{{ .terminals_api_key }}"
  dataFrom:
    - extract:
        key: open-webui
