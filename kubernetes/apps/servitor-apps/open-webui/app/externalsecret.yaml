---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name open-webui
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # Single provider on the unified /v1 surface; lane choice is a model
        # name (complex-raw open / complex+omni+micro guarded).
        # GATEWAY_API_KEY feeds TOOL_SERVER_CONNECTIONS bearer auth via
        # kubelet $(VAR) expansion in the helmrelease env.
        OPENAI_API_BASE_URLS: "http://agentgateway-proxy.networking-system.svc.cluster.local:80/v1"
        OPENAI_API_KEYS: "{{ .agentgateway_api_auth }}"
        GATEWAY_API_KEY: "{{ .agentgateway_api_auth }}"
  dataFrom:
    - extract:
        key: llm-api
