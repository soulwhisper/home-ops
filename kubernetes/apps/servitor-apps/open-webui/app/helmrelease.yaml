---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name open-webui
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        # role + database open-webui are created by postgres-init against the
        # shared CNPG cluster (no Database CR / managed role — open-webui has
        # no special extension/ownership needs; its migrations self-create
        # the vector extension)
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18"
            envFrom:
              - secretRef:
                  name: open-webui-pguser
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              # renovate: datasource=docker depName=ghcr.io/open-webui/open-webui
              tag: v0.11.3
            env:
              # Auth is authentik forward-auth at the gateway (components/authentik);
              # disable open-webui's own login so the SSO identity passes through.
              WEBUI_AUTH: "False"
              # Single provider: the agentgateway OPEN lane (/chat/raw). Any
              # model id falls through to the `complex` catch-all on the
              # studio main brain; explicit lane aliases (omni/micro) select
              # their lanes. The former hermes chat-profile provider was
              # removed — open-webui's only AI egress is the gateway (see
              # ciliumnetworkpolicy). OPENAI_API_KEYS order matches.
              OPENAI_API_BASE_URLS: "http://agentgateway-proxy.networking-system.svc.cluster.local:80/chat/raw"
              # Gateway API key for the MCP tool servers below. Declared
              # before TOOL_SERVER_CONNECTIONS so $(GATEWAY_API_KEY) expands
              # (kubelet dependent-env expansion, same pattern as
              # REDIS_PASSWORD above).
              GATEWAY_API_KEY:
                valueFrom:
                  secretKeyRef: { name: open-webui, key: GATEWAY_API_KEY }
              # ToolHive VirtualMCPServer groups via the agentgateway tiered,
              # sidecar-guarded MCP endpoints (/mcp/ro|rw|ext). auth_type
              # "bearer" + key is native on v0.11.3 (build_tool_server_headers
              # -> Authorization: Bearer). MCP has no open lane by design —
              # these are the same guarded endpoints hermes uses. Shape
              # follows the Admin UI persistence: match is on info.id, not a
              # top-level id (v0.11.3 middleware connect_mcp_server).
              TOOL_SERVER_CONNECTIONS: '[{"type":"mcp","url":"http://agentgateway-proxy.networking-system.svc.cluster.local:80/mcp/ro","auth_type":"bearer","key":"$(GATEWAY_API_KEY)","info":{"id":"internal-ro","name":"internal-ro","description":"ToolHive internal read-only (fluxcd, grafana, kubernetes, victoria-logs, context, trendradar)"},"config":{"enable":true}},{"type":"mcp","url":"http://agentgateway-proxy.networking-system.svc.cluster.local:80/mcp/rw","auth_type":"bearer","key":"$(GATEWAY_API_KEY)","info":{"id":"internal-rw","name":"internal-rw","description":"ToolHive internal read-write (forgejo, github, home-assistant, hindsight)"},"config":{"enable":true}},{"type":"mcp","url":"http://agentgateway-proxy.networking-system.svc.cluster.local:80/mcp/ext","auth_type":"bearer","key":"$(GATEWAY_API_KEY)","info":{"id":"external","name":"external","description":"ToolHive external egress (firecrawl)"},"config":{"enable":true}}]'
              ENABLE_OLLAMA_API: "false"
              # OTLP -> opentelemetry-collector; its traces/servitor pipeline
              # keeps gen_ai spans and exports them to langfuse
              ENABLE_OTEL: "true"
              ENABLE_OTEL_TRACES: "true"
              OTEL_EXPORTER_OTLP_ENDPOINT: "http://opentelemetry-collector.monitoring-system.svc.cluster.local:4318"
              OTEL_SERVICE_NAME: "open-webui"
              # durable state is externalized — CNPG (data + pgvector), the
              # app dragonfly (session/rate-limit state), the app ceph bucket
              # (uploads/KB files); the on-disk data dir is cache-only
              DATABASE_URL:
                valueFrom:
                  secretKeyRef: { name: open-webui-pguser, key: uri }
              VECTOR_DB: "pgvector" # PGVECTOR_DB_URL defaults to DATABASE_URL
              REDIS_PASSWORD:
                valueFrom:
                  secretKeyRef: { name: open-webui-dragonfly, key: password }
              REDIS_URL: "redis://:$(REDIS_PASSWORD)@open-webui-dragonfly:6379/0"
              STORAGE_PROVIDER: "s3"
              STORAGE_LOCAL_CACHE: "False"
              S3_BUCKET_NAME: "open-webui"
              S3_ENDPOINT_URL: "http://rook-ceph-rgw-ceph-objectstore.storage-system.svc:80"
              S3_ADDRESSING_STYLE: "path"
              S3_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef: { name: ceph-bucket-open-webui, key: AWS_ACCESS_KEY_ID }
              S3_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef: { name: ceph-bucket-open-webui, key: AWS_SECRET_ACCESS_KEY }
            envFrom:
              - secretRef:
                  name: *name
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: false # upstream entrypoint chowns the data dir

    service:
      app:
        ports:
          http:
            port: &port 8080
    route:
      app:
        hostnames: ["chat.noirprime.com"]
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: open-webui.svg
          gethomepage.dev/name: Open WebUI
          gethomepage.dev/group: AI
        parentRefs:
          - name: kgateway-internal
            namespace: networking-system

    persistence:
      # cache only; durable state lives in CNPG / dragonfly / the ceph bucket
      app:
        type: emptyDir
        globalMounts:
          - path: /app/backend/data
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
