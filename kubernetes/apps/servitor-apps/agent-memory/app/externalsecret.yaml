---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-memory
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # memory-core
        TDAI_LLM_BASE_URL: &llm_url http://agentgateway-proxy.networking-system.svc.cluster.local:80/chat
        TDAI_LLM_MODEL: &llm_model fast
        TDAI_LLM_API_KEY: &llm_key "{{ .agentgateway_api_auth }}"
        # memory-hub
        LLM_MODE: custom
        LLM_PROTOCOL: openai
        LLM_BASE_URL: *llm_url
        LLM_MODEL: *llm_model
        LLM_API_KEY: *llm_key
        # memory-proxy
        PROXY_UPSTREAM_URL: *llm_url
        PROXY_UPSTREAM_MODEL: *llm_model
        PROXY_UPSTREAM_API_KEY: *llm_key
  dataFrom:
    - extract:
        key: llm-api
