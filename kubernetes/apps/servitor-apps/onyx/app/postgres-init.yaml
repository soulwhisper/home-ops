---
# yaml-language-server: $schema=https://json.schemastore.org/cronjob
# One-shot DB bootstrap; the onyx chart has no initContainer hook for this.
apiVersion: batch/v1
kind: Job
metadata:
  name: onyx-postgres-init
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-db
          image: ghcr.io/home-operations/postgres-init:18
          envFrom:
            - secretRef:
                name: onyx-initdb
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
