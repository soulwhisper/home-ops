---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name onyx
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # openssl rand -hex 32 (chart auth.userauth default key)
        user_auth_secret: "{{ .onyx }}"
        # must meet OpenSearch complexity: >=8 chars, upper+lower+digit+special
        # lowercase variants consumed by onyx chart (auth.opensearch.existingSecret)
        opensearch_admin_username: "admin"
        opensearch_admin_password: "{{ .opensearch }}"
        # Langfuse tracing (project keys, created in Langfuse UI per project)
        LANGFUSE_PUBLIC_KEY: "{{ .onyx_public_key }}"
        LANGFUSE_SECRET_KEY: "{{ .onyx_secret_key }}"
  dataFrom:
    - extract:
        key: encryption_cipher
    - extract:
        key: langfuse
