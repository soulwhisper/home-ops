---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name onyx
spec:
  interval: 1h
  timeout: 20m # model-server pods need ~10min (torch init throttled at 2 CPU)
  chartRef:
    kind: OCIRepository
    name: *name

  values:
    global:
      # renovate: datasource=docker depName=onyxdotapp/onyx-backend
      version: v4.7.2

    postgresql:
      enabled: false
      installCRDs: false
    postgresqlOperator:
      enabled: false
    redis:
      enabled: false
    redisOperator:
      enabled: false
    minio:
      enabled: false
    nginx:
      enabled: false
    slackbot:
      enabled: false
    codeInterpreter:
      enabled: false

    opensearch:
      extraEnvs:
        - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: *name
              key: opensearch_admin_password
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: 2000m
          memory: 4Gi
      opensearchJavaOpts: "-Xmx2g -Xms2g"
      persistence:
        storageClass: ceph-block
        size: 30Gi
    inferenceCapability:
      # in-cluster model serving retired in favor of agentgateway
      # (litellm provider, see README): replicaCount 0 skips the deployment,
      # the service stays so MODEL_SERVER_HOST still resolves. Embeddings/
      # rerank fail until the litellm provider switch lands (admin REST).
      replicaCount: 0
      resources:
        requests:
          cpu: 250m
          memory: 1500Mi
        limits:
          cpu: 2000m
          memory: 4Gi
      # no probes by default: v4.7.2 upgrade timed out waiting for these two
      # deployments (big ML image pull through tproxy + torch init on 2 CPU).
      # Images are pre-pulled on all nodes; probe keeps helm's window honest.
      startupProbe:
        httpGet: { path: /api/health, port: 9000 }
        periodSeconds: 10
        failureThreshold: 120
    indexCapability:
      replicaCount: 0 # see inferenceCapability above
      resources:
        requests:
          cpu: 250m
          memory: 1500Mi
        limits:
          cpu: 2000m
          memory: 4Gi
      startupProbe:
        httpGet: { path: /api/health, port: 9000 }
        periodSeconds: 10
        failureThreshold: 120
    celery_worker_docprocessing:
      resources:
        requests: { cpu: 250m, memory: 1Gi }
        limits: { cpu: 1000m, memory: 4Gi }
    celery_worker_docfetching:
      resources:
        requests: { cpu: 250m, memory: 1Gi }
        limits: { cpu: 1000m, memory: 4Gi }

    auth:
      postgresql:
        existingSecret: onyx-pguser
        secretKeys:
          POSTGRES_USER: username
          POSTGRES_PASSWORD: password
      redis:
        existingSecret: onyx-dragonfly
        secretKeys:
          REDIS_PASSWORD: password
      objectstorage:
        existingSecret: ceph-bucket-onyx
        secretKeys:
          S3_AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
          S3_AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      opensearch:
        existingSecret: *name
        secretKeys:
          OPENSEARCH_ADMIN_USERNAME: opensearch_admin_username
          OPENSEARCH_ADMIN_PASSWORD: opensearch_admin_password
      userauth:
        enabled: true
        existingSecret: *name
        secretKeys:
          USER_AUTH_SECRET: user_auth_secret
    extraEnvFromSecret: *name
    configMap:
      AUTH_TYPE: "basic"
      WEB_DOMAIN: "https://onyx.noirprime.com"
      REQUIRE_EMAIL_VERIFICATION: "false"
      DISABLE_METRICS_AUTH: "true"
      LANGFUSE_HOST: "http://langfuse-web.monitoring-system.svc.cluster.local:3000"
      POSTGRES_HOST: "postgres-rw.database-system.svc.cluster.local"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: *name
      REDIS_HOST: "onyx-dragonfly"
      REDIS_PORT: "6379"
      S3_ENDPOINT_URL: "http://rook-ceph-rgw-ceph-objectstore.storage-system.svc.cluster.local"
      S3_FILE_STORE_BUCKET_NAME: *name
