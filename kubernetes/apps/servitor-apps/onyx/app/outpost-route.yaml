---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
# authentik forward-auth: /outpost.goauthentik.io/* must reach the outpost
# directly (OAuth callback is a real request, not an ext-authz check)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: onyx-outpost
spec:
  hostnames: ["onyx.noirprime.com"]
  parentRefs:
    - name: kgateway-internal
      namespace: networking-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-forwarded-host
                value: "onyx.noirprime.com"
              - name: x-forwarded-proto
                value: "https"
      backendRefs:
        - name: authentik-server
          namespace: security-system
          port: 80
