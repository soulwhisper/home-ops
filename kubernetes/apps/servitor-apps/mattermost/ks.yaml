---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &name mattermost
  annotations:
    config.home-ops.io/managed: "true"
  labels:
    config.home-ops.io/deps: "infra"
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *name
  targetNamespace: servitor-apps
  path: "./kubernetes/apps/servitor-apps/mattermost/app"
  dependsOn:
    - name: cnpg-cluster
      namespace: database-system
  components:
    - ../../../../components/authentik
    - ../../../../components/ceph-bucket
    - ../../../../components/cnpg
  postBuild:
    substitute:
      APP: *name
      APP_HOST: "ops.noirprime.com"
