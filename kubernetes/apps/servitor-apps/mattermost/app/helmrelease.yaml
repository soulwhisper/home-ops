---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name mattermost
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18"
            envFrom:
              - secretRef:
                  name: mattermost-pguser
        containers:
          app:
            image:
              repository: docker.io/mattermost/mattermost-team-edition
              # renovate: datasource=docker depName=mattermost/mattermost-team-edition
              tag: "10.12.4"
            env:
              MM_SERVICESETTINGS_SITEURL: "https://mm.noirprime.com"
              MM_SQLSETTINGS_DRIVERNAME: postgres
              # cnpg component pguser secret carries uri/host/port/username/password
              MM_SQLSETTINGS_DATASOURCE:
                valueFrom:
                  secretKeyRef: { name: mattermost-pguser, key: uri }
              # cluster-internal ops bus: no telemetry, no outbound calls
              MM_LOGSETTINGS_CONSOLELEVEL: INFO
              # filestore on ceph RGW (ceph-bucket component OBC): rebuildable
              # data stays out of rbd/kopiur snapshot scope by design
              MM_FILESETTINGS_DRIVERNAME: amazons3
              MM_FILESETTINGS_AMAZONS3BUCKET: *name
              MM_FILESETTINGS_AMAZONS3ENDPOINT: "rook-ceph-rgw-ceph-objectstore.storage-system.svc.cluster.local:80"
              MM_FILESETTINGS_AMAZONS3SSL: "false"
              MM_FILESETTINGS_AMAZONS3REGION: "us-east-1"
              MM_FILESETTINGS_AMAZONS3ACCESSKEYID:
                valueFrom:
                  secretKeyRef: { name: ceph-bucket-mattermost, key: AWS_ACCESS_KEY_ID }
              MM_FILESETTINGS_AMAZONS3SECRETACCESSKEY:
                valueFrom:
                  secretKeyRef: { name: ceph-bucket-mattermost, key: AWS_SECRET_ACCESS_KEY }
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v4/system/ping
                    port: 8065
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }

    service:
      app:
        ports:
          http:
            port: 8065

    route:
      app:
        hostnames: ["mm.noirprime.com"]
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: mattermost.svg
          gethomepage.dev/name: Mattermost
          gethomepage.dev/group: Observability
          gethomepage.dev/pod-selector: app.kubernetes.io/name=mattermost
        parentRefs:
          - name: kgateway-internal
            namespace: networking-system

    # scratch only (logs/plugins); filestore lives on the ceph bucket above
    persistence:
      data:
        type: emptyDir
        globalMounts:
          - path: /mattermost/data
