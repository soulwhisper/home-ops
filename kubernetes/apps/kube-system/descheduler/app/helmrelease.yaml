---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name descheduler
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: descheduler

  values:
    replicas: 1
    kind: Deployment
    deschedulerPolicyAPIVersion: descheduler/v1alpha2
    deschedulerPolicy:
      metricsProviders:
        - source: KubernetesMetrics
      profiles:
        - name: Default
          pluginConfig:
            - name: DefaultEvictor
              args:
                podProtections:
                  defaultDisabled:
                    - FailedBarePods
                    - PodsWithLocalStorage
                    - SystemCriticalPods
            - name: LowNodeUtilization
              # Bands fitted to 3x 13900H/96G nodes (allocatable ~19.95c/93.4Gi,
              # maxPods 110). Measured requests run cpu 50-76% / mem 50-76%
              # cluster-wide, so tight bands leave no underutilized receiver and
              # the plugin no-ops every cycle ("No node is underutilized").
              #   under : cpu<75% (~15c) AND mem<80% (~75Gi) AND pods<55% (60)
              #   evict : cpu>90% (~18c)  OR mem>90% (~84Gi)  OR pods>75% (82)
              # pods dimension was previously 100/100 = physically unreachable
              # (>100% of 110 maxPods), so pod-count skew was invisible:
              # exarch-03 hit 106/110 (96%) while exarch-01 idled at 47%.
              args:
                thresholds:
                  cpu: 75
                  memory: 80
                  pods: 55
                targetThresholds:
                  cpu: 90
                  memory: 90
                  pods: 75
            - name: RemoveFailedPods
              args:
                reasons:
                  - ContainerStatusUnknown
                  - NodeAffinity
                  - NodeShutdown
                  - Terminated
                  - UnexpectedAdmissionError
                includingInitContainers: true
                excludeOwnerKinds:
                  - Job
                minPodLifetimeSeconds: 1800
            - name: RemovePodsViolatingInterPodAntiAffinity
            - name: RemovePodsViolatingNodeAffinity
              args:
                nodeAffinityType:
                  - requiredDuringSchedulingIgnoredDuringExecution
            - name: RemovePodsViolatingNodeTaints
            - name: RemovePodsViolatingTopologySpreadConstraint
          plugins:
            balance:
              enabled:
                - LowNodeUtilization
                - RemovePodsViolatingTopologySpreadConstraint
            deschedule:
              enabled:
                - RemoveFailedPods
                - RemovePodsViolatingInterPodAntiAffinity
                - RemovePodsViolatingNodeAffinity
                - RemovePodsViolatingNodeTaints
    service:
      enabled: true
    serviceMonitor:
      enabled: true
    leaderElection:
      enabled: true
