---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name victoria-logs-server
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: victoria-logs-single

  values:
    global:
      image:
        registry: quay.io
    server:
      fullnameOverride: *name
      retentionPeriod: 90d
      # Talos pins pods to pod_t and has no container_file_t, so kubelet's
      # seLinuxOptions relabel is a no-op. Talos blesses ephemeral_t for CSI
      # volumes; relabel idempotently at pod start. Root required because
      # volume files have mixed uids (lost+found is root).
      initContainers:
        - name: selinux-relabel
          image: ubuntu:24.04
          command:
            - sh
            - -eu
            - -c
            - |
              # Marker-file proof of a completed full walk; deleted before
              # each redo so a failed walk cannot leave a stale marker.
              if [ "$(stat -c %C /storage)" != "system_u:object_r:ephemeral_t:s0" ] || [ ! -f /storage/.selinux-relabelled ]; then
                rm -f /storage/.selinux-relabelled
                chcon -R system_u:object_r:ephemeral_t:s0 /storage
                touch /storage/.selinux-relabelled
                echo "relabelled /storage"
              fi
          securityContext:
            runAsUser: 0
            runAsNonRoot: false  # overrides the pod-level runAsNonRoot
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"], add: ["FOWNER"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: server-volume, mountPath: /storage }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
      podSecurityContext:
        enabled: true
        fsGroup: 2000
        runAsNonRoot: true
        runAsUser: 1000
      persistentVolume:
        enabled: true
        storageClassName: ceph-block
        size: 50Gi
      serviceMonitor:
        enabled: true
