---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name victoria-logs-server
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: victoria-logs-single

  values:
    global:
      image:
        registry: quay.io
    server:
      fullnameOverride: *name
      retentionPeriod: 90d
      resources:
        requests:
          cpu: 150m
          memory: 2304Mi
      podSecurityContext:
        enabled: true
        fsGroup: 2000
        runAsNonRoot: true
        runAsUser: 1000
      persistentVolume:
        enabled: true
        storageClassName: ceph-block
        size: 50Gi
      serviceMonitor:
        enabled: true
