---
# Schedules are UTC; the comments show the Asia/Shanghai equivalent.
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/holmesgpt.dev/scheduledhealthcheck_v1alpha1.json
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: ceph-health-growth
spec:
  schedule: "17 4,10,16,22 * * *" # 00:17/06:17/12:17/18:17 Asia/Shanghai
  # controller default is 30s — real tool-using investigations take minutes
  timeout: 300
  # Verdicts must cite live tool output; the demands track what the sandboxed
  # toolset actually emits (Prometheus metrics, not ceph CLI text — kubectl
  # exec is approval-gated in this sandbox).
  query: "Check the ceph cluster (namespace storage-system) health: overall HEALTH status, OSD count/in/out state, pool usage vs the ceph-blockpool/ceph-cachepool/ceph-filesystem trend, and any slow or blocked requests. Base the verdict only on tool output gathered in this run: quote the decisive evidence verbatim in the rationale — metric names with their raw values, e.g. ceph_health_status=0, ceph_osd_up/ceph_osd_in counts, ceph_pool_bytes_used values. Tool discipline: keep every tool response small (under ~2000 chars) — use server-side selectors and jq filters, never dump full tables; a truncated or errored response means narrow the query and retry; report a tool error only when a retry still cannot provide evidence — never guess cluster state. Report concise status and flag anything trending worse."
---
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: cert-expiry-watch
spec:
  schedule: "23 23 * * *" # 07:23 Asia/Shanghai
  timeout: 300
  # noirprime-com uses a 160h duration, so judge renewal health via
  # status.renewalTime, not a flat expiry window.
  query: "Check cert-manager managed certificates in this cluster: list any Certificate not in Ready state, and any Certificate whose status.renewalTime is missing, already past, or later than status.notAfter (renewal broken or overdue). Short-lived certificates with a valid future renewalTime before notAfter are healthy, not findings. Quote each flagged certificate's name, namespace, renewalTime and notAfter verbatim from tool output in the rationale. Tool discipline: keep every tool response small (under ~2000 chars) — use server-side selectors and jq filters, never dump full tables; a truncated or errored response means narrow the query and retry. Report a concise list, or 'all clear'."
---
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: node-density-trend
spec:
  schedule: "41 0 * * *" # 08:41 Asia/Shanghai
  timeout: 300
  # maxPods is 160 per node; use three aggregate instant queries, not exploration.
  query: "Check current per-node pod density and resource requests using exactly these three instant PromQL queries against vmsingle (namespace monitoring-system): (1) sum by (node) (kube_pod_info{node=~\"exarch.*\"} unless on(namespace,pod) (kube_pod_status_phase{phase=~\"Succeeded|Failed\"} == 1)); (2) kube_node_status_allocatable{node=~\"exarch.*\",resource=~\"pods|cpu|memory\"}; (3) sum by (node, resource) (kube_pod_container_resource_requests{node=~\"exarch.*\",resource=~\"cpu|memory\"} unless on(namespace,pod) (kube_pod_status_phase{phase=~\"Succeeded|Failed\"} == 1)). Use only current instant values: no per-node/per-pod kubectl loops, no range queries, no logs, and no extra exploratory calls. For each exarch node, calculate pod count / pod capacity and CPU/memory requests / allocatable from these results, quoting the raw counts, capacities and requests verbatim. Report a small table and flag nodes above 80% of any dimension. Do not infer historical trend. If a query fails, retry once with the same bounded response, then report the error instead of guessing."
---
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: alert-rule-quality-weekly
spec:
  schedule: "13 1 * * mon" # Monday 09:13 Asia/Shanghai
  timeout: 300
  # Deterministic alerting-loop health check: target availability plus a firing
  # count for context.
  query: "Review alerting loop health using vmsingle (namespace monitoring-system). Run these PromQL queries and preserve each raw result: (1) `sum(up{job=\"vmalert-victoria-metrics-cluster\"}) or vector(0)`; (2) `sum(up{job=\"vmalertmanager-victoria-metrics-cluster\"}) or vector(0)`; (3) `sum(up{job=~\"vmalert.*|alertmanager.*\"}) or vector(0)`; (4) `count(up{job=~\"vmalert.*|alertmanager.*\"}) or vector(0)`; (5) `count(ALERTS{alertstate=\"firing\"}) or vector(0)`. For each query, the rationale must contain one line in the exact form `<full PromQL from the tool result's query field> => <unmodified numeric string from data.result[0].value[1]>`, using verbatim values from this run, not paraphrases or inferred numbers. PASS only when values (1) and (2) are both 1 and value (3) equals value (4). Firing alerts (5) are context and are not a failure by themselves. FAIL when a component sum is 0 or a target is down. If a query fails, report ERROR and do not issue a verdict without evidence."
---
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: resolved-alert-recheck-daily
spec:
  schedule: "3 */6 * * *" # Every 6 hours at minute 3
  timeout: 300
  # Recheck recently healed alerts every 6 hours; the 12h overlap tolerates a
  # missed or errored run without dropping candidates.
  query: "Recheck recently healed alerts using vmsingle and vmalert (namespace monitoring-system). First use this instant PromQL against vmsingle to find candidate alert name/group pairs that fired in the last 12h but are not currently present: max by (alertname, alertgroup) (max_over_time(ALERTS{alertstate=\"firing\"}[12h])) unless on(alertname, alertgroup) present_over_time(ALERTS{alertstate=\"firing\"}[5m]). Use list_prometheus_rules once with type=\"alert\" to obtain the alert rules, and select every rule expression whose alert name and group match a candidate pair; alert name/group is not unique, so do not evaluate only one expression per pair. Do not use curl or ad-hoc scripts. For every matching Prometheus rule expression, use execute_prometheus_instant_query with the original expression wrapped exactly as absent((expr)) or vector(0): a numeric result of 1 means the original expression is currently empty and healed, while 0 means it is non-empty and not healed. Evaluate every matching expression in batches of at most 10 concurrent tool calls when supported, flagging every 0 result. Explicitly report every matching non-Prometheus rule as unevaluated; never send LogsQL or other non-PromQL expressions to /api/v1/query. Do not use Alertmanager for rule expressions, do not fetch raw 48-hour series, VictoriaLogs, or per-alert logs, do not dump full rule responses, and do not silently cap or skip candidates. Quote non-healed alert names, alert groups, matching-rule indexes and numeric absent-query results verbatim; do not reproduce rule expressions or annotations in investigation findings or verdicts. Never emit or recommend shell, kubectl, container, database, or remediation commands. Count healed evaluations instead of quoting them; mark unevaluated or errored queries as errors rather than guessing. Report a small table, or 'all clear' when every Prometheus candidate expression returns 1 and there are no non-Prometheus candidates or evaluation errors."
---
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: backup-chain-daily
spec:
  schedule: "7 22 * * *" # 06:07 Asia/Shanghai
  timeout: 300
  # Weekly postgres-backup-verify has a 10-day missing criterion, not 48h.
  query: "Check backup health in six bounded categories. For a truncated or \"too large to return\" response, retry that category once with a narrower projection or selector; no other retries, exploratory calls, or substitutions. (1) Use kubernetes_jq_query with kind=backups, namespace=database-system, and jq_expr='[.items[] | select(.metadata.name | startswith(\"postgres-\")) | {NAME: .metadata.name, PHASE: .status.phase, STARTED: .status.startedAt, STOPPED: .status.stoppedAt, ERROR: .status.error}] | sort_by(.STARTED) | reverse | .[:2]'. Judge the latest two runs by STARTED: completed with no error is successful; missing expected runs or explicit failures are findings. Do not use lastBackup, lastBackupStartTime, lastBackupFinishedAt, or lastSuccessfulTime as execution proof. (2) Use kubernetes_tabular_query with kind=cronjobs, namespace=database-system, field_selector=metadata.name=postgres-backup-verify, and columns NAME:.metadata.name,SCHEDULE:.spec.schedule,SUSPEND:.spec.suspend,LAST_SCHEDULE:.status.lastScheduleTime,LAST_SUCCESS:.status.lastSuccessfulTime. Judge weekly cadence against the existing 10-day missing-success criterion, not a 48h job requirement. This is the existing backup/DR verification target; do not require a separate literal DR-test resource or call WAL/base-backup checks a full restore test. (3) Use kubernetes_tabular_query with kind=jobs, namespace=database-system, filter_pattern=postgres-backup-verify, and columns NAME:.metadata.name,OWNER:.metadata.ownerReferences[*].name,CREATED:.metadata.creationTimestamp,SUCCEEDED:.status.succeeded,FAILED:.status.failed,COMPLETION:.status.completionTime. Select the newest row whose OWNER is postgres-backup-verify; distinguish null fields, not-found/RBAC errors, and not-yet-due. (4) Use execute_prometheus_instant_query for max(time() - kopiur_policy_last_backup_success_timestamp_seconds) to report only the single oldest successful snapshot age across all policies. (5) Use kubernetes_jq_query with kind=clusterrepositories and jq_expr='.items[] | select(.metadata.name == \"nas\") | first(.status.conditions[]? | select(.type == \"Ready\")) as $ready | {NAME: .metadata.name, PHASE: .status.phase, STATUS: $ready.status, REASON: $ready.reason}'. (6) Use kubernetes_jq_query with kind=snapshots and jq_expr='def cutoff: (now - 172800); def epoch: if contains(\".\") then split(\".\")[0] + \"Z\" else . end | fromdateiso8601; def running_pending: select(.status.phase == \"Running\" or .status.phase == \"Pending\"); [.items[] | running_pending | select(.status.timing.startTime != null and ((.status.timing.startTime | epoch) < (now - 1800)))] as $over_30m | [.items[] | running_pending | select(.status.timing.startTime == null)] as $missing_started | [.items[] | select(.status.phase == \"Failed\" and (((.status.timing.endTime // .metadata.creationTimestamp) | epoch) >= cutoff))] as $recent_failed | {running_pending_over_30m: ($over_30m | length), running_pending_missing_started: ($missing_started | length), failed_recent: ($recent_failed | length)}'. Flag Running/Pending snapshots older than 30m by STARTED and Failed snapshots in the last 48h by ENDED; use CREATED only as a fallback for Failed snapshots whose ENDED is missing, never to age Running/Pending snapshots. Missing STARTED on Running/Pending snapshots is an informational pending/unstarted count, not stale, failed, missing-backup evidence, or an unevaluable category by itself; continue evaluating all other categories. Any non-zero over-30m or recent-failed count is a finding; counts may be split across paginated result objects. Keep every response small (under ~2000 chars), never dump full objects. If a category cannot be evaluated after its single allowed narrowing retry, mark only that category unevaluable; do not substitute a different query or guess. Never treat a query error or oversized response as proof of a missing backup."
