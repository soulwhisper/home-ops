---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/holmesgpt.dev/scheduledhealthcheck_v1alpha1.json
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: ceph-health-growth
spec:
  schedule: "17 */6 * * *"
  # controller default is 30s — real tool-using investigations take minutes
  timeout: 300
  query: "Check the ceph cluster (namespace storage-system) health: overall HEALTH status, OSD count/in/out state, pool usage vs the ceph-blockpool/ceph-cachepool/ceph-filesystem trend, and any slow or blocked requests. Report concise status and flag anything trending worse."
---
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: cert-expiry-watch
spec:
  schedule: "23 7 * * *"
  timeout: 300
  # noirprime-com deliberately runs a 160h duration, so a flat "expiring within
  # 14 days" window can never pass (homelab-tickets#12). Judge renewal health
  # instead: cert-manager exposes status.renewalTime well before notAfter.
  query: "Check cert-manager managed certificates in this cluster: list any Certificate not in Ready state, and any Certificate whose status.renewalTime is missing, already past, or later than status.notAfter (renewal broken or overdue). Short-lived certificates with a valid future renewalTime before notAfter are healthy, not findings. Report a concise list, or 'all clear'."
---
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: node-density-trend
spec:
  schedule: "41 8 * * *"
  timeout: 300
  query: "Check per-node pod density and resource requests across the exarch nodes: pod count vs the 110 per-node limit, cpu/memory request utilization, and any node trending toward saturation (like the recent exarch-03 pile-up to 106 pods). Report a small table and flag nodes above 80% of any dimension."
---
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: alert-rule-quality-weekly
spec:
  schedule: "13 9 * * 1"
  timeout: 300
  query: "Review alert quality using vmalertmanager and vmsingle (namespace monitoring-system): which alerts fired most in the past 7 days, which are flapping (fire/resolve repeatedly), and which look like threshold-vs-normal mismatch (for example latency-based health checks whose normal latency exceeds the alert threshold). Propose concrete rule adjustments (threshold, for-duration, or silence) for the top 3 offenders."
---
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: backup-chain-daily
spec:
  schedule: "7 6 * * *"
  timeout: 300
  query: "Check backup health: kopiur snapshot jobs (namespace storage-system) and the cnpg postgres backup plus DR-test cronjobs (namespace database-system): any failed or missed runs in the last 48 hours, and the oldest successful snapshot age per critical app. Report concise status."
