---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # app
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  # utils
  - ./externalsecret.yaml
  - ./ciliumnetworkpolicy.yaml
  - ./holmes-certmanager-rbac.yaml
  - ./holmes-backup-rbac.yaml

configMapGenerator:
  # stable name: the HR references it by name (kustomize can't rewrite inside
  # HelmRelease values), so no hash suffix; holmes restarts via HR reconcile
  - name: holmes-checks-patch
    options:
      disableNameSuffixHash: true
    files:
      - checks.py=holmes-checks-0.45.0.py
