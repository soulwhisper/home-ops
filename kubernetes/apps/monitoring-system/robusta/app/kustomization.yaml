---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # app
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  # utils
  - ./externalsecret.yaml
  - ./ciliumnetworkpolicy.yaml
  - ./holmes-certmanager-rbac.yaml
  - ./holmes-backup-rbac.yaml

configMapGenerator:
  # stable name: the HR references it by name (kustomize can't rewrite inside
  # HelmRelease values), so no hash suffix; holmes restarts via HR reconcile
  - name: holmes-checks-patch
    options:
      disableNameSuffixHash: true
    files:
      - checks.py=holmes-checks-0.45.0.py
      - checks_api.py=holmes-checks-api-0.45.0.py
      - home_ops_check_runtime.py=holmes-home-ops-check-runtime.py
      - home_ops_check_worker.py=holmes-home-ops-check-worker.py
      - home_ops_collectors.py=home_ops_collectors.py
      - operator_api_client.py=holmes-operator-api-client-0.45.0.py
      - operator_healthcheck.py=holmes-operator-healthcheck-0.45.0.py
