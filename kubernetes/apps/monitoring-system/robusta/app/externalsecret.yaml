---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: robusta-holmes
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: robusta-holmes
    template:
      data:
        # agentgateway guarded /v1 lane; key shared with other LLM consumers
        OPENAI_API_BASE: "http://agentgateway-proxy.networking-system.svc.cluster.local:80/v1"
        OPENAI_API_KEY: "{{ .agentgateway_api_auth }}"
  dataFrom:
    - extract:
        key: llm-api
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# mattermost bot credentials for the robusta mattermost_sink. The bot account
# is created MANUALLY in the mattermost UI (Main Menu > Integrations > Bot
# Accounts) after mattermost is live; until the 1Password item exists this ES
# stays unsynced and the sink logs loud errors — that is the intended signal,
# not a bug.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: robusta
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: robusta
    template:
      data:
        MM_BOT_TOKEN: "{{ .mm_bot_token }}"
        MM_BOT_TOKEN_ID: "{{ .mm_bot_token_id }}"
  dataFrom:
    - extract:
        key: mattermost-bot
