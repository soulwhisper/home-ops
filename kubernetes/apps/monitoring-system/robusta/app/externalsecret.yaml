---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: robusta-holmes
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: robusta-holmes
    template:
      data:
        # agentgateway guarded /v1 lane; key shared with other LLM consumers
        OPENAI_API_BASE: "http://agentgateway-proxy.networking-system.svc.cluster.local:80/v1"
        OPENAI_API_KEY: "{{ .agentgateway_api_auth }}"
  dataFrom:
    - extract:
        key: llm-api

---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# PREREQUISITE: 1Password item `robusta` field `tickets_relay_secret`
# (random hex) — shared with webhook-relay's verify.token gate
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: robusta
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: robusta
    template:
      data:
        TICKETS_RELAY_SECRET: "{{ .tickets_relay_secret }}"
  dataFrom:
    - extract:
        key: robusta
