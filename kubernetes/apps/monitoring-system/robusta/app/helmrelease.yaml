---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name robusta
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: robusta

  values:
    clusterName: main
    # OSS classic mode: no platform account (account_id/signing_key stay empty).
    # Platform features (UI / smart grouping / Slack bot) are SaaS-gated and
    # deliberately out of scope.
    # Holmes runs unified in this release as a subchart: runner AI analysis
    # requires enableHolmesGPT, and the subchart has no enabled kill-switch —
    # so the embedded topology is the only sane one. Holmes service: robusta-holmes.
    enableHolmesGPT: true

    globalConfig:
      # Robusta's default map sends warning -> LOW, which the ticket route
      # (MEDIUM/HIGH) drops — 178 of 289 rules, including etcd, ESO, kopiur
      # and CrashLoop. MEDIUM parses back to HIGH; map warning to MEDIUM so it
      # is ticketed while info/none stay below the gate.
      custom_severity_map:
        warning: medium

    sinksConfig:
      # no feishu sink: alert delivery stays on alertmanager -> webhook-relay;
      # robusta's duplicate push lane is disabled at the relay
      # ticket intake: relay route robusta-tickets gates MEDIUM+ into the
      # serialized Forgejo consumer. size_limit default (4096) truncates the
      # payload field-by-field and drops enrichments — the diagnosis — first;
      # chaski accepts up to 1 MiB.
      - webhook_sink:
          name: tickets-relay
          url: "http://webhook-relay.monitoring-system.svc.cluster.local:8080/hooks/robusta-tickets"
          format: json
          size_limit: 262144

    runner:
      # Ticket Started/Ended are user-facing; keep this renderer on local time.
      # The rest of the monitoring data plane stays UTC.
      additional_env_vars:
        - name: TZ
          value: Asia/Shanghai
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi

    # ---- unified holmes (values carried over from servitor-apps/holmesgpt) ----
    holmes:
      # chart default points SENTRY_DSN at robusta's hosted sentry; the CNP
      # blocks internet egress -> retry spam every minute drowning real logs
      sentryDSN: ""
      extraEnvVarsSecrets:
        - robusta-holmes # OPENAI_API_BASE + OPENAI_API_KEY (ExternalSecret)
      # LOCAL PATCH: mount a patched checks.py forcing two-phase check execution
      # on the agent lane (response_format+tools incompatible). Keep the patch
      # aligned with the deployed Holmes image (currently 0.45.x).
      additionalVolumes:
        - name: holmes-checks-patch
          configMap:
            name: holmes-checks-patch
      additionalVolumeMounts:
        - name: holmes-checks-patch
          mountPath: /app/holmes/checks/checks.py
          subPath: checks.py
          readOnly: true
      podAnnotations:
        # bump when holmes-checks-0.45.0.py changes: subPath mounts never
        # propagate ConfigMap updates to running pods (coderabbit)
        home-ops/checks-patch-rev: "13"
        # the agentgateway lane key lives in the robusta-holmes Secret; without
        # this a key rotation leaves Holmes on the old key (401 every check)
        reloader.stakater.com/auto: "true"
      additionalEnvVars:
        # default model for requests that don't name one (HealthChecks!):
        # without it holmes falls back to "gpt-5.4" when OPENAI_API_KEY is set
        # -> agentgateway 404s the unknown lane
        - { name: MODEL, value: agent }
        # the agent lane caps at 64K total context; holmes' output floor of
        # max(64K, 12% of window) would eat the whole window, so cap output
        # explicitly and compact earlier (60% of 64K + 8K output < 64K)
        - { name: OVERRIDE_MAX_OUTPUT_TOKEN, value: "8192" }
        - { name: CONTEXT_WINDOW_COMPACTION_THRESHOLD_PCT, value: "60" }
      modelList:
        # agent lane (studio-hosted). temperature 0.6 follows the model's
        # tuned sampling (0.6/0.95/top_k 20).
        agent:
          model: openai/agent
          api_base: envRef:OPENAI_API_BASE
          api_key: envRef:OPENAI_API_KEY
          temperature: 0.6
          # holmes assumes 200K when the model is unknown to litellm; the lane
          # rejects prompts >64K ("Prompt too long"). Tell holmes the truth so
          # it compacts instead of erroring.
          custom_args:
            max_context_size: 65536
      toolsets:
        internet:
          enabled: false # no Internet egress for this pod (see CNP)
        robusta:
          enabled: false # requires a Robusta SaaS account; not used
        prometheus/metrics:
          enabled: true
          config:
            subtype: victoriametrics
            prometheus_url: http://vmsingle-victoria-metrics-cluster.monitoring-system.svc.cluster.local:8428
        victorialogs:
          enabled: true
          config:
            api_url: http://victoria-logs-server.monitoring-system.svc.cluster.local:9428
      # operator mode (alpha upstream): HealthCheck CRDs; no destinations —
      # results read from CR status
      operator:
        enabled: true
        # ScheduledHealthCheck cron expressions are UTC; keep the operator in
        # UTC so schedules do not silently shift by the node timezone.
        additionalEnvVars:
          - name: TZ
            value: UTC
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
        limits:
          memory: 2Gi
