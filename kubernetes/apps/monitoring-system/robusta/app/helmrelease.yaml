---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name robusta
spec:
  interval: 1h
  chart:
    spec:
      chart: robusta
      version: "0.51.0"
      sourceRef:
        kind: HelmRepository
        name: robusta
  values:
    clusterName: main
    # OSS classic mode: no platform account (account_id/signing_key stay empty).
    # Platform features (UI / smart grouping / Slack bot) are SaaS-gated and
    # deliberately out of scope.
    # Holmes stays standalone (servitor-apps/holmesgpt) — do not let the chart
    # install a second copy; AI-analysis wiring to the existing deployment is a
    # follow-up item (see PR body).
    enableHolmesGPT: false

    # feishu via the existing webhook-relay (route added in this PR)
    sinksConfig:
      - webhook_sink:
          name: feishu-relay
          url: "http://webhook-relay.monitoring-system.svc.cluster.local:8080/hooks/robusta"

    # P0 posture: enrichment only. No remediation playbooks yet — those land
    # behind an explicit alertname->action allow-list (Kyverno/match rules) in
    # a later phase, never by default.
    runner:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
