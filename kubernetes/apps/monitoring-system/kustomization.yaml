---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring-system
components:
  - ../../components/namespace
resources:
  # exporters
  - ./blackbox-exporter
  - ./node-exporter
  - ./smartctl-exporter
  - ./vmware-exporter
  # monitoring stack
  - ./grafana
  - ./langfuse
  - ./kube-state-metrics
  - ./opentelemetry-collector
  - ./prometheus-crds
  - ./silence-operator
  # monitoring backend
  - ./victoria-logs
  - ./victoria-metrics
  - ./victoria-traces
  # others
  - ./headlamp
  - ./krr
  - ./robusta
  - ./webhook-relay
