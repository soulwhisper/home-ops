---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: devices
spec:
  module: icmp
  prober:
    url: blackbox-exporter.monitoring-system.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - esxi.homelab.internal
        - nas.homelab.internal
        - unifi.homelab.internal
        # - zigbee.homelab.internal  # offline (SLZB-06P10 powered down)
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: nfs
spec:
  module: tcp_connect
  prober:
    url: blackbox-exporter.monitoring-system.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - nas.homelab.internal:2049
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/monitoring.coreos.com/probe_v1.json
# Studio API-plane health: GET /v1/models on oMLX — the surface every /v1
# consumer depends on. oMLX auto-loads models and evicts KV on TTL, so
# per-model inference probes are deliberately absent: they would force
# reloads and false-alarm on evictions. Model-plane regressions surface at
# the gateway (agentgateway pod monitoring) and in app error rates.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: studio-models
spec:
  interval: 30s
  module: studio_api
  prober:
    url: blackbox-exporter.monitoring-system.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://studio.homelab.internal:8000/v1/models
      labels:
        service: macstudio
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/monitoring.coreos.com/probe_v1.json
# Firecrawl scrape canary: POST /v2/scrape. The module also rejects challenge
# pages and requires the expected Markdown keyword, not just HTTP 200.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: firecrawl-scrape
spec:
  interval: 5m
  scrapeTimeout: 60s
  module: firecrawl_scrape
  prober:
    url: blackbox-exporter.monitoring-system.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://firecrawl-app.selfhosted-apps.svc.cluster.local:3002/v2/scrape
      labels:
        service: firecrawl-scrape
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/monitoring.coreos.com/probe_v1.json
# Firecrawl search canary: POST /v2/search, fails on empty web results.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: firecrawl-search
spec:
  interval: 5m
  scrapeTimeout: 75s
  module: firecrawl_search
  prober:
    url: blackbox-exporter.monitoring-system.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://firecrawl-app.selfhosted-apps.svc.cluster.local:3002/v2/search
      labels:
        service: firecrawl-search
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/monitoring.coreos.com/probe_v1.json
# SearXNG JSON search canary. SearXNG is a soft dependency for Firecrawl
# search; this catches engine fanout/limiter regressions even when the pod is up.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: searxng-search
spec:
  interval: 5m
  scrapeTimeout: 20s
  module: searxng_search
  prober:
    url: blackbox-exporter.monitoring-system.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - "http://searxng.selfhosted-apps.svc.cluster.local:8080/search?q=crawl4ai&format=json"
      labels:
        service: searxng-search
