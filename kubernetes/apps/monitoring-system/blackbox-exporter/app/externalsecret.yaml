---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# oMLX server key, mounted into blackbox-exporter for the direct-to-studio
# L7 probes (http module authorization.credentials_file).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: studio-api-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        Authorization: "{{ .api_key }}"
  dataFrom:
    - extract:
        key: omlx
