---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name blackbox-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: blackbox-exporter

  values:
    fullnameOverride: *name
    image:
      registry: quay.io
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - HTTP/1.1
              - HTTP/2.0
            follow_redirects: true
            preferred_ip_protocol: ip4
        icmp:
          prober: icmp
          timeout: 5s
          icmp:
            preferred_ip_protocol: ip4
        tcp_connect:
          prober: tcp
          timeout: 5s
          tcp:
            preferred_ip_protocol: ip4
        # MacStudio (oMLX) per-model L7 probes: direct to the host, bypassing
        # agentgateway (gateway health is covered by pod monitoring; these
        # catch Mac down / model unloaded, the hindsight-crashloop failure mode)
        studio_embedding:
          prober: http
          timeout: 15s
          http:
            method: POST
            headers:
              Content-Type: application/json
            body: '{"model":"qwen3-embedding-4b","input":"probe"}'
            valid_http_versions:
              - HTTP/1.1
            preferred_ip_protocol: ip4
            fail_if_body_not_matches_regexp:
              - '"embedding"'
        studio_rerank:
          prober: http
          timeout: 15s
          http:
            method: POST
            headers:
              Content-Type: application/json
            body: '{"model":"qwen3-reranker-0.6b","query":"probe","documents":["alpha","beta"]}'
            valid_http_versions:
              - HTTP/1.1
            preferred_ip_protocol: ip4
            fail_if_body_not_matches_regexp:
              - '"results"|"relevance"'
    prometheusRule:
      enabled: true
      rules:
        - alert: BlackboxProbeFailed
          # $labels.target does not exist on probe metrics (host is .instance);
          # macstudio lanes excluded: MacStudioModelServiceDown covers them
          # faster and model-aware (fires 5m vs 15m)
          expr: probe_success{service!="macstudio"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: |-
              The host {{ $labels.instance }} is currently unreachable
        # faster + model-specific companion to BlackboxProbeFailed (15m) for the
        # MacStudio lanes agents depend on (vmcp optimizer, hindsight).
        # NOTE: Prometheus annotation templates have no sprig `default` — the vm
        # operator silently drops rules that use it during VMRule conversion.
        - alert: MacStudioModelServiceDown
          expr: probe_success{service="macstudio"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: |-
              Mac Studio model service probe failing: {{ $labels.model }} {{ $labels.instance }} (5m).
              Dependents: vmcp optimizer (find_tool), hindsight embeddings/rerank.
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        add:
          - NET_RAW
    serviceMonitor:
      enabled: true
      defaults:
        interval: 1m
        scrapeTimeout: 10s
