---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name blackbox-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: blackbox-exporter

  values:
    fullnameOverride: *name
    image:
      registry: quay.io
    # studio-api-auth (oMLX key) for the direct-to-studio L7 probe modules
    extraVolumes:
      - name: studio-api-auth
        secret:
          secretName: studio-api-auth
    extraVolumeMounts:
      - name: studio-api-auth
        mountPath: /etc/blackbox/secrets
        readOnly: true
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - HTTP/1.1
              - HTTP/2.0
            follow_redirects: true
            preferred_ip_protocol: ip4
        icmp:
          prober: icmp
          timeout: 5s
          icmp:
            preferred_ip_protocol: ip4
        tcp_connect:
          prober: tcp
          timeout: 5s
          tcp:
            preferred_ip_protocol: ip4
        # MacStudio (oMLX) API-plane probe: GET /v1/models with the server
        # key, direct to the host (bypasses agentgateway on purpose — its
        # health is covered by pod monitoring). Per-model inference probes
        # were removed: oMLX auto-loads models and evicts KV on TTL, so
        # inference calls from monitoring would force reloads and flap on
        # evictions. The mounted secret feeds credentials_file.
        studio_api:
          prober: http
          timeout: 10s
          http:
            method: GET
            authorization:
              credentials_file: /etc/blackbox/secrets/Authorization
            valid_http_versions:
              - HTTP/1.1
            preferred_ip_protocol: ip4
            fail_if_body_not_matches_regexp:
              - '"id"'
    prometheusRule:
      enabled: true
      rules:
        - alert: BlackboxProbeFailed
          # $labels.target does not exist on probe metrics (host is .instance);
          # macstudio excluded: MacStudioApiDown covers it (fires 5m vs 15m)
          expr: probe_success{service!="macstudio"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: |-
              The host {{ $labels.instance }} is currently unreachable
        # faster companion to BlackboxProbeFailed (15m) for the studio API
        # surface every model consumer depends on (agentgateway LLM lanes,
        # vmcp optimizer, hindsight embeddings/rerank).
        # NOTE: Prometheus annotation templates have no sprig `default` — the vm
        # operator silently drops rules that use it during VMRule conversion.
        - alert: MacStudioApiDown
          expr: probe_success{service="macstudio"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: |-
              Mac Studio oMLX API probe failing: {{ $labels.instance }} (5m).
              Dependents: agentgateway LLM lanes, vmcp optimizer (find_tool), hindsight embeddings/rerank.
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        add:
          - NET_RAW
    serviceMonitor:
      enabled: true
      defaults:
        interval: 1m
        scrapeTimeout: 10s
