---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name apprise
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  # ref:https://github.com/adnanh/webhook
  # ref:https://github.com/caronc/apprise-api

  values:
    configMaps:
      config:
        enabled: true
        data:
          hooks.yaml: |
            - id: alertmanager
              execute-command: /config/alertmanager.sh
              command-working-directory: /config
              pass-arguments-to-command:
                - source: entire-payload
          # Alertmanager webhook -> Apprise API (stateless /notify)
          # -> feishu (primary) + pushover (fallback)
          # ref:https://appriseit.com/services/feishu/
          # ref:https://appriseit.com/services/pushover/
          alertmanager.sh: |
            #!/usr/bin/env bash
            set -Eeuo pipefail

            PAYLOAD=${1:?}

            function _jq() {
                jq --raw-output "${1:?}" <<<"${PAYLOAD}"
            }

            function notify() {
                local status firing_count alertname title body urls

                status=$(_jq '.status | ascii_upcase')
                firing_count=$(_jq '[.alerts[] | select(.status == "firing")] | length')
                alertname=$(_jq '.commonLabels.alertname // "Alertmanager"')

                if [[ "${status}" == "FIRING" ]]; then
                    title="[FIRING:${firing_count}] ${alertname}"
                else
                    title="[${status}] ${alertname}"
                fi

                body=$(_jq '[.alerts[] |
                    (.annotations.description // .annotations.summary // .annotations.message // "Alert description not available")
                    + "\n" + ([.labels | to_entries[] | "\(.key): \(.value)"] | join(", "))
                ] | join("\n---\n")')

                # pover body limit is 512/1024 chars, so truncate instead of passing upstream
                urls="feishu://${FEISHU_TOKEN:?}"
                if [[ "${status}" == "FIRING" ]]; then
                    urls="${urls} pover://${PUSHOVER_USER_KEY:?}@${PUSHOVER_TOKEN:?}?priority=1&sound=gamelan&overflow=truncate"
                else
                    urls="${urls} pover://${PUSHOVER_USER_KEY:?}@${PUSHOVER_TOKEN:?}?priority=0&overflow=truncate"
                fi

                jq --null-input \
                    --arg urls "${urls}" \
                    --arg title "${title}" \
                    --arg body "${body}" \
                    '{urls: $urls, title: $title, body: $body, type: "info", format: "text"}' \
                | curl -fsS --max-time 15 -X POST \
                    --header "Content-Type: application/json" \
                    --data-binary @- \
                    "http://localhost:8000/notify/"
            }

            function main() {
              notify
            }

            main "$@"

    defaultPodOptions:
      hostUsers: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/webhook
              tag: 2.8.2
            env:
              WEBHOOK__PORT: &port 9000
            envFrom:
              - secretRef:
                  name: *name
            resources: &resources
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
          apprise:
            image:
              repository: ghcr.io/caronc/apprise
              tag: v1.5.4
            env:
              APPRISE_STATEFUL_MODE: disabled
              APPRISE_CONFIG_LOCK: "y"
              APPRISE_ATTACH_SIZE: "0"
              APPRISE_WORKER_COUNT: "1"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status
                    port: 8000
              readiness: *probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
            securityContext: *securityContext

    service:
      app:
        ports:
          http:
            port: *port
            primary: true

    persistence:
      config:
        type: configMap
        identifier: config
        defaultMode: 0775
        globalMounts:
          - readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
