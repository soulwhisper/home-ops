---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name langfuse-worker
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18"
            envFrom:
              - secretRef:
                  name: langfuse-pguser
        containers:
          app:
            image:
              repository: ghcr.io/langfuse/langfuse-worker
              tag: 4.69.0
            env:
              REDIS_AUTH:
                valueFrom:
                  secretKeyRef:
                    name: langfuse-dragonfly
                    key: password
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: langfuse-pguser
                    key: uri
              # Full URL required (JS client new URL()); bare BUCKET_HOST 500s
              # S3 uploads. RGW in-cluster needs path style (no wildcard DNS).
              LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: &bucket_endpoint "http://rook-ceph-rgw-ceph-objectstore.storage-system.svc:80"
              LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: &bucket_path_style "true"
              LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: &bucket_access_key_id
                valueFrom:
                  secretKeyRef:
                    name: ceph-bucket-langfuse
                    key: AWS_ACCESS_KEY_ID
              LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY:
                &bucket_secret_access_key
                valueFrom:
                  secretKeyRef:
                    name: ceph-bucket-langfuse
                    key: AWS_SECRET_ACCESS_KEY
              LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: *bucket_endpoint
              LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: *bucket_path_style
              LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: *bucket_access_key_id
              LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: *bucket_secret_access_key
              LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: *bucket_endpoint
              LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: *bucket_path_style
              LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: *bucket_access_key_id
              LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: *bucket_secret_access_key
            envFrom:
              - configMapRef:
                  name: langfuse
              - secretRef:
                  name: langfuse
            resources:
              requests:
                cpu: "2"
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true

    service:
      app:
        ports:
          http:
            port: 3030

    persistence:
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
