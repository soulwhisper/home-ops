---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./grafanafolder.yaml
  - ./grafanadashboard.yaml
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: "disabled"
  # grafana-operator resolves configMapRef by exact name; hash suffix breaks the lookup
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/managed-by: "grafana-operator"
configMapGenerator:
  - name: dashboard-ceph-cluster
    files:
      - ceph-cluster.json=../_sources/ceph/ceph-cluster/dashboard.json
  - name: dashboard-ceph-osd
    files:
      - ceph-osd.json=../_sources/ceph/ceph-osd/dashboard.json
  - name: dashboard-ceph-pools
    files:
      - ceph-pools.json=../_sources/ceph/ceph-pools/dashboard.json
