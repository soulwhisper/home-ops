---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./grafanafolder.yaml
  - ./grafanadashboard.yaml
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: "disabled"
  # grafana-operator resolves configMapRef by exact name; hash suffix breaks the lookup
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/managed-by: "grafana-operator"
configMapGenerator:
  - name: dashboard-k8s-system-api-server
    files:
      - k8s-system-api-server.json=../_sources/kubernetes/k8s-system-api-server/download
  - name: dashboard-blackbox-exporter
    files:
      - blackbox-exporter.json=../_sources/devices/blackbox-exporter/download
  - name: dashboard-envoy-proxy-global
    files:
      - envoy-proxy-global.json=../_sources/envoy/gateway/charts/gateway-addons-helm/dashboards/envoy-proxy-global.json
  - name: dashboard-kopiur-slo
    files:
      - kopiur-slo.json=../custom/kopiur-slo.json
