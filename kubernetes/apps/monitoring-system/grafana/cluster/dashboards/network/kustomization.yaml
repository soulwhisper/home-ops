---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./grafanafolder.yaml
  - ./grafanadashboard.yaml
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: "disabled"
  # grafana-operator resolves configMapRef by exact name; hash suffix breaks the lookup
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/managed-by: "grafana-operator"
configMapGenerator:
  - name: dashboard-kgateway
    files:
      - kgateway.json=../_sources/kgateway/install/helm/kgateway-dashboards/dashboards/kgateway.json
  - name: dashboard-cilium-agent
    files:
      - cilium-agent.json=../_sources/cilium/install/kubernetes/cilium/files/cilium-agent/dashboards/cilium-dashboard.json
