---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name etcd
spec:
  staticConfigs:
    - targets:
        - exarch-01.homelab.internal:2381
        - exarch-02.homelab.internal:2381
        - exarch-03.homelab.internal:2381
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name zot
spec:
  staticConfigs:
    - targets:
        - nas.homelab.internal:9002
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name chrony
spec:
  staticConfigs:
    - targets:
        - 10.10.0.254:80
  metricsPath: /cgi-bin/chrony
  scrapeInterval: 60s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      sourceLabels: [__address__]
      targetLabel: instance
      replacement: router.homelab.internal
