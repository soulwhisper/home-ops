---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name etcd
spec:
  staticConfigs:
    - targets:
        - exarch-01.homelab.internal:2381
        - exarch-02.homelab.internal:2381
        - exarch-03.homelab.internal:2381
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name zot
spec:
  staticConfigs:
    - targets:
        - nas.homelab.internal:9002
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/monitoring.coreos.com/scrapeconfig_v1alpha1.json
# nix-dev (corp VM, offsite backup target) node exporter via easytier mesh.
# Depends on nix-config: modules.services.exporters.enable on nix-dev.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name nix-dev
spec:
  staticConfigs:
    - targets:
        - 172.19.82.10:9101
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
