---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: k8s-rules
spec:
  groups:
    - name: k8s.rules
      rules:
        - alert: HighContainerNonZeroExits
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} repeatedly exits with code {{ $labels.exit_code }}"
          expr: |
            sum by (namespace, pod, container, exit_code) (
              increase(terminated_containers_total{exit_code!="0"}[15m])
            ) > 5
          for: 10m
          labels:
            severity: critical
        # KubePodCrashLooping only sees CrashLoopBackOff; a control-plane stall
        # instead restarts many leader-election controllers once each
        # (2026-10-08 18:20Z / 10-09 00:16Z: ~20 pods, "leader election lost").
        # Node reboots are excluded; they legitimately restart everything.
        - alert: PodRestartStorm
          annotations:
            summary: "{{ $value }} pods restarted within 15m (not caused by a node reboot)"
            description: >-
              Correlated restarts usually mean apiserver/etcd stalls (leader
              election lost). Check etcd WAL fsync latency, leader changes and
              system-disk utilisation for the same window.
          expr: |
            (
              count(count by (namespace, pod) (increase(kube_pod_container_status_restarts_total[15m]) > 0)) >= 5
            ) unless on () (min(time() - node_boot_time_seconds) < 1800)
          labels:
            severity: warning
        # etcdHighFsyncDurations needs 10m above 0.5s; the incident spikes were
        # ~5m at 1.4-1.8s and still cost leadership.
        - alert: EtcdFsyncLatencySpike
          annotations:
            summary: "etcd {{ $labels.instance }} WAL fsync p99 {{ $value | humanizeDuration }}"
            description: >-
              Short fsync stalls on the shared system NVMe cause leader changes.
              Look for concurrent image pulls or other EPHEMERAL writes.
          expr: |
            histogram_quantile(0.99, sum by (instance, le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket[2m]))) > 0.5
          for: 2m
          labels:
            severity: warning
        - alert: HolmesHealthCheckFailed
          annotations:
            summary: "Holmes health check {{ $labels.name }} last result: {{ $labels.result }}"
            description: >-
              Read the finding in the CR status:
              kubectl -n {{ $labels.exported_namespace }} get scheduledhealthcheck {{ $labels.name }} -o jsonpath='{.status.history[0].message}'
          expr: |
            max by (exported_namespace, name, result) (holmes_scheduledhealthcheck_last_result{result=~"fail|error"}) == 1
          for: 10m
          labels:
            severity: warning
    - name: platform.rules
      rules:
        # upstream rule, VictoriaMetrics v1.151 (alerts-health.yml)
        - alert: UncleanShutdown
          expr: vm_app_prev_shutdown_unclean == 1 and time() - vm_app_start_timestamp < 600
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.job }} on {{ $labels.instance }} started after an unclean shutdown"
            description: "Previous run did not shut down cleanly. Check logs for OOM/SIGKILL/host failure. Stops firing 10m after startup. https://github.com/VictoriaMetrics/VictoriaMetrics/issues/8443"
        # Cilium 1.20 configmap drift detection
        - alert: CiliumConfigMapDrift
          expr: cilium_drift_checker_config_delta > 0
          for: 15m
          labels:
            severity: info
          annotations:
            summary: "Cilium agent {{ $labels.instance }} has unapplied ConfigMap changes"
            description: "The agent is running with settings older than the current ConfigMap and needs a restart. https://docs.cilium.io/en/stable/configuration/configmap-drift-detection/"
