---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.kgateway.dev/trafficpolicy_v1alpha1.json
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: victoria-metrics-auth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: vmsingle-victoria-metrics-cluster
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: vmalertmanager-victoria-metrics-cluster
  extAuth:
    extensionRef:
      name: authentik-ext-auth
      namespace: networking-system
  transformation:
    request:
      dynamicMetadata:
        - namespace: kgateway.auth
          key: username
          value:
            stringValue: '{{ header("x-authentik-username") }}'
        - namespace: kgateway.auth
          key: groups
          value:
            stringValue: '{{ header("x-authentik-groups") }}'
