---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name opentelemetry-collector
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: opentelemetry-collector

  values:
    fullnameOverride: *name
    mode: deployment
    replicaCount: 2
    clusterRole:
      rules:
        - apiGroups: [events.k8s.io]
          resources: [events]
          verbs: [get, list, watch]
    image:
      repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
    command:
      name: "otelcol-k8s"
    useGOMEMLIMIT: true
    resources:
      requests: { cpu: 10m, memory: 512Mi }
      limits: { memory: 1Gi }
    serviceMonitor:
      enabled: true
    service:
      enabled: true
      type: ClusterIP
      trafficDistribution: PreferSameZone
    presets:
      kubernetesAttributes:
        enabled: true
    ports:
      otlp:
        enabled: true
        containerPort: 4317
        servicePort: 4317
        hostPort: null
        protocol: TCP
        appProtocol: grpc
      otlp-http:
        enabled: true
        containerPort: 4318
        servicePort: 4318
        hostPort: null
        protocol: TCP
      jaeger-compact: { enabled: false }
      jaeger-thrift: { enabled: false }
      jaeger-grpc: { enabled: false }
      zipkin: { enabled: false }
      metrics:
        enabled: true
        containerPort: 8888
        servicePort: 8888
        protocol: TCP
    alternateConfig:
      extensions:
        health_check:
          endpoint: 0.0.0.0:13133
        k8s_leader_elector/policy-events:
          auth_type: serviceAccount
          lease_name: opentelemetry-policy-events
          lease_namespace: monitoring-system
      receivers:
        k8s_objects:
          auth_type: serviceAccount
          k8s_leader_elector: k8s_leader_elector/policy-events
          # Recover still-live events after collector restarts; query event UID
          # and event/series timestamps, not raw delivery counts.
          include_initial_state: true
          objects:
            - name: events
              mode: watch
              group: events.k8s.io
              field_selector: reason=PolicyViolation
              exclude_watch_type: [DELETED]
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      processors:
        memory_limiter:
          check_interval: 1s
          limit_percentage: 80
          spike_limit_percentage: 25
        redaction/credentials:
          allow_all_keys: true
          blocked_values:
            - "ghp_[A-Za-z0-9]{36}"
            - "github_pat_[A-Za-z0-9_]{22,}"
            - "AKIA[0-9A-Z]{16}"
            - "eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]+" # JWT
            - "op://[^\\s\"']+" # 1Password
            - "-----BEGIN [A-Z ]*PRIVATE KEY-----"
            - "(?i)bearer +[a-z0-9._\\-]{20,}"
          summary: info
        filter/noise:
          error_mode: ignore
          traces:
            span:
              # Drop successful connection and health spans only. The ping
              # chain carries mcp.method.name on every span, so a normal
              # chain disappears without orphans; spans with an error status
              # or error attribute are kept. Discovery methods (tools/list,
              # resources/list, prompts/list) stay unfiltered because
              # ToolHive can return JSON-RPC errors with HTTP 200 and no error
              # attribute. GET /mcp is a connection parent and is only
              # subject to sampling.
              - 'attributes["mcp.method.name"] == "ping" and status.code != STATUS_CODE_ERROR and attributes["error"] != "true"'
              - 'name == "connect" and status.code != STATUS_CODE_ERROR and attributes["error"] != "true"'
              - 'IsMatch(name, "^GET /(healthz|readyz|livez)$") and status.code != STATUS_CODE_ERROR and attributes["error"] != "true"'
        tail_sampling:
          decision_wait: 10s
          policies:
            # Keep failures, model calls, and tool execution; sample the rest.
            # There is no global latency policy: a 300s SSE connection
            # lifetime is not request latency and must not force-retain every
            # connection trace.
            - name: errors-policy
              type: status_code
              status_code: { status_codes: [ERROR] }
            - name: genai-policy
              type: string_attribute
              string_attribute:
                key: gen_ai.operation.name
                values: [chat]
            - name: tools-call-policy
              type: string_attribute
              string_attribute:
                key: mcp.method.name
                values: [tools/call]
            - name: probability-policy
              type: probabilistic
              probabilistic: { sampling_percentage: 10 }
        batch:
          send_batch_size: 1024
          send_batch_max_size: 2048
          timeout: 1s
      exporters:
        otlp_http/policy-events:
          logs_endpoint: http://victoria-logs-server.monitoring-system.svc.cluster.local:9428/insert/opentelemetry/v1/logs
          headers:
            # k8s_objects watch mode wraps the event as {type, object}; the
            # event itself (with `note`) is nested under body.object
            VL-Msg-Field: body.object.note
          sending_queue:
            enabled: true
            queue_size: 1000
          retry_on_failure:
            enabled: true
            max_elapsed_time: 300s
        otlp_http/victoria-traces:
          endpoint: "http://victoria-traces.monitoring-system.svc.cluster.local:10428/insert/opentelemetry"
          tls:
            insecure: true
          sending_queue:
            enabled: true
            num_consumers: 10
            queue_size: 5000
          retry_on_failure:
            enabled: true
            initial_interval: 5s
            max_interval: 30s
            max_elapsed_time: 300s
      service:
        extensions: [health_check, k8s_leader_elector/policy-events]
        telemetry:
          metrics:
            readers:
              - pull:
                  exporter:
                    prometheus:
                      host: 0.0.0.0
                      port: 8888
          logs:
            level: warn
            encoding: json
        pipelines:
          logs:
            receivers: [k8s_objects]
            processors: [memory_limiter, redaction/credentials, batch]
            exporters: [otlp_http/policy-events]
          traces/app:
            receivers: [otlp]
            processors:
              - memory_limiter
              - k8sattributes
              - filter/noise
              - tail_sampling
              - batch
            exporters: [otlp_http/victoria-traces]
