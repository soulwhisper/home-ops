---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# Project API keypair for the collector -> langfuse OTLP leg
# (otlp_http/langfuse exporter). Lives in the 1Password `langfuse` item as
# `otel_public_key`/`otel_secret_key` (langfuse project keys are UI-created;
# the init bootstrap auto-generates them per the worker externalsecret note).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name langfuse-otel
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        LANGFUSE_PUBLIC_KEY: "{{ .otel_public_key }}"
        LANGFUSE_SECRET_KEY: "{{ .otel_secret_key }}"
  dataFrom:
    - extract:
        key: langfuse
