---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# Project API keypair for the collector -> langfuse OTLP leg
# (otlp_http/langfuse exporter). Reuses the existing langfuse 1Password
# item's project keys (created in the Langfuse UI; same "Default" project).
# If these ever rotate to a dedicated "otel-collector" keypair, only the
# property names below change.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name langfuse-otel
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        LANGFUSE_PUBLIC_KEY: "{{ .onyx_public_key }}"
        LANGFUSE_SECRET_KEY: "{{ .onyx_secret_key }}"
  dataFrom:
    - extract:
        key: langfuse
