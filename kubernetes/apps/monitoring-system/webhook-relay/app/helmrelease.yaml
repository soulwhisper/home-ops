---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name webhook-relay
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  # Central inbound webhook collector: receives cluster webhooks and relays
  # to notification channels. Hooks live in the config ConfigMap; add a new
  # hook id + script there to onboard a new webhook source.
  # ref:https://github.com/adnanh/webhook

  values:
    defaultPodOptions:
      hostUsers: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/webhook
              tag: 2.8.2
            env:
              WEBHOOK__PORT: &port 9000
            envFrom:
              - secretRef:
                  name: *name
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true

    service:
      app:
        ports:
          http:
            port: *port
            primary: true

    persistence:
      config:
        type: configMap
        name: *name
        defaultMode: 0775
        globalMounts:
          - readOnly: true
