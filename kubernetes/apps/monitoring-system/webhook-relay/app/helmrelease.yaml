---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name webhook-relay
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  # Central inbound webhook collector: receives cluster webhooks and relays
  # to notification targets. Routes/targets live in the config ConfigMap;
  # add a new route there to onboard a new webhook source.
  # ref:https://github.com/home-operations/chaski

  values:
    defaultPodOptions:
      hostUsers: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/chaski
              tag: 0.5.1
            env:
              CHASKI_CONFIG: /config/chaski.yaml
              CHASKI_PORT: &port 8080
            envFrom:
              - secretRef:
                  name: *name
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
              readiness: *probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      config:
        type: configMap
        name: *name
        defaultMode: 0775
        globalMounts:
          - readOnly: true
