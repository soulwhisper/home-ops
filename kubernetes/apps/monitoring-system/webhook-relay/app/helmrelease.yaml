---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name webhook-relay
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  # Central inbound webhook collector: receives cluster webhooks and relays
  # to notification targets. Routes/targets live in the config ConfigMap;
  # add a new route there to onboard a new webhook source.
  # ref:https://github.com/home-operations/chaski

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
    controllers:
      *name :
        # A second live consumer could race the repo-backed check/create.
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/chaski
              tag: 0.5.1
            env:
              CHASKI_CONFIG: /config/chaski.yaml
              CHASKI_PORT: &port 8080
              FEISHU_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: *name
                    key: FEISHU_TOKEN
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
              readiness: *probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
          tickets:
            image:
              repository: docker.io/library/python
              tag: 3.14.5-alpine3.22
            command: ["python3", "-B", "/tickets/ticket_consumer.py"]
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/healthz"]
                  timeoutSeconds: 2
                  periodSeconds: 10
            env:
              # TLS via the internal gateway (forgejo-proxy, git.noirprime.com
              # -> nas:9003); direct nas.homelab.internal:9003 stays as the
              # documented fallback if the gateway is down
              FORGEJO_REPO_URL: https://git.noirprime.com/api/v1/repos/soulwhisper/homelab-tickets
              # New/reopened incidents get one Holmes investigation comment.
              # /api/chat is the only investigation API in holmes 0.42 (the
              # Robusta ask_holmes action posts to the removed /api/investigate).
              HOLMES_URL: http://robusta-holmes.monitoring-system.svc.cluster.local:80
              FORGEJO_TICKETS_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: *name
                    key: FORGEJO_TICKETS_TOKEN
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              # 128Mi was OOMKilled by unbounded Holmes /api/chat reads
              # (homelab-tickets#54/#55); read is now capped at 2 MiB in
              # ticket_consumer.py, so 256Mi is generous headroom over the
              # observed ~16-22Mi steady state + issue/comment pagination.
              limits: { memory: 256Mi }
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    service:
      app:
        ports:
          http:
            port: *port
          metrics:
            port: 8081
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
            path: /metrics
            interval: 1m

    persistence:
      config:
        type: configMap
        name: *name
        defaultMode: 0775
        globalMounts:
          - readOnly: true
      tickets:
        type: configMap
        name: webhook-relay-tickets
        advancedMounts:
          webhook-relay:
            tickets:
              - path: /tickets
                readOnly: true
