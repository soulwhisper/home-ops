---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name webhook-relay
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  # Central inbound webhook collector: receives cluster webhooks and relays
  # to notification targets. Routes/targets live in the config ConfigMap;
  # add a new route there to onboard a new webhook source.
  # ref:https://github.com/home-operations/chaski

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
    controllers:
      *name :
        # A second live consumer could race the repo-backed check/create.
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/chaski
              tag: 0.5.1
            env:
              CHASKI_CONFIG: /config/chaski.yaml
              CHASKI_PORT: &port 8080
              FEISHU_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: *name
                    key: FEISHU_TOKEN
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
              readiness: *probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
          tickets:
            image:
              repository: docker.io/library/python
              tag: 3.13.9-alpine3.22
            command: ["python3", "-B", "/tickets/ticket_consumer.py"]
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/healthz"]
                  timeoutSeconds: 2
                  periodSeconds: 10
            env:
              FORGEJO_REPO_URL: http://nas.homelab.internal:9003/api/v1/repos/soulwhisper/homelab-tickets
              FORGEJO_TICKETS_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: *name
                    key: FORGEJO_TICKETS_TOKEN
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { memory: 128Mi }
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      config:
        type: configMap
        name: *name
        defaultMode: 0775
        globalMounts:
          - readOnly: true
      tickets:
        type: configMap
        name: webhook-relay-tickets
        advancedMounts:
          webhook-relay:
            tickets:
              - path: /tickets
                readOnly: true
