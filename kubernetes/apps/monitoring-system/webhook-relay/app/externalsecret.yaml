---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: webhook-relay
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # alertbot_webhook is the full bot URL; apprise feishu:// takes only the token (last path segment)
        FEISHU_TOKEN: "{{ .alertbot_webhook | trimSuffix \"/\" | regexFind \"[^/]+$\" }}"
        PUSHOVER_TOKEN: "{{ .pushover_token }}"
        PUSHOVER_USER_KEY: "{{ .pushover_key }}"
        # forgejo `pat_tickets` field — the single PAT for all Forgejo
        # automation (issues write on homelab-tickets)
        FORGEJO_TICKETS_TOKEN: "{{ .pat_tickets }}"
        # shared secret gating /hooks/robusta-tickets (item `robusta`)
        ROBUSTA_TICKETS_SECRET: "{{ .tickets_relay_secret }}"
  dataFrom:
    - extract:
        key: feishu
    - extract:
        key: pushover
    - extract:
        key: forgejo
    - extract:
        key: robusta
