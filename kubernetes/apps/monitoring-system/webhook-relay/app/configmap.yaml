---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-relay
data:
  # Central inbound webhook collector: add a target + route here to onboard a
  # new webhook source. Validate offline: chaski validate -c chaski.yaml
  # ref:https://github.com/home-operations/chaski
  chaski.yaml: |
    targets:
      feishu:
        apprise:
          url: 'feishu://{{ env "FEISHU_TOKEN" }}'
      # Serialized, repo-backed dedupe: chaski sends findings to the local
      # consumer; only that consumer holds the Forgejo PAT and calls the NAS.
      # NAS HTTP is an accepted wired-LAN risk, not transport encryption.
      forgejo-tickets:
        http:
          url: http://127.0.0.1:8082/findings
          timeout: 120s
          headers:
            Content-Type: application/json

    routes:
      # Alertmanager -> feishu
      alertmanager:
        target:
          - feishu
        title: '[{{ .payload.status | toUpper }}{{ if eq .payload.status "firing" }}:{{ len .payload.alerts }}{{ end }}] {{ .payload.commonLabels.alertname | default "Alertmanager" }}'
        # Per alert: description/summary plus curated context labels only —
        # dumping .labels produced a ~20-line wall per alert in feishu
        # (endpoint/job/oid/prometheus/exporter noise). kube-state-metrics
        # alerts carry the resource ns in exported_namespace (namespace is the
        # exporter's); direct-scrape alerts keep it in namespace.
        message: |-
          {{- range $i, $a := .payload.alerts }}{{ if $i }}
          ---
          {{ end }}{{ $a.annotations.description | default ($a.annotations.summary | default ($a.annotations.message | default "Alert description not available")) }}
          severity: {{ $a.labels.severity | default "unknown" }}
          {{- with ($a.labels.exported_namespace | default $a.labels.namespace) }}
          namespace: {{ . }}
          {{- end }}
          {{- with $a.labels.name }}
          resource: {{ . }}
          {{- end }}
          {{- with $a.labels.pod }}
          pod: {{ . }}
          {{- end }}
          {{- with $a.labels.container }}
          container: {{ . }}
          {{- end }}
          {{- with $a.labels.kubernetes_node }}
          node: {{ . }}
          {{- end }}
          {{- end }}
      # Robusta runner -> feishu (enriched alerts + findings)
      robusta:
        target:
          - feishu
        title: '[{{ .payload.severity | default "info" | toUpper }}] {{ .payload.title | default "robusta" }}'
        # enrichments carry the actual enrichment blocks (markdown/header text,
        # list items, json); absent when the sink's size_limit trims them
        message: |-
          {{ .payload.description | default (.payload.message | default "") }}
          {{- range $e := .payload.enrichments }}
          {{- range $b := $e.blocks }}
          {{- if $b.text }}
          {{ $b.text }}
          {{- else if $b.items }}
          {{- range $b.items }}
          - {{ . }}
          {{- end }}
          {{- else if $b.json_str }}
          {{ $b.json_str }}
          {{- end }}
          {{- end }}
          {{- end }}
      # Robusta runner -> local ticket consumer. Exact retries are suppressed;
      # changed findings append to the same source/aggregation_key incident.
      # Access is enforced by network identity: the relay ingress CNP admits
      # this path only from robusta pods.
      robusta-tickets:
        whenExpr: 'payload.severity in ["MEDIUM", "HIGH"]'
        target:
          - forgejo-tickets
        message: '{{ .payload | toJSON }}'
      # authentik system notifications (blueprints/core/notifications.yaml)
      authentik:
        target:
          - feishu
        title: '[authentik:{{ .payload.severity | toUpper }}]'
        message: '{{ .payload.body }}'
