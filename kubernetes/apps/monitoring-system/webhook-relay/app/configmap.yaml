---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-relay
data:
  # Central inbound webhook collector: add a target + route here to onboard a
  # new webhook source. Validate offline: chaski validate -c chaski.yaml
  # ref:https://github.com/home-operations/chaski
  chaski.yaml: |
    targets:
      feishu:
        apprise:
          url: 'feishu://{{ env "FEISHU_TOKEN" }}'
      # pushover: disabled 2026-09-26 — feishu proved sufficient; re-enable by
      # uncommenting here, in the alertmanager route target list, and params.
      # pushover:
      #   apprise:
      #     url: 'pover://{{ env "PUSHOVER_USER_KEY" }}@{{ env "PUSHOVER_TOKEN" }}'
      # ai-ops ticket fan-out: Forgejo homelab-tickets issues (create via REST;
      # token from FORGEJO_TICKETS_TOKEN, see externalsecret prerequisite).
      # Cleartext HTTP to the NAS is an accepted risk: wired VLAN 100 LAN only,
      # same posture as mcp-forgejo/NFS/RGW; TLS termination on Forgejo is a
      # NAS-side follow-up. Duplicate sources by design: alertmanager
      # repeat_interval (12h) re-notifies and chaski retries after 5xx —
      # consumer-side merge on aggregation_key handles both until a stateful
      # create-or-comment consumer replaces this route.
      forgejo-tickets:
        http:
          url: http://nas.homelab.internal:9003/api/v1/repos/soulwhisper/homelab-tickets/issues
          headers:
            Authorization: 'token {{ env "FORGEJO_TICKETS_TOKEN" }}'
            Content-Type: application/json

    routes:
      # Alertmanager -> feishu
      alertmanager:
        target:
          - feishu
          # - pushover
        title: '[{{ .payload.status | toUpper }}{{ if eq .payload.status "firing" }}:{{ len .payload.alerts }}{{ end }}] {{ .payload.commonLabels.alertname | default "Alertmanager" }}'
        # Per alert: description/summary plus curated context labels only —
        # dumping .labels produced a ~20-line wall per alert in feishu
        # (endpoint/job/oid/prometheus/exporter noise). kube-state-metrics
        # alerts carry the resource ns in exported_namespace (namespace is the
        # exporter's); direct-scrape alerts keep it in namespace.
        message: |-
          {{- range $i, $a := .payload.alerts }}{{ if $i }}
          ---
          {{ end }}{{ $a.annotations.description | default ($a.annotations.summary | default ($a.annotations.message | default "Alert description not available")) }}
          severity: {{ $a.labels.severity | default "unknown" }}
          {{- with ($a.labels.exported_namespace | default $a.labels.namespace) }}
          namespace: {{ . }}
          {{- end }}
          {{- with $a.labels.name }}
          resource: {{ . }}
          {{- end }}
          {{- with $a.labels.pod }}
          pod: {{ . }}
          {{- end }}
          {{- with $a.labels.container }}
          container: {{ . }}
          {{- end }}
          {{- with $a.labels.kubernetes_node }}
          node: {{ . }}
          {{- end }}
          {{- end }}
        # params were pushover-only (priority/sound); feishu ignores unknown
        # query keys. Uncomment with the pushover target if re-enabled.
        # params:
        #   priority: '{{ ternary "1" "0" (eq .payload.status "firing") }}'
        #   sound: gamelan
      # Robusta runner -> feishu (enriched alerts + findings)
      robusta:
        target:
          - feishu
        title: '[{{ .payload.severity | default "info" | toUpper }}] {{ .payload.title | default "robusta" }}'
        # enrichments carry the actual enrichment blocks (markdown/header text,
        # list items, json); absent when the sink's size_limit trims them
        message: |-
          {{ .payload.description | default (.payload.message | default "") }}
          {{- range $e := .payload.enrichments }}
          {{- range $b := $e.blocks }}
          {{- if $b.text }}
          {{ $b.text }}
          {{- else if $b.items }}
          {{- range $b.items }}
          - {{ . }}
          {{- end }}
          {{- else if $b.json_str }}
          {{ $b.json_str }}
          {{- end }}
          {{- end }}
          {{- end }}
      # Robusta runner -> Forgejo homelab-tickets (fed by the second sink at
      # /hooks/robusta-tickets). Ticket floor MEDIUM+; Forgejo has no
      # idempotency, so dedupe on aggregation_key is the consumer's (omp) job.
      # verify.token: this route spends the relay's Forgejo PAT — only the
      # robusta runner (sink authorization header) may trigger it.
      robusta-tickets:
        whenExpr: 'payload.severity in ["MEDIUM", "HIGH"]'
        verify:
          token:
            header: Authorization
            secret: '{{ env "ROBUSTA_TICKETS_SECRET" }}'
        target:
          - forgejo-tickets
        message: |-
          {{- $sev := .payload.severity | default "INFO" -}}
          {{- $sub := .payload.subject | default dict -}}
          {{- $title := printf "[%s] %s" $sev (.payload.title | default "robusta finding") -}}
          {{- $body := printf "**Source:** %s | **Aggregation key:** `%s` | **Fingerprint:** `%s`\n**Subject:** %s `%s` (ns `%s`)\n\n%s"
                (.payload.source | default "unknown")
                (.payload.aggregation_key | default "n/a")
                (.payload.fingerprint | default "n/a")
                ($sub.kind | default "?") ($sub.name | default "?") ($sub.namespace | default "-")
                (.payload.description | default "no description") -}}
          {{ dict "title" $title "body" $body | toJSON }}
      # authentik system notifications (blueprints/core/notifications.yaml)
      authentik:
        target:
          - feishu
        title: '[authentik:{{ .payload.severity | toUpper }}]'
        message: '{{ .payload.body }}'
