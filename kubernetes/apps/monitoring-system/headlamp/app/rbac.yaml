---
# pod SA: in-cluster bootstrap only (bound to `view`, no secrets).
# The long-lived SA-token Secret and token login were removed — OIDC only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: headlamp-admin
    namespace: monitoring-system
---
# Read-only wildcard for OIDC humans: covers current AND future CRDs, so new
# installs stop surfacing as per-CRD "forbidden" errors. Includes secrets —
# accepted: homelab-admin already holds cluster-admin via kubectl, and the
# leak-prone path (non-expiring SA token in pod/browser localStorage) was
# deleted instead of granting secrets to it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-readall
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  # new name: roleRef is immutable, so the old view-bound binding is replaced
  name: headlamp-oidc-readall
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-readall
subjects:
  - kind: Group
    name: homelab-admin
