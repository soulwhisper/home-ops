---
# Suppress pod-level alerts for mcp-firecrawl while its image rejects the
# MCP revision sent by ToolHive. Remove when the image supports it.
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: mcp-firecrawl-protocol-mismatch
  namespace: monitoring-system
spec:
  matchers:
    - name: namespace
      value: servitor-apps
    - name: pod
      matchType: =~
      value: mcp-firecrawl.*
