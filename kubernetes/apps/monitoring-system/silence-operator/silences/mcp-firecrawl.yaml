---
# ToolHive's streamable-HTTP proxy (v0.55.2) sends MCP protocol 2026-07-28;
# the Firecrawl MCP server image v3.33.4 bundles mcp-proxy 6.5.1, which only
# supports up to 2025-11-25. The server logs "Unsupported protocol version"
# every 10s (no alert currently matches). Keep any pod-level alert for the
# server quiet until the image is rebuilt with mcp-proxy >= 6.7.21.
# Remove this file once the upstream fix is deployed.
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: mcp-firecrawl-protocol-mismatch
  namespace: monitoring-system
spec:
  matchers:
    - name: namespace
      value: servitor-apps
    - name: pod
      matchType: =~
      value: mcp-firecrawl.*
