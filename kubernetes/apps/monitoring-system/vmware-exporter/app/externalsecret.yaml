---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# 1Password item `esxi` (username/password of the read-only host account —
# created by hand on the ESXi host, see the PR summary steps). ExternalSecret
# will report a sync error until the item exists; expected.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmware-exporter
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        VSPHERE_USER: "{{ .username }}"
        VSPHERE_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: esxi
