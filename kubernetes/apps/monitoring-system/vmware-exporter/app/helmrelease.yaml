---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Scrapes the standalone ESXi host (10.0.0.10) over the SOAP SDK.
# Upstream project is dormant (v0.18.4, 2022-10) but the ESXi SOAP API is
# stable; telegraf inputs.vsphere is the maintained fallback if auth breaks.
# The ESXi account is created MANUALLY on the host (see PR/1Password `esxi`).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name vmware-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
    controllers:
      *name :
        containers:
          app:
            image:
              repository: pryorda/vmware_exporter
              # renovate: datasource=docker depName=pryorda/vmware_exporter
              tag: "v0.18.4"
            env:
              VSPHERE_HOST: 10.0.0.10
              VSPHERE_IGNORE_SSL: "1" # self-signed host cert
            envFrom:
              - secretRef:
                  name: *name
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
    service:
      app:
        ports:
          http:
            port: 9272
