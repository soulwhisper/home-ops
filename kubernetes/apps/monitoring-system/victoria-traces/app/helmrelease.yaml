---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name victoria-traces
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: victoria-traces-single

  values:
    global:
      image:
        registry: quay.io
    server:
      fullnameOverride: *name
      retentionPeriod: 14d
      # Same Talos SELinux fix as victoria-logs (see its helmrelease for the
      # full story): idempotent chcon to ephemeral_t at pod start.
      initContainers:
        - name: selinux-relabel
          image: ubuntu:24.04
          command:
            - sh
            - -eu
            - -c
            - |
              # Marker-file proof of a COMPLETED full walk; deleted BEFORE
              # each redo so a mid-walk failure can't leave a stale marker
              # (see victoria-logs helmrelease for the full failure mode).
              if [ "$(stat -c %C /storage)" != "system_u:object_r:ephemeral_t:s0" ] || [ ! -f /storage/.selinux-relabelled ]; then
                rm -f /storage/.selinux-relabelled
                chcon -R system_u:object_r:ephemeral_t:s0 /storage
                touch /storage/.selinux-relabelled
                echo "relabelled /storage"
              fi
          securityContext:
            runAsUser: 0
            runAsNonRoot: false  # overrides the pod-level runAsNonRoot
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"], add: ["FOWNER"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: server-volume, mountPath: /storage }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
      persistentVolume:
        enabled: true
        storageClassName: ceph-block
        size: 50Gi
      serviceMonitor:
        enabled: true
