---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: krr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    serviceAccount:
      krr:
        enabled: true
        forceRename: krr

    defaultPodOptions:
      # KRR reads the cluster with the krr ServiceAccount; the app-template
      # default is to not mount the token.
      automountServiceAccountToken: true

    controllers:
      krr:
        type: cronjob
        cronjob:
          schedule: "0 12 * * 1"
          timeZone: Asia/Shanghai
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 3600
          successfulJobsHistory: 3
          failedJobsHistory: 3
          activeDeadlineSeconds: 3600
          backoffLimit: 1
          ttlSecondsAfterFinished: 604800
        containers:
          krr:
            image:
              repository: robustadev/krr
              tag: v1.30.0
            command: ["python", "/scripts/krr_report.py"]
            env:
              - name: FORGEJO_REPO_URL
                value: "https://git.noirprime.com/api/v1/repos/soulwhisper/homelab-tickets"
              - name: PROMETHEUS_URL
                value: "http://vmsingle-victoria-metrics-cluster.monitoring-system.svc.cluster.local:8428"
              - name: KRR_NAMESPACES
                value: ".*-apps"
              - name: CLUSTER_NAME
                value: "main"
              - name: TZ
                value: "Asia/Shanghai"
              - name: FORGEJO_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: webhook-relay
                    key: FORGEJO_TICKETS_TOKEN
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: "1"
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              seccompProfile: { type: RuntimeDefault }

    persistence:
      scripts:
        type: configMap
        name: krr-report
        defaultMode: 0555
        globalMounts:
          - path: /scripts
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
