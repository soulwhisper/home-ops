---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &name flux-operator
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *name
  targetNamespace: gitops-system
  path: ./kubernetes/apps/gitops-system/flux-operator/app
  interval: 1h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: gitops-system
    namespace: gitops-system
  prune: false
  wait: true
