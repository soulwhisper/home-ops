---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name flux-instance
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: flux-instance

  values:
    instance:
      cluster:
        networkPolicy: false
      components:
        - source-controller
        - kustomize-controller
        - helm-controller
        - notification-controller
      sync:
        kind: GitRepository
        url: https://github.com/soulwhisper/home-ops.git
        ref: refs/heads/main
        path: kubernetes/flux/cluster
        interval: 30m
      commonMetadata:
        labels:
          app.kubernetes.io/name: flux
      kustomize:
        patches:

          # ------------------------------------------------
          # Reconciliation concurrency
          # ------------------------------------------------

          - target:
              kind: Deployment
              name: kustomize-controller
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --concurrent=4
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --interval-jitter-percentage=20
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=CancelHealthCheckOnNewRevision=true

          - target:
              kind: Deployment
              name: helm-controller
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --concurrent=2
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --interval-jitter-percentage=20
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=OOMWatch=true
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=DisableChartDigestTracking=true

          - target:
              kind: Deployment
              name: source-controller
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --concurrent=4
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --interval-jitter-percentage=20
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --helm-cache-max-size=10
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --helm-cache-ttl=60m
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --helm-cache-purge-interval=5m

          # ------------------------------------------------
          # Resources: source-controller
          # ------------------------------------------------

          - target:
              kind: Deployment
              name: source-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: source-controller
              spec:
                template:
                  spec:
                    containers:
                      - name: manager
                        resources:
                          requests:
                            cpu: 100m
                            memory: 256Mi
                          limits:
                            memory: 1Gi

          # ------------------------------------------------
          # Resources: kustomize-controller
          # ------------------------------------------------

          - target:
              kind: Deployment
              name: kustomize-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kustomize-controller
              spec:
                template:
                  spec:
                    containers:
                      - name: manager
                        resources:
                          requests:
                            cpu: 100m
                            memory: 256Mi
                          limits:
                            memory: 2Gi

          # ------------------------------------------------
          # Resources: helm-controller
          # ------------------------------------------------

          - target:
              kind: Deployment
              name: helm-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: helm-controller
              spec:
                template:
                  spec:
                    containers:
                      - name: manager
                        resources:
                          requests:
                            cpu: 100m
                            memory: 256Mi
                          limits:
                            memory: 2Gi

          # ------------------------------------------------
          # RAM-backed Kustomize temporary workspace
          # ------------------------------------------------

          - target:
              kind: Deployment
              name: kustomize-controller
            patch: |
              - op: replace
                path: /spec/template/spec/volumes/0
                value:
                  name: temp
                  emptyDir:
                    medium: Memory
                    sizeLimit: 512Mi
