---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux-instance-rules
spec:
  groups:
    - name: flux-instance.rules
      rules:
        - alert: FluxInstanceAbsent
          expr: absent(flux_instance_info{exported_namespace="gitops-system", name="flux"})
          for: 15m
          annotations:
            summary: Flux instance metric is missing
            description: |
              The flux_instance_info metric for the Flux instance in namespace {{ $labels.exported_namespace }} is not available.
          labels:
            severity: critical
        - alert: FluxInstanceNotReady
          expr: flux_instance_info{exported_namespace="gitops-system", name="flux", ready!="True"}
          for: 15m
          annotations:
            summary: Flux instance {{ $labels.name }} is not ready
            description: |
              The Flux instance in namespace {{ $labels.exported_namespace }} is not ready.
              Reason: {{ $labels.reason }}
          labels:
            severity: critical

        # 30m tolerates routine helm/kustomize upgrades (5-20m for
        # cnpg/monitoring charts) and transient etcd/tproxy blips; stuck
        # failures persist and still alert.
        - alert: HelmReleaseReconciliationFailure
          expr: |-
            gotk_resource_info{customresource_kind="HelmRelease", ready!="True"} == 1
          for: 30m
          annotations:
            summary: >-
              HelmRelease {{ $labels.name }} in {{ $labels.exported_namespace }} is not ready
          labels:
            severity: critical

        - alert: KustomizationReconciliationFailure
          expr: |-
            gotk_resource_info{customresource_kind="Kustomization", ready!="True"} == 1
          for: 1h
          annotations:
            summary: >-
              Kustomization {{ $labels.name }} in {{ $labels.exported_namespace }} is not ready
          labels:
            severity: critical
        # notification-controller Alert CRs send point-in-time events directly
        # to Alertmanager; kubernetes/components/namespace/alerts/alert.yaml
        # excludes only observed transient DNS/network messages. These rules
        # retain sustained coverage: source-controller retries usually self-heal
        # upstream-DNS blips in 3-5m (homelab-tickets#15-17), while 10m+
        # failures still page (#66/#67).
        - alert: FluxOCIRepositoryNotReady
          expr: |-
            gotk_resource_info{customresource_kind="OCIRepository", ready!="True"} == 1
          for: 10m
          annotations:
            summary: >-
              OCIRepository {{ $labels.name }} in {{ $labels.exported_namespace }} is not ready
            description: >-
              Persistent for 10m+ — beyond the self-heal window of transient
              registry/DNS blips. Check source-controller logs for the reason.
          labels:
            severity: critical
        - alert: FluxGitRepositoryNotReady
          expr: |-
            gotk_resource_info{customresource_kind="GitRepository", ready!="True"} == 1
          for: 10m
          annotations:
            summary: >-
              GitRepository {{ $labels.name }} in {{ $labels.exported_namespace }} is not ready
            description: >-
              Persistent for 10m+ — beyond the self-heal window of transient
              git/DNS blips. Check source-controller logs for the reason.
          labels:
            severity: critical
