---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux-instance-rules
spec:
  groups:
    - name: flux-instance.rules
      rules:
        - alert: FluxInstanceAbsent
          expr: absent(flux_instance_info{exported_namespace="gitops-system", name="flux"})
          for: 15m
          annotations:
            summary: Flux instance metric is missing
            description: |
              The flux_instance_info metric for the Flux instance in namespace {{ $labels.exported_namespace }} is not available.
          labels:
            severity: critical
        - alert: FluxInstanceNotReady
          expr: flux_instance_info{exported_namespace="gitops-system", name="flux", ready!="True"}
          for: 15m
          annotations:
            summary: Flux instance {{ $labels.name }} is not ready
            description: |
              The Flux instance in namespace {{ $labels.exported_namespace }} is not ready.
              Reason: {{ $labels.reason }}
          labels:
            severity: critical

        # for: 30m, was 5m: ready flips False for the whole duration of a
        # routine helm/kustomize upgrade (5-20m for cnpg/monitoring/immich
        # charts), so 5m fired on every renovate merge + transient etcd/tproxy
        # blips (342 transitions/3d). Real stuck failures (onyx, admission
        # rejections) persist way past 30m and still alert.
        - alert: HelmReleaseReconciliationFailure
          expr: |-
            gotk_resource_info{customresource_kind="HelmRelease", ready!="True"} == 1
          for: 30m
          annotations:
            summary: >-
              HelmRelease {{ $labels.name }} in {{ $labels.exported_namespace }} is not ready
          labels:
            severity: critical

        - alert: KustomizationReconciliationFailure
          expr: |-
            gotk_resource_info{customresource_kind="Kustomization", ready!="True"} == 1
          for: 30m
          annotations:
            summary: >-
              Kustomization {{ $labels.name }} in {{ $labels.exported_namespace }} is not ready
          labels:
            severity: critical
