---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=github-releases depName=siderolabs/talos
    version: v1.14.4

  # defaults
  maintenance:
    windows:
      # Sunday 01:00 - 05:00
      - start: "0 1 * * 0"
        duration: "4h"
        timezone: "Asia/Shanghai"
  parallelism: 1
  policy:
    force: false
    stage: false
    placement: soft
    rebootMode: powercycle
    waitForVolumeDetach: true
  healthChecks:
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      description: No backup snapshots actively running
      timeout: 10m
      expr: |-
        !(has(status.phase) && status.phase in ["Running", "Pending"])
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      name: storage-system
      namespace: storage-system
      description: Ceph cluster ready and healthy
      timeout: 10m
      expr: |-
        status.phase == "Ready" && status.ceph.health == "HEALTH_OK"
    - apiVersion: v1
      kind: Node
      description: All Kubernetes nodes ready
      timeout: 10m
      expr: |-
        status.conditions.exists(c, c.type == "Ready" && c.status == "True")
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: ClusterRepository
      name: nas
      description: Backup repository ready and reachable
      timeout: 10m
      expr: >-
        status.phase == "Ready" &&
        status.conditions.exists(c, c.type == "BackendReachable" && c.status == "True")
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: postgres
      namespace: database-system
      description: PostgreSQL instances ready
      timeout: 10m
      expr: |-
        status.readyInstances == status.instances && status.instances > 0
