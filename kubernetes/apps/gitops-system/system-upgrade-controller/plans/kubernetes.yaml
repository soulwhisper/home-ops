---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/tuppr.home-operations.com/kubernetesupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
spec:
  kubernetes:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
    version: v1.37.1

  # defaults
  maintenance:
    windows:
      # Monday 01:00 - 05:00
      - start: "0 1 * * 1"
        duration: "4h"
        timezone: "Asia/Shanghai"
  healthChecks:
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      description: No backup snapshots actively running
      timeout: 10m
      expr: |-
        !(has(status.phase) && status.phase in ["Running", "Pending"])
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      name: storage-system
      namespace: storage-system
      description: Ceph cluster ready and healthy
      timeout: 10m
      expr: |-
        status.phase == "Ready" && status.ceph.health == "HEALTH_OK"
    - apiVersion: v1
      kind: Node
      description: All Kubernetes nodes ready
      timeout: 10m
      expr: |-
        status.conditions.exists(c, c.type == "Ready" && c.status == "True")
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: ClusterRepository
      name: nas
      description: Backup repository ready and reachable
      timeout: 10m
      expr: >-
        status.phase == "Ready" &&
        status.conditions.exists(c, c.type == "BackendReachable" && c.status == "True")
