---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name system-upgrade-controller
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: tuppr

  values:
    fullnameOverride: *name
    replicaCount: 2
    controller:
      logLevel: info
    monitoring:
      serviceMonitor:
        enabled: true
    prometheusRule:
      enabled: true
