---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# Offsite S3 credentials for nix-dev versitygw (corp VM, 172.19.82.10:9000).
# RepositoryReplication movers run in this namespace and read the secret by
# the name the destination's auth.secretRef references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name kopiur-offsite
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-offsite-secret
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .admin_user }}"
        AWS_SECRET_ACCESS_KEY: "{{ .admin_pass }}"
  dataFrom:
    - extract:
        key: nix-dev-versitygw
