---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      bucket: kopiur
      endpoint: nas.homelab.internal:9000
      tls:
        disableTls: true # versitygw on LAN http
      auth:
        secretRef:
          name: kopiur-repository-secret
          namespace: storage-system
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: storage-system
      key: KOPIA_PASSWORD
  create:
    enabled: true
  moverDefaults:
    cache:
      # warm kopia cache across mover runs: controller-owned RWO PVC per
      # policy instead of a cold emptyDir each run (~96 mover runs/day)
      mode: Persistent
      storageClassName: ceph-block
      capacity: 10Gi
      # Ceiling = metadata 4096x2 (index-blobs cap) + content 1024
      # = 9Gi <= ~9.5Gi usable (ext4 5% reserve). Sized per-policy:
      # each mover needs the full shared repo index (~1-3Gi at
      # current repo size), not the sum of all app data.
      metadataCacheSizeMb: 4096
      contentCacheSizeMb: 1024
  maintenance:
    schedule:
      quick:
        cron: 0 * * * *
        jitter: 10m
      full:
        cron: 0 3 * * *
        jitter: 1h
  parameters:
    epoch:
      minDuration: 1h
  scheduleDefaults:
    timezone: Asia/Shanghai
