---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &name rook-ceph-mgr-dashboard
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/icon: rook.svg
    gethomepage.dev/name: Rook
    gethomepage.dev/group: Storage
    # homepage k8s status looks up pods by app.kubernetes.io/name=<route name>;
    # rook daemon pods carry operator labels instead
    gethomepage.dev/pod-selector: app=rook-ceph-mgr
spec:
  hostnames: ["rook.noirprime.com"]
  parentRefs:
    - name: kgateway-internal
      namespace: networking-system
  rules:
    - backendRefs:
        - name: *name
          port: 7000
