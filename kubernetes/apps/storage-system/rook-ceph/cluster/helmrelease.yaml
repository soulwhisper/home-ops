---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name rook-ceph-cluster
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster

  values:
    clusterName: &cluster_namespace storage-system
    csiDriverNamePrefix: *cluster_namespace
    operatorNamespace: *cluster_namespace
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: false
    cephClusterSpec:
      # Rotate cephx keys (Tentacle AUTH_INSECURE_CLIENT_KEY_TYPE warning:
      # CSI keys use the old cipher). CSI stays aes because node kernels
      # (6.18) don't support aes256k mounts yet.
      security:
        cephx:
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          csi:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
            keepPriorKeyCountMax: 1
            keyType: aes
          rbdMirrorPeer:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
            keyType: aes
      cephConfig:
        global:
          bdev_enable_discard: "true"
          bdev_async_discard_threads: "1"
          osd_class_update_on_start: "false"
          device_failure_prediction_mode: local # requires mgr module
        mgr:
          mgr/crash/warn_recent_interval: "7200" # 2h
        mon:
          # default: "0.05". Raised because Talos SNTP polls at up to 34min
          # intervals and node clocks drift between polls (exarch-03 runs
          # +64ppm, ~130ms/poll-cycle), so inter-mon skew reaches ~70ms and
          # flaps MON_CLOCK_SKEW / CephHealthWarning. 0.1s is harmless for a
          # 3-mon homelab; revert by setting "0.05" explicitly (rook sets but
          # never unsets cephConfig keys).
          mon_clock_drift_allowed: "0.1"
      healthCheck:
        # ceph-cachepool is size=1 by design (rewarmable scratch, see the pool
        # comment below); POOL_NO_REDUNDANCY would otherwise hold HEALTH_WARN
        # and re-page CephHealthWarning forever.
        muteHealthWarning:
          POOL_NO_REDUNDANCY:
            policy: mute
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false # set true if saml2
        prometheusEndpoint: http://vmsingle-victoria-metrics-cluster.monitoring-system.svc.cluster.local:8428
      mgr:
        modules:
          - name: diskprediction_local
            enabled: true
          - name: rook
            enabled: true
      network:
        provider: host
        connections:
          requireMsgr2: true
      resources:
        mgr:
          limits:
            memory: 2Gi
        osd:
          limits:
            memory: 4Gi
      storage:
        useAllNodes: false
        useAllDevices: false
        nodes:
          - name: "exarch-01"
            devices: &nodeDevices
              # Test only
              # - name: "sdb"
              #   config:
              #     osdsPerDevice: "1"
              # WD Black SN850X 8TB
              # - name: "/dev/disk/by-path/pci-0000:01:00.0-nvme-1"
              #   config:
              #     osdsPerDevice: "4"
              # P41 2TB
              - name: "/dev/disk/by-path/pci-0000:58:00.0-nvme-1"
                config:
                  osdsPerDevice: "2" # 2 for best performance
              # Koxia RC20 2TB
              # - name: "/dev/disk/by-path/pci-0000:5d:00.0-nvme-1"
              #   config:
              #     osdsPerDevice: "1"
          - name: "exarch-02"
            devices: *nodeDevices
          - name: "exarch-03"
            devices: *nodeDevices
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: WaitForFirstConsumer
          mountOptions:
            - discard
          parameters:
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: *cluster_namespace
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: *cluster_namespace
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: *cluster_namespace
            csi.storage.k8s.io/fstype: ext4
      # Cache/scratch pool: size=1 on NVMe OSDs for rewarmable data (kopia
      # mover caches, transcode scratch, ML model caches). No replication
      # write amplification; data loss on OSD failure is acceptable and
      # self-healing (caches rewarm). Do NOT point durable data at this.
      - name: ceph-cachepool
        spec:
          failureDomain: osd
          replicated:
            size: 1
            requireSafeReplicaSize: false
          parameters:
            compression_mode: none
        storageClass:
          enabled: true
          name: ceph-cache
          isDefault: false
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: WaitForFirstConsumer
          mountOptions:
            - discard
          parameters:
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: *cluster_namespace
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: *cluster_namespace
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: *cluster_namespace
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: ceph-block-snapshot
      isDefault: true
      deletionPolicy: Delete
    cephFileSystems:
      - name: &cephFileSystemName ceph-filesystem
        spec:
          metadataPool:
            replicated:
              size: 3
          dataPools:
            - name: default
              failureDomain: host
              replicated:
                size: 3
          metadataServer:
            activeCount: 1
            activeStandby: true
            priorityClassName: system-cluster-critical
            placement:
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: ceph-mds
                      app.kubernetes.io/part-of: *cephFileSystemName
        storageClass:
          name: ceph-filesystem
          pool: default
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: WaitForFirstConsumer
          parameters:
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: *cluster_namespace
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: *cluster_namespace
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: *cluster_namespace
            csi.storage.k8s.io/fstype: ext4
    # only rbd volumes are snapshotted (kopiur/ceph-block); no cephfs snapshotting
    cephFileSystemVolumeSnapshotClass:
      enabled: false
    cephObjectStores:
      # endpoint: http://rook-ceph-rgw-ceph-objectstore.storage-system.svc.cluster.local
      - name: ceph-objectstore
        spec:
          metadataPool:
            failureDomain: host
            replicated:
              size: 3
          dataPool:
            failureDomain: host
            replicated:
              size: 3
          preservePoolsOnDelete: true
          gateway:
            port: 80
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 1Gi
            instances: 1
        storageClass:
          enabled: true
          name: ceph-bucket
        ingress:
          enabled: false
