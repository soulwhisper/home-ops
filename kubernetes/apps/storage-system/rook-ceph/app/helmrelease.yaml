---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name rook-ceph
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: rook-ceph

  values:
    # vlagent parses klog's offset-less timestamps as UTC; the operator is
    # k8tz-injected Asia/Shanghai, so its lines land 8h in the future
    # (homelab-tickets#27)
    annotations:
      k8tz.io/timezone: "UTC"
    crds:
      enabled: true
    csi:
      serviceMonitor:
        # targets the legacy rook-managed CSI "csi-metrics" service, which does
        # not exist under ceph-csi-operator -> ScrapePoolHasNoTargets
        enabled: false
    monitoring:
      enabled: true
    # default obc fields = "maxObjects,maxSize"
    obcAllowAdditionalConfigFields: "bucketOwner,bucketPolicy,bucketLifecycle"
