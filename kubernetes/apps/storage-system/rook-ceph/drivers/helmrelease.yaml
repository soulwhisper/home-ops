---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name rook-ceph-drivers
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: ceph-csi-drivers
  # Talos does not ship /etc/selinux/config; mount a minimal permissive config
  # from the ceph-csi-selinux-config ConfigMap so mount keeps context=. The
  # chart renders a non-empty nodePlugin.volumes list at the key's indentation,
  # which is invalid YAML, hence post-render.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: csi.ceph.io
              version: v1
              kind: Driver
              name: storage-system.rbd.csi.ceph.com
            patch: |
              apiVersion: csi.ceph.io/v1
              kind: Driver
              metadata:
                name: storage-system.rbd.csi.ceph.com
              spec:
                controllerPlugin:
                  containerExtraArgs:
                    csi-provisioner:
                      - --feature-gates=CrossNamespaceVolumeDataSource=true
                nodePlugin:
                  volumes:
                    - mount:
                        name: selinux-config
                        mountPath: /etc/selinux/config
                        subPath: config
                        readOnly: true
                      volume:
                        name: selinux-config
                        configMap:
                          name: ceph-csi-selinux-config

  values:
    operatorConfig:
      driverSpecDefaults:
        imageSet:
          name: ceph-csi-image-set
        log:
          rotation:
            enabled: false
        controllerPlugin:
          priorityClassName: system-cluster-critical
          resources:
            attacher:
              limits:
                memory: 256Mi
              requests:
                cpu: 20m
                memory: 96Mi
            omapGenerator:
              limits:
                memory: 1Gi
              requests:
                cpu: 250m
                memory: 512Mi
            plugin:
              limits:
                memory: 1Gi
              requests:
                memory: 512Mi
            provisioner:
              limits:
                memory: 256Mi
              requests:
                cpu: 20m
                memory: 96Mi
            resizer:
              limits:
                memory: 256Mi
              requests:
                cpu: 20m
                memory: 96Mi
            snapshotter:
              limits:
                memory: 256Mi
              requests:
                cpu: 20m
                memory: 96Mi
        nodePlugin:
          priorityClassName: system-node-critical
          resources:
            plugin:
              limits:
                memory: 1Gi
              requests:
                cpu: 50m
                memory: 192Mi
            registrar:
              limits:
                memory: 256Mi
              requests:
                cpu: 20m
                memory: 96Mi
    drivers:
      rbd:
        name: storage-system.rbd.csi.ceph.com
        controllerPlugin:
          replicas: 2
        grpcTimeout: 150
        log:
          rotation:
            enabled: false
        # chart default "none" omits the csi-snapshotter sidecar from the
        # ctrlplugin -> VolumeSnapshots stall forever and every kopiur backup fails
        snapshotPolicy: volumeSnapshot
      cephfs:
        name: storage-system.cephfs.csi.ceph.com
        controllerPlugin:
          replicas: 2
        grpcTimeout: 150
        log:
          rotation:
            enabled: false
        # only rbd needs snapshots; chart default enables the snapshotter here
        snapshotPolicy: none
      nvmeof:
        enabled: false
        name: storage-system.nvmeof.csi.ceph.com
      nfs:
        enabled: false
        name: storage-system.nfs.csi.ceph.com
