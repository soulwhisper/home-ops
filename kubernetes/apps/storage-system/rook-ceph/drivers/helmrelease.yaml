---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name rook-ceph-drivers
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: ceph-csi-drivers

  values:
    operatorConfig:
      driverSpecDefaults:
        # Use rook's image set
        imageSet:
          name: rook-csi-operator-image-set-configmap
        log:
          rotation:
            enabled: false
        controllerPlugin:
          priorityClassName: system-cluster-critical
          resources:
            attacher:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            omapGenerator:
              limits:
                memory: 1Gi
              requests:
                cpu: 250m
                memory: 512Mi
            plugin:
              limits:
                memory: 1Gi
              requests:
                memory: 512Mi
            provisioner:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            resizer:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            snapshotter:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
        nodePlugin:
          priorityClassName: system-node-critical
          resources:
            plugin:
              limits:
                memory: 1Gi
              requests:
                cpu: 250m
                memory: 512Mi
            registrar:
              limits:
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 128Mi
    drivers:
      rbd:
        name: storage-system.rbd.csi.ceph.com
        controllerPlugin:
          replicas: 2
        grpcTimeout: 150
        log:
          rotation:
            enabled: false
        # chart default "none" omits the csi-snapshotter sidecar from the
        # ctrlplugin -> VolumeSnapshots stall forever and every kopiur backup fails
        snapshotPolicy: volumeSnapshot
      cephfs:
        name: storage-system.cephfs.csi.ceph.com
        controllerPlugin:
          replicas: 2
        grpcTimeout: 150
        log:
          rotation:
            enabled: false
        # only rbd needs snapshots; chart default enables the snapshotter here
        snapshotPolicy: none
      nvmeof:
        enabled: false
        name: storage-system.nvmeof.csi.ceph.com
      nfs:
        enabled: false
        name: storage-system.nfs.csi.ceph.com
