---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # app
  - ./configmap.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  # The CSI operator watches the image-set reference, not the ConfigMap data.
  - name: ceph-csi-image-set
    literals:
      - plugin=quay.io/cephcsi/cephcsi:v3.18.2
configurations:
  - ./name-reference.conf
