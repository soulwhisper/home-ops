---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name snapshot-controller
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: snapshot-controller

  values:
    installCRDs: true
    controller:
      replicaCount: 1
      # vlagent parses klog's offset-less timestamps as UTC; with the
      # k8tz-injected Asia/Shanghai every line landed 8h in the future
      # (VictoriaLogsFutureLogTimestamps, homelab-tickets#27). Infra Go apps
      # get UTC until VictoriaLogs#1883 is fixed upstream.
      podAnnotations:
        k8tz.io/timezone: "UTC"
      serviceMonitor:
        create: true
    webhook:
      enabled: false
