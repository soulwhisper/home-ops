---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name csi-driver-nfs
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: csi-driver-nfs

  values:
    controller:
      enableSnapshotter: false
    externalSnapshotter:
      customResourceDefinitions:
        enabled: false
    feature:
      # use "securityContext.fsGroupChangePolicy: OnRootMismatch" instead
      # ref:https://github.com/kubernetes-csi/csi-driver-nfs/issues/870
      enableFSGroupPolicy: false

  # Chart 4.13.5 has no podAnnotation values; patch the workload pod templates
  # so offset-less klog lines stay UTC until VictoriaLogs#1883 (#27).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: csi-nfs-node
            patch: |-
              - op: add
                path: /spec/template/metadata/annotations
                value:
                  k8tz.io/timezone: "UTC"
          - target:
              kind: Deployment
              name: csi-nfs-controller
            patch: |-
              - op: add
                path: /spec/template/metadata/annotations
                value:
                  k8tz.io/timezone: "UTC"
