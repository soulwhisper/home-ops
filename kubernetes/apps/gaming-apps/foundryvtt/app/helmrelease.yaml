---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name foundryvtt
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        # Same Talos SELinux fix as victoria-logs (full story in the
        # victoria-logs helmrelease): hosted-room-dri's writes to the
        # unlabeled RBD volume were the #2 AVC source. seLinuxOptions is a
        # proven no-op on Talos — relabel via initContainer instead.
        initContainers:
          selinux-relabel:
            image: { repository: ubuntu, tag: "24.04" }
            command:
              - sh
              - -eu
              - |
                  cur="$(stat -c %C /vol)"
                  if [ "$cur" != "system_u:object_r:ephemeral_t:s0" ]; then
                    chcon -R system_u:object_r:ephemeral_t:s0 /vol
                    echo "relabelled /vol from $cur"
                  fi
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"], add: ["FOWNER"] }
              readOnlyRootFilesystem: true
            resources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { memory: 256Mi }
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000 # node
            runAsGroup: 1000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/felddy/foundryvtt
              tag: 14.369.0
            env:
              FOUNDRY_HOSTNAME: "fvtt.noirprime.com"
              FOUNDRY_IP_DISCOVERY: "false"
              FOUNDRY_MINIFY_STATIC_FILES: "true"
              FOUNDRY_PROXY_PORT: "443"
              FOUNDRY_PROXY_SSL: "true"
            envFrom:
              - secretRef:
                  name: *name
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - >
                        ls /data > /dev/null
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 15
                  failureThreshold: 5
                  successThreshold: 1
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true

    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "10.10.0.144"
        ports:
          http:
            port: 30000
    route:
      app:
        hostnames: ["fvtt.noirprime.com"]
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: /icons/foundry-vtt.svg
          gethomepage.dev/name: FoundryVTT
          gethomepage.dev/group: Service
        parentRefs:
          - name: kgateway-internal
            namespace: networking-system

    persistence:
      app:
        existingClaim: *name
        globalMounts:
          - path: /home/node/resources/app
        # app-template schema: initContainer mounts come from advancedMounts,
        # not per-entry volumeMounts. Mounts the RBD data volume for chcon.
        advancedMounts:
          *name :
            selinux-relabel:
              - path: /vol
      shared:
        existingClaim: trpg
        globalMounts:
          - path: /data
            subPath: fvtt
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
