# Daily restart of trendradar to cap the MCP sidecar's memory under the 1Gi
# limit; the sidecar grows linearly under steady MCP traffic.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trendradar-restarter
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trendradar-restarter
rules:
  # rollout restart = GET + PATCH on the deployment's pod template
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["trendradar"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trendradar-restarter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: trendradar-restarter
subjects:
  - kind: ServiceAccount
    name: trendradar-restarter
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trendradar-restarter
spec:
  # 10 min after hindsight-restarter; both off the Renovate/backup windows
  schedule: "30 4 * * *"
  timeZone: "Asia/Shanghai"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: trendradar-restarter
          automountServiceAccountToken: true
          securityContext:
            # kubectl image defaults to root; pin non-root instead of
            # runAsNonRoot, which would reject the container outright
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: kubectl
              image: registry.k8s.io/kubectl:v1.37.1
              resources:
                requests:
                  cpu: 5m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              command:
                - kubectl
                - rollout
                - restart
                - deploy/trendradar
                - --namespace=selfhosted-apps
          restartPolicy: Never
