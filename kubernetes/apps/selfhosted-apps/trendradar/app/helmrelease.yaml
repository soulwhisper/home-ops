---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name trendradar
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: wantcat/trendradar
              # renovate: datasource=docker depName=wantcat/trendradar
              tag: "6.11.0"
            env:
              TZ: Asia/Shanghai
              WEBSERVER_PORT: "8080"
              RUN_MODE: cron
              # One daily crawl after the 04:30 memory-leak restart; no extra
              # immediate run on pod restart.
              CRON_SCHEDULE: "0 5 * * *"
              IMMEDIATE_RUN: "false"
              AI_ANALYSIS_ENABLED: "true"
              # AI lane (base/model/key) comes from the trendradar secret
              # (envFrom below)
              # delivery channels: add NTFY_*/DINGTALK_WEBHOOK_URL/FEISHU_WEBHOOK_URL env when chosen
            envFrom:
              - secretRef:
                  name: *name
            probes:
              # first crawl of ~50 feeds takes minutes before / answers;
              # helm's 5m upgrade window is not enough without a startup gate
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /, port: 8080 }
                  periodSeconds: 10
                  failureThreshold: 60
                  timeoutSeconds: 10
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /, port: 8080 }
                  periodSeconds: 30
                  failureThreshold: 5
                  # default timeoutSeconds=1 kills the app mid crawl cycle
                  # (exitCode 137 every ~3min; readiness never passes)
                  timeoutSeconds: 10
              readiness: *probe
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
          mcp:
            image:
              repository: wantcat/trendradar-mcp
              # renovate: datasource=docker depName=wantcat/trendradar-mcp
              tag: "4.1.1"
            env:
              TZ: Asia/Shanghai
              MCP_PORT: "3333"
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                # MCP query serving over /app/output grows past 512Mi within
                # ~39h; 1Gi matches the app container. Growth is a linear
                # leak, bounded by restart-cronjob.yaml.
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }

    service:
      app:
        ports:
          http:
            primary: true
            port: 8080
          mcp:
            port: 3333

    persistence:
      # per-file subPath mounts (NOT a whole-dir mount at /app/config): a dir
      # mount shadows image-shipped defaults — that hid the stock
      # ai_analysis_prompt.txt and broke AI analysis (empty prompt)
      config:
        type: configMap
        name: *name
        globalMounts:
          - { subPath: config.yaml, path: /app/config/config.yaml, readOnly: true }
          - { subPath: frequency_words.txt, path: /app/config/frequency_words.txt, readOnly: true }
          - { subPath: ai_interests.txt, path: /app/config/ai_interests.txt, readOnly: true }
          - { subPath: timeline.yaml, path: /app/config/timeline.yaml, readOnly: true }
          - { subPath: ai_analysis_prompt.txt, path: /app/config/ai_analysis_prompt.txt, readOnly: true }
      output:
        type: persistentVolumeClaim
        storageClass: ceph-block
        size: 1Gi
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /app/output
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
