---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name trendradar
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: wantcat/trendradar
              # renovate: datasource=docker depName=wantcat/trendradar
              tag: "6.10.0"
            env:
              TZ: Asia/Shanghai
              WEBSERVER_PORT: "8080"
              RUN_MODE: cron
              CRON_SCHEDULE: "*/30 * * * *"
              IMMEDIATE_RUN: "true"
              AI_ANALYSIS_ENABLED: "true"
              AI_MODEL: "openai/omni"
              AI_API_BASE: "http://agentgateway-proxy.networking-system.svc.cluster.local:80/chat"
              # delivery channels: add NTFY_*/DINGTALK_WEBHOOK_URL/FEISHU_WEBHOOK_URL env when chosen
            envFrom:
              - secretRef:
                  name: *name
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /, port: 8080 }
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *probe
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
          mcp:
            image:
              repository: wantcat/trendradar-mcp
              # renovate: datasource=docker depName=wantcat/trendradar-mcp
              tag: "4.1.0"
            env:
              TZ: Asia/Shanghai
              MCP_PORT: "3333"
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }

    service:
      app:
        ports:
          http:
            primary: true
            port: 8080
          mcp:
            port: 3333

    persistence:
      config:
        type: configMap
        name: *name
        globalMounts:
          - path: /app/config
            readOnly: true
      output:
        type: persistentVolumeClaim
        storageClass: ceph-block
        size: 1Gi
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /app/output
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
