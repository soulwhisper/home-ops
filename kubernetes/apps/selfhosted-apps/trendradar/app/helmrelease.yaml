---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name trendradar
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: wantcat/trendradar
              # renovate: datasource=docker depName=wantcat/trendradar
              tag: "6.10.0"
            env:
              TZ: Asia/Shanghai
              WEBSERVER_PORT: "8080"
              RUN_MODE: cron
              CRON_SCHEDULE: "*/30 * * * *"
              IMMEDIATE_RUN: "true"
              AI_ANALYSIS_ENABLED: "true"
              # guarded lane, `omni` lane (news digest; `micro` is the documented
              # fallback for classification-style passes)
              AI_MODEL: "openai/omni"
              AI_API_BASE: "http://agentgateway-proxy.networking-system.svc.cluster.local:80/chat"
              # delivery channels: add NTFY_*/DINGTALK_WEBHOOK_URL/FEISHU_WEBHOOK_URL env when chosen
            envFrom:
              - secretRef:
                  name: *name
            probes:
              # first crawl of ~50 feeds takes minutes before / answers;
              # helm's 5m upgrade window is not enough without a startup gate
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /, port: 8080 }
                  periodSeconds: 10
                  failureThreshold: 60
                  timeoutSeconds: 10
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /, port: 8080 }
                  periodSeconds: 30
                  failureThreshold: 5
                  # default timeoutSeconds=1 kills the app mid crawl cycle
                  # (exitCode 137 every ~3min; readiness never passes ->
                  # helm upgrade and rollback both timed out 2026-09-14)
                  timeoutSeconds: 10
              readiness: *probe
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
          mcp:
            image:
              repository: wantcat/trendradar-mcp
              # renovate: datasource=docker depName=wantcat/trendradar-mcp
              tag: "4.1.0"
            env:
              TZ: Asia/Shanghai
              MCP_PORT: "3333"
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                # OOMKilled 2026-09-17 at 512Mi after ~39h of MCP query
                # serving over /app/output; 1Gi matches the app container.
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }

    service:
      app:
        ports:
          http:
            primary: true
            port: 8080
          mcp:
            port: 3333

    persistence:
      config:
        type: configMap
        name: *name
        globalMounts:
          - path: /app/config
            readOnly: true
      output:
        type: persistentVolumeClaim
        storageClass: ceph-block
        size: 1Gi
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /app/output
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
