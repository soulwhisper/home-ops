---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Daily restart of trendradar to cap the MCP sidecar's memory under the 1Gi
# limit; the sidecar grows linearly under steady MCP traffic.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trendradar-restarter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    serviceAccount:
      restarter:
        enabled: true
        forceRename: trendradar-restarter

    rbac:
      roles:
        restarter:
          type: Role
          rules:
            - apiGroups: ["apps"]
              resources: ["deployments"]
              resourceNames: ["trendradar"]
              verbs: ["get", "patch"]
      bindings:
        restarter:
          type: RoleBinding
          roleRef:
            identifier: restarter
          subjects:
            - identifier: restarter

    defaultPodOptions:
      automountServiceAccountToken: true

    controllers:
      restarter:
        type: cronjob
        serviceAccount:
          identifier: restarter
        cronjob:
          # off the Renovate/backup windows
          schedule: "30 4 * * *"
          timeZone: Asia/Shanghai
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 2
          backoffLimit: 1
        pod:
          securityContext:
            # kubectl image defaults to root; pin non-root instead of
            # runAsNonRoot, which would reject the container outright.
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
        containers:
          kubectl:
            image:
              repository: registry.k8s.io/kubectl
              tag: v1.37.2
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 128Mi
            command:
              - kubectl
              - rollout
              - restart
              - deploy/trendradar
              - --namespace=selfhosted-apps
