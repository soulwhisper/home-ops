---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trendradar-restarter
rules:
  # rollout restart = GET + PATCH on the deployment's pod template
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["trendradar"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trendradar-restarter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: trendradar-restarter
subjects:
  - kind: ServiceAccount
    name: trendradar-restarter
