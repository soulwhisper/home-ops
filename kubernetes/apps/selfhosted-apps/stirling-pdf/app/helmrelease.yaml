---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name stirling-pdf
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      hostUsers: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.stirlingpdf.com/stirlingtools/stirling-pdf
              tag: 2.14.3-fat
            envFrom:
              - configMapRef:
                  name: *name
              - secretRef:
                  name: *name
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 4Gi
            resizePolicy:
              - resourceName: cpu
                restartPolicy: NotRequired
              - resourceName: memory
                restartPolicy: NotRequired
            securityContext:
              allowPrivilegeEscalation: false
              # entrypoint chowns /tmp/stirling-pdf and su-execs to the app user
              capabilities: { drop: ["ALL"], add: ["CHOWN", "SETUID", "SETGID"] }
              # entrypoint symlinks into /usr/local/bin -> rootfs must be writable
              readOnlyRootFilesystem: false

    service:
      app:
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames: ["pdf.noirprime.com"]
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: stirling-pdf.svg
          gethomepage.dev/name: Stirling-PDF
          gethomepage.dev/group: Service
        parentRefs:
          - name: kgateway-internal
            namespace: networking-system

    persistence:
      app:
        existingClaim: *name
        globalMounts:
          - path: /configs
            subPath: configs
          - path: /usr/share/tessdata
            subPath: tessdata
          - path: /pipeline
            subPath: pipeline
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /logs
            subPath: logs
