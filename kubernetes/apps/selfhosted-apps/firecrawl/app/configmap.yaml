---
apiVersion: v1
kind: ConfigMap
metadata:
  name: firecrawl
data:
  # General
  HOST: "0.0.0.0"
  USE_DB_AUTHENTICATION: "false"
  SENTRY_ENVIRONMENT: "production"
  ENV: "production"
  LOGGING_LEVEL: "INFO"
  IS_KUBERNETES: "true"
  # Service. Firecrawl POSTs to this URL verbatim; the Playwright service
  # serves /scrape (POST / is a 404).
  PLAYWRIGHT_MICROSERVICE_URL: "http://firecrawl-playwright.selfhosted-apps.svc.cluster.local:3000/scrape"
  MAX_CONCURRENT_JOBS: "2"
  NUM_WORKERS_PER_QUEUE: "2"
  CRAWL_CONCURRENT_REQUESTS: "2"
  BROWSER_POOL_SIZE: "2"
  MAX_CPU: "0.75"
  MAX_RAM: "0.75"
  # SearXNG. Curated engine list: the default fanout spends latency on
  # Brave (suspended) and DuckDuckGo (CAPTCHA) while only Google CSE returns
  # reliably. This list was measured at 85-118 results / 0.9-2.4s with no
  # unresponsive engines. Do not set SEARXNG_CATEGORIES to the broad
  # general,news,science,it set: that measured 235 results / 15.3s with 11
  # unresponsive engines.
  SEARXNG_ENDPOINT: "http://searxng.selfhosted-apps.svc.cluster.local:8080"
  SEARXNG_ENGINES: "google cse,duckduckgo,sogou wechat,360search,arxiv,pubmed,semantic scholar,duckduckgo news,wikinews"
