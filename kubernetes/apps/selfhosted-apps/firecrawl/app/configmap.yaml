---
apiVersion: v1
kind: ConfigMap
metadata:
  name: firecrawl
data:
  # General
  HOST: "0.0.0.0"
  USE_DB_AUTHENTICATION: "false"
  SENTRY_ENVIRONMENT: "production"
  ENV: "production"
  LOGGING_LEVEL: "INFO"
  IS_KUBERNETES: "true"
  # Service. Firecrawl POSTs to this URL verbatim; the Playwright service
  # serves /scrape (POST / is a 404).
  PLAYWRIGHT_MICROSERVICE_URL: "http://firecrawl-playwright.selfhosted-apps.svc.cluster.local:3000/scrape"
  MAX_CONCURRENT_JOBS: "2"
  NUM_WORKERS_PER_QUEUE: "2"
  CRAWL_CONCURRENT_REQUESTS: "2"
  BROWSER_POOL_SIZE: "2"
  MAX_CPU: "0.75"
  MAX_RAM: "0.75"
  # SearXNG. General/news engines only: academic engines (arxiv/pubmed/
  # semantic scholar) can fill a limit=5 search with unrelated papers before
  # the news engines finish and are returned. Keep research queries on the
  # SearXNG UI/API (or a separate profile) instead of the global Firecrawl
  # search path. This list measured 26 results / 0.6-0.8s, 0 academic results
  # across 3 runs. Do not set SEARXNG_CATEGORIES to the broad
  # general,news,science,it set: that measured 235 results / 15.3s with 11
  # unresponsive engines.
  SEARXNG_ENDPOINT: "http://searxng.selfhosted-apps.svc.cluster.local:8080"
  SEARXNG_ENGINES: "google cse,duckduckgo,sogou wechat,360search,duckduckgo news,wikinews"
