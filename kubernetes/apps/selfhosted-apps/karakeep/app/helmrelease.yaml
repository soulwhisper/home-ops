---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name karakeep
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      runtimeClassName: kata
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
          config.home-ops.io/proxy: "https" # https_proxy needed
        containers:
          app:
            image:
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.33.2
            env:
              BROWSER_WEB_URL: http://localhost:9222
              CRAWLER_DOWNLOAD_BANNER_IMAGE: true
              CRAWLER_ENABLE_ADBLOCKER: true
              CRAWLER_STORE_SCREENSHOT: true
              DATA_DIR: /data
              DISABLE_SIGNUPS: true
              MEILI_ADDR: http://localhost:7700
              NEXTAUTH_URL: https://bookmarks.noirprime.com
              DISABLE_NEW_RELEASE_CHECK: true
              COREPACK_INTEGRITY_KEYS: 0
              OAUTH_PROVIDER_NAME: authentik
              OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: true
              OAUTH_WELLKNOWN_URL: https://auth.noirprime.com/application/o/karakeep/.well-known/openid-configuration
              # semantic/hybrid search + auto-tagging via the gateway media
              # route (Qwen3-Embedding-4B on MacStudio); key from envFrom secret
              EMBEDDING_OPENAI_BASE_URL: http://agentgateway-proxy.networking-system.svc.cluster.local:80/v1
              EMBEDDING_TEXT_MODEL: qwen3-embedding-4b
              EMBEDDING_DIMENSIONS: 2560
              EMBEDDING_ENABLE_AUTO_INDEXING: true
            envFrom:
              - secretRef:
                  name: *name
            ports:
              - name: http
                containerPort: &port 3000
            resources: &resources
              requests:
                cpu: 10m
              limits:
                memory: 1Gi

          chrome:
            # upstream image (zenika/alpine-chrome deprecated in 0.33.2);
            # entrypoint handles headless/no-sandbox itself
            image:
              repository: ghcr.io/karakeep-app/karakeep-chrome
              tag: release
            args:
              - --disable-gpu
              - --disable-dev-shm-usage
              - --hide-scrollbars
              - --remote-debugging-address=0.0.0.0
              - --remote-debugging-port=9222
            ports:
              - name: http
                containerPort: 9222
            resources: *resources

          meilisearch:
            image:
              repository: getmeili/meilisearch
              tag: v1.53.2
            args:
              - --upgrade-db
            env:
              MEILI_NO_ANALYTICS: true
            envFrom:
              - secretRef:
                  name: *name
            ports:
              - name: http
                containerPort: 7700
            resources: *resources

    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["bookmarks.noirprime.com"]
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: karakeep.svg
          gethomepage.dev/name: Karakeep
          gethomepage.dev/group: Service
        parentRefs:
          - name: kgateway-internal
            namespace: networking-system

    persistence:
      app:
        existingClaim: *name
        globalMounts:
          - path: /data
            subPath: karakeep
          - path: /meili_data
            subPath: meilisearch
