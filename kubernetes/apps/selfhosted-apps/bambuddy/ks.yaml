---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &name bambuddy
  annotations:
    config.home-ops.io/managed: "true"
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *name
  targetNamespace: selfhosted-apps
  path: "./kubernetes/apps/selfhosted-apps/bambuddy/app"
  dependsOn:
    - name: selfhosted-nfs
      namespace: selfhosted-apps
  components:
    - ../../../../components/authentik
  postBuild:
    substitute:
      APP: *name
      APP_HOST: "bambuddy.noirprime.com"
