---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # app
  - ./helmrelease.yaml
  # utils
  - ./configmap.yaml
  - ./externalsecret.yaml
# icons/ -> ConfigMap homepage-icons, mounted at /app/public/icons so all
# icon references resolve locally (jsdelivr/simple-icons CDNs are 5-9s or
# TLS-failing from this LAN). Reloader restarts homepage on CM change;
# Next only scans public/ at boot, so new icons go live via that restart.
configMapGenerator:
  - name: homepage-icons
    # generator files do not support globs -> explicit list, keep in sync
    # when adding an icon. SVG only: flux source-controller AND flate's
    # ignoreFS default-exclude *.png/*.jpg/... raster files (flate#998),
    # so raster icons ship as SVG wrappers embedding the PNG data URI.
    files:
      - icons/alertmanager.svg
      - icons/cilium.svg
      - icons/covel.svg
      - icons/deepseek.svg
      - icons/diceframe.svg
      - icons/discord.svg
      - icons/forgejo.svg
      - icons/grafana.svg
      - icons/heimdall.svg
      - icons/metabrainz.svg
      - icons/microsoft-outlook.svg
      - icons/open-webui.svg
      - icons/openwrt.svg
      - icons/rook.svg
      - icons/searxng.svg
      - icons/si-anthropic.svg
      - icons/si-bambulab.svg
      - icons/si-hermes.svg
      - icons/si-jpeg.svg
      - icons/si-langflow.svg
      - icons/si-materialdesign.svg
      - icons/si-rss.svg
      - icons/si-simpleicons.svg
      - icons/synology.svg
      - icons/unifi.svg
      - icons/victoriametrics.svg
      - icons/vmware-esxi.svg
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  disableNameSuffixHash: true
