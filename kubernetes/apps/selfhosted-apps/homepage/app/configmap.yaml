---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    gateway: true
    ingress: false
    traefik: false
  settings.yaml: |
    # icons are served locally from /icons (see kustomization.yaml)
    title: Dashboard
    favicon: /icons/heimdall.svg
    theme: dark
    headerStyle: boxed
    hideVersion: true
    useEqualHeights: true
    hideErrors: true
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
    # group order = page placement; custom.css pins the first group (Status)
    # as a full-height left sidebar and flows the rest into two tracks
    layout:
      Status:                 # widget sidebar: jellyfin/immich/qbittorrent/crafty
        style: column
      Media:
        style: column
      Service:
        style: row
        columns: 2
      SmartHome:
        style: column
      Download:
        style: column
      Observability:
        style: column
      Infrastructure:         # below the fold by design
        style: column
      # Calendar:             # re-enable together with the services.yaml entry
      #   header: false
      #   style: column
  custom.css: |
    /* wide screens: first layout group (Status) = full-height left sidebar,
       remaining groups flow into two tracks. hooks #layout-groups /
       .services-group are semantic; re-verify on homepage upgrades. */
    @media (min-width: 1280px) {
      #layout-groups { display: grid !important; grid-template-columns: minmax(320px, 400px) 1fr 1fr; align-items: start; }
      /* span 3, not 1/-1: with zero explicit rows, -1 resolves to line 1 and
         the sidebar would collapse to one row; bump if right-side rows grow */
      #layout-groups > .services-group:first-child { grid-column: 1; grid-row: 1 / span 3; }
    }
  custom.js: ""
  bookmarks.yaml: ""
  services.yaml: |
    # Calendar widget deactivated; uncomment here AND in settings.yaml layout
    # - Calendar:
    #     - Calendar:
    #         widget:
    #           type: calendar
    #           firstDayInWeek: monday
    #           view: agenda
    #           maxEvents: 10
    #           showTime: true
    #           timezone: Asia/Shanghai
    #           integrations:
    #             - type: ical
    #               name: Ticktick
    #               url: {{HOMEPAGE_VAR_TICKTICK_ICAL}}
    - Infrastructure:
        - ESXi:
            href: https://10.0.0.10
            icon: /icons/vmware-esxi.svg
        - OpenWRT:
            href: http://10.10.0.254
            icon: /icons/openwrt.svg
            widget:
              type: openwrt
              # widget appends /ubus (JSON-RPC); a path here 404s the session login
              url: http://10.10.0.254
              username: {{HOMEPAGE_VAR_OPENWRT_USERNAME}}
              password: {{HOMEPAGE_VAR_OPENWRT_PASSWORD}}
              # widget indexes the ubus network.device dump by DEVICE name;
              # the WAN is PPPoE -> pppoe-wan (no device is named "wan")
              interfaceName: pppoe-wan
        - Unifi:
            href: https://10.10.0.200:9801
            icon: /icons/unifi.svg
            widget:
              type: unifi
              url: https://10.10.0.200:9801
              username: {{HOMEPAGE_VAR_UNIFI_USERNAME}}
              password: {{HOMEPAGE_VAR_UNIFI_PASSWORD}}
        - NAS:
            href: https://10.10.0.100:5001
            icon: /icons/synology.svg
            widget:
              type: diskstation
              url: https://10.10.0.100:5001
              username: {{HOMEPAGE_VAR_SYNOLOGY_USERNAME}}
              password: {{HOMEPAGE_VAR_SYNOLOGY_PASSWORD}}
              volume: volume_2
  widgets.yaml: |
    - search:
        provider: custom
        url: https://search.noirprime.com/search?q=
        suggestionUrl: https://search.noirprime.com/autocompleter?q=
        focus: false
        target: _blank
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: Talos
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - datetime:
        text_size: l
        format:
          dateStyle: long
          timeStyle: short
          hourCycle: h23
  docker.yaml: ""
