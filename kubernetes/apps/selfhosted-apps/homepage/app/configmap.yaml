---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    gateway: true
    ingress: false
    traefik: false
  settings.yaml: |
    # icons are served locally from /icons (see kustomization.yaml)
    title: Dashboard
    favicon: /icons/heimdall.svg
    theme: dark
    headerStyle: boxed
    hideVersion: true
    useEqualHeights: true
    hideErrors: true
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
    layout:
      Calendar:
        header: false
        style: columns
      Download:
        style: columns
      Media:
        style: row
        columns: 2
      Service:
        style: row
        columns: 2
      Observability:
        style: row
        columns: 2
      SmartHome:
        style: columns
      Storage:
        style: columns
      Infrastructure:
        style: columns
      Networking:
        style: columns
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Social:
        - Discord:
            - icon: /icons/discord.svg
              href: https://discord.com/app
        - Outlook:
            - icon: /icons/microsoft-outlook.svg
              href: https://outlook.live.com/mail/0/
    - Cloud:
        - Cloudflare:
            - icon: /icons/cloudflare.svg
              href: https://dash.cloudflare.com
    - Icons:
        - Homepage Dashboard:
            - icon: /icons/si-jpeg.svg
              href: https://dashboardicons.com/
        - Homepage MDI:
            - icon: /icons/si-materialdesign.svg
              href: https://pictogrammers.com/library/mdi/
        - Homepage SI:
            - icon: /icons/si-simpleicons.svg
              href: https://simpleicons.org/
  services.yaml: |
    - Calendar:
        - Calendar:
            widget:
              type: calendar
              firstDayInWeek: monday
              view: agenda
              maxEvents: 10
              showTime: true
              timezone: Asia/Shanghai
              integrations:
                - type: ical
                  name: Ticktick
                  url: {{HOMEPAGE_VAR_TICKTICK_ICAL}}
    - Infrastructure:
        - ESXi:
            href: https://10.0.0.10
            icon: /icons/vmware-esxi.svg
        - OpenWRT:
            href: http://10.10.0.254
            icon: /icons/openwrt.svg
            widget:
              type: openwrt
              # widget appends /ubus (JSON-RPC); a path here 404s the session login
              url: http://10.10.0.254
              username: {{HOMEPAGE_VAR_OPENWRT_USERNAME}}
              password: {{HOMEPAGE_VAR_OPENWRT_PASSWORD}}
              # widget indexes the ubus network.device dump by DEVICE name;
              # the WAN is PPPoE -> pppoe-wan (no device is named "wan")
              interfaceName: pppoe-wan
    - Networking:
        - Unifi:
            href: https://10.10.0.200:9801
            icon: /icons/unifi.svg
            widget:
              type: unifi
              url: https://10.10.0.200:9801
              username: {{HOMEPAGE_VAR_UNIFI_USERNAME}}
              password: {{HOMEPAGE_VAR_UNIFI_PASSWORD}}
    - Storage:
        - NAS:
            href: https://10.10.0.100:5001
            icon: /icons/synology.svg
            widget:
              type: diskstation
              url: https://10.10.0.100:5001
              username: {{HOMEPAGE_VAR_SYNOLOGY_USERNAME}}
              password: {{HOMEPAGE_VAR_SYNOLOGY_PASSWORD}}
              volume: volume_2
  widgets.yaml: |
    - search:
        provider: custom
        url: https://search.noirprime.com/search?q=
        suggestionUrl: https://search.noirprime.com/autocompleter?q=
        focus: false
        target: _blank
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: Talos
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - datetime:
        text_size: l
        format:
          dateStyle: long
          timeStyle: short
          hourCycle: h23
  docker.yaml: ""
