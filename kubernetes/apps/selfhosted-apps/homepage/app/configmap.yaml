---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    gateway: true
    ingress: false
    traefik: false
  settings.yaml: |
    # icons are served locally from /icons (see kustomization.yaml)
    title: Dashboard
    favicon: /icons/heimdall.svg
    theme: dark
    headerStyle: boxed
    hideVersion: true
    useEqualHeights: true
    hideErrors: true
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
    # group order = column order on wide screens (custom.css below):
    # Status | Media | SmartHome | Service | Observability
    layout:
      Status:                 # ALL widget apps + ESXi; 2 internal columns like
        style: row            # Service/Observability (weights pair the rows:
        columns: 2            # jellyfin+immich / qbit+crafty / nas+openwrt /
                              # unifi+esxi)
      Media:
        style: column
      SmartHome:
        style: column
      Service:
        style: row
        columns: 2
      Observability:
        style: row
        columns: 2
      # Calendar:             # re-enable together with the services.yaml entry
      #   header: false
      #   style: column
  custom.css: |
    /* 3-column page: Status sidebar (internally 2-col since #4056) pinned
       left spanning both rows; column flow fills Media->SmartHome in col 2,
       Service->Observability in col 3. Flat one-row grids render as 8 narrow
       card columns — don't. hooks #layout-groups / .services-group are
       semantic; re-verify on homepage upgrades. */
    @media (min-width: 1900px) {
      #layout-groups { display: grid !important; grid-template-columns: minmax(560px, 640px) 1fr 1fr; grid-template-rows: repeat(2, auto); grid-auto-flow: column; align-items: start; }
      #layout-groups > .services-group:first-child { grid-column: 1; grid-row: 1 / -1; }
    }
    @media (min-width: 1280px) and (max-width: 1899px) {
      #layout-groups { display: grid !important; grid-template-columns: minmax(440px, 560px) 1fr 1fr; grid-template-rows: repeat(2, auto); grid-auto-flow: column; align-items: start; }
      #layout-groups > .services-group:first-child { grid-column: 1; grid-row: 1 / -1; }
    }
  custom.js: ""
  bookmarks.yaml: ""
  services.yaml: |
    # Calendar widget deactivated; uncomment here AND in settings.yaml layout
    # - Calendar:
    #     - Calendar:
    #         widget:
    #           type: calendar
    #           firstDayInWeek: monday
    #           view: agenda
    #           maxEvents: 10
    #           showTime: true
    #           timezone: Asia/Shanghai
    #           integrations:
    #             - type: ical
    #               name: Ticktick
    #               url: {{HOMEPAGE_VAR_TICKTICK_ICAL}}
    # Status sidebar also holds the discovered widget apps (jellyfin/immich/
    # qbittorrent/crafty via their route annotations, weights 10-40)
    - Status:
        - NAS:
            href: https://10.10.0.100:5001
            icon: /icons/synology.svg
            weight: 50
            widget:
              type: diskstation
              url: https://10.10.0.100:5001
              username: {{HOMEPAGE_VAR_SYNOLOGY_USERNAME}}
              password: {{HOMEPAGE_VAR_SYNOLOGY_PASSWORD}}
              volume: volume_2
        - OpenWRT:
            href: http://10.10.0.254
            icon: /icons/openwrt.svg
            weight: 60
            widget:
              type: openwrt
              # widget appends /ubus (JSON-RPC); a path here 404s the session login
              url: http://10.10.0.254
              username: {{HOMEPAGE_VAR_OPENWRT_USERNAME}}
              password: {{HOMEPAGE_VAR_OPENWRT_PASSWORD}}
              # widget indexes the ubus network.device dump by DEVICE name;
              # the WAN is PPPoE -> pppoe-wan (no device is named "wan")
              interfaceName: pppoe-wan
        - Unifi:
            href: https://10.10.0.200:9801
            icon: /icons/unifi.svg
            weight: 70
            widget:
              type: unifi
              url: https://10.10.0.200:9801
              username: {{HOMEPAGE_VAR_UNIFI_USERNAME}}
              password: {{HOMEPAGE_VAR_UNIFI_PASSWORD}}
        - Forgejo:
            href: https://git.noirprime.com
            icon: /icons/forgejo.svg
            weight: 75
            widget:
              type: customapi
              # TLS via the internal gateway (forgejo-proxy); PAT from 1Password
              url: https://git.noirprime.com/api/v1/repos/soulwhisper/homelab-tickets
              headers:
                Authorization: "token {{HOMEPAGE_VAR_FORGEJO_PAT}}"
              refreshInterval: 60000
              mappings:
                - { field: open_issues_count, label: "Open Issues", format: number }
                - { field: open_pr_counter, label: "Open PRs", format: number }
        - ESXi:
            href: https://10.0.0.10
            icon: /icons/vmware-esxi.svg
            weight: 80              # pinned bottom of the sidebar
            # one customapi widget (fields render as a single block row like
            # qbittorrent's): one vmsingle instant query unions all four
            # metrics via label_replace into a stable operand order
            widget:
              type: customapi
              url: http://vmsingle-victoria-metrics-cluster.monitoring-system.svc.cluster.local:8428/api/v1/query?query=label_replace%28max%28%28time%28%29%20-%20vmware_host_boot_timestamp_seconds%29%20/%203600%29%2C%20%22m%22%2C%20%22a_uptime_h%22%2C%20%22%22%2C%20%22%22%29%20or%20label_replace%28count%28vmware_vm_boot_timestamp_seconds%29%2C%20%22m%22%2C%20%22b_vms%22%2C%20%22%22%2C%20%22%22%29%20or%20label_replace%28max%28vmware_host_cpu_usage%29%20/%20max%28vmware_host_cpu_max%29%2C%20%22m%22%2C%20%22c_cpu%22%2C%20%22%22%2C%20%22%22%29%20or%20label_replace%28max%28vmware_host_memory_usage%29%20/%20max%28vmware_host_memory_max%29%2C%20%22m%22%2C%20%22d_mem%22%2C%20%22%22%2C%20%22%22%29
              refreshInterval: 60000
              mappings:
                - { field: data.result.0.value.1, label: "Uptime (h)", format: number }
                - { field: data.result.1.value.1, label: "VMs", format: number }
                - { field: data.result.2.value.1, label: "CPU", format: percent }
                - { field: data.result.3.value.1, label: "Mem", format: percent }
  widgets.yaml: |
    - search:
        provider: custom
        url: https://search.noirprime.com/search?q=
        suggestionUrl: https://search.noirprime.com/autocompleter?q=
        focus: false
        target: _blank
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: Talos
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - datetime:
        text_size: l
        format:
          dateStyle: long
          timeStyle: short
          hourCycle: h23
  docker.yaml: ""
