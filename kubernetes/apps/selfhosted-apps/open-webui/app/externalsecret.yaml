---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name open-webui
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        WEBUI_SECRET_KEY: "{{ .open_webui }}"
        # order matches OPENAI_API_BASE_URLS: siliconflow lane, hermes chat profile
        OPENAI_API_KEYS: "{{ .agentgateway_api_auth }};{{ .api_server_key_chat }}"
  dataFrom:
    - extract:
        key: encryption_cipher
    - extract:
        key: llm-api
    - extract:
        key: hermes-agent
