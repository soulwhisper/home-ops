---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name manyfold
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          prepare-paths:
            image:
              repository: docker.io/library/busybox
              tag: "1.38"
            command:
              - sh
              - -ec
              - |
                mkdir -p /tmp/manyfold
                chmod 0700 /tmp/manyfold
                chown 2000:2000 /usr/src/app/tmp /usr/src/app/log /tmp/manyfold
            resources:
              requests: { cpu: 10m, memory: 16Mi }
              limits: { memory: 64Mi }
            # Kubelet creates these mountpoints root-owned; only init needs CHOWN/FOWNER.
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "FOWNER"]
              readOnlyRootFilesystem: true
        containers:
          app:
            image:
              repository: ghcr.io/manyfold3d/manyfold-solo
              tag: 0.154.1
            env:
              PGID: 2000
              PUID: 2000
              TMPDIR: /tmp/manyfold
              # Kubernetes leaves /run root-owned and fsGroup-writable; s6
              # accepts that single-UID layout without additional privileges.
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
            envFrom:
              - secretRef:
                  name: *name
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &httpPort 3214
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *httpPort
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "DAC_OVERRIDE", "SETUID", "SETGID"]
              readOnlyRootFilesystem: true

    service:
      app:
        ports:
          http:
            appProtocol: kubernetes.io/ws
            port: *httpPort
    route:
      app:
        hostnames: ["manyfold.noirprime.com"]
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Manyfold
          gethomepage.dev/group: Service
        parentRefs:
          - name: kgateway-internal
            namespace: networking-system

    persistence:
      app:
        existingClaim: *name
        globalMounts:
          - path: /config
      library:
        existingClaim: 3d-assets
        globalMounts:
          - path: /libraries/main
            subPath: library
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /usr/src/app/tmp
            subPath: app-tmp
          - path: /usr/src/app/log
            subPath: log
          - path: /run
            subPath: run
