---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &name manyfold
  annotations:
    config.home-ops.io/managed: "true"
  labels:
    config.home-ops.io/deps: "infra"
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *name
  targetNamespace: selfhosted-apps
  path: "./kubernetes/apps/selfhosted-apps/manyfold/app"
  dependsOn:
    - name: selfhosted-nfs
      namespace: selfhosted-apps
  components:
    - ../../../../components/kopiur/backup
  postBuild:
    substitute:
      APP: *name
      APP_HOST: "manyfold.noirprime.com"
      KOPIUR_CAPACITY: 10Gi
