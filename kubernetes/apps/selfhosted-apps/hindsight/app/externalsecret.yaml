---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # LLM — guarded lane, `omni` lane (memory extraction is the dominant workload)
        HINDSIGHT_API_LLM_PROVIDER: "openai"
        HINDSIGHT_API_LLM_BASE_URL: "http://agentgateway-proxy.networking-system.svc.cluster.local:80/v1"
        HINDSIGHT_API_LLM_MODEL: "omni"
        HINDSIGHT_API_LLM_API_KEY: "{{ .agentgateway_api_auth }}"
        # Embeddings via the studio oMLX lane (studio id `qwen3-embedding-0.6b`,
        # 1024d). Store is empty — rebuild from scratch after rollout.
        HINDSIGHT_API_EMBEDDINGS_PROVIDER: "openai"
        HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: "http://agentgateway-proxy.networking-system.svc.cluster.local:80/v1"
        HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: "embedding"
        HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: "{{ .agentgateway_api_auth }}"
        # Rerank via the same lane (studio id `qwen3-reranker-0.6b`,
        # Cohere-compatible /v1/rerank).
        HINDSIGHT_API_RERANKER_PROVIDER: "cohere"
        HINDSIGHT_API_RERANKER_COHERE_BASE_URL: "http://agentgateway-proxy.networking-system.svc.cluster.local:80/v1/rerank"
        HINDSIGHT_API_RERANKER_COHERE_MODEL: "reranker"
        HINDSIGHT_API_RERANKER_COHERE_API_KEY: "{{ .agentgateway_api_auth }}"
  dataFrom:
    - extract:
        key: llm-api
