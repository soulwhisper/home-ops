---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # LLM
        HINDSIGHT_API_LLM_PROVIDER: "openai"
        # guarded lane, `omni` lane (memory extraction is the dominant workload)
        HINDSIGHT_API_LLM_BASE_URL: "http://agentgateway-proxy.networking-system.svc.cluster.local:80/v1"
        HINDSIGHT_API_LLM_MODEL: "omni"
        HINDSIGHT_API_LLM_API_KEY: "{{ .agentgateway_api_auth }}"
        # Media lanes (studio-keyed: valid at the gateway via multi-entry
        # llm-api-auth, then forwarded to oMLX by the passthrough)
        HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: "{{ .api_key }}"
        HINDSIGHT_API_RERANKER_COHERE_API_KEY: "{{ .api_key }}"
  dataFrom:
    - extract:
        key: llm-api
    - extract:
        key: omlx
