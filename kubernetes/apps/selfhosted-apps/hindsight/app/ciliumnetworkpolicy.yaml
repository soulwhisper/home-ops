---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hindsight-egress
spec:
  endpointSelector:
    matchLabels:
      "app.kubernetes.io/name": hindsight
  egress:
    # LLM gateway (chat /v1 + media /v1/*)
    - toServices:
        - k8sService:
            serviceName: agentgateway-proxy
            namespace: networking-system
      toPorts:
        - ports:
            - { port: "80", protocol: TCP }
    # CloudNativePG
    - toServices:
        - k8sService:
            serviceName: postgres-rw
            namespace: database-system
      toPorts:
        - ports:
            - { port: "5432", protocol: TCP }
    # OTEL traces
    - toServices:
        - k8sService:
            serviceName: opentelemetry-collector
            namespace: monitoring-system
      toPorts:
        - ports:
            - { port: "4318", protocol: TCP }
    # DNS
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: TCP }
            - { port: "53", protocol: UDP }
