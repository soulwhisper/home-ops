---
# Restrict the init Job to DNS and the Hindsight API.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hindsight-init-bank-egress
spec:
  endpointSelector:
    matchLabels:
      "app.kubernetes.io/name": hindsight-init-bank
  egress:
    - toServices:
        - k8sService:
            serviceName: hindsight
            namespace: selfhosted-apps
      toPorts:
        - ports:
            - { port: "8888", protocol: TCP }
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: TCP }
            - { port: "53", protocol: UDP }
