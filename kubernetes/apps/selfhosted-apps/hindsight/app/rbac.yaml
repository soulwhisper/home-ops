---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hindsight-restarter
rules:
  # rollout restart = GET + PATCH on the deployment's pod template
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["hindsight"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hindsight-restarter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hindsight-restarter
subjects:
  - kind: ServiceAccount
    name: hindsight-restarter
