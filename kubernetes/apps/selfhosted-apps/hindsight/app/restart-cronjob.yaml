# Daily restart of hindsight to cap its memory growth under the 2Gi limit;
# the process grows without bound under steady MCP traffic.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hindsight-restarter
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hindsight-restarter
rules:
  # rollout restart = GET + PATCH on the deployment's pod template
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["hindsight"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hindsight-restarter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hindsight-restarter
subjects:
  - kind: ServiceAccount
    name: hindsight-restarter
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hindsight-restarter
spec:
  schedule: "20 4 * * *"
  timeZone: "Asia/Shanghai"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: hindsight-restarter
          automountServiceAccountToken: true
          securityContext:
            # kubectl image defaults to root; pin non-root instead of
            # runAsNonRoot, which would reject the container outright
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: kubectl
              image: registry.k8s.io/kubectl:v1.37.2
              resources:
                requests:
                  cpu: 5m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              command:
                - kubectl
                - rollout
                - restart
                - deploy/hindsight
                - --namespace=selfhosted-apps
          restartPolicy: Never
