# Daily restart of hindsight to bound its memory growth.
# Why: the hindsight-api Python process leaks ~14 MB/h under steady MCP
# traffic (2160 new streamable-http transports/3h from the toolhive proxy),
# so the 2Gi limit is hit in ~5 days and the container is OOMKilled
# (last: exit 137, peak RSS pinned at 2046 MiB). Upstream leaks are tracked
# in vectorize-io/hindsight#996 / #660 / #1572; no fixed release yet
# (0.10.0 is latest). Restarting daily caps RSS at ~380 MiB, far below the
# limit. Delete this file once upstream ships a fix.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hindsight-restarter
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hindsight-restarter
rules:
  # rollout restart = GET + PATCH on the deployment's pod template
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["hindsight"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hindsight-restarter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hindsight-restarter
subjects:
  - kind: ServiceAccount
    name: hindsight-restarter
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hindsight-restarter
spec:
  schedule: "20 4 * * *"
  timeZone: "Asia/Shanghai"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: hindsight-restarter
          automountServiceAccountToken: true
          securityContext:
            # kubectl image defaults to root; pin non-root instead of
            # runAsNonRoot, which would reject the container outright
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: kubectl
              image: registry.k8s.io/kubectl:v1.37.0
              command:
                - kubectl
                - rollout
                - restart
                - deploy/hindsight
                - --namespace=selfhosted-apps
          restartPolicy: Never
