---
# The home tier's MCPRemoteProxy points at /mcp/home, but Hindsight does not
# auto-create banks. Without this CronJob, get_bank/list_tags/recall return
# "Bank 'home' not found". PUT is create-or-update and the script checks the
# bank first, so repeated runs are no-ops once the bank exists.
# The pod label intentionally differs from app.kubernetes.io/name=hindsight:
# the hindsight-egress CNP only permits LLM/Postgres/OTEL egress.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hindsight-init-bank-home
spec:
  # Hourly: the check is a no-op once the bank exists, and this bounds the
  # post-merge gap instead of waiting for the next 04:50 run.
  schedule: "50 * * * *"
  timeZone: "Asia/Shanghai"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: hindsight-init-bank
            app.kubernetes.io/instance: hindsight
            app.kubernetes.io/component: init-bank
        spec:
          automountServiceAccountToken: false
          hostUsers: false
          restartPolicy: Never
          securityContext:
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: init-bank
              image: ghcr.io/vectorize-io/hindsight:1.1.0-slim
              command:
                - /app/api/.venv/bin/python
                - -c
                - |
                  import json, time, urllib.request

                  base = "http://hindsight.selfhosted-apps.svc.cluster.local:8888"
                  for _ in range(60):
                      try:
                          urllib.request.urlopen(base + "/health/ready", timeout=5).read()
                          break
                      except Exception:
                          time.sleep(5)
                  else:
                      raise SystemExit("hindsight not ready after 300s")

                  with urllib.request.urlopen(
                      base + "/v1/default/banks?q=home", timeout=30
                  ) as resp:
                      banks = json.load(resp).get("banks", [])
                  if any(b.get("bank_id") == "home" for b in banks):
                      print("bank home already exists")
                      raise SystemExit(0)

                  req = urllib.request.Request(
                      base + "/v1/default/banks/home",
                      data=b"{}",
                      headers={"Content-Type": "application/json"},
                      method="PUT",
                  )
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      print(resp.status, resp.read().decode())
              env:
                - name: HOME
                  value: /tmp
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
