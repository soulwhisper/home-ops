---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # app
  - ./helmrelease.yaml
  # utils
  - ./externalsecret.yaml
  - ./ciliumnetworkpolicy.yaml
  # bounded restart for upstream memory leak (see file header)
  - ./restart-cronjob.yaml
  # ensure the /mcp/home bank exists (Hindsight does not auto-create banks)
  - ./init-bank-cronjob.yaml
