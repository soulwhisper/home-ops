---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name gods-eye-view
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        GOOGLE_MAPS_API_KEY: "{{ .google_maps_api_key }}"
        CESIUM_ION_TOKEN: "{{ .cesium_ion_api_key }}"
        AISSTREAM_API_KEY: "{{ .aisstream_api_key }}"
        FIRMS_MAP_KEY: "{{ .nasa_firms_api_key }}"
        TOMTOM_API_KEY: "{{ .tomtom_api_key }}"
  dataFrom:
    - extract:
        key: geo
