---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name gods-eye-view
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # client-exposed by design (injected into the browser bundle); scope
        # it with HTTP-referrer restrictions in Google Cloud
        GOOGLE_MAPS_API_KEY: "{{ .google_maps_api_key }}"
        CESIUM_ION_TOKEN: "{{ .cesium_ion_token }}"
        # server-side only (brokered under /api/*)
        GOOGLE_MAPS_SERVER_API_KEY: "{{ .google_maps_server_api_key }}"
        OPENAI_API_KEY: "{{ .openai_api_key }}"
        AISSTREAM_API_KEY: "{{ .aisstream_api_key }}"
        FIRMS_MAP_KEY: "{{ .firms_map_key }}"
        TOMTOM_API_KEY: "{{ .tomtom_api_key }}"
        OPENSKY_CLIENT_ID: "{{ .opensky_client_id }}"
        OPENSKY_CLIENT_SECRET: "{{ .opensky_client_secret }}"
  dataFrom:
    - extract:
        key: gods-eye-view
