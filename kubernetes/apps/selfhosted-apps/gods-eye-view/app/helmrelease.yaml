---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name gods-eye-view
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/soulwhisper/gods-eye-view
              # renovate: datasource=docker depName=ghcr.io/soulwhisper/gods-eye-view
              tag: main
              pullPolicy: Always
            envFrom:
              - secretRef:
                  name: *name
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /, port: 4173 }
                  periodSeconds: 10
                  failureThreshold: 30
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /, port: 4173 }
                  periodSeconds: 30
                  failureThreshold: 5
                  timeoutSeconds: 10
              readiness: *probe
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    service:
      app:
        ports:
          http:
            port: 4173

    route:
      app:
        hostnames: ["spy.noirprime.com"]
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: si-satellite
          gethomepage.dev/name: God's Eye View
          gethomepage.dev/group: Service
        parentRefs:
          - name: kgateway-internal
            namespace: networking-system

    persistence:
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /app/node_modules/.vite
            subPath: cache
          - path: /app/node_modules/.vite-temp
            subPath: cache-temp
          - path: /app/.gev-logs
            subPath: logs
          - path: /tmp
            subPath: tmp
