---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name gods-eye-view
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/soulwhisper/gods-eye-view
              # renovate: datasource=docker depName=ghcr.io/soulwhisper/gods-eye-view
              # upstream cuts no release tags yet; containers CI bakes the
              # floating `main` tag — Always so nodes don't serve stale layers
              tag: main
              pullPolicy: Always
            env:
              # The app has no built-in auth (upstream SECURITY.md: put it
              # behind an auth proxy); SSO is authentik forward-auth at the
              # gateway via components/authentik. Keys come from the
              # ExternalSecret; the two client-exposed ones are injected into
              # the browser bundle by vite at server start, so key rotation
              # lands via the reloader annotation above.
              TZ: Asia/Shanghai
            envFrom:
              - secretRef:
                  name: *name
            probes:
              # vite transforms the whole client on first request; cold start
              # of the unbundled app takes tens of seconds
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /, port: 4173 }
                  periodSeconds: 10
                  failureThreshold: 30
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /, port: 4173 }
                  periodSeconds: 30
                  failureThreshold: 5
                  timeoutSeconds: 10
              readiness: *probe
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    service:
      app:
        ports:
          http:
            primary: true
            port: 4173

    route:
      app:
        hostnames: ["spy.noirprime.com"]
        parentRefs:
          - name: kgateway-internal
            namespace: networking-system
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: si-satellite
          gethomepage.dev/name: God's Eye View
          gethomepage.dev/group: Service

    persistence:
      # vite optimize-deps cache (readOnlyRootFilesystem)
      vite-cache:
        type: emptyDir
        globalMounts:
          - path: /app/node_modules/.vite
      # voice debug log dir
      gev-logs:
        type: emptyDir
        globalMounts:
          - path: /app/.gev-logs
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
