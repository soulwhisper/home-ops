---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name obico-ml
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
    controllers:
      *name :
        containers:
          app:
            image:
              repository: ghcr.io/thespaghettidetective/obico-ml-api-cpu
              tag: 2026.11.6-gdf8190ef
            command:
              - gunicorn
              - --bind=0.0.0.0:3333
              - --workers=1
              - --timeout=120
              - --access-logfile=-
              - wsgi
            env:
              FLASK_APP: server.py
            probes:
              liveness: &healthCheck
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - python
                      - -c
                      - |
                        import sys
                        import urllib.request
                        body = urllib.request.urlopen("http://localhost:3333/hc/", timeout=3).read().strip()
                        sys.exit(0 if body == b"ok" else 1)
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *healthCheck
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - python
                      - -c
                      - |
                        import sys
                        import urllib.request
                        body = urllib.request.urlopen("http://localhost:3333/hc/", timeout=3).read().strip()
                        sys.exit(0 if body == b"ok" else 1)
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                cpu: "2"
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true

    service:
      app:
        ports:
          http:
            port: 3333

    persistence:
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
