---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name obico-ml
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
    controllers:
      *name :
        containers:
          app:
            image:
              repository: ghcr.io/thespaghettidetective/obico-ml-api-cpu
              tag: 2026.11.6-gdf8190ef
            command:
              - gunicorn
              - --bind=0.0.0.0:3333
              - --workers=1
              - --timeout=120
              - --access-logfile=-
              - wsgi
            env:
              FLASK_APP: server.py
            probes:
              liveness: &healthCheck
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - 'test "$(wget -q -O - http://localhost:3333/hc/)" = "ok"'
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *healthCheck
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - 'test "$(wget -q -O - http://localhost:3333/hc/)" = "ok"'
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: "2"
                memory: 2Gi

    service:
      app:
        ports:
          http:
            port: 3333
