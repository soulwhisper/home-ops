---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name scrypted
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            # s6-overlay image: must run as root (s6-rmrf rewrites /run at boot,
            # services spawn via s6 suexec); fsGroup keeps volume data readable
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/koush/scrypted
              tag: v0.146.1-noble-full
            env:
              SCRYPTED_DEFAULT_AUTHENTICATION: "admin"
              SCRYPTED_NVR_VOLUME: "/nvr"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - >
                        ls /nvr > /dev/null
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 15
                  failureThreshold: 5
                  successThreshold: 1
            resources:
              requests:
                cpu: 10m
                gpu.intel.com/i915: 1
              limits:
                memory: 8Gi
                gpu.intel.com/i915: 1
            securityContext:
              # s6-overlay needs writable /run and privesc for suexec
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false

    service:
      app:
        ports:
          http:
            port: 11080
            primary: true
          rebroadcast1:
            port: 34135
          rebroadcast2:
            port: 34136
    route:
      app:
        hostnames: ["scrypted.noirprime.com"]
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: scrypted.svg
          gethomepage.dev/name: ScryptedNVR
          gethomepage.dev/group: SmartHome
        parentRefs:
          - name: kgateway-internal
            namespace: networking-system
        rules:
          - backendRefs:
              - identifier: app
                port: http

    persistence:
      app:
        existingClaim: *name
        globalMounts:
          - path: /server/volume
      shared:
        existingClaim: surveillance
        globalMounts:
          - path: /nvr
            subPath: scrypted
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /.cache
            subPath: cache
          - path: /.npm
            subPath: npm-cache
