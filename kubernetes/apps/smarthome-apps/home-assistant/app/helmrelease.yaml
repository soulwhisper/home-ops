---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name home-assistant
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          hacs-installer:
            image:
              repository: busybox
              tag: "1.38.0"
            env:
              HACS_VERSION: "2.0.5"
            command:
              - sh
              - -eu
              - -c
              - |
                marker=/config/custom_components/hacs/.home-ops-version
                if [ -f "$${marker}" ] && [ "$$(cat "$${marker}")" = "$${HACS_VERSION}" ]; then
                  echo "HACS $${HACS_VERSION} is already installed; skipping download and unzip."
                else
                  wget -O /tmp/hacs.zip \
                    "https://github.com/hacs/integration/releases/download/$${HACS_VERSION}/hacs.zip"
                  mkdir -p /config/custom_components/hacs
                  unzip -o /tmp/hacs.zip -d /config/custom_components/hacs
                  printf '%s\n' "$${HACS_VERSION}" > "$${marker}"
                  echo "HACS $${HACS_VERSION} installed."
                fi
        containers:
          app:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2026.10.4
            env:
              OIDC_CLIENT_ID:
                secretKeyRef:
                  name: *name
                  key: oidc_client_id
              OIDC_CLIENT_SECRET:
                secretKeyRef:
                  name: *name
                  key: oidc_client_secret
            resources:
              requests:
                cpu: 40m
              limits:
                memory: 2Gi

    service:
      app:
        ports:
          http:
            appProtocol: kubernetes.io/ws
            port: 8123

    route:
      app:
        hostnames: ["hass.noirprime.com"]
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: /icons/home-assistant.svg
          gethomepage.dev/name: HomeAssistant
          gethomepage.dev/group: SmartHome
        parentRefs:
          - name: kgateway-internal
            namespace: networking-system

    persistence:
      app:
        existingClaim: *name
        globalMounts:
          - path: /config
      packages:
        type: configMap
        name: *name
        globalMounts:
          - path: /config/packages
            readOnly: true
