---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mosquitto
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # password_file entries are <username>:<mosquitto_passwd hash>
        mosquitto: "{{ .mosquitto_username }}:{{ .mosquitto_password_hashed }}"
  dataFrom:
    - extract:
        key: zigbee2mqtt
