---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name mosquitto
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
    configMaps:
      *name :
        data:
          mosquitto.conf: |
            # 2.1: password_file/per_listener_settings directives deprecated,
            # auth moved to the password-file plugin (same code, new shape)
            allow_anonymous false
            autosave_interval 60
            connection_messages false
            listener 1883
            plugin /usr/lib/mosquitto_password_file.so
            plugin_opt_password_file /etc/mosquitto/password_file
            persistence true
            persistence_location /config
            # 2.1 behavior note: max_packet_size now defaults to 2MB (was 256MB)
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: eclipse-mosquitto
              tag: 2.1.2-alpine
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true

    service:
      *name :
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "10.10.0.135"
        ports:
          mqtt:
            port: 1883

    persistence:
      app:
        existingClaim: *name
        globalMounts:
          - path: /config
      config:
        type: configMap
        identifier: *name
        globalMounts:
          - path: /mosquitto/config/mosquitto.conf
            subPath: mosquitto.conf
      secrets:
        type: secret
        name: *name
        globalMounts:
          - path: /etc/mosquitto/password_file
            subPath: mosquitto
            readOnly: true
