---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name mosquitto
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
    configMaps:
      *name :
        data:
          mosquitto.conf: |
            # Mosquitto 2.1 uses the password-file plugin; password_file and
            # per_listener_settings are deprecated.
            allow_anonymous false
            autosave_interval 60
            connection_messages false
            listener 1883
            plugin /usr/lib/mosquitto_password_file.so
            plugin_opt_password_file /etc/mosquitto/password_file
            persistence true
            persistence_location /config
            # Mosquitto 2.1 default max_packet_size is 2MB.
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        # Idempotent chcon to ephemeral_t; the marker proves a completed walk.
        initContainers:
          selinux-relabel:
            image: { repository: ubuntu, tag: "24.04" }
            command:
              - sh
              - -eu
              - -c
              - |
                  if [ "$(stat -c %C /vol)" != "system_u:object_r:ephemeral_t:s0" ] || [ ! -f /vol/.selinux-relabelled ]; then
                    rm -f /vol/.selinux-relabelled
                    chcon -R system_u:object_r:ephemeral_t:s0 /vol
                    touch /vol/.selinux-relabelled
                    echo "relabelled /vol"
                  fi
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"], add: ["FOWNER"] }
              readOnlyRootFilesystem: true
            resources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { memory: 256Mi }
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: eclipse-mosquitto
              tag: 2.1.2-alpine
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true

    service:
      *name :
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "10.10.0.135"
        ports:
          mqtt:
            port: 1883

    persistence:
      app:
        existingClaim: *name
        globalMounts:
          - path: /config
        # the relabel initContainer gets its mounts only via advancedMounts
        # (app-template schema); without this it fails on a missing /vol mount.
        advancedMounts:
          *name :
            selinux-relabel:
              - path: /vol
      config:
        type: configMap
        identifier: *name
        globalMounts:
          - path: /mosquitto/config/mosquitto.conf
            subPath: mosquitto.conf
      secrets:
        type: secret
        name: *name
        globalMounts:
          - path: /etc/mosquitto/password_file
            subPath: mosquitto
            readOnly: true
