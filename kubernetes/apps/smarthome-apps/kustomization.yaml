---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: smarthome-apps
components:
  - ../../components/namespace
  - ../../components/kopiur/secret
resources:
  # storage
  - ./smarthome-nfs/ks.yaml
  # app
  - ./frigate/ks.yaml
  - ./frigate-vision/ks.yaml
  - ./home-assistant/ks.yaml
  - ./home-assistant-sgcc/ks.yaml
  - ./mosquitto/ks.yaml
  - ./scrypted/ks.yaml
  - ./zigbee2mqtt/ks.yaml
patches:
  # kopiur webhook requires an explicit namespace opt-in for uid-0 movers
  # (home-assistant, karakeep write root-owned 0600 state files)
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: _
        annotations:
          kopiur.home-operations.com/privileged-movers: "true"
    target:
      kind: Namespace
