---
# Frigate native GenAI description -> hermes (ops profile) webhook forwarder.
# VLM description+severity run INSIDE frigate (objects.genai -> agentgateway
# omni lane, severity as a [prefix]); this bridge only parses the prefix,
# gates on MIN_SEVERITY, enriches via the events API, and signs the hermes
# webhook (HMAC-V2). HA notification moved to an HA-side MQTT automation.
# Secrets arrive via env (ExternalSecret); nothing sensitive in here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate-vision
data:
  bridge.py: |
    import hashlib
    import hmac
    import json
    import logging
    import os
    import re
    import time

    import httpx
    import paho.mqtt.client as mqtt

    logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(message)s")
    log = logging.getLogger("frigate-vision")

    MQTT_HOST = os.environ.get("MQTT_HOST", "mosquitto.smarthome-apps.svc.cluster.local")
    MQTT_PORT = int(os.environ.get("MQTT_PORT", "1883"))
    FRIGATE_URL = os.environ.get("FRIGATE_URL", "http://frigate.smarthome-apps.svc.cluster.local:5000")
    HERMES_WEBHOOK_URL = os.environ.get(
        "HERMES_WEBHOOK_URL",
        "http://hermes-agent.servitor-apps.svc.cluster.local:8644/p/ops/webhooks/frigate-alert",
    )
    HERMES_WEBHOOK_SECRET = os.environ["HERMES_WEBHOOK_SECRET"]
    MIN_SEVERITY = os.environ.get("MIN_SEVERITY", "medium")  # low|medium|high

    SEVERITY_RANK = {"low": 0, "medium": 1, "high": 2}
    # frigate objects.genai prompt instructs the model to start with [severity]
    SEVERITY_PREFIX = re.compile(r"^\[(low|medium|high)\][.:]?\s*(.*)", re.IGNORECASE | re.DOTALL)

    http = httpx.Client(timeout=httpx.Timeout(30.0, connect=5.0))


    def lookup_event(event_id: str) -> dict:
        # description updates fire at end of object lifecycle; one retry covers
        # the rare case where the event row isn't readable yet
        for attempt in (0, 1):
            try:
                resp = http.get(f"{FRIGATE_URL}/api/events/{event_id}")
                resp.raise_for_status()
                return resp.json()
            except Exception:
                if attempt:
                    raise
                time.sleep(2)
        return {}


    def notify_hermes(payload: dict) -> None:
        body = json.dumps(payload).encode()
        ts = str(int(time.time()))
        sig = hmac.new(
            HERMES_WEBHOOK_SECRET.encode(), f"{ts}.".encode() + body, hashlib.sha256
        ).hexdigest()
        http.post(
            HERMES_WEBHOOK_URL,
            content=body,
            headers={
                "Content-Type": "application/json",
                "X-Webhook-Signature-V2": sig,
                "X-Webhook-Timestamp": ts,
            },
        ).raise_for_status()


    def on_message(client, userdata, msg):
        try:
            update = json.loads(msg.payload)
            if update.get("type") != "description":
                return
            m = SEVERITY_PREFIX.match(str(update.get("description", "")).strip())
            if not m:
                log.warning("description missing severity prefix: %r", str(update.get("description"))[:120])
                return
            severity, description = m.group(1).lower(), m.group(2).strip()
            if SEVERITY_RANK.get(severity, 0) < SEVERITY_RANK[MIN_SEVERITY]:
                return
            event_id = update["id"]
            event = lookup_event(event_id)
            payload = {
                "event_type": "frigate.alert",
                "event_id": event_id,
                "camera": event.get("camera"),
                "label": event.get("label") or event.get("data", {}).get("label"),
                "zones": event.get("zones", []),
                "severity": severity,
                "description": description[:500],
                "timestamp": int(event.get("end_time") or time.time()),
            }
            log.info("event=%s camera=%s [%s] %s", event_id, payload["camera"], severity, description[:80])
            notify_hermes(payload)
        except Exception:
            log.exception("failed processing message")


    client = mqtt.Client(mqtt.CallbackAPIVersion.VERSION2)
    client.username_pw_set(os.environ["MQTT_USERNAME"], os.environ["MQTT_PASSWORD"])
    client.on_message = on_message
    client.connect(MQTT_HOST, MQTT_PORT)
    client.subscribe("frigate/tracked_object_update")
    log.info("listening on %s:%s frigate/tracked_object_update", MQTT_HOST, MQTT_PORT)
    client.loop_forever()
