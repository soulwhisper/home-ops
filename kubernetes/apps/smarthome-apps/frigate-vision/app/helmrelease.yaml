---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name frigate-vision
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
        containers:
          app:
            image:
              repository: ghcr.io/soulwhisper/frigate-vision
              tag: "2026.10.07"
            # deps (paho-mqtt, httpx) are baked into the image at build time;
            # no runtime pip install (the CNP grants no Internet egress, and
            # pypi.org availability stops being a boot dependency)
            command:
              - python
              - /app/bridge.py
            envFrom:
              - secretRef:
                  name: *name
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true

    persistence:
      app:
        type: configMap
        name: *name
        globalMounts:
          - path: /app
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
