---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name frigate-vision
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # mosquitto (same source as home-assistant-sgcc)
        MQTT_USERNAME: "mosquitto"
        MQTT_PASSWORD: "{{ .mosquitto_password_hashed }}"
        # agent gateway (omni lane)
        GATEWAY_API_KEY: "{{ .agentgateway_api_auth }}"
        # home assistant long-lived token
        HA_TOKEN: "{{ .hass_token }}"
        # hermes webhook route secret (per-route HMAC, ops profile)
        HERMES_WEBHOOK_SECRET: "{{ .frigate_webhook_secret }}"
  dataFrom:
    - extract:
        key: home-assistant
    - extract:
        key: llm-api
    - extract:
        key: hermes-agent
