---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: frigate-vision-egress
spec:
  endpointSelector:
    matchLabels:
      "app.kubernetes.io/name": frigate-vision
  egress:
    # LLM gateway (omni lane)
    - toServices:
        - k8sService:
            serviceName: agentgateway-proxy
            namespace: networking-system
      toPorts:
        - ports:
            - { port: "80", protocol: TCP }
    # frigate snapshots
    - toServices:
        - k8sService:
            serviceName: frigate
            namespace: smarthome-apps
      toPorts:
        - ports:
            - { port: "5000", protocol: TCP }
    # MQTT events
    - toServices:
        - k8sService:
            serviceName: mosquitto
            namespace: smarthome-apps
      toPorts:
        - ports:
            - { port: "1883", protocol: TCP }
    # Home Assistant persistent_notification
    - toServices:
        - k8sService:
            serviceName: home-assistant
            namespace: smarthome-apps
      toPorts:
        - ports:
            - { port: "8123", protocol: TCP }
    # hermes webhook (ops profile alerts)
    - toServices:
        - k8sService:
            serviceName: hermes-agent
            namespace: servitor-apps
      toPorts:
        - ports:
            - { port: "8644", protocol: TCP }
    # DNS
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: TCP }
            - { port: "53", protocol: UDP }
