---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-sgcc
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # sgcc
        PHONE_NUMBER: "{{ .sgcc_username }}"
        PASSWORD: "{{ .sgcc_password }}"
        # llm
        OPENAI_BASE_URL: "http://agentgateway-proxy.networking-system.svc.cluster.local:80/chat"
        OPENAI_API_KEY: "{{ .agentgateway_api_auth }}"
        OPENAI_MODEL_NAME: "omni"
        # mosquitto
        MQTT_USERNAME: "mosquitto"
        MQTT_PASSWORD: "{{ .mosquitto_password_hashed }}"
  dataFrom:
    - extract:
        key: home-assistant
    - extract:
        key: llm-api
    - extract:
        key: zigbee2mqtt
