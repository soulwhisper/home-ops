---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &name home-assistant-sgcc
  annotations:
    config.home-ops.io/managed: "true"
  labels:
    config.home-ops.io/deps: "infra"
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *name
  targetNamespace: smarthome-apps
  path: "./kubernetes/apps/smarthome-apps/home-assistant-sgcc/app"
  dependsOn:
    - name: mosquitto
      namespace: smarthome-apps
  # no kopiur/backup: this app mounts the shared `home-assistant` PVC, which
  # home-assistant's own policy already backs up; the component's APP-named
  # PVC has no consumer, stays unbound, and every snapshot fails
  postBuild:
    substitute:
      APP: *name
