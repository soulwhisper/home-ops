---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name dragonfly-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: dragonfly-operator

  values:
    # Keep klog timestamps aligned with CRI/vlagent until VictoriaLogs#1883 is fixed (#27).
    podAnnotations:
      k8tz.io/timezone: "UTC"
    serviceMonitor:
      enabled: true
