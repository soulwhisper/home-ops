---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 3
  # SELinux (Talos pod_t vs unlabeled RBD volumes): CNPG Cluster v1 has no
  # initContainers/podTemplate knob, so labels must be verified live. A new
  # volume (rebuild, scale-out) must be relabeled by hand until CNPG or Talos
  # provides a hook.
  # one instance per node: default podAntiAffinityType is "preferred" (soft) —
  # postgres-2/-3 both landed on exarch-03. "required" is free here:
  # 3 instances on 3 nodes means every feasible placement is 1:1:1 anyway.
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  # ghcr.io/soulwhisper/postgresql — custom suite (vchord + vchord_bm25 + pg_tokenizer + pgroonga + cnpg baseline)
  # Digest-pinned so nodes cannot serve a stale tag with a different postgres
  # UID under IfNotPresent.
  imageName: ghcr.io/soulwhisper/postgresql:18.6@sha256:9cd922e37569121e115c3dbdb026162dd99b0423ebd553f84dee377526d5eb1d
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: barman-cloud
        serverName: postgres-v1 # changeme if restored
  storage:
    size: 50Gi
    storageClass: ceph-block
  superuserSecret:
    name: cloudnative-pg
  enableSuperuserAccess: true
  postgresql:
    # pgroonga MUST NOT be in preload at initdb: PGroonga 4.x's bootstrap-time
    # hook then breaks per-database grn initialization. Without preload the
    # per-db store initializes lazily at CREATE EXTENSION. Runtime re-adding is
    # harmless if WAL/crash-safe is needed (enable_wal=off today).
    shared_preload_libraries:
      - vchord
      - vchord_bm25
      - pg_tokenizer
    parameters:
      effective_io_concurrency: "200"
      max_connections: "400"
      shared_buffers: "2GB"
  resources:
    requests:
      cpu: 500m
    limits:
      memory: 6Gi
  bootstrap:
    initdb:
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
  managed:
    roles:
      - name: immich
        ensure: present
        login: true
        superuser: false
      - name: hindsight
        ensure: present
        login: true
        superuser: false

---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: &name immich
spec:
  cluster:
    name: postgres
  name: *name
  owner: *name
  extensions:
    - name: vector
      ensure: present
    - name: vchord
      ensure: present
    - name: cube
      ensure: present
    - name: earthdistance
      ensure: present
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: &name hindsight
spec:
  cluster:
    name: postgres
  name: *name
  owner: *name
  extensions:
    - name: vector
      ensure: present
    - name: vchord
      ensure: present
    - name: pgroonga
      ensure: present
