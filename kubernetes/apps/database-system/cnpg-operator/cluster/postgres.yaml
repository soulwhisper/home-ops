---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 3
  # SELinux (Talos pod_t vs unlabeled RBD volumes): CNPG Cluster v1 has no
  # initContainers/podTemplate knob, so labels must be verified live. A new
  # volume (rebuild, scale-out) must be relabeled by hand until CNPG or Talos
  # provides a hook.
  # one instance per node: default podAntiAffinityType is "preferred" (soft) —
  # postgres-2/-3 both landed on exarch-03. "required" is free here:
  # 3 instances on 3 nodes means every feasible placement is 1:1:1 anyway.
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  # ghcr.io/soulwhisper/postgresql — custom suite (pgroonga + pgvector + cnpg baseline)
  # Digest-pinned so nodes cannot serve a stale tag with a different postgres
  # UID under IfNotPresent.
  imageName: ghcr.io/soulwhisper/postgresql:18.6@sha256:b8603020b65a51f4ce1b0545ea0d8d90f4430a8b1d47004b31fc6b5544a538a2
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: barman-cloud
        serverName: postgres-v1 # changeme if restored
  storage:
    size: 50Gi
    storageClass: ceph-block
  superuserSecret:
    name: cloudnative-pg
  enableSuperuserAccess: true
  postgresql:
    # pgroonga_wal_resource_manager propagates pgroonga index changes to replicas.
    # Do not preload pgroonga itself: its initdb bootstrap hook breaks per-database grn init.
    shared_preload_libraries:
      - pgroonga_wal_resource_manager
    parameters:
      effective_io_concurrency: "200"
      max_connections: "400"
      shared_buffers: "2GB"
      pgroonga.enable_wal_resource_manager: "on"
  resources:
    requests:
      cpu: 500m
    limits:
      memory: 6Gi
  managed:
    roles:
      - name: hindsight
        ensure: present
        login: true
        superuser: false

---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: &name hindsight
spec:
  cluster:
    name: postgres
  name: *name
  owner: *name
  extensions:
    - name: vector
      ensure: present
    - name: vchord
      ensure: absent
    - name: pgroonga
      ensure: present
