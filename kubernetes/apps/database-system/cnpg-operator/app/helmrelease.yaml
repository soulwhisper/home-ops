---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name cnpg-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cloudnative-pg

  values:
    fullnameOverride: *name
    replicaCount: 1
    # ScheduledBackup cron has no timezone field; keep the operator on UTC and
    # express schedules as UTC.
    additionalEnv:
      - name: TZ
        value: UTC
    crds:
      create: true
