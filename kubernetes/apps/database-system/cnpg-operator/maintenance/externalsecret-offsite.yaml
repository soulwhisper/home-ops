---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# Offsite S3 (nix-dev versitygw, corp VM) credentials + rclone crypt password for
# the postgres backup offsite sync job. The crypt password is stored in rclone's
# obscured form (output of `rclone obscure <random>`) — the underlying plaintext
# is never needed and should be discarded after generating.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name offsite-s3
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: offsite-s3-secret
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .admin_user }}"
        AWS_SECRET_ACCESS_KEY: "{{ .admin_pass }}"
        RCLONE_CRYPT_PASSWORD: "{{ .crypt_password }}"
  dataFrom:
    - extract:
        key: nix-dev-versitygw
