---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name postgres-offsite-sync
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    controllers:
      *name :
        type: cronjob
        cronjob:
          schedule: "30 6 * * *" # after CNPG backups (03:00) and kopia repo replication (05:30)
          activeDeadlineSeconds: 3600
          backoffLimit: 1
          concurrencyPolicy: Forbid
          failedJobsHistory: 1
          successfulJobsHistory: 1
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
        containers:
          app:
            image:
              repository: rclone/rclone
              tag: "1.75.1"
            args:
              - sync
              - "nas:postgres"
              - "offsite:"
              - --fast-list
              - --transfers=8
              - --stats=30s
              - --stats-one-line
            env:
              RCLONE_CONFIG_NAS_TYPE: s3
              RCLONE_CONFIG_NAS_PROVIDER: Other
              RCLONE_CONFIG_NAS_ENDPOINT: http://nas.homelab.internal:9000
              RCLONE_CONFIG_NAS_FORCE_PATH_STYLE: "true"
              RCLONE_CONFIG_NAS_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: cloudnative-pg
                    key: aws-access-key-id
              RCLONE_CONFIG_NAS_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: cloudnative-pg
                    key: aws-secret-access-key
              RCLONE_CONFIG_REMOTE_TYPE: s3
              RCLONE_CONFIG_REMOTE_PROVIDER: Other
              RCLONE_CONFIG_REMOTE_ENDPOINT: http://172.19.82.10:9000
              RCLONE_CONFIG_REMOTE_FORCE_PATH_STYLE: "true"
              RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: offsite
                    key: AWS_ACCESS_KEY_ID
              RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: offsite
                    key: AWS_SECRET_ACCESS_KEY
              RCLONE_CONFIG_OFFSITE_TYPE: crypt
              RCLONE_CONFIG_OFFSITE_REMOTE: remote:postgres
              RCLONE_CONFIG_OFFSITE_FILENAME_ENCRYPTION: standard
              RCLONE_CONFIG_OFFSITE_DIRECTORY_NAME_ENCRYPTION: "true"
              RCLONE_CONFIG_OFFSITE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: offsite
                    key: RCLONE_CRYPT_PASSWORD
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
