---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name postgres-backup-verify
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    # Verification script. NOTE: `barman-cloud-check-wal-archive` is a
    # *pre-flight* check for NEW servers — it fails unless the WAL archive is
    # empty — so it can never pass against this live, archiving cluster.
    # This script checks the latest base backup's required begin-to-end WAL
    # range in the archive. Object presence is not content validation, a
    # restore test, or proof of PITR beyond the backup's end_wal.
    configMaps:
      scripts:
        enabled: true
        data:
          verify-backup-chain.py: |
            #!/usr/bin/env python3
            import re
            import sys

            import boto3

            ENDPOINT = "http://nas.homelab.internal:9000"
            BUCKET = "postgres"
            SERVER = "postgres-v1"

            WAL_RE = re.compile(r"^([0-9A-F]{24})(\.partial)?(\.[a-z0-9]+)?$")

            s3 = boto3.client("s3", endpoint_url=ENDPOINT)
            errors = []


            def list_keys(prefix):
                keys, token = [], None
                while True:
                    kwargs = {"Bucket": BUCKET, "Prefix": prefix}
                    if token:
                        kwargs["ContinuationToken"] = token
                    resp = s3.list_objects_v2(**kwargs)
                    keys.extend(o["Key"] for o in resp.get("Contents", []))
                    if not resp.get("IsTruncated"):
                        return keys
                    token = resp["NextContinuationToken"]


            def wal_position(wal, segments_per_log):
                if not wal or not re.fullmatch(r"[0-9A-F]{24}", wal):
                    raise ValueError(f"missing/invalid WAL segment name: {wal!r}")
                timeline = wal[:8]
                logid, segno = int(wal[8:16], 16), int(wal[16:24], 16)
                if int(timeline, 16) == 0 or segno >= segments_per_log:
                    raise ValueError(f"invalid WAL segment: {wal}")
                return timeline, logid * segments_per_log + segno


            backup_keys = sorted(
                k for k in list_keys(f"{SERVER}/base/") if k.endswith("/backup.info")
            )
            if not backup_keys:
                errors.append(f"no base backups found under s3://{BUCKET}/{SERVER}/base/")
            else:
                latest = backup_keys[-1]
                info = s3.get_object(Bucket=BUCKET, Key=latest)["Body"].read().decode()
                fields = dict(
                    line.split("=", 1) for line in info.splitlines() if "=" in line
                )
                try:
                    # Barman records PostgreSQL wal_segment_size in bytes as
                    # xlog_segment_size (normally 16777216). Require the field
                    # rather than assuming the default for an unknown backup.
                    segment_size = int(fields["xlog_segment_size"])
                    if (
                        not (1 << 20) <= segment_size <= (1 << 30)
                        or segment_size & (segment_size - 1)
                    ):
                        raise ValueError("invalid xlog_segment_size")
                    segments_per_log = (1 << 32) // segment_size
                    begin_wal, end_wal = fields.get("begin_wal"), fields.get("end_wal")
                    begin_tli, begin_pos = wal_position(begin_wal, segments_per_log)
                    end_tli, end_pos = wal_position(end_wal, segments_per_log)
                    if begin_tli != end_tli or end_pos < begin_pos:
                        raise ValueError("incoherent begin_wal/end_wal range")
                except (KeyError, TypeError, ValueError) as exc:
                    errors.append(f"{latest}: invalid backup.info: {exc}")

                if not errors:
                    print(
                        f"latest backup: {latest.split('/')[-2]} "
                        f"begin_wal={begin_wal} end_wal={end_wal} "
                        f"xlog_segment_size={segment_size}"
                    )
                    positions = set()
                    for key in list_keys(f"{SERVER}/wals/"):
                        name = key.rsplit("/", 1)[-1]
                        m = WAL_RE.fullmatch(name)
                        if not m or m.group(2):  # partial WAL cannot fill a gap
                            continue
                        seg = m.group(1)
                        if seg[:8] != begin_tli:
                            continue  # old timelines and history are unrelated
                        try:
                            _, pos = wal_position(seg, segments_per_log)
                        except ValueError:
                            continue
                        if begin_pos <= pos <= end_pos:
                            positions.add(pos)

                    for label, wal, pos in (
                        ("begin_wal", begin_wal, begin_pos),
                        ("end_wal", end_wal, end_pos),
                    ):
                        if pos not in positions:
                            errors.append(f"latest backup {label} is not archived: {wal}")

                    ordered = sorted(positions)
                    gaps = [
                        (a, b)
                        for a, b in zip(ordered, ordered[1:])
                        if b - a != 1
                    ]
                    if gaps:
                        a, b = gaps[0]
                        logid, segno = divmod(a + 1, segments_per_log)
                        errors.append(
                            f"timeline {int(begin_tli, 16)}: {len(gaps)} WAL gap(s) "
                            f"inside backup range; first missing: "
                            f"{begin_tli}{logid:08X}{segno:08X}"
                        )
                    if not errors:
                        print(
                            f"required WAL range: {len(positions)} complete archived "
                            "segments; contents and restore not tested"
                        )

            for err in errors:
                print(f"VERIFICATION FAILED: {err}")
            sys.exit(1 if errors else 0)

    controllers:
      *name :
        type: cronjob
        cronjob:
          schedule: "0 4 * * 0"
          activeDeadlineSeconds: 1800 # 30m
          backoffLimit: 0
          concurrencyPolicy: Forbid
          failedJobsHistory: 1
          successfulJobsHistory: 1
        pod:
          securityContext:
            # CNPG postgres image uses postgres UID 26, GID 102
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 102
            fsGroup: 102
        containers:
          app:
            image:
              repository: ghcr.io/cloudnative-pg/postgresql
              tag: 18
            command:
              - python3
            args:
              - /scripts/verify-backup-chain.py
            env:
              AWS_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: cloudnative-pg
                    key: aws-access-key-id
              AWS_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: cloudnative-pg
                    key: aws-secret-access-key
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true

    persistence:
      scripts:
        type: configMap
        identifier: scripts
        defaultMode: 0555
        globalMounts:
          - path: /scripts
            readOnly: true
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
