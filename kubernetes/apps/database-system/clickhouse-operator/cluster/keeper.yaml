---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/clickhouse.com/keepercluster_v1alpha1.json
apiVersion: clickhouse.com/v1alpha1
kind: KeeperCluster
metadata:
  name: default
spec:
  replicas: 3
  dataVolumeClaimSpec:
    storageClassName: ceph-block
    accessModes: ["ReadWriteOnce"]
    resources:
      requests:
        storage: 10Gi
  podTemplate:
    topologyZoneKey: topology.kubernetes.io/zone
    nodeHostnameKey: kubernetes.io/hostname
  containerTemplate:
    image:
      repository: docker.io/clickhouse/clickhouse-keeper
      # renovate: datasource=docker depName=clickhouse/clickhouse-keeper
      tag: 26.10.3.7
    resources:
      requests: # default = 2C4G
        cpu: 100m
        memory: 384Mi
      limits: # default = 4C8G
        cpu: "500m"
        memory: "512Mi"
