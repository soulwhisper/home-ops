---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/clickhouse.com/clickhousecluster_v1alpha1.json
apiVersion: clickhouse.com/v1alpha1
kind: ClickHouseCluster
metadata:
  name: default
spec:
  replicas: 2
  shards: 1
  keeperClusterRef:
    name: default
  dataVolumeClaimSpec:
    storageClassName: ceph-block
    accessModes: ["ReadWriteOnce"]
    resources:
      requests:
        storage: 100Gi
  podTemplate:
    topologyZoneKey: topology.kubernetes.io/zone
    initContainers:
      # One-time + bootstrap guard: PVC data/log dirs are created root-owned,
      # but the server runs as uid/gid 101. Chown before every start so fresh
      # volumes bootstrap cleanly and the ownership warning stays gone.
      - name: chown-data
        # renovate: datasource=docker depName=docker.io/library/busybox
        image: docker.io/library/busybox:1.38
        command:
          - sh
          - -c
          - chown -R 101:101 /var/lib/clickhouse /var/log/clickhouse-server
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID"]
        volumeMounts:
          - name: clickhouse-storage-volume
            mountPath: /var/lib/clickhouse
          - name: clickhouse-storage-volume
            mountPath: /var/log/clickhouse-server
    nodeHostnameKey: kubernetes.io/hostname
    volumes:
      - name: init-db
        configMap:
          name: clickhouse-init-db
      - name: init-user
        secret:
          secretName: clickhouse-credentials
          items:
            - key: langfuse.yaml
              path: langfuse.yaml
  containerTemplate:
    resources:
      requests:
        cpu: "2"
        memory: "4Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
    volumeMounts:
      - mountPath: /docker-entrypoint-initdb.d/
        name: init-db
        readOnly: true
      - mountPath: /etc/clickhouse-server/users.d/
        name: init-user
        readOnly: true
  settings:
    enableDatabaseSync: true
    defaultUserPassword:
      passwordType: password
      secret:
        name: clickhouse-credentials
        key: default_password
