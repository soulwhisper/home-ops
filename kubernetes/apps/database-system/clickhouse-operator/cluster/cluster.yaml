---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/clickhouse.com/clickhousecluster_v1alpha1.json
apiVersion: clickhouse.com/v1alpha1
kind: ClickHouseCluster
metadata:
  name: default
spec:
  replicas: 2
  shards: 1
  keeperClusterRef:
    name: default
  dataVolumeClaimSpec:
    storageClassName: ceph-block
    accessModes: ["ReadWriteOnce"]
    resources:
      requests:
        storage: 100Gi
  podTemplate:
    topologyZoneKey: topology.kubernetes.io/zone
    initContainers:
      # One-time + bootstrap guard: PVC data/log dirs are created root-owned,
      # but the server runs as uid/gid 101. Chown before every start so fresh
      # volumes bootstrap cleanly and the ownership warning stays gone.
      - name: chown-data
        # renovate: datasource=docker depName=docker.io/library/busybox
        image: docker.io/library/busybox:1.38
        command:
          - sh
          - -c
          - chown -R 101:101 /var/lib/clickhouse /var/log/clickhouse-server
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID"]
        volumeMounts:
          - name: clickhouse-storage-volume
            mountPath: /var/lib/clickhouse
          - name: clickhouse-storage-volume
            mountPath: /var/log/clickhouse-server
      # Same Talos SELinux fix as victoria-logs (full story in the
      # victoria-logs helmrelease): ClickHouse writes to its unlabeled RBD
      # volume were one of the 2026-10-18 permissive-AVC flood sources, and
      # seLinuxOptions is a proven no-op on Talos. Relabel idempotently to
      # ephemeral_t at pod start; root required (chcon needs ownership).
      - name: selinux-relabel
        image: ubuntu:24.04
        command:
          - sh
          - -eu
          - -c
          - |
            # Marker-file proof of a COMPLETED full walk; deleted BEFORE
            # each redo so a mid-walk failure (e.g. RBD stall) can't leave
            # a stale marker (see victoria-logs helmrelease).
            if [ "$(stat -c %C /storage)" != "system_u:object_r:ephemeral_t:s0" ] || [ ! -f /storage/.selinux-relabelled ]; then
              rm -f /storage/.selinux-relabelled
              chcon -R system_u:object_r:ephemeral_t:s0 /storage
              touch /storage/.selinux-relabelled
              echo "relabelled /storage"
            fi
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["FOWNER"]
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: clickhouse-storage-volume
            mountPath: /storage
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { memory: 256Mi }
    nodeHostnameKey: kubernetes.io/hostname
    volumes:
      - name: init-db
        configMap:
          name: clickhouse-init-db
      - name: init-user
        secret:
          secretName: clickhouse-credentials
          items:
            - key: langfuse.yaml
              path: langfuse.yaml
  containerTemplate:
    resources:
      requests:
        cpu: "2"
        memory: "4Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
    volumeMounts:
      - mountPath: /docker-entrypoint-initdb.d/
        name: init-db
        readOnly: true
      - mountPath: /etc/clickhouse-server/users.d/
        name: init-user
        readOnly: true
  settings:
    enableDatabaseSync: true
    defaultUserPassword:
      passwordType: password
      secret:
        name: clickhouse-credentials
        key: default_password
