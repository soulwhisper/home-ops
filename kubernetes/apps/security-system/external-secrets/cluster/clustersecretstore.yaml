---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes
spec:
  provider:
    kubernetes:
      # Source namespace for all secrets served by this store.
      remoteNamespace: monitoring-system
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          # read next to the secrets; SA itself stays in security-system
          namespace: monitoring-system
          key: ca.crt
      auth:
        serviceAccount:
          name: "eso-kubernetes"
          namespace: security-system
