---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/kyverno.io/clusterpolicy_v1.json
# Privilege-escalation tripwire. Two rules, both AUDIT:
# 1) any new/edited binding to cluster-admin (excluding the known-good
#    cluster-admin creators: flux, system:masters internals)
# 2) any new/edited ClusterRole containing wildcard resource+verb grants
# An injected agent or supply-chain payload that wants persistence must
# escalate first — this is where it shows up.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: audit-rbac-escalation
spec:
  background: false
  # Audit-only: a down or slow single-replica admission controller must not
  # block RBAC writes, including Flux's, cluster-wide (webhook default is Fail).
  webhookConfiguration:
    failurePolicy: Ignore
  rules:
    - name: binding-to-cluster-admin
      match:
        any:
          - resources:
              kinds: ["ClusterRoleBinding", "RoleBinding"]
              operations: ["CREATE", "UPDATE"]
      exclude:
        any:
          - clusterRoles: ["cluster-admin"]
      validate:
        failureAction: Audit
        message: >-
          {{ request.operation }} of {{ request.kind }}
          {{ request.namespace }}/{{ request.name }} grants cluster-admin
          (or a cluster-admin-equivalent role) by
          {{ request.userInfo.username }} — verify intent
        deny:
          conditions:
            any:
              - key: "{{ request.object.roleRef.name }}"
                operator: AnyIn
                value: ["cluster-admin", "cluster-reconciler-gitops-system"]
    - name: wildcard-clusterrole
      match:
        any:
          - resources:
              kinds: ["ClusterRole"]
              operations: ["CREATE", "UPDATE"]
      exclude:
        any:
          - clusterRoles: ["cluster-admin"]
      validate:
        failureAction: Audit
        message: >-
          {{ request.operation }} of ClusterRole {{ request.name }} with
          wildcard '*' rules by {{ request.userInfo.username }} — verify
          intent; prefer scoped roles
        deny:
          conditions:
            any:
              - key: "{{ contains(request.object.rules[].resources[] || `[]`, '*') || contains(request.object.rules[].verbs[] || `[]`, '*') }}"
                operator: Equals
                value: true
