---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/policies.kyverno.io/validatingpolicy_v1.json
# Out-of-band write detector for gitops-managed app namespaces. In the AI-ops
# era the agent reasons over cluster state — manual kubectl edits that bypass
# git are the main RCA noise source. Excluding every ServiceAccount (flux,
# operators, system) leaves only human Users: if a person touches these
# namespaces outside git, it lands in a PolicyReport. AUDIT ONLY.
# Migrated from ClusterPolicy v1 (deprecated in kyverno v1.19): match+exclude
# became matchConstraints+matchConditions, the unconditional deny:{} became
# an always-false validation (Audit action records it, blocks nothing).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: audit-nonflux-writes
spec:
  evaluation:
    background:
      enabled: false
  # Audit-only: a down or slow single-replica admission controller must not
  # block writes cluster-wide (webhook default is Fail).
  failurePolicy: Ignore
  validationActions:
    - Audit
  matchConstraints:
    resourceRules:
      - apiGroups: ['apps']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE', 'DELETE']  # admission maps HTTP PATCH to UPDATE
        resources: ['deployments', 'statefulsets', 'daemonsets']
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE', 'DELETE']
        resources: ['services', 'configmaps', 'secrets']
      - apiGroups: ['networking.k8s.io']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE', 'DELETE']
        resources: ['ingresses']
      - apiGroups: ['gateway.networking.k8s.io']
        apiVersions: ['v1', 'v1beta1']
        operations: ['CREATE', 'UPDATE', 'DELETE']
        resources: ['httproutes']
      - apiGroups: ['helm.toolkit.fluxcd.io']
        apiVersions: ['v2']
        operations: ['CREATE', 'UPDATE', 'DELETE']
        resources: ['helmreleases']
      - apiGroups: ['kustomize.toolkit.fluxcd.io']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE', 'DELETE']
        resources: ['kustomizations']
  matchConditions:
    - name: gitops-managed-namespaces
      # request.namespace survives DELETE (object is null there); all matched
      # kinds are namespaced
      expression: >-
        request.namespace in
        ['servitor-apps', 'smarthome-apps', 'selfhosted-apps', 'gaming-apps',
         'monitoring-system', 'storage-system', 'database-system']
    # all machine actors: flux, operators, controllers — the remaining
    # signal is human users only
    - name: human-users-only
      expression: "!('system:serviceaccounts' in request.userInfo.groups)"
  variables:
    # DELETE admission has object=null and the resource in oldObject
    - name: target
      expression: "oldObject != null ? oldObject : object"
  validations:
    - expression: 'false'
      messageExpression: >-
        "out-of-band " + request.operation + " on "
        + request.namespace + "/" + variables.target.metadata.name + " by "
        + request.userInfo.username
        + " — gitops-managed namespace; route the change through git or record the exception"
