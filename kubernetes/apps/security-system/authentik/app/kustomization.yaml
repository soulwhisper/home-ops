---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # app
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  # utils
  - ./externalsecret.yaml
  - ./httproute.yaml
  - ./referencegrant.yaml
  # core blueprints
  - ./blueprints/core/basic-users.yaml
  # oidc blueprints
  - ./blueprints/oidc/forgejo.yaml
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: "disabled"
  # helmrelease mounts these by fixed name (blueprints.configMaps) — a hashed
  # suffix leaves the worker's volume pointing at a name that never exists
  disableNameSuffixHash: true
configMapGenerator:
  - name: authentik-blueprints-core
    files:
      - ./blueprints/core/flow-authentication.yaml
      - ./blueprints/core/outpost-proxy.yaml
      - ./blueprints/core/policy-reputation.yaml
      - ./blueprints/core/scope-groups-mapping.yaml
      - ./blueprints/core/scope-groups.yaml
      - ./blueprints/core/notifications.yaml
  - name: authentik-blueprints-forward
    files:
      - ./blueprints/forward/agentgateway.yaml
      - ./blueprints/forward/bambuddy.yaml
      - ./blueprints/forward/covel.yaml
      - ./blueprints/forward/hermes-agent.yaml
      - ./blueprints/forward/homepage.yaml
      - ./blueprints/forward/hubble.yaml
      - ./blueprints/forward/open-webui.yaml
      - ./blueprints/forward/victoria-logs.yaml
      - ./blueprints/forward/victoria-metrics.yaml
      - ./blueprints/forward/victoria-alert.yaml
      - ./blueprints/forward/victoria-traces.yaml
      - ./blueprints/forward/trendradar.yaml
