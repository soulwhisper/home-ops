---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/gateway.networking.k8s.io/referencegrant_v1beta1.json
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: authentik-ext-auth-grant
spec:
  from:
    - group: gateway.kgateway.dev
      kind: GatewayExtension
      namespace: networking-system
  to:
    - group: ""
      kind: Service
      name: authentik-server
---
# forward-auth app routes: /outpost.goauthentik.io/* must reach the embedded
# outpost directly (OAuth callback etc.), bypassing ext-authz
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: authentik-outpost-route-grant
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kube-system
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: media-apps
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: monitoring-system
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: networking-system
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: selfhosted-apps
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: servitor-apps
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: smarthome-apps
  to:
    - group: ""
      kind: Service
      name: authentik-server
