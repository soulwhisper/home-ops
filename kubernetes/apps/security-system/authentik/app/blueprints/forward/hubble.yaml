---
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: hubble-proxy-provider
    identifiers:
      name: &provider hubble-proxy-provider
    attrs:
      name: *provider
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-invalidation-flow],
        ]
      mode: forward_domain
      external_host: &domain "https://hubble.noirprime.com"
      access_token_validity: "hours=12"
      cookie_domain: "noirprime.com"
  - model: authentik_core.application
    id: hubble
    identifiers:
      slug: &name hubble
    attrs:
      name: *name
      provider: !KeyOf hubble-proxy-provider
      meta_launch_url: *domain
      group: "Observability"
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf hubble
      group: !Find [authentik_core.group, [name, homelab-admin]]
      order: 0
    attrs: { enabled: true, timeout: 30 }
