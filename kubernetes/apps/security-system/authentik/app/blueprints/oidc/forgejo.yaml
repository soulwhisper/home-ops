---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprints-oidc-forgejo
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  dataFrom:
    - extract:
        key: authentik
  target:
    template:
      data:
        forgejo.yaml: |
          # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
          version: 1
          context:
            # operator-generated random pair, stored in the 1Password
            # `authentik` item; the forgejo side gets the same values via
            # infrastructure/forgejo/oidc-auth-source.sh (manual, once)
            client_id: "{{ .forgejo_oidc_client_id }}"
            client_secret: "{{ .forgejo_oidc_client_secret }}"
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              id: forgejo-oidc-provider
              identifiers:
                name: &provider forgejo-oidc-provider
              attrs:
                name: *provider
                client_id: !Context client_id
                client_secret: !Context client_secret
                authorization_flow:
                  !Find [
                    authentik_flows.flow,
                    [slug, default-provider-authorization-implicit-consent],
                  ]
                invalidation_flow:
                  !Find [
                    authentik_flows.flow,
                    [slug, default-invalidation-flow],
                  ]
                client_type: confidential
                grant_types: ["authorization_code", "refresh_token"]
                redirect_uris:
                  # requires forgejo ROOT_URL=https://git.noirprime.com applied
                  # (infrastructure/synology/forgejo/docker-compose.yml) BEFORE
                  # the auth source is created on the NAS
                  - url: "https://git.noirprime.com/user/oauth2/authentik/callback"
                    matching_mode: strict
                sub_mode: user_email
                include_claims_in_id_token: true
                signing_key:
                  !Find [
                    authentik_crypto.certificatekeypair,
                    [name, "authentik Self-signed Certificate"],
                  ]
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
            - model: authentik_core.application
              id: forgejo
              identifiers:
                slug: &name forgejo
              attrs:
                name: *name
                provider: !KeyOf forgejo-oidc-provider
                meta_launch_url: "https://git.noirprime.com"
                group: "Service"
                policy_engine_mode: any
            - model: authentik_policies.policybinding
              identifiers:
                target: !KeyOf forgejo
                group: !Find [authentik_core.group, [name, homelab-admin]]
                order: 0
              attrs: { enabled: true, timeout: 30 }
            - model: authentik_policies.policybinding
              identifiers:
                target: !KeyOf forgejo
                group: !Find [authentik_core.group, [name, homelab-internal]]
                order: 10
              attrs: { enabled: true, timeout: 30 }
