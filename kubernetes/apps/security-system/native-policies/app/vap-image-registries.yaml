---
# Image provenance audit. Flags containers whose image registry is outside the
# observed allowlist; images without an explicit registry resolve to docker.io.
# Audit-only: this policy never blocks pod admission.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: audit-image-registries
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])
    - name: allowedRegistries
      expression: >-
        ['ghcr.io', 'quay.io', 'registry.k8s.io', 'docker.io', 'index.docker.io',
         'registry.gitlab.com', 'gsoci.azurecr.io', 'cr.kgateway.dev',
         'cr.agentgateway.dev', 'docker.stirlingpdf.com', 'docker.dragonflydb.io',
         'git.b4mad.industries']
    - name: nonAllowlisted
      expression: >-
        variables.containers
        .filter(c, c.image.matches('^[^/]+[.:][^/]*/') || c.image.startsWith('localhost/'))
        .filter(c, !variables.allowedRegistries.exists(r, c.image.startsWith(r + '/')))
        .map(c, c.image)
  validations:
    - expression: size(variables.nonAllowlisted) == 0
      messageExpression: >-
        'container image from a non-allowlisted registry: ' + variables.nonAllowlisted.join(', ')
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: audit-image-registries
spec:
  policyName: audit-image-registries
  validationActions: ["Audit"]
