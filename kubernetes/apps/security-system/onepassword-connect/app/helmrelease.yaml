---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name onepassword-connect
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: onepassword-connect

  values:
    connect:
      # HA pair; all replicas mount the same shared credentials secret
      replicas: 2
      credentialsName: *name
      credentialsKey: 1password-credentials.json
      api:
        httpPort: 8080
        imageRepository: ghcr.io/1password/connect-api
        serviceMonitor:
          enabled: true
        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits: { memory: 256Mi }
      sync:
        imageRepository: ghcr.io/1password/connect-sync
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { memory: 128Mi }
      pdb:
        enabled: true
        maxUnavailable: null # chart default (1) would win over minAvailable
        minAvailable: 1
