---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &name frigate-vision
  annotations:
    config.home-ops.io/managed: "true"
  labels:
    config.home-ops.io/deps: "infra"
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *name
  targetNamespace: smarthome-apps
  path: "./kubernetes/apps/smarthome-apps/frigate-vision/app"
  dependsOn:
    - name: frigate
      namespace: smarthome-apps
    - name: mosquitto
      namespace: smarthome-apps
    - name: agentgateway
      namespace: networking-system
    - name: hermes-agent
      namespace: servitor-apps
  postBuild:
    substitute:
      APP: *name
