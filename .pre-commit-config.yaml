---
# yaml-language-server: $schema=https://raw.githubusercontent.com/j178/prek/refs/heads/master/prek.schema.json
minimum_prek_version: "0.3.4"
exclude: "^.*/.*_sources/"
repos:
  # Basic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: (^|/)\.pre-commit-config\.ya?ml$

  # GitHub Actions linting
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        # v1.7.12 ships a stale popular-actions schema for
        # create-github-app-token (rejects client-id, demands app-id);
        # runtime v3 accepts client-id. Ignore scoped to that action only.
        args: [-ignore, input.*(app-id|client-id).*create-github-app-token]

  # GitHub Actions security audit
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.24.1
    hooks:
      - id: zizmor
        args:
          - "--config=.github/zizmor.yaml"
          - "--persona=regular"
          - "--min-severity=medium"
          - "--min-confidence=medium"

  # YAML lint
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  # K8S
  - repo: local
    hooks:
      - id: kubeconform
        name: kubeconform
        entry: kubeconform
        args:
          - "-strict"
          # mirror .woodpecker/flux-kubeconform.yaml: schema gaps (e.g.
          # kustomize Kustomization) must not fail local runs when CI passes
          - "-ignore-missing-schemas"
          - "-summary"
          - "-schema-location=default"
          - "-schema-location=https://soulwhisper.github.io/k8s-schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
        language: system
        files: ^kubernetes/.*\.ya?ml$
        # bootstrap/ is helmfile state; components/ requires Flux substitutions.
        # Validate rendered component consumers, not their raw ${...} templates.
        # **/blueprints/ holds authentik blueprint entries — ConfigMap data with
        # no kind/apiVersion, never applied as k8s resources.
        # **/ks.yaml Flux Kustomizations omit interval/prune/sourceRef by design
        # (kubernetes/flux/cluster/cluster.yaml patches them in at reconcile
        # time), so the strict CRD schema can never pass pre-injection; CI
        # validates the rendered manifests instead.
        exclude: ^kubernetes/(bootstrap|components)/|/blueprints/|/ks\.yaml$
