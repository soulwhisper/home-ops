---
# Woodpecker port of .github/workflows/infra-checks.yaml (job: dnscontrol).
# Kept alongside the GitHub workflow for the forgejo+woodpecker migration.
# Split into its own workflow so checks run in parallel on separate agents.
# Runner image: ghcr.io/soulwhisper/woodpecker-runner has dnscontrol baked.
when:
  - event: pull_request
    path: ["infrastructure/**", ".justfiles/**"]

steps:
  - name: dnscontrol check
    image: ghcr.io/soulwhisper/woodpecker-runner:latest
    pull: true
    commands:
      - cd infrastructure/dnscontrol && dnscontrol check
