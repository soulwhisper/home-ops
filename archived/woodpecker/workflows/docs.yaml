---
# Woodpecker port of .github/workflows/docs.yaml.
# Kept alongside the GitHub workflow for the forgejo+woodpecker migration.
# Deploy pushes the built site to the `gh-pages` branch; configure the pages
# source (GitHub Pages branch source or forgejo-pages after cutover) to serve
# from it.
# Build keeps the official uv image (no install step); deploy uses the
# runner image for git.
# Prerequisites:
#   - woodpecker repo secret `pages_push_token` (contents:write on the repo)
when:
  - event: push
    branch: main
    path: ["docs/**", "mkdocs.yml"]
  - event: manual

concurrency: 1

steps:
  - name: build docs
    image: ghcr.io/astral-sh/uv:0.12
    commands:
      - uvx zensical build --clean

  - name: deploy to gh-pages branch
    image: ghcr.io/soulwhisper/woodpecker-runner:latest
    pull: true
    environment:
      PAGES_PUSH_TOKEN:
        from_secret: pages_push_token
    commands:
      - |
        cd site
        git init -q
        git add -A
        git -c user.name="woodpecker-ci" -c user.email="ci@noirprime.com" \
          commit -qm "docs: deploy ${CI_COMMIT_SHA}"
        git push --force -q \
          "https://ci:${PAGES_PUSH_TOKEN}@${CI_REPO_CLONE_URL#*://}" \
          HEAD:refs/heads/gh-pages
