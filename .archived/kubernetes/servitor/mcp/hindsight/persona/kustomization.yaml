---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../app
patches:
  - path: mcpremoteproxy.patch
    target:
      group: toolhive.stacklok.dev
      version: v1beta1
      kind: MCPRemoteProxy
      name: mcp-hindsight
  - path: mcptoolconfig.patch
    target:
      group: toolhive.stacklok.dev
      version: v1alpha1
      kind: MCPToolConfig
      name: mcp-hindsight
