---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zigbee2mqtt
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        ZIGBEE2MQTT_CONFIG_MQTT_USER: "{{ .mosquitto_username }}"
        ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD: "{{ .mosquitto_password }}"
        ZIGBEE2MQTT_CONFIG_ADVANCED_PAN_ID: "{{ .zigbee_pan_id }}"
        ZIGBEE2MQTT_CONFIG_ADVANCED_EXT_PAN_ID: "{{ .zigbee_ext_pan_id }}"
        ZIGBEE2MQTT_CONFIG_ADVANCED_NETWORK_KEY: "{{ .zigbee_network_key }}"
  dataFrom:
    - extract:
        key: zigbee2mqtt
