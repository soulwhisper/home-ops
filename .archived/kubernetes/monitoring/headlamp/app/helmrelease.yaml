---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name headlamp
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: headlamp

  values:
    fullnameOverride: *name
    replicaCount: 1
    initContainers:
      # Install Flux plugin
      - name: headlamp-plugins
        image: ghcr.io/headlamp-k8s/headlamp-plugin-flux:v0.7.0
        command:
          - /bin/sh
          - -c
          - mkdir -p /build/plugins && cp -r /plugins/* /build/plugins/
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 101
        volumeMounts:
          - name: headlamp-plugins
            mountPath: /build/plugins
    podAnnotations:
      reloader.stakater.com/auto: "true"
    config:
      pluginsDir: /build/plugins
      oidc:
        secret:
          create: false
        externalSecret:
          enabled: true
          name: *name
    service:
      port: 4466
    clusterRoleBinding:
      create: false
    serviceAccount:
      create: false
      name: headlamp-admin
    volumes:
      - name: headlamp-plugins
        emptyDir: {}
    volumeMounts:
      - name: headlamp-plugins
        mountPath: /build/plugins
