---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # chart envFrom's this secret verbatim; headlamp reads OIDC_* env names
        OIDC_ISSUER_URL: "https://auth.noirprime.com/application/o/headlamp/"
        OIDC_SCOPES: "openid profile email"
        OIDC_CLIENT_ID: "{{ .headlamp_oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .headlamp_oidc_client_secret }}"
  dataFrom:
    - extract:
        key: authentik
