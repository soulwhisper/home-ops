---
# Restore reference for the apiserver OIDC trust used by Headlamp. Merge the
# jwt entry into the KubeAuthenticationConfig in
# infrastructure/talos/prod/10-general.yaml; the anonymous block is repeated so
# this file can also be used as a complete patch document.
apiVersion: v1alpha1
kind: KubeAuthenticationConfig
configuration:
  anonymous:
    enabled: true
    conditions:
      - path: /livez
      - path: /readyz
      - path: /healthz
  jwt:
    - issuer:
        url: "https://auth.noirprime.com/application/o/headlamp/"
        audiences:
          - "headlamp-a54d74ce"
        audienceMatchPolicy: MatchAny
      claimMappings:
        username:
          claim: "email"
          prefix: ""
        groups:
          claim: "groups"
          prefix: ""
