---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: node-exporter-full
spec:
  folderRef: nodes
  resyncPeriod: 30m
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - inputName: "DS_PROMETHEUS"
      datasourceName: "victoria-metrics"
  configMapRef:
    name: dashboard-node-exporter-full
    key: node-exporter-full.json
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: smartctl-exporter
spec:
  folderRef: nodes
  resyncPeriod: 30m
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - inputName: "DS_PROMETHEUS"
      datasourceName: "victoria-metrics"
  configMapRef:
    name: dashboard-smartctl-exporter
    key: smartctl-exporter.json
