---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kgateway
spec:
  folderRef: network
  resyncPeriod: 30m
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - inputName: "DS_PROMETHEUS"
      datasourceName: "victoria-metrics"
  configMapRef:
    name: dashboard-kgateway
    key: kgateway.json
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cilium-agent
spec:
  folderRef: network
  resyncPeriod: 30m
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - inputName: "DS_PROMETHEUS"
      datasourceName: "victoria-metrics"
  configMapRef:
    name: dashboard-cilium-agent
    key: cilium-agent.json
