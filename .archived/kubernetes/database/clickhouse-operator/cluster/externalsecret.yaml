---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-credentials
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        default_password: "{{ .default_password }}"
        # users.d drop-in for the langfuse user, mounted into the ClickHouse pods
        langfuse.yaml: |
          users:
            langfuse:
              password:
                - '{{ .langfuse_password }}'
              profile: default
              # one <grants> element with repeated <query> — a YAML list of maps
              # here becomes duplicate <grants> sections and CH keeps only the first
              grants:
                query:
                  - "GRANT ALL ON langfuse.*"
                  # langfuse v4 worker event-propagation job reads system.parts
                  - "GRANT SELECT ON system.parts"
                  # cluster-mode migrations run DDL ON CLUSTER default
                  - "GRANT CLUSTER ON *.*"
                  # v4 legacy-api-usage job scans query_log via remote()
                  - "GRANT READ ON REMOTE"
                  # v4 usage job reads per-replica query_log
                  - "GRANT SELECT ON system.query_log"
  dataFrom:
    - extract:
        key: clickhouse
