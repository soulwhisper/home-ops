---
# Woodpecker port of .archived/.forgejo/workflows/dr-test.yaml (removed with
# the forgejo-runner archival). Monthly DR rehearsal: restore the production
# CNPG cluster into a disposable namespace from the latest barman-cloud
# backup, validate postgres is queryable, then tear down. Pushes a
# `dr_test_last_success_timestamp` metric to VictoriaMetrics on success
# (consumed by the cnpg maintenance PrometheusRule).
# Runner image: ghcr.io/soulwhisper/woodpecker-runner has kubectl/yq/curl baked.
# Prerequisites:
#   - woodpecker repo secret `dr_test_kubeconfig`: kubeconfig content with
#     rights to create/delete namespaces, read secrets/objectstores in
#     database-system, and manage CNPG clusters in dr-test-* namespaces
#   - woodpecker cron entry named `dr-test` with schedule `0 3 1 * *`
#     (03:00 UTC on the 1st of every month)
when:
  - event: cron
    cron: dr-test
  - event: manual

steps:
  - name: render restore manifest
    image: ghcr.io/soulwhisper/woodpecker-runner:latest
    pull: true
    commands:
      - mkdir -p out
      # take the production cluster, rename it, switch to recovery bootstrap
      - |
        yq '
          .metadata.namespace = "dr-test-postgres-" + env(CI_PIPELINE_NUMBER) |
          .metadata.name = "postgres-dr" |
          .spec.instances = 1 |
          .spec.bootstrap = {"recovery": {"source": "postgres-v1"}} |
          .spec.externalClusters = [{
            "name": "postgres-v1",
            "plugin": {
              "name": "barman-cloud.cloudnative-pg.io",
              "parameters": {"barmanObjectName": "barman-cloud", "serverName": "postgres-v1"}
            }
          }]
        ' kubernetes/apps/database-system/cnpg-operator/cluster/postgres.yaml > out/postgres.yaml

  - name: apply
    image: ghcr.io/soulwhisper/woodpecker-runner:latest
    pull: true
    environment:
      DR_TEST_KUBECONFIG:
        from_secret: dr_test_kubeconfig
    commands:
      - printf '%s' "${DR_TEST_KUBECONFIG}" > kubeconfig && export KUBECONFIG="${PWD}/kubeconfig"
      - NS="dr-test-postgres-${CI_PIPELINE_NUMBER}"
      - kubectl create ns "${NS}" --dry-run=client -o yaml | kubectl apply -f -
      # Copy the secrets needed for restore into the new ns.
      - |
        kubectl -n database-system get secret cloudnative-pg -o yaml \
          | yq '.metadata.namespace = strenv(NS) | del(.metadata.uid,.metadata.resourceVersion,.metadata.creationTimestamp)' \
          | kubectl apply -f -
      # Plugin needs the ObjectStore replicated.
      - |
        kubectl -n database-system get objectstore barman-cloud -o yaml \
          | yq '.metadata.namespace = strenv(NS) | del(.metadata.uid,.metadata.resourceVersion,.metadata.creationTimestamp)' \
          | kubectl apply -f -
      - kubectl apply -f out/postgres.yaml

  - name: wait for cluster ready
    image: ghcr.io/soulwhisper/woodpecker-runner:latest
    pull: true
    environment:
      DR_TEST_KUBECONFIG:
        from_secret: dr_test_kubeconfig
    commands:
      - printf '%s' "${DR_TEST_KUBECONFIG}" > kubeconfig && export KUBECONFIG="${PWD}/kubeconfig"
      # 30m cap: woodpecker default step timeout is server-side (60m); rely on kubectl wait here
      - kubectl -n "dr-test-postgres-${CI_PIPELINE_NUMBER}" wait --for=condition=Ready cluster/postgres-dr --timeout=30m

  - name: validate
    image: ghcr.io/soulwhisper/woodpecker-runner:latest
    pull: true
    environment:
      DR_TEST_KUBECONFIG:
        from_secret: dr_test_kubeconfig
    commands:
      - printf '%s' "${DR_TEST_KUBECONFIG}" > kubeconfig && export KUBECONFIG="${PWD}/kubeconfig"
      # add hindsight tests later
      - |
        kubectl -n "dr-test-postgres-${CI_PIPELINE_NUMBER}" exec postgres-dr-1 -c postgres -- \
          psql -U postgres -tAc "SELECT count(*) FROM pg_database WHERE datname='immich';" \
          | grep -q '^1$'

  - name: push success metric
    image: ghcr.io/soulwhisper/woodpecker-runner:latest
    pull: true
    when:
      - status: [success]
    commands:
      - |
        curl -fsSL --data-binary "dr_test_last_success_timestamp{job=\"dr-test\",target=\"postgres\"} $(date +%s)" \
          "http://vmsingle-victoria-metrics-cluster.monitoring-system.svc.cluster.local:8428/api/v1/import/prometheus"

  - name: cleanup
    image: ghcr.io/soulwhisper/woodpecker-runner:latest
    pull: true
    when:
      - status: [success, failure]
    environment:
      DR_TEST_KUBECONFIG:
        from_secret: dr_test_kubeconfig
    commands:
      - printf '%s' "${DR_TEST_KUBECONFIG}" > kubeconfig && export KUBECONFIG="${PWD}/kubeconfig"
      - kubectl delete ns "dr-test-postgres-${CI_PIPELINE_NUMBER}" --wait=false --ignore-not-found
