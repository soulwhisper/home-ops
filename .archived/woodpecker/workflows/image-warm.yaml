---
# Image warmer: pulls the CI step images on a runner node so the kubelet
# node cache and spegel P2P mirror stay warm — step pods then start without
# registry round-trips. Same idea as the old image-pull workflow, but as a
# scheduled warm-up instead of a PR check: declaring an image on a step makes
# the kubelet pull it; spegel serves it to the other nodes on demand.
# `pull: true` refreshes mutable tags (:latest runner image, rolling minors).
# Prerequisites:
#   - woodpecker cron entry named `image-warm` with schedule `0 */6 * * *`
when:
  - event: cron
    cron: image-warm
  - event: manual

steps:
  - name: warm woodpecker-runner
    image: ghcr.io/soulwhisper/woodpecker-runner:latest
    pull: true
    commands:
      - "true"

  - name: warm uv (docs build)
    image: ghcr.io/astral-sh/uv:0.12
    commands:
      - "true"

  - name: warm docker cli (compose check)
    image: docker:29-cli
    commands:
      - "true"

  - name: warm cnpg postgresql (backup verify)
    image: ghcr.io/cloudnative-pg/postgresql:18
    commands:
      - "true"
