---
# Woodpecker port of .github/workflows/infra-checks.yaml (job: compose).
# Kept alongside the GitHub workflow for the forgejo+woodpecker migration.
# docker compose config --no-interpolate needs no daemon; the CLI image suffices.
when:
  - event: pull_request
    path: ["infrastructure/**", ".justfiles/**"]

steps:
  - name: validate synology compose files
    image: docker:29-cli
    commands:
      - |
        # --no-interpolate: sops-encrypted env values are unavailable in CI
        for FILE in infrastructure/synology/*/docker-compose*.y*ml; do
          echo "Validating ${FILE}"
          docker compose --file "${FILE}" config --quiet --no-interpolate
        done
