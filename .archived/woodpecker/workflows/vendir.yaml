---
# Woodpecker port of .github/workflows/vendir.yaml.
# Kept alongside the GitHub workflow for the forgejo+woodpecker migration.
# pull_request event: syncs and pushes the rename fixups back to the PR branch.
# manual event: syncs and opens a `chore/sync-resources` PR.
# Runner image: ghcr.io/soulwhisper/woodpecker-runner has vendir/git/jq baked.
# Prerequisites:
#   - woodpecker repo secret `forgejo_token` (contents:write, pull-requests:write)
when:
  - event: pull_request
    path: ["**/vendir.yml", "**/vendir.lock.yml"]
  - event: manual

steps:
  - name: vendir sync + commit
    image: ghcr.io/soulwhisper/woodpecker-runner:latest
    pull: true
    environment:
      FORGEJO_TOKEN:
        from_secret: forgejo_token
    commands:
      - |
        BASE_DIR="kubernetes/apps/monitoring-system/grafana/cluster/dashboards"
        SOURCES_DIR="${BASE_DIR}/_sources"
        vendir sync --chdir "${BASE_DIR}"
        find "${SOURCES_DIR}" -type f \( -name "*_rev*.json" -o -name "download" \) | while read -r FILE; do
          DIR=$(dirname "${FILE}")
          mv "${FILE}" "${DIR}/dashboard.json"
        done
      - |
        if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
          echo "No vendir changes"
          exit 0
        fi
        git add -A
        git config user.name "woodpecker-ci"
        git config user.email "ci@noirprime.com"
        REMOTE="https://ci:${FORGEJO_TOKEN}@${CI_REPO_CLONE_URL#*://}"
        if [ "${CI_PIPELINE_EVENT}" = "pull_request" ]; then
          git commit -qm "chore(deps): fix vendir filenames (renovate hook)"
          git push -q "${REMOTE}" "HEAD:${CI_COMMIT_SOURCE_BRANCH}"
        else
          git commit -qm "chore(deps): sync resources managed by vendir"
          git push -qf "${REMOTE}" "HEAD:refs/heads/chore/sync-resources"
          OPEN=$(curl -fsSL -H "Authorization: token ${FORGEJO_TOKEN}" \
            "${CI_FORGE_URL}/api/v1/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/pulls?state=open" \
            | jq '[.[] | select(.head.ref == "chore/sync-resources")] | length')
          if [ "${OPEN}" = "0" ]; then
            curl -fsSL -X POST -H "Authorization: token ${FORGEJO_TOKEN}" -H "Content-Type: application/json" \
              "${CI_FORGE_URL}/api/v1/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/pulls" \
              -d '{"head":"chore/sync-resources","base":"main","title":"chore(deps): sync resources managed by vendir","body":"Automated sync of Resources via Vendir."}' > /dev/null
          fi
        fi
