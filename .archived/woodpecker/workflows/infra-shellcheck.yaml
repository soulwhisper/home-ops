---
# Woodpecker port of .github/workflows/infra-checks.yaml (job: shellcheck).
# Kept alongside the GitHub workflow for the forgejo+woodpecker migration.
# Runner image: ghcr.io/soulwhisper/woodpecker-runner has shellcheck baked.
when:
  - event: pull_request
    path: ["infrastructure/**", ".justfiles/**"]

steps:
  - name: shellcheck switch configs
    image: ghcr.io/soulwhisper/woodpecker-runner:latest
    pull: true
    commands:
      # switch configs are H3C Comware CLI snippets pasted into the console,
      # not executed by a shell; error severity keeps real syntax breakage
      # while ignoring false positives on CLI content (e.g. password hashes)
      - shellcheck --severity=error infrastructure/switch/*.sh
