---
# Woodpecker port of the in-cluster postgres-backup-verify CronJob
# (kubernetes/apps/database-system/cnpg-operator/maintenance/cronjob-dr-test.yaml).
# Kept alongside it: the CronJob (and its PrometheusRule alert) stay in the
# cluster until the woodpecker cutover, then both should be removed and the
# alert repointed at woodpecker pipeline status.
# Prerequisites:
#   - woodpecker repo secrets `cnpg_aws_access_key_id` / `cnpg_aws_secret_access_key`
#     (same values as the cloudnative-pg secret in database-system)
#   - woodpecker cron entry named `postgres-backup-verify` with schedule `0 4 * * 0`
when:
  - event: cron
    cron: postgres-backup-verify
  - event: manual

steps:
  - name: check wal archive
    image: ghcr.io/cloudnative-pg/postgresql:18
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: cnpg_aws_access_key_id
      AWS_SECRET_ACCESS_KEY:
        from_secret: cnpg_aws_secret_access_key
    commands:
      - barman-cloud-check-wal-archive --endpoint-url=http://nas.homelab.internal:9000 --read-timeout=300 s3://postgres/ postgres-v1
