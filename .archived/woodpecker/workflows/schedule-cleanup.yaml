---
# Woodpecker port of .github/workflows/schedule-cleanup.yml.
# Kept alongside the GitHub workflow for the forgejo+woodpecker migration.
# Deletes forgejo Actions runs by conclusion, same retention policy as the
# Mattraks/delete-workflow-runs version:
#   - cancelled/skipped: delete everything
#   - success: retain 7 days, keep at least 3
#   - failure/action_required: retain 7 days, keep at least 3
# Once woodpecker is the sole CI this pipeline becomes obsolete (woodpecker
# pipelines are not garbage-collected by this script).
# Runner image: ghcr.io/soulwhisper/woodpecker-runner has curl+jq baked.
# Prerequisites:
#   - woodpecker repo secret `forgejo_token` (repo admin / actions:write)
#   - woodpecker cron entry named `schedule-cleanup` with schedule `0 */12 * * *`
when:
  - event: cron
    cron: schedule-cleanup
  - event: manual

steps:
  - name: delete stale workflow runs
    image: ghcr.io/soulwhisper/woodpecker-runner:latest
    pull: true
    environment:
      FORGEJO_TOKEN:
        from_secret: forgejo_token
    commands:
      - |
        API="${CI_FORGE_URL}/api/v1/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/actions/runs"
        AUTH="Authorization: token ${FORGEJO_TOKEN}"
        NOW=$(date +%s)
        RETAIN_SECONDS=$((7 * 86400))
        cleanup() {
          STATUS="$1"; KEEP_MIN="$2"; RETAIN="$3"
          RUNS=$(curl -fsSL -H "${AUTH}" "${API}?status=${STATUS}&limit=100" \
            | jq -r '.workflow_runs // . | sort_by(.created_at) | reverse | .[] | [.id, .created_at] | @tsv')
          COUNT=0
          printf '%s\n' "${RUNS}" | while IFS="$(printf '\t')" read -r ID CREATED; do
            [ -z "${ID}" ] && continue
            COUNT=$((COUNT + 1))
            [ "${COUNT}" -le "${KEEP_MIN}" ] && continue
            AGE=$((NOW - $(date -d "${CREATED}" +%s)))
            [ "${RETAIN}" -gt 0 ] && [ "${AGE}" -lt "${RETAIN_SECONDS}" ] && continue
            echo "deleting run ${ID} (${STATUS}, age ${AGE}s)"
            curl -fsSL -X DELETE -H "${AUTH}" "${API}/${ID}" > /dev/null || echo "failed to delete ${ID}"
          done
        }
        cleanup cancelled 0 0
        cleanup skipped 0 0
        cleanup success 3 1
        cleanup failure 3 1
        cleanup action_required 3 1
