---
# Woodpecker port of .github/workflows/label-sync.yaml.
# Kept alongside the GitHub workflow for the forgejo+woodpecker migration.
# Syncs .github/labels.yaml (single source of truth) to the forgejo repo,
# deleting labels not in the config (delete-other-labels: true equivalent).
# Runner image: ghcr.io/soulwhisper/woodpecker-runner has python3+pyyaml baked.
# Prerequisites:
#   - woodpecker repo secret `forgejo_token` (issues:write)
#   - woodpecker cron entry named `label-sync` with schedule `0 0 * * *`
when:
  - event: push
    branch: main
    path: [".github/labels.yaml"]
  - event: cron
    cron: label-sync
  - event: manual

steps:
  - name: sync labels
    image: ghcr.io/soulwhisper/woodpecker-runner:latest
    pull: true
    environment:
      FORGEJO_TOKEN:
        from_secret: forgejo_token
    commands:
      - |
        python3 <<'EOF'
        import json, os, urllib.request
        import yaml

        api = f"{os.environ['CI_FORGE_URL']}/api/v1/repos/{os.environ['CI_REPO_OWNER']}/{os.environ['CI_REPO_NAME']}/labels"
        headers = {"Authorization": f"token {os.environ['FORGEJO_TOKEN']}", "Content-Type": "application/json"}

        def req(method, url, payload=None):
            data = json.dumps(payload).encode() if payload is not None else None
            r = urllib.request.Request(url, data=data, headers=headers, method=method)
            try:
                with urllib.request.urlopen(r) as resp:
                    return json.loads(resp.read() or b"null")
            except urllib.error.HTTPError as e:
                if e.code == 404:
                    return None
                raise

        with open(".github/labels.yaml") as f:
            wanted = {l["name"]: l["color"] for l in yaml.safe_load(f)}

        existing, page = {}, 1
        while True:
            batch = req("GET", f"{api}?limit=50&page={page}") or []
            existing.update({l["name"]: l for l in batch})
            if len(batch) < 50:
                break
            page += 1

        for name, color in wanted.items():
            color = color.lstrip("#")
            cur = existing.get(name)
            if cur is None:
                req("POST", api, {"name": name, "color": color})
                print(f"created {name}")
            elif cur["color"].lstrip("#").lower() != color.lower():
                req("PATCH", f"{api}/{cur['id']}", {"name": name, "color": color})
                print(f"updated {name}")

        for name, cur in existing.items():
            if name not in wanted:
                req("DELETE", f"{api}/{cur['id']}")
                print(f"deleted {name}")
        EOF
