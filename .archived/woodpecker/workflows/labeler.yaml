---
# Woodpecker port of .github/workflows/labeler.yaml.
# Kept alongside the GitHub workflow for the forgejo+woodpecker migration.
# Applies .github/labeler.yaml any-glob-to-any-file rules via the forgejo API.
# Fork PRs are skipped, matching the GitHub workflow's head-repo guard.
# Runner image: ghcr.io/soulwhisper/woodpecker-runner has python3+pyyaml baked.
# Prerequisites:
#   - woodpecker repo secret `forgejo_token` (issues:write)
when:
  - event: pull_request

steps:
  - name: apply labels
    image: ghcr.io/soulwhisper/woodpecker-runner:latest
    pull: true
    environment:
      FORGEJO_TOKEN:
        from_secret: forgejo_token
    commands:
      - |
        python3 <<'EOF'
        import fnmatch, json, os, urllib.request
        import yaml

        forge = os.environ["CI_FORGE_URL"]
        owner, repo = os.environ["CI_REPO_OWNER"], os.environ["CI_REPO_NAME"]
        pr = os.environ["CI_COMMIT_PULL_REQUEST"]
        base = f"{forge}/api/v1/repos/{owner}/{repo}"
        headers = {"Authorization": f"token {os.environ['FORGEJO_TOKEN']}", "Content-Type": "application/json"}

        def req(method, url, payload=None):
            data = json.dumps(payload).encode() if payload is not None else None
            r = urllib.request.Request(url, data=data, headers=headers, method=method)
            with urllib.request.urlopen(r) as resp:
                return json.loads(resp.read() or b"null")

        # skip fork PRs (same guard as the GitHub workflow)
        meta = req("GET", f"{base}/pulls/{pr}")
        if meta["head"]["repo"]["full_name"] != f"{owner}/{repo}":
            print("fork PR, skipping")
            raise SystemExit(0)

        files, page = [], 1
        while True:
            batch = req("GET", f"{base}/pulls/{pr}/files?limit=50&page={page}") or []
            files += [f["filename"] for f in batch]
            if len(batch) < 50:
                break
            page += 1

        with open(".github/labeler.yaml") as f:
            rules = yaml.safe_load(f)

        matched = []
        for label, groups in rules.items():
            for group in groups or []:
                globs = (group.get("changed-files") or [{}])[0].get("any-glob-to-any-file") or []
                if isinstance(globs, str):
                    globs = [globs]
                if any(fnmatch.fnmatch(p, g) for p in files for g in globs):
                    matched.append(label)
                    break

        if matched:
            req("POST", f"{base}/issues/{pr}/labels", {"labels": matched})
        print("applied:", ", ".join(matched) or "none")
        EOF
