---
# Woodpecker port of .github/workflows/image-pull.yaml.
# Kept alongside the GitHub workflow for the forgejo+woodpecker migration.
# Uses `crane manifest` (existence + linux/amd64 platform check) instead of a
# real pull. Woodpecker has no dynamic matrix, so images are checked in one
# step with xargs -P4 (matching the GitHub matrix max-parallel).
# Runner image: ghcr.io/soulwhisper/woodpecker-runner has flate+crane baked.
when:
  - event: pull_request
    path: ["kubernetes/**"]

steps:
  - name: check images exist
    image: ghcr.io/soulwhisper/woodpecker-runner:latest
    pull: true
    environment:
      FLATE_PATH: ./kubernetes/flux/cluster
      FLATE_OUTPUT: json
    commands:
      - |
        IMAGES=$(flate diff images)
        if [ "${IMAGES}" = "[]" ]; then
          echo "No new images to check"
          exit 0
        fi
        printf '%s' "${IMAGES}" | jq --raw-output '.[]' \
          | xargs -P 4 -n 1 sh -c 'crane manifest "$0" --platform linux/amd64 > /dev/null'
