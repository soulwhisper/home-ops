---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# yamllint disable rule:truthy
# Distills a closed ticket into learnings/ — manual dispatch or an explicit
# merged post-merge close/learn plan through cluster-aiops (no cron and no
# autonomous fixers; acceptance evidence is always required). Supervised runs
# key either result: a lesson embeds exact aiops_action/aiops_run Git
# frontmatter, while NO_LESSON writes one source-ticket comment containing the
# no-lesson marker, exact action marker, exact aiops_run line, and exact
# aiops_workflow_run line. Its user.id must match run.trigger_user.id and its
# creation time must fall within that run's lifetime; marker text alone is
# insufficient. No lesson file is written.
# Recovery records run.status; logical terminal failure means status failure
# or cancelled, while an exact result artifact remains authoritative.
# Secrets (set once in the tickets repo's Actions settings):
#   TICKETS_TOKEN — forgejo `pat_tickets` (issue/Actions run read + source-ticket
#                   comment write + git push). Forgejo rejects secret names starting
#                   with FORGEJO_/GITEA_.
#   LLM_API_KEY   — `agentgateway.llm_agent` (agent lane consumer key)
name: lessons

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: "Ticket number to distill into a lesson"
        required: true
        type: number
      run_id:
        description: "Canonical 26-character Crockford Base32 ULID for crash-safe resume (both identifiers omitted for manual dispatch)"
        required: false
        type: string
      action_key:
        description: "Exact <RUN_ID>:lesson:<40 lowercase hex merge SHA> key for lesson frontmatter or NO_LESSON (both identifiers omitted for manual dispatch)"
        required: false
        type: string

jobs:
  write-lesson:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Distill ticket into learnings/
        env:
          FORGEJO_TOKEN: ${{ secrets.TICKETS_TOKEN }}
          # cleartext HTTP to the NAS is an accepted risk: wired VLAN 100 LAN
          # only, same posture as the cluster-internal Forgejo clients
          FORGEJO_API: http://nas.homelab.internal:9003/api/v1
          REPO: soulwhisper/homelab-tickets
          LLM_API_BASE: https://api.noirprime.com/v1
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: agent
          TICKET: ${{ inputs.ticket }}
          RUN_ID: ${{ inputs.run_id }}
          ACTION_KEY: ${{ inputs.action_key }}
        run: |
          set -euo pipefail
          output="$(python3 .forgejo/workflows/write_lesson.py)"
          printf '%s\n' "$output"
          case "$output" in
            "ticket carries no reusable lesson; no lesson file written"*) exit 0 ;;
          esac

          git config user.name "ai-ops[bot]"
          git config user.email "ai-ops@noirprime.com"
          git add learnings/
          git diff --cached --quiet || git commit -m "learn: ticket #${{ inputs.ticket }}"
          # concurrent dispatches race on main: rebase onto whatever landed
          # first and retry (lesson filenames differ per ticket, no conflicts)
          pushed=0
          for i in 1 2 3; do
            git push && { pushed=1; break; }
            git pull --rebase origin main || exit 1
          done
          # CodeRabbit: without this, three failed pushes + one clean rebase
          # exits 0 and silently loses the unpushed lesson
          [ "$pushed" = 1 ] || exit 1
