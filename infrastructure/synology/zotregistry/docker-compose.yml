---
# Pull-through OCI cache: containerd -> spegel -> zot -> upstream.
# S3 uses versitygw; credentials come from zotregistry.sops.env.
# Sync tuning bounds requests and avoids shared HTTP/2 stalls.
name: zotregistry
services:
  zot:
    image: "ghcr.io/project-zot/zot-linux-amd64:v2.1.23"
    container_name: "zot"
    restart: "unless-stopped"
    ports:
      - "9002:9002/tcp"
    env_file:
      - zotregistry.sops.env
    configs:
      - source: "config.json"
        target: "/etc/zot/config.json"
    extra_hosts:
      - "nas.homelab.internal:host-gateway"
    # /tmp/zot is ephemeral S3 staging; the minimal image has no healthcheck tools.

configs:
  config.json:
    content: |
      {
        "distSpecVersion": "1.1.1",
        "storage": {
          "rootDirectory": "/tmp/zot",
          "commit": false,
          "dedupe": false,
          "gc": true,
          "gcDelay": "2h",
          "gcInterval": "24h",
          "storageDriver": {
            "name": "s3",
            "region": "us-east-1",
            "regionendpoint": "nas.homelab.internal:9000",
            "bucket": "zot",
            "forcepathstyle": true,
            "secure": false,
            "skipverify": false
          },
          "retention": {
            "dryRun": false,
            "delay": "24h",
            "policies": [
              {
                "repositories": ["**"],
                "deleteReferrers": true,
                "deleteUntagged": true,
                "keepTags": [
                  {
                    "mostRecentlyPushedCount": 5,
                    "mostRecentlyPulledCount": 3
                  }
                ]
              }
            ]
          }
        },
        "http": {
          "address": "0.0.0.0",
          "port": "9002",
          "compat": ["docker2s2"]
        },
        "log": {
          "level": "warn"
        },
        "extensions": {
          "ui": {
            "enable": true
          },
          "search": {
            "enable": true
          },
          "metrics": {
            "enable": true,
            "prometheus": {
              "path": "/metrics"
            }
          },
          "scrub": {
            "enable": true,
            "interval": "24h"
          },
          "sync": {
            "enable": true,
            "downloadDir": "/tmp/zot",
            "registries": [
              {
                "urls": ["https://registry-1.docker.io"],
                "content": [
                  {
                    "prefix": "**",
                    "destination": "/docker.io"
                  }
                ],
                "onDemand": true,
                "tlsVerify": true,
                "manifestCheckInterval": "10m",
                "maxRetries": 3,
                "retryDelay": "1s",
                "maxRetryDelay": "30s",
                "syncTimeout": "30m",
                "reqConcurrent": 30,
                "disableHTTP2": true,
                "maxIdleConnsPerHost": 30
              },
              {
                "urls": ["https://ghcr.io"],
                "content": [
                  {
                    "prefix": "**",
                    "destination": "/ghcr.io"
                  }
                ],
                "onDemand": true,
                "tlsVerify": true,
                "manifestCheckInterval": "10m",
                "maxRetries": 3,
                "retryDelay": "1s",
                "maxRetryDelay": "30s",
                "syncTimeout": "30m",
                "reqConcurrent": 30,
                "disableHTTP2": true,
                "maxIdleConnsPerHost": 30
              },
              {
                "urls": ["https://quay.io"],
                "content": [
                  {
                    "prefix": "**",
                    "destination": "/quay.io"
                  }
                ],
                "onDemand": true,
                "tlsVerify": true,
                "manifestCheckInterval": "10m",
                "maxRetries": 3,
                "retryDelay": "1s",
                "maxRetryDelay": "30s",
                "syncTimeout": "30m",
                "reqConcurrent": 30,
                "disableHTTP2": true,
                "maxIdleConnsPerHost": 30
              },
              {
                "urls": ["https://registry.k8s.io"],
                "content": [
                  {
                    "prefix": "**",
                    "destination": "/registry.k8s.io"
                  }
                ],
                "onDemand": true,
                "tlsVerify": true,
                "manifestCheckInterval": "10m",
                "maxRetries": 3,
                "retryDelay": "1s",
                "maxRetryDelay": "30s",
                "syncTimeout": "30m",
                "reqConcurrent": 30,
                "disableHTTP2": true,
                "maxIdleConnsPerHost": 30
              },
              {
                "urls": ["https://factory.talos.dev"],
                "content": [
                  {
                    "prefix": "**",
                    "destination": "/factory.talos.dev"
                  }
                ],
                "onDemand": true,
                "tlsVerify": true,
                "manifestCheckInterval": "10m",
                "maxRetries": 3,
                "retryDelay": "1s",
                "maxRetryDelay": "30s",
                "syncTimeout": "30m",
                "reqConcurrent": 30,
                "disableHTTP2": true,
                "maxIdleConnsPerHost": 30
              }
            ]
          }
        }
      }
