---
name: homepage
services:
  homepage:
    image: "ghcr.io/gethomepage/homepage:v2.8.0"
    container_name: "homepage"
    restart: "unless-stopped"
    network_mode: "host"
    user: "1026:100"
    env_file:
      - path: homepage.sops.env
        format: raw
    environment:
      - "HOSTNAME=10.10.0.100"
      - "PORT=8300"
      - "HOMEPAGE_ALLOWED_HOSTS=10.10.0.100:8300,nas.homelab.internal:8300"
      - "HOMEPAGE_CONFIG_DIR=/tmp/homepage"
    # Keep Git-managed files read-only while Homepage writes defaults and logs.
    command:
      - "/bin/sh"
      - "-ec"
      - |
        mkdir -p "$${HOMEPAGE_CONFIG_DIR}"
        ln -sf /app/config/* "$${HOMEPAGE_CONFIG_DIR}/"
        exec node server.js
    volumes:
      - "./config:/app/config:ro"
      - "./icons:/app/public/icons:ro"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider -Y off \"http://$${HOSTNAME}:$${PORT}/api/healthcheck\""]
