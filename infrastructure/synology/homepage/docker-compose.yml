---
name: homepage

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.8.0
    container_name: homepage
    restart: unless-stopped
    # Host networking lets widgets reach NAS services on loopback.
    network_mode: host
    user: "1026:101"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    env_file:
      - path: homepage.sops.env
        format: raw
    environment:
      HOSTNAME: "10.10.0.100"
      PORT: "8300"
      HOMEPAGE_ALLOWED_HOSTS: "10.10.0.100:8300,nas.homelab.internal:8300"
      HOMEPAGE_CONFIG_DIR: /tmp/homepage
    # Link Git-managed files into the writable container layer for defaults and logs.
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p "$${HOMEPAGE_CONFIG_DIR}"
        ln -sf /app/config/* "$${HOMEPAGE_CONFIG_DIR}/"
        exec node server.js
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider -Y off "http://$${HOSTNAME}:$${PORT}/api/healthcheck"
    volumes:
      - ./config/bookmarks.yaml:/app/config/bookmarks.yaml:ro
      - ./config/services.yaml:/app/config/services.yaml:ro
      - ./config/settings.yaml:/app/config/settings.yaml:ro
      - ./config/widgets.yaml:/app/config/widgets.yaml:ro
      - ./config/custom.css:/app/config/custom.css:ro
      - ./icons:/app/public/icons:ro
    mem_limit: "512m"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
