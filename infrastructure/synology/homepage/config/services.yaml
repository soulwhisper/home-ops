---
- Status:
    - NAS:
        href: https://10.10.0.100:5001
        icon: /icons/synology.svg
        widget:
          type: diskstation
          url: https://10.10.0.100:5001
          username: '{{HOMEPAGE_VAR_SYNOLOGY_USERNAME}}'
          password: '{{HOMEPAGE_VAR_SYNOLOGY_PASSWORD}}'
          volume: volume_2
    - OpenWRT:
        href: http://10.10.0.254
        icon: /icons/openwrt.svg
        widget:
          type: openwrt
          url: http://10.10.0.254
          username: '{{HOMEPAGE_VAR_OPENWRT_USERNAME}}'
          password: '{{HOMEPAGE_VAR_OPENWRT_PASSWORD}}'
          interfaceName: pppoe-wan
    - Unifi:
        href: https://10.10.0.200:9801
        icon: /icons/unifi.svg
        widget:
          type: unifi
          url: https://10.10.0.200:9801
          username: '{{HOMEPAGE_VAR_UNIFI_USERNAME}}'
          password: '{{HOMEPAGE_VAR_UNIFI_PASSWORD}}'
    - Forgejo:
        href: http://10.10.0.100:9003
        icon: /icons/forgejo.svg
        widget:
          type: customapi
          url: http://10.10.0.100:9003/api/v1/repos/soulwhisper/homelab-tickets
          headers:
            Authorization: 'token {{HOMEPAGE_VAR_FORGEJO_PAT}}'
          refreshInterval: 60000
          mappings:
            - {field: open_issues_count, label: Open Issues, format: number}
            - {field: open_pr_counter, label: Open PRs, format: number}
    - ESXi:
        href: https://10.0.0.10/
        icon: /icons/vmware-esxi.svg
        description: Management UI reachability
        siteMonitor: https://10.0.0.10/
    - TL-SE2109P:
        href: http://10.0.0.2
        icon: /icons/tp-link.svg
        description: 10 GbE PoE switch
        siteMonitor: http://10.0.0.2
    - AdGuard:
        href: http://10.10.0.254:9200
        icon: /icons/adguard-home.svg
        description: DNS filtering
        siteMonitor: http://10.10.0.254:9200
    - JetKVM:
        href: http://10.0.0.210/
        icon: /icons/jetkvm.svg
        description: Remote KVM
        siteMonitor: http://10.0.0.210/
    - TProxy:
        href: http://10.10.0.254:9090/ui/zashboard
        icon: /icons/openwrt.svg
        description: Transparent proxy
        siteMonitor: http://10.10.0.254:9090/ui/zashboard
- Service:
    - Bambuddy:
        href: http://10.10.0.100:8000
        icon: /icons/si-bambulab.svg
        description: Bambu Lab printer monitor
        siteMonitor: http://10.10.0.100:8000/health
    - Hindsight:
        href: http://10.10.0.100:9999
        icon: /icons/metabrainz.svg
        description: AI memory service
        siteMonitor: http://10.10.0.100:9999
    - Scryfall Downloader:
        href: http://10.10.0.100:8765
        icon: /icons/scryfall-downloader.svg
        description: Magic card and token images
        siteMonitor: http://10.10.0.100:8765
    - Scrutiny:
        href: http://10.10.0.100:9204
        icon: /icons/scrutiny.svg
        description: SMART drive monitoring
        widget:
          type: scrutiny
          url: http://10.10.0.100:9204
    - MeshCentral:
        href: https://10.10.0.100:444
        icon: /icons/meshcentral.svg
        description: Out-of-band management
        siteMonitor: https://10.10.0.100:444
    - Hermes:
        href: http://10.10.0.200:9119
        icon: /icons/hermes.svg
        description: Native AI agent
        widget:
          type: customapi
          url: http://10.10.0.200:9119/api/status
          refreshInterval: 30000
          mappings:
            - {field: version, label: Version}
            - {field: gateway_state, label: Gateway}
            - {field: active_sessions, label: Active, format: number}
