---
name: versitygw
services:
  versitygw:
    image: "ghcr.io/versity/versitygw:v1.10.0"
    container_name: "versitygw"
    restart: "unless-stopped"
    command:
      - "posix"
      - "/tmp/gw"
    ports:
      - "9000:9000/tcp"
      - "9001:9001/tcp"
    env_file:
      - versitygw.sops.env
    environment:
      - "VGW_PORT=:9000"
      - "VGW_WEBUI_PORT=:9001"
      - "VGW_WEBUI_GATEWAYS=http://10.10.0.100:9000"
      - "VGW_WEBUI_ADMIN_GATEWAYS=http://10.10.0.100:9000"
      # unauthenticated GET health endpoint on the S3 port (upstream --health flag)
      - "VGW_HEALTH=/healthz"
    volumes:
      - "/volume3/docker/versitygw:/tmp/gw"
    healthcheck:
      # image is alpine-based (busybox wget); VGW_HEALTH verified in v1.7.0 cmd/versitygw/main.go
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
