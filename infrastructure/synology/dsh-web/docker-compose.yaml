---
name: dsh-web

# First run: `docker logs dsh-web` shows the startup token URL (replace the
# loopback host with nas.homelab.internal:9400); dsh-ui-auth writes the
# bootstrap admin credentials to /workspace/dsh-ui-auth-bootstrap.txt
# (mounted below, persists). Change the password after first login.
#
# Model config is UI-side (Settings → Model): point at the agent gateway,
#   base URL https://api.noirprime.com/v1, key = 1Password agentgateway.llm_agent
# (persisted on the data volume).

services:
  # Bind mounts on the NAS come up root-owned; the app runs as node
  # (uid 1000) with supplementary group 100 (users). This one-shot prepares
  # the dirs group-writable so the entrypoint seed can write them.
  init:
    image: "ghcr.io/soulwhisper/dsh-web:0.2.1-rc.2"
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - "mkdir -p /v/data /v/workspace && chgrp -R 100 /v && chmod -R g+rwX /v"
    volumes:
      - "/volume3/docker/dsh-web:/v"

  dsh-web:
    image: "ghcr.io/soulwhisper/dsh-web:0.2.1-rc.2"
    container_name: "dsh-web"
    restart: "unless-stopped"
    depends_on:
      init:
        condition: service_completed_successfully
    # uid 1000 (node) + supplementary gid 100 (users) — matches the bind
    # mounts' group; enough for the seeded writes
    group_add:
      - "100"
    ports:
      - "9400:3080"
    volumes:
      - "/volume3/docker/dsh-web/data:/home/node/.dsh"
      - "/volume3/docker/dsh-web/workspace:/workspace"
    healthcheck:
      # root path is auth-gated (401 without token); accept any answered HTTP
      # status below 500, reject 5xx and connection failures (bare curl -f
      # would also reject the normal 401)
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/) && [ \"$$code\" -gt 0 ] && [ \"$$code\" -lt 500 ]"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
