---
name: hindsight
services:
  postgres:
    image: "ghcr.io/soulwhisper/postgresql:18.7@sha256:a6857e9937546ea96e523585b7b3ca6188d2edf5a596ca8563dc0792d207708f"
    container_name: "hindsight-postgres"
    restart: "unless-stopped"
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pgroonga_wal_resource_manager"
      - "-c"
      - "pgroonga.enable_wal_resource_manager=on"
      - "-c"
      - "shared_buffers=768MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=off"
    env_file:
      - hindsight.sops.env
    volumes:
      - "/volume3/docker/hindsight/data:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - internal

  # The database is the one thing the cluster cannot rebuild, so it gets a dump
  # on start and every 24h. Dumps land under the stack directory that the NAS
  # snapshot schedule already covers; an off-host copy is still the operator's
  # job. Retention: 7 days.
  backup:
    image: "ghcr.io/soulwhisper/postgresql:18.7@sha256:a6857e9937546ea96e523585b7b3ca6188d2edf5a596ca8563dc0792d207708f"
    container_name: "hindsight-backup"
    restart: "unless-stopped"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - hindsight.sops.env
    entrypoint: ["/bin/bash", "-eu", "-c"]
    command:
      - |
        mkdir -p /backups
        while true; do
          ts=$$(date -u +%Y%m%dT%H%M%SZ)
          export PGPASSWORD="$$POSTGRES_PASSWORD"
          if pg_dump -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
               -Fc -f "/backups/$$ts.dump.tmp"; then
            mv "/backups/$$ts.dump.tmp" "/backups/$$ts.dump"
            echo "backup ok: $$ts.dump"
          else
            rm -f "/backups/$$ts.dump.tmp"
            echo "backup FAILED at $$ts" >&2
            exit 1
          fi
          find /backups -maxdepth 1 -name '*.dump' -mtime +7 -delete
          sleep 86400
        done
    healthcheck:
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -name '*.dump' -mmin -1560 | grep -q ."]
      # Check promptly so doco-cd can see a fresh dump within its deployment timeout.
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 5m
    volumes:
      - "/volume3/docker/hindsight/backups:/backups"
    networks:
      - internal

  hindsight:
    image: "ghcr.io/vectorize-io/hindsight:1.3.0-slim"
    container_name: "hindsight"
    restart: "unless-stopped"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - hindsight.sops.env
    environment:
      - "HINDSIGHT_API_WORKER_ID=hindsight"
      - "HINDSIGHT_API_VECTOR_EXTENSION=pgvector"
      - "HINDSIGHT_API_TEXT_SEARCH_EXTENSION=pgroonga"
      - "HINDSIGHT_API_OTEL_TRACES_ENABLED=false"
      - "HINDSIGHT_API_TENANT_EXTENSION=hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension"
    ports:
      - "8888:8888/tcp"
      - "9999:9999/tcp"
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import http.client,sys;c=http.client.HTTPConnection('127.0.0.1',8888,timeout=5);c.request('GET','/mcp/persona');sys.exit(0 if c.getresponse().status<500 else 1)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    networks:
      - internal

networks:
  internal:
    driver: bridge
