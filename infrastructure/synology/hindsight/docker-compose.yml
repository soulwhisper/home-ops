---
name: hindsight

services:
  postgres:
    image: "ghcr.io/soulwhisper/postgresql:18.6@sha256:b8603020b65a51f4ce1b0545ea0d8d90f4430a8b1d47004b31fc6b5544a538a2"
    container_name: "hindsight-postgres"
    restart: "unless-stopped"
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pgroonga_wal_resource_manager"
      - "-c"
      - "pgroonga.enable_wal_resource_manager=on"
      - "-c"
      - "shared_buffers=768MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=off"
    env_file:
      - hindsight.sops.env
    volumes:
      - "/volume3/docker/hindsight:/var/lib/postgresql"
      - "./initdb:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      - internal

  hindsight:
    image: "ghcr.io/vectorize-io/hindsight:1.2.1-slim"
    container_name: "hindsight"
    restart: "unless-stopped"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - hindsight.sops.env
    environment:
      - "HINDSIGHT_API_VECTOR_EXTENSION=pgvector"
      - "HINDSIGHT_API_TEXT_SEARCH_EXTENSION=pgroonga"
      - "HINDSIGHT_API_OTEL_TRACES_ENABLED=false"
    ports:
      - "8888:8888/tcp"
    read_only: true
    tmpfs:
      - "/tmp"
    cap_drop:
      - "ALL"
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python3 -c \"import socket; s=socket.create_connection(('127.0.0.1',8888),3); s.close()\""
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      - internal

networks:
  internal:
    driver: bridge
