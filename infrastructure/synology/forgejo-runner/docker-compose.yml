---
# forgejo actions runner — executes workflows for NAS-hosted repos
# (homelab-tickets lessons etc). Registered against nas.homelab.internal:9003.
# Identity (FORGEJO_RUNNER_UUID/TOKEN) comes from forgejo-runner.sops.env —
# the live `register` flow never worked, so the pre-registered runner identity
# is authored in git (sops) and written to /data/.runner on every start.
# Limits: single concurrent job, hard RAM cap (no CPU cap — see below).

services:
  forgejo-runner:
    # renovate: datasource=docker depName=code.forgejo.org/forgejo/runner
    image: "code.forgejo.org/forgejo/runner:13.2.0"
    container_name: "forgejo-runner"
    restart: "unless-stopped"
    # forgejo-net gives us (and job containers) nas.homelab.internal ->
    # the forgejo container directly; LAN hairpin/fake-ip DNS fails in docker
    networks:
      - forgejo-net
    working_dir: /data
    # NAS socket/data access uses root; full host control is accepted below.
    user: "0:0"
    # no `cpus` cap: the Synology kernel lacks CPU CFS scheduler support and
    # the daemon rejects NanoCPUs at container create
    mem_limit: 3g
    mem_reservation: 512m
    env_file:
      - forgejo-runner.sops.env
    environment:
      - "DOCKER_HOST=unix:///var/run/docker.sock"
      - "FORGEJO_INSTANCE_URL=http://nas.homelab.internal:9003"
      - "FORGEJO_RUNNER_NAME=nas-docker"
      # act-compatible alias for GHA syntax workflows
      - "FORGEJO_RUNNER_LABELS=ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-22.04,self-hosted:host"
    volumes:
      # host docker socket grants full host-level control by design; accepted
      # because the runner is registered repo-scoped (homelab-tickets only) and
      # every workflow it can ever run is operator-authored. A socket proxy
      # cannot restrict privileged container creation, so it buys nothing here.
      - "/etc/localtime:/etc/localtime:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/volume3/docker/forgejo-runner:/data"
      - "./runner-config.yaml:/etc/runner/config.yaml:ro"
    command: |
      sh -ec 'labels_json=$$(printf "%s" "$${FORGEJO_RUNNER_LABELS}" | sed "s/,/\",\"/g");
              printf "%s\n" "{\"WARNING\":\"generated by compose from git-sops env; do not edit\",\"uuid\":\"$${FORGEJO_RUNNER_UUID}\",\"name\":\"$${FORGEJO_RUNNER_NAME}\",\"token\":\"$${FORGEJO_RUNNER_TOKEN}\",\"address\":\"$${FORGEJO_INSTANCE_URL}\",\"labels\":[\"$${labels_json}\"]}" > /data/.runner;
              exec forgejo-runner daemon -c /etc/runner/config.yaml'
    healthcheck:
      test: ["CMD", "forgejo-runner", "--version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  forgejo-net:
    external: true # created by the forgejo stack; a race on first deploy self-heals on the next 300s doco-cd poll
