---
name: bambuddy

services:
  bambuddy:
    image: ghcr.io/maziggy/bambuddy:1.3.2
    container_name: bambuddy
    restart: unless-stopped
    stop_grace_period: 30s
    # Bind in the host namespace: older Docker releases do not isolate localhost port publishes.
    network_mode: host
    environment:
      HOST: "127.0.0.1"
      PORT: "8000"
    user: "1000:1000"
    read_only: true
    cap_drop: ["ALL"]
    # The image's Python binary carries this file capability.
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - type: bind
        source: /volume3/docker/bambuddy
        target: /app/data
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:mode=1777
      - /app/logs:uid=1000,gid=1000,mode=0700
    mem_limit: "4g"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
