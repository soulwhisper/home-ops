---
name: bambuddy
services:
  bambuddy:
    image: "ghcr.io/maziggy/bambuddy:1.3.2"
    container_name: "bambuddy"
    restart: "unless-stopped"
    network_mode: "host"
    user: "1026:100"
    environment:
      - "HOST=10.10.0.100"
      - "PORT=8000"
    volumes:
      - "/volume3/docker/bambuddy:/app/data"
      - "/volume3/docker/bambuddy/logs:/app/logs"
