---
name: bambuddy

services:
  bambuddy:
    image: ghcr.io/maziggy/bambuddy:1.3.2
    container_name: bambuddy
    restart: unless-stopped
    network_mode: host
    user: "1026:100"
    cap_add: ["NET_BIND_SERVICE"]
    environment:
      - "HOST=127.0.0.1"
      - "PORT=8000"
    volumes:
      - "/volume3/docker/bambuddy:/app/data"
