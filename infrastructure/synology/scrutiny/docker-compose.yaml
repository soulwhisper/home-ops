---
name: scrutiny
services:
  scrutiny:
    image: "ghcr.io/starosdev/scrutiny:1.80.2-omnibus"
    container_name: "scrutiny"
    restart: "unless-stopped"
    cap_add: ["SYS_ADMIN", "SYS_RAWIO"]
    ports:
      - "9204:8080/tcp"
    configs:
      - source: "collector.yaml"
        target: "/opt/scrutiny/config/collector.yaml"
    devices:
      - "/dev/nvme0"
      - "/dev/nvme1"
      - "/dev/sata1"
      - "/dev/sata2"
    volumes:
      - "/run/udev:/run/udev:ro"
      - "/volume3/docker/scrutiny/config:/opt/scrutiny/config"
      - "/volume3/docker/scrutiny/influxdb:/opt/scrutiny/influxdb"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

configs:
  collector.yaml:
    content: |
      devices: [
        { device: "/dev/nvme0", type: "nvme" },
        { device: "/dev/nvme1", type: "nvme" },
        { device: "/dev/sata1", type: "sat" },
        { device: "/dev/sata2", type: "sat" }
      ]
