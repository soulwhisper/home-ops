worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8443 ssl;
        ssl_certificate /run/secrets/api_tls;
        ssl_certificate_key /run/secrets/api_tls;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 2m;

        location /api/v1/ {
            # Cilium masquerades ExternalDNS traffic to a Talos node address.
            allow 10.10.0.101;
            allow 10.10.0.102;
            allow 10.10.0.103;
            # DNSControl runs from the operator workstation.
            allow 10.10.0.200;
            deny all;
            proxy_pass http://127.0.0.1:8081;
        }

        location / {
            return 404;
        }
    }
}
