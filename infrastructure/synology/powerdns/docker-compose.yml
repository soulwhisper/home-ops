---
name: powerdns
services:
  powerdns:
    image: "docker.io/powerdns/pdns-auth-51:5.1.5"
    container_name: "powerdns"
    restart: "unless-stopped"
    # DSM's published-port proxy hides the client IP needed by the API ACL.
    network_mode: "host"
    command:
      - "--local-address=10.10.0.100"
      - "--local-port=53"
      - "--api=yes"
      - "--webserver-address=10.10.0.100"
      - "--webserver-port=9200"
      - "--webserver-allow-from=10.10.0.0/24"
    secrets:
      - source: "pdns_api_key"
        target: "/etc/powerdns/pdns.d/api-key.conf"
    volumes:
      - "/volume3/docker/powerdns:/var/lib/powerdns"
    healthcheck:
      test: ["CMD", "pdns_control", "rping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  pdns_api_key:
    # api-key={key}
    file: "./powerdns.sops.conf"
