---
name: powerdns

services:
  powerdns:
    image: "docker.io/powerdns/pdns-auth-51:5.1.5"
    container_name: "powerdns"
    restart: "unless-stopped"
    # DSM's published-port proxy hides the client IP needed by the API ACL.
    network_mode: "host"
    # Drop to the image user before startup, retaining only the port 53 capability.
    user: "0:0"
    entrypoint:
      - "/usr/bin/setpriv"
      - "--reuid=pdns"
      - "--regid=pdns"
      - "--clear-groups"
      - "--inh-caps=+net_bind_service"
      - "--ambient-caps=+net_bind_service"
      - "/usr/bin/tini"
      - "--"
      - "/usr/local/sbin/pdns_server-startup"
    command:
      - "--local-address=10.10.0.100"
      - "--local-port=53"
      - "--api=yes"
      - "--webserver-address=10.10.0.100"
      - "--webserver-port=9200"
      - "--webserver-allow-from=10.10.0.0/24"
    secrets:
      - source: pdns_api_key
        target: /etc/powerdns/pdns.d/api-key.conf
    volumes:
      # Docker seeds the empty named volume with the image's SQLite database.
      - "pdns_data:/var/lib/powerdns"
    cap_drop:
      - "ALL"
    cap_add:
      - "NET_BIND_SERVICE"
      - "SETUID"
      - "SETGID"
    security_opt:
      - "no-new-privileges:true"
    mem_limit: "256m"
    healthcheck:
      test: ["CMD", "setpriv", "--reuid=pdns", "--regid=pdns", "--clear-groups", "pdns_control", "rping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  pdns_api_key:
    # api-key={key}
    file: ./powerdns.sops.conf

volumes:
  pdns_data: {}
