---
# forgejo + actions runner, one stack: the runner and its job containers share
# the stack network, where forgejo carries the nas.homelab.internal alias —
# the LAN name resolves to a fake-ip/hairpin that docker cannot use.
# nas.homelab.internal A 10.10.0.100
# worker HTTP => http://nas.homelab.internal:9003
# worker SSH => ssh://nas.homelab.internal:9004
name: forgejo

services:
  forgejo:
    # alias so stack-internal clients hit this container directly
    networks:
      default:
        aliases:
          - nas.homelab.internal
    image: "codeberg.org/forgejo/forgejo:17.0.1"
    container_name: "forgejo"
    restart: "unless-stopped"
    ports:
      - "9003:9003/tcp"
      - "9004:9004/tcp"
    environment:
      - "DEFAULT_UI_LOCATION=Asia/Shanghai"
      - "USER_UID=1000"
      - "USER_GID=1000"
      # server
      # canonical URL = the cluster gateway HTTPS front (forgejo-proxy);
      # plain HTTP on :9003 stays live as the direct/fallback path
      - "DOMAIN=git.noirprime.com"
      - "ROOT_URL=https://git.noirprime.com/"
      # SSH clone URLs stay NAS-direct (gateway has no :9004 listener)
      - "SSH_DOMAIN=nas.homelab.internal"
      - "HTTP_PORT=9003"
      - "SSH_PORT=9004"
      - "DB_TYPE=sqlite3"
      - "LFS_START_SERVER=true"
      - "START_SSH_SERVER=true"
      # webhook
      - "ALLOWED_HOST_LIST=private"
      - "SKIP_TLS_VERIFY=true"
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/volume3/docker/forgejo:/data"
    healthcheck:
      # curl ships in codeberg.org/forgejo/forgejo (alpine, Dockerfile v16.0.2)
      # /api/healthz registered in routers/web/web.go
      test: ["CMD", "curl", "-f", "http://localhost:9003/api/healthz"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # executes workflows for NAS-hosted repos (homelab-tickets lessons etc).
  # Identity (FORGEJO_RUNNER_UUID/TOKEN) comes from forgejo-runner.sops.env —
  # the live `register` flow never worked, so the pre-registered runner identity
  # is authored in git (sops) and written to /data/.runner on every start.
  # Limits: single concurrent job, hard RAM cap (no CPU cap — the Synology
  # kernel lacks CPU CFS scheduler support and rejects NanoCPUs).
  forgejo-runner:
    # renovate: datasource=docker depName=code.forgejo.org/forgejo/runner
    image: "code.forgejo.org/forgejo/runner:13.2.0"
    container_name: "forgejo-runner"
    restart: "unless-stopped"
    working_dir: /data
    depends_on:
      - forgejo
    # NAS socket/data access uses root; full host control is accepted below.
    user: "0:0"
    mem_limit: 3g
    mem_reservation: 512m
    env_file:
      - forgejo-runner.sops.env
    environment:
      - "DOCKER_HOST=unix:///var/run/docker.sock"
      - "FORGEJO_INSTANCE_URL=http://nas.homelab.internal:9003"
      - "FORGEJO_RUNNER_NAME=nas-docker"
      # act-compatible alias for GHA syntax workflows
      - "FORGEJO_RUNNER_LABELS=ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-22.04,self-hosted:host"
    volumes:
      # host docker socket grants full host-level control by design; accepted
      # because the runner is registered repo-scoped (homelab-tickets only) and
      # every workflow it can ever run is operator-authored. A socket proxy
      # cannot restrict privileged container creation, so it buys nothing here.
      - "/etc/localtime:/etc/localtime:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/volume3/docker/forgejo-runner:/data"
    configs:
      - source: runner-config.yaml
        target: /etc/runner/config.yaml
    command: |
      sh -ec 'labels_json=$$(printf "%s" "$${FORGEJO_RUNNER_LABELS}" | sed "s/,/\",\"/g");
              printf "%s\n" "{\"WARNING\":\"generated by compose from git-sops env; do not edit\",\"uuid\":\"$${FORGEJO_RUNNER_UUID}\",\"name\":\"$${FORGEJO_RUNNER_NAME}\",\"token\":\"$${FORGEJO_RUNNER_TOKEN}\",\"address\":\"$${FORGEJO_INSTANCE_URL}\",\"labels\":[\"$${labels_json}\"]}" > /data/.runner;
              exec forgejo-runner daemon -c /etc/runner/config.yaml'
    healthcheck:
      test: ["CMD", "forgejo-runner", "--version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

configs:
  # forgejo-runner daemon config (-c). Server connection comes from
  # /data/.runner — a `server:` section here would conflict. Job containers
  # join this stack's network so nas.homelab.internal resolves to forgejo.
  runner-config.yaml:
    content: |
      container:
        network: forgejo_default
