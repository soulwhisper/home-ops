---
name: scryfall-downloader

services:
  scryfall-downloader:
    image: "ghcr.io/soulwhisper/scryfall-downloader:v0.5.0@sha256:e7befe44976406e403adbb21008b7624a92aa1e851d2c99a8207745e507b9db3"
    # The launcher only initializes the state volume before serving as 1026:101.
    user: "0:0"
    env_file:
      - downloader.sops.env
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        : "$${DOWNLOADER_API_TOKEN:?downloader.sops.env must supply DOWNLOADER_API_TOKEN}"
        exec python -m scryfall_downloader --bind 0.0.0.0 --data /state \
          --uid 1026 --gid 101 --init-state-owner --archive-all
    volumes:
      - type: volume
        source: staging-state
        target: /state
        volume:
          nocopy: true
      - type: bind
        # The host directory must exist and allow read, write and traverse for UID 1026, GID 101.
        source: /volume1/backup/mtg/forge_imgs/downloading
        target: /state/pics
        bind:
          create_host_path: false
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETGID", "SETUID"]
    security_opt: ["no-new-privileges:true"]
    container_name: "scryfall-downloader"
    # Inherit the image's local-only health so upstream outages do not trigger Doco-CD restarts.
    restart: "unless-stopped"
    stop_grace_period: 30s
    ports:
      # LAN backend for authenticated clients. Use HTTPS or an SSH tunnel to protect the token in transit.
      - "10.10.0.100:8765:8765/tcp"
    mem_limit: "512m"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  staging-state: {}
