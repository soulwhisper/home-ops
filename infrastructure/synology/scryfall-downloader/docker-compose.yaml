---
name: scryfall-downloader
services:
  scryfall-downloader:
    image: "ghcr.io/soulwhisper/scryfall-downloader:v0.6.0@sha256:33b76a3d82b686c58017e5996cc6bf68e096ffc2d1390f96661ae0031a323059"
    container_name: "scryfall-downloader"
    restart: "unless-stopped"
    user: "1026:100"
    ports:
      - "10.10.0.100:8765:8765/tcp"
    env_file:
      - downloader.sops.env
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        : "$${DOWNLOADER_API_TOKEN:?downloader.sops.env must supply DOWNLOADER_API_TOKEN}"
        exec python -m scryfall_downloader --bind 0.0.0.0 --data /data --archive-all
    volumes:
      - "/volume3/docker/scryfall-downloader:/data"
      - "/volume1/backup/mtg/forge_imgs/downloading:/data/pics"
