---
name: scryfall-downloader

x-downloader: &downloader
  image: &image "ghcr.io/soulwhisper/scryfall-downloader:v0.3.0@sha256:ffdbd97d61e692dc489338dfa88af3d7cda2c84d14b10654cd62bb8d62b8b55e"
  user: &owner "1026:101"
  volumes:
    - &state-volume
      type: volume
      source: state
      target: /state
      volume:
        # Avoid inheriting the image's /data ownership on a fresh volume.
        nocopy: true
    - type: bind
      source: /volume1/backup/mtg/forge_imgs/pics
      target: /state/pics
      bind:
        create_host_path: false
  configs:
    - source: downloader-checks
      target: /scryfall-checks.py
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]

services:
  state-init:
    image: *image
    user: "0:0"
    restart: "no"
    network_mode: "none"
    healthcheck: {disable: true}
    # Never mount the Forge library in the ownership init container.
    volumes: [*state-volume]
    entrypoint: ["chown", "-hR", "-P", *owner, "/state"]
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: "64m"

  preflight:
    <<: *downloader
    restart: "no"
    network_mode: "none"
    healthcheck: {disable: true}
    depends_on:
      state-init:
        condition: service_completed_successfully
    entrypoint: ["python", "/scryfall-checks.py", "preflight"]
    mem_limit: "64m"

  scryfall-downloader:
    <<: *downloader
    command: ["--data", "/state"]
    container_name: "scryfall-downloader"
    restart: "unless-stopped"
    stop_grace_period: 30s
    depends_on:
      preflight:
        condition: service_completed_successfully
    ports:
      # The Web UI and REST API are unauthenticated; publish only on the NAS LAN address.
      - "10.10.0.100:8765:8765/tcp"
    mem_limit: "512m"
    healthcheck:
      test: ["CMD", "python", "/scryfall-checks.py", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  state: {}

configs:
  downloader-checks:
    file: ./checks.py
