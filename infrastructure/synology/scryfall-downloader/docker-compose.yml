---
name: scryfall-downloader

x-downloader: &downloader
  image: &image "ghcr.io/soulwhisper/scryfall-downloader:v0.2.0@sha256:fc925de38dcdabf7183b8a6cd8e58dc4c1ed84dad5bb1f1e6d8c33d671378a2f"
  user: &owner "1026:101"
  volumes:
    - "state:/data"
    - type: bind
      source: /volume1/backup/mtg/forge_imgs/pics
      target: /data/pics
      bind:
        create_host_path: false
  configs:
    - source: downloader-checks
      target: /scryfall-checks.py
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]

services:
  state-init:
    image: *image
    user: "0:0"
    restart: "no"
    network_mode: "none"
    # The image seeds /data as 10001:10001. Never mount the Forge library here.
    volumes: ["state:/data"]
    entrypoint: ["chown", "-hR", "-P", *owner, "/data"]
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: "64m"

  preflight:
    <<: *downloader
    restart: "no"
    network_mode: "none"
    depends_on:
      state-init:
        condition: service_completed_successfully
    entrypoint: ["python", "/scryfall-checks.py", "preflight"]
    mem_limit: "64m"

  scryfall-downloader:
    <<: *downloader
    container_name: "scryfall-downloader"
    restart: "unless-stopped"
    stop_grace_period: 30s
    depends_on:
      preflight:
        condition: service_completed_successfully
    ports:
      # The REST API is unauthenticated; publish only on the NAS LAN address.
      - "10.10.0.100:8765:8765/tcp"
    mem_limit: "512m"
    healthcheck:
      test: ["CMD", "python", "/scryfall-checks.py", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  state: {}

configs:
  downloader-checks:
    file: ./checks.py
