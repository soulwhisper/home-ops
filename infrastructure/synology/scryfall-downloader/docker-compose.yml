---
name: scryfall-downloader

services:
  scryfall-downloader:
    image: "ghcr.io/soulwhisper/scryfall-downloader:preview-2dd1a7bcfc07@sha256:5f03f689fc5d810861c1048a3e0817b7ba1d0dd69f8e49137e4941a845a1332d"
    # The launcher only initializes the state volume before serving as 1026:101.
    user: "0:0"
    command: ["--data", "/state", "--uid", "1026", "--gid", "101", "--init-state-owner", "--archive-all"]
    environment:
      SCRYFALL_HEALTH_UPSTREAM: "1"
    volumes:
      - type: volume
        source: staging-state
        target: /state
        volume:
          nocopy: true
      - type: bind
        source: /volume1/backup/mtg/forge_imgs/downloading
        target: /state/pics
        bind:
          create_host_path: false
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETGID", "SETUID"]
    security_opt: ["no-new-privileges:true"]
    container_name: "scryfall-downloader"
    restart: "unless-stopped"
    stop_grace_period: 30s
    ports:
      # The Web UI and REST API are unauthenticated; publish only on the NAS LAN address.
      - "10.10.0.100:8765:8765/tcp"
    mem_limit: "512m"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  staging-state: {}
