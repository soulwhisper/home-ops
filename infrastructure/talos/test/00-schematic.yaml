---
# schematic for test environment
# id is resolved live from factory.talos.dev and tracked in ../version.yaml
customization:
  bootloader: sd-boot
  extraKernelArgs:
    # hci
    - console=ttyS0
    # secureboot
    - -lockdown
    - lockdown=integrity
  systemExtensions:
    officialExtensions:
      - siderolabs/i915
      - siderolabs/intel-ucode
      - siderolabs/mei
      - siderolabs/nut-client
