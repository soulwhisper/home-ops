---
apiVersion: v1alpha1
kind: FilesystemScrubConfig
interval: 168h0m0s
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: local-hostpath
provisioning:
  diskSelector:
    match: system_disk
  maxSize: 140GiB
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
mount:
  secure: true
provisioning:
  diskSelector:
    match: system_disk
  maxSize: 80GiB
---
apiVersion: v1alpha1
kind: DiscoveryServiceConfig
name: default
endpoint: http://10.10.0.100:9300
---
apiVersion: v1alpha1
kind: CRICustomizationConfig
name: base
content: |
  [plugins]
    [plugins."io.containerd.cri.v1.images"]
      discard_unpacked_layers = false
    [plugins."io.containerd.cri.v1.runtime"]
      device_ownership_from_security_context = true
    [plugins."io.containerd.grpc.v1.cri"]
      enable_unprivileged_ports = true
      enable_unprivileged_icmp = true
---
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: nut-client
configFiles:
  - content: |-
      MONITOR ups@10.10.0.254 1 monuser secret secondary
      SHUTDOWNCMD "/sbin/poweroff"
    mountPath: /usr/local/etc/nut/upsmon.conf
---
apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity
configuration:
  apiVersion: pod-security.admission.config.k8s.io/v1alpha1
  kind: PodSecurityConfiguration
  defaults:
    enforce: privileged
    enforce-version: latest
    audit: privileged
    audit-version: latest
    warn: privileged
    warn-version: latest
---
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeNetworkConfig
podSubnets:
  - 10.100.0.0/17
serviceSubnets:
  - 10.100.128.0/17
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 10.10.0.0/24
labels:
  topology.kubernetes.io/region: main
  topology.kubernetes.io/zone: homelab
  intel.feature.node.kubernetes.io/gpu: "true"
taints:
  node-role.kubernetes.io/control-plane:
    $patch: delete
---
apiVersion: v1alpha1
kind: KubePrismConfig
port: 7445
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
config:
  apiVersion: kubescheduler.config.k8s.io/v1
  kind: KubeSchedulerConfiguration
  profiles:
    - schedulerName: default-scheduler
      plugins:
        score:
          disabled:
            - name: ImageLocality
            - name: SelectorSpread
      pluginConfig:
        - name: PodTopologySpread
          args:
            defaultingType: List
            defaultConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
                matchLabelKeys:
                  - pod-template-hash
                  - controller-revision-hash
---
apiVersion: v1alpha1
kind: KubeStaticPodConfig
name: network-irq-optimizer
pod:
  apiVersion: v1
  kind: Pod
  metadata:
    name: network-irq-optimizer
    namespace: kube-system
  spec:
    hostNetwork: true
    hostPID: true
    containers:
      - name: irq-optimizer
        image: alpine
        securityContext:
          privileged: true
        command: ["/bin/sh", "-c"]
        args:
          - |
            # 13900H P-cores (HT enabled) are 0-11. E-cores are 12-19.
            while true; do
              for irq in $(grep 'ice' /proc/interrupts | awk '{print $1}' | tr -d ':'); do
                echo "2-11" > /proc/irq/$irq/smp_affinity_list
              done
              sleep 3600
            done
        volumeMounts:
          - name: proc
            mountPath: /proc
    volumes:
      - name: proc
        hostPath:
          path: /proc
---
apiVersion: v1alpha1
kind: KubeTalosAPIAccessConfig
allowedRoles:
  - os:admin
  - os:etcd:backup
allowedKubernetesNamespaces:
  - gitops-system
---
apiVersion: v1alpha1
kind: LinkConfig
name: lo # fix forwardKubeDNSToHost
up: true
addresses:
  - address: 169.254.116.108/32
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 10.10.0.254
searchDomains:
  disableDefault: true
hostDNS:
  enabled: true
  forwardKubeDNSToHost: true
  resolveMemberNames: true
---
apiVersion: v1alpha1
kind: TimeSyncConfig
ntp:
  servers:
    - 10.10.0.254
---
apiVersion: v1alpha1
kind: OOMConfig
# v1.14 upstream defaults
triggerExpression: |-
  multiply_qos_vectors(d_qos_memory_full_total, {System: 8.0, Podruntime: 4.0}) > 3000.0 &&
  multiply_qos_vectors(qos_memory_full_avg10, {System: 1.0, Podruntime: 1.0}) > 5.0 &&
  time_since_trigger > duration("5s")
cgroupRankingExpression: |-
  memory_max.hasValue() ? 0.0 :
  {Besteffort: 1.0, Burstable: 0.5, Guaranteed: 0.0, Podruntime: 0.0, System: 0.0}[class] *
  double(memory_current.orValue(0u))
---
apiVersion: v1alpha1
kind: SecurityProfileConfig
workloadIsolation: true
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  # moviepilot requires high inotify limits for media library watching (~500k files)
  fs.inotify.max_user_watches: "1048576" # default 8192; recommended 1048576 supports large media libraries
  fs.inotify.max_user_instances: "8192" # default 128; matches watches for consistency
  # ARP table size for BGP+Cilium: large cluster peering table requires expanded neighbor cache
  net.ipv4.neigh.default.gc_thresh1: "1024" # GC start threshold (default 128)
  net.ipv4.neigh.default.gc_thresh2: "2048" # GC soft threshold (default 512)
  net.ipv4.neigh.default.gc_thresh3: "4096" # GC hard threshold (default 1024)
  # 10G NIC throughput tuning (Intel X710, ice driver)
  # Reference: https://www.kernel.org/doc/Documentation/networking/scaling.txt
  net.core.netdev_max_backlog: "16384" # packet queue depth per NIC (default 1000)
  net.core.somaxconn: "32768" # listen() backlog (default 4096)
  net.ipv4.tcp_max_syn_backlog: "8192" # SYN queue per socket (default 256)
  net.core.rmem_max: "134217728" # 128MB socket recv buffer max
  net.core.wmem_max: "134217728" # 128MB socket send buffer max
  net.ipv4.tcp_rmem: 4096 87380 134217728 # min/default/max recv buffer
  net.ipv4.tcp_wmem: 4096 65536 134217728 # min/default/max send buffer
  # NFS over 10G: increase RPC slot table to avoid NFS client stalls
  sunrpc.tcp_slot_table_entries: "128" # concurrent RPC calls (default 16)
  sunrpc.tcp_max_slot_table_entries: "1024" # max concurrent RPC calls
  user.max_user_namespaces: "11255" # required for rootless containers (UserNamespaces feature)
  # Writeback tuning for 96GB RAM: reduce kernel dirty page ratio to avoid write storms
  vm.dirty_background_ratio: "5" # start background writeback at 5% dirty (default 10%)
  vm.dirty_ratio: "10" # block writes at 10% dirty (default 20%)
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  # image is injected from ../version.yaml (talos_version + schematic_id) by `just talos generate`
provisioning:
  diskSelector:
    match: disk.model == "SQF-C3AV1-256GDEDM"
  wipe: false
---
machine:
  features:
    nodeAddressSortAlgorithm: v2
cluster:
  etcd:
    extraArgs:
      quota-backend-bytes: 8589934592
    advertisedSubnets:
      - 10.10.0.0/24
