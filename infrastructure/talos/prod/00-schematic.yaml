---
# schematic for production environment
# id is resolved live from factory.talos.dev and tracked in ../version.yaml
customization:
  bootloader: sd-boot
  extraKernelArgs:
    # stability
    - pcie_aspm=off
    - nvme_core.default_ps_max_latency_us=0
    # hardware
    - i915.enable_guc=3
    - module_blacklist=igc
    # bring-up network: bond0 (LACP) + DHCP from first boot for maintenance.
    # Production nodes use static BondConfig addresses after install. Prefer the
    # explicit positional ip= form to avoid Talos/Linux IP-Config ambiguity:
    # field 0 is client IPv4, field 5 is the device, and field 6 is autoconf.
    - bond=bond0:enp2s0f0np0,enp2s0f1np1:mode=802.3ad,lacp_rate=fast,xmit_hash_policy=layer3+4:9000
    - ip=:::::bond0:dhcp
  systemExtensions:
    officialExtensions:
      - siderolabs/i915
      - siderolabs/intel-ucode
      - siderolabs/mei
      - siderolabs/nut-client
