---
# Registry mirrors: route pulls through the NAS zot cache (second hop behind spegel P2P).
# Endpoint URLs must carry the literal /v2/ prefix: with overridePath containerd fetches
# <endpoint>/<repo> verbatim, and zot serves /v2/<upstream>/<repo> (PR #3541 bring-up bug).
# skipFallback: false — zot/NAS down falls back to the upstream registry directly.
apiVersion: v1alpha1
kind: RegistryMirrorConfig
name: docker.io
endpoints:
  - url: http://nas.homelab.internal:9002/v2/docker.io
    overridePath: true
skipFallback: false
