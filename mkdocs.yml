---
site_name: Home-ops Docs
site_url: https://soulwhisper.github.io/home-ops/
repo_url: https://github.com/soulwhisper/home-ops
repo_name: home-ops

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.tabs
    - navigation.top

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Architecture:
      - Cluster: infrastructure/kubernetes.md
      - Network: infrastructure/networking.md
      - Storage: infrastructure/storage.md
      - Hardware: infrastructure/hardware.md
  - Applications:
      - Catalog: application/catalog.md
      - Authentication: application/authentication.md
      - Monitoring: application/monitoring.md
      - AI: application/ai.md
  - Operations:
      - Bootstrap: deployment/bootstrap.md
  - Decisions:
      - BGP: decisions/bgp.md
      - Public Exposure: decisions/public-exposure.md
      - Workload Sandboxing: decisions/workload-sandboxing.md
