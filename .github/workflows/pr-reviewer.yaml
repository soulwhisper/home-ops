---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# yamllint disable rule:truthy

# Shadow-mode AI review. pull_request_target runs in base-branch context: the
# main-restricted `ci` environment stays reachable and forks get no secrets.
# The action is SHA-pinned, standards come from the base branch, and PR code
# is only read as evidence — never executed. Non-blocking by default; gate
# promotion happens via required-check after the shadow period (plan D5).
name: AI PR Review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  group: ai-review-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI PR Review
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: ci
    timeout-minutes: 30
    steps:
      - name: Mint repo-butler token (review author identity)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Map intranet hostname to pinned LB
        run: echo "10.10.0.140 api.noirprime.com" | sudo tee -a /etc/hosts

      - name: Join tailnet (WiF, tag:gha-ci, ephemeral)
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:gha-ci
          version: 1.102.5

      - name: AI review
        uses: misospace/pr-reviewer-action@829f395f7154b4d87c229500fd09b30a8ad2224d # v3.3.0
        with:
          ai-base-url: https://api.noirprime.com/v1
          ai-api-key: ${{ secrets.AGW_CI_KEY }}
          ai-model: complex
          github-token: ${{ steps.app-token.outputs.token }}
          # ^ publishes as the repo-butler app, not github-actions[bot]
          ai-response-format: json_schema
