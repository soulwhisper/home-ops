---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# yamllint disable rule:truthy

name: Flux-checks

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    name: Flux Checks - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@v0.6.0
        with:
          patterns: kubernetes/**/*

  test:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flux Checks - Test
    runs-on: ubuntu-latest
    env:
      FLATE_PATH: ./kubernetes/flux/cluster
      FLATE_SOURCE_RETRY_MAX_WAIT: 30s
    steps:
      - name: Checkout Pull Request Branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install flate
        uses: home-operations/flate/action@v0.6.5
        with:
          cache: true
          token: ""

      - name: Run flate test
        run: |
          flate test all --base ${{ github.event.repository.default_branch }}

      - name: Run flate diff
        id: diff
        run: |
          flate diff all > /tmp/flate-diff.out || true
          DIFF_RAW=$(head -c 60000 /tmp/flate-diff.out)
          if [[ $(wc -c < /tmp/flate-diff.out) -gt 60000 ]]; then
            DIFF_RAW="${DIFF_RAW%$'\n'*}"
            DIFF_RAW="${DIFF_RAW}"$'\n... (truncated)'
          fi
          {
            echo 'diff<<EOF'
            echo "${DIFF_RAW}"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - if: ${{ steps.diff.outputs.diff != '' }}
        name: Generate Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - if: ${{ steps.diff.outputs.diff != '' }}
        name: Add Comment
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          header: ${{ github.event.pull_request.number }}/kubernetes
          message: |
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

  kubeconform:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flux Checks - Kubeconform
    runs-on: ubuntu-latest
    env:
      CHANGED_FILES: ${{ needs.filter.outputs.changed-files }}
    steps:
      - name: Checkout Pull Request Branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install kubeconform
        run: |
          # renovate: datasource=github-releases depName=yannh/kubeconform
          KUBECONFORM_VERSION="v0.8.0"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform

      # extends the kubeconform hook in .pre-commit-config.yaml (-strict, custom
      # soulwhisper/k8s-schemas) with exclusions for file categories that are
      # structurally un-validatable in this repo (verified failing on main):
      # - **/ks.yaml: flux Kustomizations rely on cluster.yaml global patches for
      #   interval/prune/sourceRef, so the strict schema always rejects them;
      #   they are validated by the flate test job instead
      # - authentik blueprints: custom !Find/!KeyOf YAML tags break YAML->JSON
      # - kopiur Repository/SnapshotPolicy/SnapshotSchedule/Restore: schemas exist
      #   in the registry, but the component manifests are ${VAR}-templated by
      #   flux postBuild, so strict validation cannot run on them
      # - kustomize kustomization.yaml: no published schema exists
      # - bootstrap/*.yaml: helmfile configs (default.yaml base),
      #   not Kubernetes manifests
      - name: Validate changed manifests
        run: |
          mapfile -t FILES < <(echo "${CHANGED_FILES}" | jq --raw-output '.[]' \
            | grep --extended-regexp '\.ya?ml$' \
            | grep --invert-match --regexp='_sources/' \
            | grep --invert-match --regexp='ks\.yaml$' \
            | grep --invert-match --regexp='helmfile\.yaml$' \
            | grep --invert-match --regexp='components/[^/]*\.yaml$' \
            | grep --invert-match --regexp='bootstrap/[^/]*\.yaml$' \
            | grep --invert-match --regexp='bootstrap/templates/' \
            | grep --invert-match --regexp='authentik/app/blueprints/' || true)
          MANIFESTS=()
          for FILE in "${FILES[@]}"; do
            [ -f "${FILE}" ] && MANIFESTS+=("${FILE}")
          done
          if [ "${#MANIFESTS[@]}" -eq 0 ]; then
            echo "No changed kubernetes manifests to validate."
            exit 0
          fi
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            -skip 'Repository,SnapshotPolicy,SnapshotSchedule,Restore,Maintenance' \
            -schema-location default \
            -schema-location 'https://soulwhisper.github.io/k8s-schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "${MANIFESTS[@]}"

  success:
    if: ${{ !cancelled() }}
    needs:
      - test
      - kubeconform
    name: Flux Checks - Success
    runs-on: ubuntu-latest
    steps:
      - name: Check job status
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
