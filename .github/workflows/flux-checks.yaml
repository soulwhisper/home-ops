---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# yamllint disable rule:truthy

name: Flux-checks

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    name: Flux Checks - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
      render: ${{ steps.scope.outputs.render }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@v0.7.0
        with:
          patterns: |
            kubernetes/**
            .github/scripts/**
            .github/workflows/flux-checks.yaml
            .mise.toml
            infrastructure/talos/version.yaml
          include_deleted_files: true

      - name: Identify render inputs
        id: scope
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.changed_files }}
        run: |
          render=$(jq -r 'any(.[]; startswith("kubernetes/") or . == ".mise.toml" or
            . == "infrastructure/talos/version.yaml" or . == ".github/workflows/flux-checks.yaml")' <<< "$CHANGED_FILES")
          echo "render=$render" >> "$GITHUB_OUTPUT"

  test:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flux Checks - Test
    runs-on: ubuntu-latest
    env:
      FLATE_PATH: ./kubernetes/flux/cluster
      FLATE_SOURCE_RETRY_MAX_WAIT: 30s
    steps:
      - name: Checkout Pull Request Branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install regression test runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Run Python regressions
        run: python3 -m unittest discover -s .github/scripts

      - name: Install flate
        if: ${{ needs.filter.outputs.render == 'true' }}
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.11.12"
          install_args: github:home-operations/flate

      - name: Run flate test
        if: ${{ needs.filter.outputs.render == 'true' }}
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          flate test all --base "${BASE_BRANCH}"

      - name: Run flate diff
        if: ${{ needs.filter.outputs.render == 'true' }}
        id: diff
        run: |
          flate diff all > /tmp/flate-diff.out || true
          python3 .github/scripts/compact_diff.py < /tmp/flate-diff.out > /tmp/flate-digest.md || true
          DIFF_RAW=$(head -c 60000 /tmp/flate-diff.out)
          if [[ $(wc -c < /tmp/flate-diff.out) -gt 60000 ]]; then
            DIFF_RAW="${DIFF_RAW%$'\n'*}"
            DIFF_RAW="${DIFF_RAW}"$'\n... (truncated)'
          fi
          {
            echo 'diff<<EOF'
            echo "${DIFF_RAW}"
            echo 'EOF'
            echo 'digest<<EOF'
            cat /tmp/flate-digest.md
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - if: ${{ steps.diff.outputs.diff != '' }}
        name: Generate Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - if: ${{ steps.diff.outputs.diff != '' }}
        name: Add Comment
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          header: ${{ github.event.pull_request.number }}/kubernetes
          message: |
            ${{ steps.diff.outputs.digest }}

            <details><summary>Full rendered diff</summary>

            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

            </details>

  kubeconform:
    if: ${{ needs.filter.outputs.render == 'true' }}
    needs: filter
    name: Flux Checks - Kubeconform
    runs-on: ubuntu-latest
    env:
      CHANGED_FILES: ${{ needs.filter.outputs.changed-files }}
    steps:
      - name: Checkout Pull Request Branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install kubeconform
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.11.12"
          install_args: kubeconform

      - name: Validate changed manifests
        run: |
          mapfile -t FILES < <(echo "${CHANGED_FILES}" | jq --raw-output '.[]' \
            | grep --extended-regexp '^kubernetes/.*\.ya?ml$' \
            | grep --invert-match --regexp='ks\.yaml$' \
            | grep --invert-match --regexp='kubernetes/bootstrap/' \
            | grep --invert-match --regexp='kubernetes/components/' \
            | grep --invert-match --regexp='authentik/app/blueprints/' || true)
          MANIFESTS=()
          for FILE in "${FILES[@]}"; do
            [ -f "${FILE}" ] && MANIFESTS+=("${FILE}")
          done
          if [ "${#MANIFESTS[@]}" -eq 0 ]; then
            echo "No changed kubernetes manifests to validate."
            exit 0
          fi
          version=$(yq -er '.k8s_version' infrastructure/talos/version.yaml)
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            -kubernetes-version "${version#v}" \
            -schema-location default \
            -schema-location 'https://soulwhisper.github.io/k8s-schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "${MANIFESTS[@]}"

  success:
    if: ${{ !cancelled() }}
    needs:
      - test
      - kubeconform
    name: Flux Checks - Success
    runs-on: ubuntu-latest
    steps:
      - name: Check job status
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
