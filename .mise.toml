[settings]
# KUBECONFIG_DIR relies on $HOME expansion for the kube ns/cx switch tool
env_shell_expand = true

[env]
KUBECONFIG = '{{config_root}}/infrastructure/talos/clusterconfig/kubeconfig'
TALOSCONFIG = '{{config_root}}/infrastructure/talos/clusterconfig/talosconfig'

KUBECONFIG_DIR = "$HOME/.kube"
FLUX_SYSTEM_NAMESPACE = "gitops-system"
ROOK_OPERATOR_NAMESPACE = "storage-system"
ROOK_CLUSTER_NAMESPACE = "storage-system"

[tools]
# talosctl must match the cluster's Talos major.minor (see infrastructure/talos/version.yaml)
# renovate: datasource=github-releases depName=siderolabs/talos
talosctl = "1.14.1"
prek = "latest"
"github:home-operations/flate" = "latest"
